# Hart-local interrupts. They are not part of the flat SVD model, so this file has its
# own schema, checked by `./x svd merge`:
#
#   schema:     1
#   harts:      map hart name -> hart id (0..4)
#   interrupts: list of
#     local:        local interrupt number (the mcause is 16 + local)
#     name:         identifier, unique per hart
#     description:  text
#     harts:        list of hart names that have this interrupt
#     plic:         (optional) PLIC source name the same event also raises (see interrupts.yaml)
#
# The bus error unit is not listed: it raises a trap with mcause 128.
schema: 1
harts:
  E51: 0
  U54_1: 1
  U54_2: 2
  U54_3: 3
  U54_4: 4
interrupts:
  - local: 0
    name: MAINTENANCE
    description: Grouped maintenance events, source in SYSREG MAINTENANCE_INT_SR
    harts: [E51]
    plic: E51_0_MAINTENANCE
