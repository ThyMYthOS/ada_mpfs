            bitOffset: 0
            bitWidth: 3
      CLAIM_COMPLETE_H2_S:
        description: Claim (read) and complete (write) for hart 2, supervisor mode (context 4)
        addressOffset: 0x204004
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ID:
            description: Interrupt source ID. A read claims the highest-priority pending interrupt that is enabled for the context and clears its pending bit (0 if there is none); writing the ID completes the interrupt
            bitOffset: 0
            bitWidth: 32
