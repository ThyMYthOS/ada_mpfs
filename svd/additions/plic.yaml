        resetValue: 0x0
        fields:
          ID:
            description: Interrupt source ID. A read claims the highest-priority pending interrupt that is enabled for the context and clears its pending bit (0 if there is none); writing the ID completes the interrupt
            bitOffset: 0
            bitWidth: 32
            readAction: modifyExternal
      THRESHOLD_H2_S:
        description: Priority threshold for hart 2, supervisor mode (context 4)
        addressOffset: 0x204000
