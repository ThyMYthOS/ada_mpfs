# source: SiFive U54-MC Core Complex Manual, CLINT chapter (register layout)
# source: polarfire-soc/platform mpfs_hal/common/mss_clint.h @ 8d52d59 (CLINT_Type, CLINT_BASE in encoding.h)
# source: Icicle Kit measurement, boot mode 0, 2026-10-23: MSIP1 writes and reads back 1; MTIMECMP1 writes and reads back as one 64-bit value (low word at +0, high word at +4); MTIME reads 0 on repeated reads, also with SUBBLK_CLOCK_CR 0x3FFDFFFF, SOFT_RESET_CR 0 and RTC_CLOCK_CR 0x10064 (also after writing the register again)
# status: verified-MPFS250T-2026-10-23
# owner: Manuel Stahl

# Core-Local Interruptor. MSIP and MTIMECMP are indexed by the hart number (0..4).
_add:
  CLINT:
    description: Core-Local Interruptor
    groupName: CLINT
    baseAddress: 0x02000000
    addressBlock:
      offset: 0x0
      size: 0x10000
      usage: registers
    registers:
      MSIP%s:
        description: Machine-mode software interrupt pending, one register per hart (the array index is the hart ID)
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        dim: 5
        dimIncrement: 0x4
        dimIndex: "0-4"
        fields:
          MSIP:
            description: Writing 1 raises the software interrupt of the hart
            bitOffset: 0
            bitWidth: 1
      MTIMECMP%s:
        description: Timer compare value, one register per hart (the array index is the hart ID); the timer interrupt of a hart is pending while MTIME >= its MTIMECMP
        addressOffset: 0x4000
        size: 64
        access: read-write
        dim: 5
        dimIncrement: 0x8
        dimIndex: "0-4"
      MTIME:
        description: Machine-mode timer, counting at the RTC clock rate once it runs. In boot mode 0 after a power cycle it reads 0 and does not count, also with the RTC clock enabled (RTC_CLOCK_CR, SUBBLK_CLOCK_CR); what starts it is not known (N32)
        addressOffset: 0xBFF8
        size: 64
        access: read-write
