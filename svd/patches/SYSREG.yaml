# source: svd/base/sysreg.yaml, MSS_BUILD.REVISION description: set to the SVN revision of pfsoc_mss_main.sv
# source: Icicle Kit measurement: MSS_BUILD (0x20002028) reads 0x1CF02, the SVD resetValue is 0x0
# source: Icicle Kit measurement: SPARE_FIC (0x200022E0) reads 0xF at power-on, after reset halt and with the clocks enabled, the SVD resetValue is 0x0
# source: measurement on an Icicle Kit MPFS250T, boot mode 0, 2026-10-23: MSS_BUILD reads 0x1CF02 and SPARE_FIC 0xF again, both reported as noref (resetMask 0)
# source: Icicle Kit measurement, boot mode 0, 2026-10-23: ENVM_CR (0x200020B8) reads 0x40000141 at power-on, in several power cycles, the register map says 0x4005004F
# status: verified-MPFS250T-2026-10-23
# owner: Manuel Stahl

# ENVM_CR reads 0x40000141 after every power cycle (CLOCK_OKAY, bit 6, is set); the register map says
# 0x4005004F, which was not seen at power-on.
#
# MSS_BUILD holds the build revision of the silicon design, which the SVD does not know.
# Keep the reset value and compare no bit.
#
# SPARE_FIC is a read-only view of the spare FIC reset inputs, which are driven by the
# fabric (0xF on the Icicle Kit in every state measured). Keep the reset value and
# compare no bit.
SYSREG:
  _modify:
    ENVM_CR:
      resetValue: 0x40000141
    MSS_BUILD:
      resetMask: 0x0
    SPARE_FIC:
      resetMask: 0x0
