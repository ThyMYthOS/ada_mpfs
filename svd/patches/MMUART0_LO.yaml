# source: svd/base/mmuart.yaml, RBR description: the register is loaded with data from the receive FIFO
# source: 16550-compatible UART: reading RBR removes the oldest character from the receive FIFO
# source: Linux drivers/tty/serial/8250/8250_port.c: serial8250_read_char reads UART_RX once per received character (16550 behaviour, MMUART silicon not checked)
# status: unverified
# owner: Manuel Stahl

# Reading RBR pops the receive FIFO: a read with a side effect on state outside the register.
# The other MMUART instances are derivedFrom MMUART0_LO and inherit it.
MMUART0_LO:
  RBR:
    _modify:
      RBR:
        readAction: modifyExternal
