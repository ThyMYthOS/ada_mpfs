# source: official CFG_DDR_SGMII_PHY register summary and bit tables: PLL_DIV_0_1, PLL_DIV_2_3, PLL_PHADJ and SSCG_REG_2 reset values of the MAIN and IOSCB blocks (svd/base/cfg_ddr_sgmii_phy.yaml carries them unchanged, except PLL_PHADJ bit 0)
# source: svd/base/cfg_ddr_sgmii_phy.yaml (regmap2svd.py output): PLL_PHADJ_MAIN 0x0 and PLL_PHADJ_IOSCB 0x4000 drop bit 0, a reserved read-only field with reset 1 in the official tables
# source: probe on the Icicle Kit (MPFS250T, boot mode 0), reset halt with SYSREG.DFIAPB_CR=0x1 (MSS corner clock on; at the power-on value 0x2 every PHY register reads 0): 393 registers, 352 equal the SVD, 39 differ
# source: official SOFT_RESET_* register tables: PERIPH (bit 8) "asserted and left asserted at power-up" in the text, reset 0 in the table; BLOCKID (bits 31:16) read-only, listed with reset 0
# source: same probe: bit 8 reads 1 in all ten SOFT_RESET_* registers, bits 31:16 read the block ID (0x0200 DDR_PHY, 0x0800 MAIN_PLL and IOSCB_PLL, 0x0A00 CFM, 0x0B00 BANK_CTRL, 0x0C00 IOCALIB, 0 for DECODER_* and TIP)
# source: official RPC_RESET_* register tables: soft_reset_periph (bit 0) reset 0
# source: same probe: all five RPC_RESET_* registers read 1
# status: unverified
# owner: Manuel Stahl

# The probe reads the official reset value of the MAIN block at the IOSCB address and
# the other way round for PLL_DIV_0_1, PLL_DIV_2_3, PLL_PHADJ and SSCG_REG_2 (IOSCB):
#
#   register          address     SVD         official    measured
#   PLL_DIV_0_1_MAIN  0x20007090  0x08000200  0x08000200  0x02000100
#   PLL_DIV_0_1_IOSCB 0x20007110  0x02000100  0x02000100  0x08000200
#   PLL_DIV_2_3_MAIN  0x20007094  0x14000800  0x14000800  0x01000100
#   PLL_DIV_2_3_IOSCB 0x20007114  0x01000100  0x01000100  0x14000800
#   PLL_PHADJ_MAIN    0x200070A0  0x0         0x1         0x4001
#   PLL_PHADJ_IOSCB   0x20007120  0x4000      0x4001      0x1
#   SSCG_REG_2_IOSCB  0x2000712C  0x20        0x20        0x30
#
# This is consistent with exchanged MAIN and IOSCB labels or addresses in the official
# map, but the readbacks cannot tell which of the two is wrong. For the SVD only the
# reset value per address matters, so the reset values are set to what the hardware
# reads at each address; no register is renamed and no address changes. PLL_PHADJ
# also gets the reserved read-only bit 0 (reset 1) back.
#
# SSCG_REG_2_MAIN (0x200070AC) reads 0x80, which matches no official value (MAIN
# 0x30, IOSCB 0x20): unexplained, not patched.
#
# SOFT_RESET_* (ten registers: DDR_PHY, MAIN_PLL, IOSCB_PLL, BANK_CTRL, IOCALIB, CFM,
# DECODER_DRIVER, DECODER_ODT, DECODER_IO, TIP): PERIPH (bit 8) reads 1 at reset, as the
# official text says ("asserted at power-up"; the table lists 0). Bits 31:16 are a
# read-only block ID that the official map lists as 0 and that the SVD cannot know per
# silicon, so they are excluded from the comparison like DEVICE_ID in SCB_REGS.yaml:
# resetValue 0x100, resetMask 0x103 (bit 8 and the two write-only bits 1:0 compared,
# which read 0).
#
# RPC_RESET_* (five registers: MAIN_PLL, IOSCB, BANK_CTRL, IOCALIB, CFM): the only
# field soft_reset_periph (bit 0) reads 1 at reset; the official table lists 0. The
# evidence is five registers on one board, so it is medium.
CFG_DDR_SGMII_PHY:
  _modify:
    PLL_DIV_0_1_MAIN:
      resetValue: 0x02000100
    PLL_DIV_0_1_IOSCB:
      resetValue: 0x08000200
    PLL_DIV_2_3_MAIN:
      resetValue: 0x01000100
    PLL_DIV_2_3_IOSCB:
      resetValue: 0x14000800
    PLL_PHADJ_MAIN:
      resetValue: 0x4001
    PLL_PHADJ_IOSCB:
      resetValue: 0x1
    SSCG_REG_2_IOSCB:
      resetValue: 0x30
    SOFT_RESET_DDR_PHY:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_MAIN_PLL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_IOSCB_PLL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_BANK_CTRL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_IOCALIB:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_CFM:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_DRIVER:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_ODT:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_IO:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_TIP:
      resetValue: 0x100
      resetMask: 0x103
    RPC_RESET_MAIN_PLL:
      resetValue: 0x1
    RPC_RESET_IOSCB:
      resetValue: 0x1
    RPC_RESET_BANK_CTRL:
      resetValue: 0x1
    RPC_RESET_IOCALIB:
      resetValue: 0x1
    RPC_RESET_CFM:
      resetValue: 0x1
