# source: official CFG_DDR_SGMII_PHY register summary and bit tables: PLL_DIV_0_1, PLL_DIV_2_3, PLL_PHADJ and SSCG_REG_2 reset values of the MAIN and IOSCB blocks (svd/base/cfg_ddr_sgmii_phy.yaml carries them unchanged, except PLL_PHADJ bit 0)
# source: svd/base/cfg_ddr_sgmii_phy.yaml (regmap2svd.py output): PLL_PHADJ_MAIN 0x0 and PLL_PHADJ_IOSCB 0x4000 drop bit 0, a reserved read-only field with reset 1 in the official tables
# source: measurement on the Icicle Kit (MPFS250T, boot mode 0), reset halt with SYSREG.DFIAPB_CR=0x1 (MSS corner clock on; at the power-on value 0x2 every PHY register reads 0): 393 registers, 352 equal the SVD, 39 differ
# source: official SOFT_RESET_* register tables: PERIPH (bit 8) "asserted and left asserted at power-up" in the text, reset 0 in the table; BLOCKID (bits 31:16) read-only, listed with reset 0
# source: same measurement: bit 8 reads 1 in all ten SOFT_RESET_* registers, bits 31:16 read the block ID (0x0200 DDR_PHY, 0x0800 MAIN_PLL and IOSCB_PLL, 0x0A00 CFM, 0x0B00 BANK_CTRL, 0x0C00 IOCALIB, 0 for DECODER_* and TIP)
# source: official RPC_RESET_* register tables: soft_reset_periph (bit 0) reset 0
# source: same measurement: all five RPC_RESET_* registers read 1
# source: official TRAINING_RESET, DYN_CNTL, IOC_REG0 and RECAL_CNTL field tables: reset values 0x0, 0x400, 0x8000 and 0x8; field layout as used for the masks below
# source: same measurement: TRAINING_RESET reads 0x2, DYN_CNTL 0x480, IOC_REG0 0xE000, RECAL_CNTL 0x20C8
# source: svd/base/cfg_ddr_sgmii_phy.yaml: IOC_REG2, IOC_REG5, GT_CLK_SEL, GT_STATE, DQDQS_STATE, EXPERT_DLYCNT_OOR_REG0 and EXPERT_DLYCNT_OOR_REG1 are read-only calibration codes and TIP readbacks
# source: same measurement: IOC_REG2 reads 0x1FBF, IOC_REG5 0x3FFC0000, GT_CLK_SEL 0x4, GT_STATE 0xB, DQDQS_STATE 0x8, EXPERT_DLYCNT_OOR_REG0 0xFFFFFFFF, EXPERT_DLYCNT_OOR_REG1 0x00183E0F; the reset value of the official map is 0
# status: unverified
# owner: Manuel Stahl

# The probe reads the official reset value of the MAIN block at the IOSCB address and
# the other way round for PLL_DIV_0_1, PLL_DIV_2_3, PLL_PHADJ and SSCG_REG_2 (IOSCB):
#
#   register          address     SVD         official    measured
#   PLL_DIV_0_1_MAIN  0x20007090  0x08000200  0x08000200  0x02000100
#   PLL_DIV_0_1_IOSCB 0x20007110  0x02000100  0x02000100  0x08000200
#   PLL_DIV_2_3_MAIN  0x20007094  0x14000800  0x14000800  0x01000100
#   PLL_DIV_2_3_IOSCB 0x20007114  0x01000100  0x01000100  0x14000800
#   PLL_PHADJ_MAIN    0x200070A0  0x0         0x1         0x4001
#   PLL_PHADJ_IOSCB   0x20007120  0x4000      0x4001      0x1
#   SSCG_REG_2_IOSCB  0x2000712C  0x20        0x20        0x30
#
# This is consistent with exchanged MAIN and IOSCB labels or addresses in the official
# map, but the readbacks cannot tell which of the two is wrong. For the SVD only the
# reset value per address matters, so the reset values are set to what the hardware
# reads at each address; no register is renamed and no address changes. PLL_PHADJ
# also gets the reserved read-only bit 0 (reset 1) back.
#
# SSCG_REG_2_MAIN (0x200070AC) reads 0x80 (the official values: MAIN 0x30, IOSCB 0x20); it is
# the INTIN value 0x80 of the DDR PLL in the Icicle design (the MSS Configurator XML), like
# PLL_REF_FB_MAIN 0x500 (RFDIV 5) and PLL_DIV_0_1_MAIN 0x02000100 of the same PLL.
#
# SOFT_RESET_* (ten registers: DDR_PHY, MAIN_PLL, IOSCB_PLL, BANK_CTRL, IOCALIB, CFM,
# DECODER_DRIVER, DECODER_ODT, DECODER_IO, TIP): PERIPH (bit 8) reads 1 at reset, as the
# official text says ("asserted at power-up"; the table lists 0). Bits 31:16 are a
# read-only block ID that the official map lists as 0 and that the SVD cannot know per
# silicon, so they are excluded from the comparison like DEVICE_ID in SCB_REGS.yaml:
# resetValue 0x100, resetMask 0x103 (bit 8 and the two write-only bits 1:0 compared,
# which read 0).
#
# RPC_RESET_* (five registers: MAIN_PLL, IOSCB, BANK_CTRL, IOCALIB, CFM): the only
# field soft_reset_periph (bit 0) reads 1 at reset; the official table lists 0. The
# evidence is five registers on one board, so it is medium.
#
# Live status bits are excluded from the comparison (the reset value stays as
# documented, the mask drops the bits that change at run time):
#   TRAINING_RESET  0x20007818  reads 0x2: bit 1 is a documented reserved bit that is
#                   transient; only bit 0 (reset) is compared, resetMask 0x1.
#   DYN_CNTL        0x20007C1C  reads 0x480 (reset 0x400): bit 7 bc_vrgen_oor is a
#                   read-only status; resetMask 0xFFFFFF7F.
#   IOC_REG0        0x20007204  reads 0xE000 (reset 0x8000): bits 14 reg_calib_lock and
#                   13 reg_calib_start are set by the calibration; resetMask 0xFFFF9FFF.
#   RECAL_CNTL      0x20007C14  reads 0x20C8 (reset 0x8): bits 13:12 reg_pvt_reg_calib_clkdiv,
#                   7 reg_pvt_calib_lock and 6 reg_pvt_calib_start change at run time;
#                   resetMask 0xFFFFCF3F.
#
# Read-only results of the calibration and the training of the hardware, which read nonzero
# at power-on in boot mode 0 before any software has run (the cause is not known): IO calibration codes (IOC_REG2 SRO_*CODE, IOC_REG5 SRO_*SLEW*), the TIP
# readbacks of the gate training and the DQ/DQS optimisation (GT_CLK_SEL, GT_STATE,
# DQDQS_STATE) and the delay line out-of-range flags (EXPERT_DLYCNT_OOR_REG0 and 1). They
# have no reset value that a comparison can use, so no bit is compared (resetMask 0, the
# reset value 0 of the map stays), as for SPARE_FIC in SYSREG.yaml.
#
# Power-on values measured on 2026-10-23 (boot mode 0 after a power cycle, DFIAPB_CR 1 and
# the reference clock set up by `./x svd probe --enable-clocks`, see N5 and N32) that differ
# from the official map and are not changed by ./x hw initialize, so they are what the
# system controller loaded from the design at power-up: DDRPHY_STARTUP 0x003F0000 (the
# initialize writes 0x003F1F00), PLL_REF_FB_MAIN 0x500, SSCG_REG_2_MAIN 0x80, CH0_CNTL and
# CH1_CNTL 0x00FC0000 (the initialize writes 0x37F07770), TIP_CFG_PARAMS 0x03C1E000 (0x07CFE02F
# was read in an earlier run in another state). They are reset values of this design.
# IOC_REG1 (0x20007208) is a read-only calibration result that reads 0x10 once the
# calibration has run (the probe starts it): resetMask 0. DYN_CNTL: bits 31:15 are status
# (ARO_*, PVT_CALIB_STATUS) and read 0x0D10 there after the calibration has started, so only
# bits 14:8 and 6:0 are compared.
CFG_DDR_SGMII_PHY:
  _modify:
    IOC_REG2:
      resetMask: 0x0
    IOC_REG5:
      resetMask: 0x0
    GT_CLK_SEL:
      resetMask: 0x0
    GT_STATE:
      resetMask: 0x0
    DQDQS_STATE:
      resetMask: 0x0
    EXPERT_DLYCNT_OOR_REG0:
      resetMask: 0x0
    EXPERT_DLYCNT_OOR_REG1:
      resetMask: 0x0
    DDRPHY_STARTUP:
      resetValue: 0x003F0000
    PLL_REF_FB_MAIN:
      resetValue: 0x500
    SSCG_REG_2_MAIN:
      resetValue: 0x80
    CH0_CNTL:
      resetValue: 0x00FC0000
    CH1_CNTL:
      resetValue: 0x00FC0000
    TIP_CFG_PARAMS:
      resetValue: 0x03C1E000
    IOC_REG1:
      resetMask: 0x0
    PLL_DIV_0_1_MAIN:
      resetValue: 0x02000100
    PLL_DIV_0_1_IOSCB:
      resetValue: 0x08000200
    PLL_DIV_2_3_MAIN:
      resetValue: 0x01000100
    PLL_DIV_2_3_IOSCB:
      resetValue: 0x14000800
    PLL_PHADJ_MAIN:
      resetValue: 0x4001
    PLL_PHADJ_IOSCB:
      resetValue: 0x1
    SSCG_REG_2_IOSCB:
      resetValue: 0x30
    SOFT_RESET_DDR_PHY:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_MAIN_PLL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_IOSCB_PLL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_BANK_CTRL:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_IOCALIB:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_CFM:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_DRIVER:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_ODT:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_DECODER_IO:
      resetValue: 0x100
      resetMask: 0x103
    SOFT_RESET_TIP:
      resetValue: 0x100
      resetMask: 0x103
    RPC_RESET_MAIN_PLL:
      resetValue: 0x1
    RPC_RESET_IOSCB:
      resetValue: 0x1
    RPC_RESET_BANK_CTRL:
      resetValue: 0x1
    RPC_RESET_IOCALIB:
      resetValue: 0x1
    RPC_RESET_CFM:
      resetValue: 0x1
    TRAINING_RESET:
      resetMask: 0x1
    DYN_CNTL:
      resetMask: 0x00007F7F
    IOC_REG0:
      resetMask: 0xFFFF9FFF
    RECAL_CNTL:
      resetMask: 0xFFFFCF3F
