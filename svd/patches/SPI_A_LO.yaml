# source: svd/base/spi.yaml, RX_DATA.RXDATA description: "Received data. Reading this clears the register of the received data."
# source: Linux drivers/spi/spi-microchip-core-spi.c: mchp_corespi_read_fifo reads RXDATA once per byte after waiting for a non-empty RX FIFO, which is a FIFO pop
# status: unverified
# owner: Manuel Stahl

# Reading RX_DATA consumes the received data (the receive FIFO). The other SPI instances
# are derivedFrom SPI_A_LO and inherit it.
SPI_A_LO:
  RX_DATA:
    _modify:
      RXDATA:
        readAction: modifyExternal
