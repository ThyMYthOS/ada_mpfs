_add:
  PCIESS_QUAD_PLL0:
    description: PCIESS_QUAD_PLL0 Controller
    groupName: EXTPLL
    baseAddress: 0x32044000
    registers:
      SOFT_RESET:
        description: Compulsory register for all SCB slaves, facilitating global soft reset.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts functional reset of the peripheral block. It is asserted and left asserted at power-up. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: Resets all the volatile register bits. Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: Resets all the non-volatile register bits (e.g. RW-P bits). Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      EXTPLL_CLKBUF:
        description: External TX PLL Clock Buffer Control
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EXTPLL_CLKBUF_EN_APAD:
            description: 'This register is NOT for customers. Please mark this register as RESERVED. Allow DUALCLK1 input to be used as an analog output NOTE: The following settings must also be set when en_apad = 1 DUALCLK1_MODE = 2''b00 DUALCLK1_ENTERM = 2''b00 CLKBUF_EN_RDIFF = 1''b0 All TXATESTOUT# and RXATESTOUT# are connected to the APAD input to the clock buffer TXATESTEN# and RXATESTEN# should be set such that only 1 analog output is driven at a time. See TXATESTSEL# and RXATESTSEL# for possible output signals 0 1'
            bitOffset: 16
            bitWidth: 1
            access: read-write
          EXTPLL_CLKBUF_EN_PULLUP:
            description: Enable a pullup on both Dual Reference Clock inputs. 0 1
            bitOffset: 13
            bitWidth: 1
            access: read-write
          EXTPLL_CLKBUF_EN_UDRIVE_N:
            description: Enable Underdrive capability on CMOS receiver 0 1
            bitOffset: 12
            bitWidth: 1
            access: read-write
          EXTPLL_CLKBUF_EN_UDRIVE_P:
            description: Enable Underdrive capability on CMOS receiver 0 1
            bitOffset: 11
            bitWidth: 1
            access: read-write
          EXTPLL_CLKBUF_EN_RDIFF:
            description: Enable 100 Ohm Differential Termination (P to N) 0 1
            bitOffset: 10
            bitWidth: 1
            access: read-write
          EXTPLL_DUALCLK0_EN_HYST:
            description: Enable Hysteresis for DUALCLK0 0 1
            bitOffset: 9
            bitWidth: 1
            access: read-write
          EXTPLL_DUALCLK1_EN_HYST:
            description: Enable Hysteresis for DUALCLK1 0 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          EXTPLL_DUALCLK0_ENTERM:
            description: Determines Single Ended Termination for DUALCLK0 0x0 0x1 0x2 0x3
            bitOffset: 6
            bitWidth: 2
            access: read-write
          EXTPLL_DUALCLK0_MODE:
            description: Determines mode/negative input for DUALCLK0 0x0 0x1 0x2 0x3
            bitOffset: 4
            bitWidth: 2
            access: read-write
          EXTPLL_DUALCLK1_ENTERM:
            description: Determines Single Ended Termination for DUALCLK1 0x0 0x1 0x2 0x3
            bitOffset: 2
            bitWidth: 2
            access: read-write
          EXTPLL_DUALCLK1_MODE:
            description: Determines mode/negative input for DUALCLK1 0x0 0x1 0x2 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      EXTPLL_CTRL:
        description: External TXPLL Control
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0xCE0009
        fields:
          EXTPLL_LOCK:
            description: External Transmit PLL lock output
            bitOffset: 24
            bitWidth: 1
            access: read-only
          EXTPLL_FOUTAUXDIV2_SEL:
            description: Select divided by 2 of auxilary clock output 0 1
            bitOffset: 23
            bitWidth: 1
            access: read-write
          EXTPLL_RESET_RTL:
            description: Reset all RTL for EXTPLL 0 1
            bitOffset: 22
            bitWidth: 1
            access: read-write
          EXTPLL_CLKRESET:
            description: Reset signal synchronized and sent to serializers Stop Serializer clock for 4 VCO periods when CLKRESET transitions from 0 to 1. 0 1
            bitOffset: 21
            bitWidth: 1
            access: read-write
          EXTPLL_CLKRESETEN:
            description: Enable for EXTPLL_CLKRESET 0 1
            bitOffset: 20
            bitWidth: 1
            access: read-write
          EXTPLL_BIAS_PD:
            description: Powerdown Bias Currents to fracpll 0 1
            bitOffset: 19
            bitWidth: 1
            access: read-write
          EXTPLL_AUXDIVPD:
            description: Active High powerdown for auxilary clock output from TXPLL 0 1
            bitOffset: 18
            bitWidth: 1
            access: read-write
          EXTPLL_PD:
            description: Transmit PLL Power Down Control 0 1
            bitOffset: 17
            bitWidth: 1
            access: read-write
          EXTPLL_STEP_PHASE:
            description: Step PLL Phase for one PFD period Step on every TXPLL_STEP_PHASE transition
            bitOffset: 16
            bitWidth: 1
            access: read-write
          EXTPLL_PHASESTEPAMOUNT:
            description: Signed fractional step for phase stepping (+/- 1/2 integer bit)
            bitOffset: 8
            bitWidth: 8
            access: read-write
          EXTPLL_DSMPD:
            description: External Transmit PLL fractional modulator PD The PLL should be in integer mode (DSMPD=1) for lowest jitter 0 1
            bitOffset: 3
            bitWidth: 1
            access: read-write
          EXTPLL_FBDIV_SEL:
            description: Selects modulation for TXPLL 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          EXTPLL_VBGREF_SEL:
            description: Select VBG Reference for PLL voltage regulator 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          EXTPLL_PLLBW:
            description: Transmit PLL Bandwidth Control 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      EXTPLL_CLK_SEL:
        description: External TXPLL Clock Select
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x1F00
        fields:
          EXTPLL_JA_FREF_SEL:
            description: Select External PLL Jitter Attenuator Reference Clock 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 16
            bitWidth: 3
            access: read-write
          EXTPLL_CASCADE_CLK_SEL_SM:
            description: Select External PLL Soft Macro Cascade Clock 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 10
            bitWidth: 3
            access: read-write
          EXTPLL_CASCADE_CLK_SEL_HM:
            description: Select External PLL Hard Macro Cascade Clock 0x0 0x1 0x2 0x3
            bitOffset: 8
            bitWidth: 2
            access: read-write
          EXTPLL_REFCLK_SEL_SM:
            description: Select External PLL Soft Macro Reference Clock 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 2
            bitWidth: 3
            access: read-write
          EXTPLL_REFCLK_SEL_HM:
            description: EXT PLL Reference Clock Mux 0x0 0x1 0x2 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      EXTPLL_DIV_1:
        description: External TXPLL Dividers
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x140014
        fields:
          EXTPLL_FBDIV:
            description: 'Transmit PLL feedback divide value from (16 in integer mode) from 19 in fractional-N mode The VCO frequency is given by (f_ref * FBDIV / REFDIV / POSTDIV), where f_ref is the reference frequency The bit rate is given by (2 * f_ref * FBDIV / REFDIV / POSTDIV) See TXPOSTDIV for post-divider settings The VCO frequency should be programmed to half the bit rate Example : for 10Gb/s, the VCO should be programmed to 5GHz'
            bitOffset: 16
            bitWidth: 12
            access: read-write
          EXTPLL_AUXDIV:
            description: External Transmit PLL auxilary clock output FOUTAUXDIV= VCO Frequency / TXPLL_AUXDIV Supports any divide value of 8,9,10,12,13,15,16,... FOUTAUXDIV connected to Jitter Attenuator FFB port
            bitOffset: 0
            bitWidth: 12
            access: read-write
      EXTPLL_DIV_2:
        description: External TXPLL Dividers
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x1000001
        fields:
          EXTPLL_REFDIV:
            description: Transmit PLL reference divide value (1 to 63) For PLL programming, see FBDIV notes
            bitOffset: 24
            bitWidth: 6
            access: read-write
          EXTPLL_FRAC:
            description: PLL fractional part of feedback divide value
            bitOffset: 0
            bitWidth: 24
            access: read-write
      EXTPLL_JA_1:
        description: External TXPLL JA Control
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x640064
        fields:
          EXTPLL_JA_DIVFFB:
            description: Jitter Attenuator PLL Integer divider for FFB
            bitOffset: 16
            bitWidth: 16
            access: read-write
          EXTPLL_JA_DIVFIN:
            description: Jitter Attenuator PLL Integer divider for FIN
            bitOffset: 0
            bitWidth: 16
            access: read-write
      EXTPLL_JA_2:
        description: External TXPLL JA Control
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x64
        fields:
          EXTPLL_JA_SYNCCNTMAX:
            description: Jitter Attenuator PLL FIN pulses will be counted for SYNCCNTMAX pulses to determine frequency match
            bitOffset: 0
            bitWidth: 32
            access: read-write
      EXTPLL_JA_3:
        description: External TXPLL JA Control
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0xA0064
        fields:
          EXTPLL_JA_TARGETCNT:
            description: Jitter Attenuator PLL If number of pulse counts between FIN and FFB is less than TARGETCNT the frequency comparator will declare frequencies match (Set FLOCK=1'b1)
            bitOffset: 16
            bitWidth: 16
            access: read-write
          EXTPLL_JA_CNTOFFSET:
            description: Jitter Attenuator PLL Allows for frequency multiplication in the frequency control loop. By setting CNTOFFSET to SYNCCNTMAX / K, where K is the multiplication ratio, the frequency detector will output a zero frequency error when CNTOFFSET pulses have been counted from the reference and SYNCCNTMAX pulses have been counted from the feedback.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      EXTPLL_JA_4:
        description: External TXPLL JA Control
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x101000F
        fields:
          EXTPLL_JA_FKI:
            description: Jitter Attenuator PLL K Gain for integral frequency comparison loop Gain=$M\times 2^K$
            bitOffset: 24
            bitWidth: 5
            access: read-write
          EXTPLL_JA_FMI:
            description: Jitter Attenuator PLL M gain for integral frequency comparison loop Gain=$M\times 2^K$
            bitOffset: 16
            bitWidth: 8
            access: read-write
          EXTPLL_JA_OTDLY:
            description: Jitter Attenuator PLL Delay in FFB pulses from when FLOCK=1'b1 to when the ADPLL transfers control from the frequency comparison loop to the phase comparison loop -- allows additional settling and avoids glitches in FLOCK output
            bitOffset: 0
            bitWidth: 16
            access: read-write
      EXTPLL_JA_5:
        description: External TXPLL JA Control
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x1010101
        fields:
          EXTPLL_JA_PMI2:
            description: Jitter Attenuator PLL Fine settling M gain for integral phase comparison loop Gain=$M\times 2^K$
            bitOffset: 24
            bitWidth: 8
            access: read-write
          EXTPLL_JA_PMI1:
            description: Jitter Attenuator PLL Course settling M gain for integral phase comparison loop Gain=$M\times 2^K$
            bitOffset: 16
            bitWidth: 8
            access: read-write
          EXTPLL_JA_PMP2:
            description: Jitter Attenuator PLL Fine settling M gain for proportional phase comparison loop Gain=$M\times 2^K$
            bitOffset: 8
            bitWidth: 8
            access: read-write
          EXTPLL_JA_PMP1:
            description: Jitter Attenuator PLL Course settling M gain for proportional phase comparison loop Gain=$M\times 2^K$
            bitOffset: 0
            bitWidth: 8
            access: read-write
      EXTPLL_JA_6:
        description: External TXPLL JA Control
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x1010101
        fields:
          EXTPLL_JA_PKI2:
            description: Jitter Attenuator PLL 2s Complement Fine settling K gain for integral phase comparison loop Gain=$M\times 2^K$
            bitOffset: 24
            bitWidth: 5
            access: read-write
          EXTPLL_JA_PKI1:
            description: Jitter Attenuator PLL 2s Copmplement Course settling K gain for integral phase comparison loop Gain=$M\times 2^K$
            bitOffset: 16
            bitWidth: 5
            access: read-write
          EXTPLL_JA_PKP2:
            description: Jitter Attenuator PLL 2s Complement Fine settling K gain for proportional phase comparison loop Gain=$M\times 2^K$
            bitOffset: 8
            bitWidth: 5
            access: read-write
          EXTPLL_JA_PKP1:
            description: Jitter Attenuator PLL 2s Complement Course settling K gain for proportional phase comparison loop Gain=$M\times 2^K$
            bitOffset: 0
            bitWidth: 5
            access: read-write
      EXTPLL_JA_7:
        description: External TXPLL JA Control
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x7000001
        fields:
          EXTPLL_JA_PROGRAM:
            description: Jitter Attenuator PLL Diagnostic Control Signal 0 1
            bitOffset: 26
            bitWidth: 1
            access: read-write
          EXTPLL_JA_ONTARGETOV:
            description: Jitter Attenuator PLL Diagnostic Control Signal 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          EXTPLL_JA_FDONLY:
            description: Jitter Attenuator PLL Force Frequency Control 0 1
            bitOffset: 24
            bitWidth: 1
            access: read-write
          EXTPLL_JA_DELAYK:
            description: Jitter Attenuator PLL Phase comparison loop will settle initially using PKP1 and PKI1 (course settling) parameters, and switch over to PKP2 and PKI2 (fine settling) parameters DELAYK FFB pulses after phase comparison loop takes over (OTDLY + DELAYK FFB pulses after initial frequency lock)
            bitOffset: 0
            bitWidth: 24
            access: read-write
      EXTPLL_JA_8:
        description: External TXPLL JA Control
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EXTPLL_JA_HOLD:
            description: Jitter Attenuator PLL Hold output state of the DPLL. 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          EXTPLL_JA_PRESET_EN:
            description: Jitter Attenuator PLL Load Preset INT and FRAC values into DPLL 0 1
            bitOffset: 24
            bitWidth: 1
            access: read-write
          EXTPLL_JA_FRAC_PRESET:
            description: Jitter Attenuator PLL Preset FRAC output, if PRESET_EN --> 1'b1, output is set to this value
            bitOffset: 0
            bitWidth: 24
            access: read-write
      EXTPLL_JA_9:
        description: External TXPLL JA Control
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0x180014
        fields:
          EXTPLL_JA_INT_PD_OUT:
            description: Jitter Attenuator PLL Integer bits of Phase Detector Integrator Output
            bitOffset: 16
            bitWidth: 12
            access: read-only
          EXTPLL_JA_INT_PRESET:
            description: Jitter Attenuator PLL Preset INT output, if PRESET_EN --> 1'b1, output is set to this value
            bitOffset: 0
            bitWidth: 12
            access: read-write
      EXTPLL_JA_10:
        description: External TXPLL JA Control
        addressOffset: 0x3C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          EXTPLL_JA_PHASE_LOCK:
            description: Jitter Attenuator PLL Indicates the DPLL is in fine tune phase tracking mode 1'b1 -- The PLL is in fine tune phase tracking mode 1'b0 -- The PLL is either in coarse tune tracking mode or (if FLOCK=1'b0) not frequency locked
            bitOffset: 25
            bitWidth: 1
            access: read-only
          EXTPLL_JA_FLOCK:
            description: Jitter Attenuator PLL Indicates the DPLL has achieved frequency lock 1'b1 -- Frequencies have maintained lock within TARGETCNT for OTDLY FFB pulses 1'b0 -- Frequency comparator has detected a mismatch in FIN and FFB pulse counts
            bitOffset: 24
            bitWidth: 1
            access: read-only
          EXTPLL_JA_FRAC_PD_OUT:
            description: Jitter Attenuator PLL Fractional bits of Phase Detector Integrator Output
            bitOffset: 0
            bitWidth: 24
            access: read-only
      EXTPLL_JA_RST:
        description: External TXPLL JA RESETs
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x55
        fields:
          EXTPLL_JA_RESET_CLKS_EXT:
            description: Jitter Attenuator PLL RESET for PLL Sync Clock Domain when RESET_CLKS_OVERRIDE=1'b1 0 1
            bitOffset: 6
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET_CLKS_OVERRIDE:
            description: Jitter Attenuator PLL Override Signal for PLL Sync Clock Domain Reset Signal 0 1
            bitOffset: 5
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET_FIN_EXT:
            description: Jitter Attenuator PLL RESET for Input Clock Domain when RESET_FIN_OVERRIDE=1'b1 0 1
            bitOffset: 4
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET_FIN_OVERRIDE:
            description: Jitter Attenuator PLL Override Signal for Input Clock Domain Reset Signal 0 1
            bitOffset: 3
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET_FFB_EXT:
            description: Jitter Attenuator PLL RESET for Feedback Clock Domain when RESET_FFB_OVERRIDE=1'b1 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET_FFB_OVERRIDE:
            description: Jitter Attenuator PLL Override Signal for Feedback Clock Domain Reset Signal 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          EXTPLL_JA_RESET:
            description: Jitter Attenuator PLL Resets all internal counters and registers to their default state INITINT, INITFRAC and INITDPLLSTATE are ignored 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
  PCIESS_QUAD_PLL1:
    derivedFrom: PCIESS_QUAD_PLL0
    description: PCIESS_QUAD_PLL1 Controller
    baseAddress: 0x32048000
  SERDES_01_EXT:
    derivedFrom: PCIESS_QUAD_PLL0
    description: SERDES_01_EXT Controller
    baseAddress: 0x34010000
  SERDES_13_EXT:
    derivedFrom: PCIESS_QUAD_PLL0
    description: SERDES_13_EXT Controller
    baseAddress: 0x34020000
  SERDES_02_EXT:
    derivedFrom: PCIESS_QUAD_PLL0
    description: SERDES_02_EXT Controller
    baseAddress: 0x34040000
  SERDES_24_EXT:
    derivedFrom: PCIESS_QUAD_PLL0
    description: SERDES_24_EXT Controller
    baseAddress: 0x34080000
  SERDES_35_EXT:
    derivedFrom: PCIESS_QUAD_PLL0
    description: SERDES_35_EXT Controller
    baseAddress: 0x34100000
