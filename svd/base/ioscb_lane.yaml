_add:
  LANE_N_5:
    description: LANE_N_5 Controller
    groupName: IOSCB_LANE
    baseAddress: 0x36000000
    registers:
      SOFT_RESET:
        description: This is a compulsory register for all SCB slaves and must be at the same offset in all slaves to facilitate global soft reset of all SCB registers with a single broadcast write from the SCB master.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. (IO SCB bus only) Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts the functional reset of the block. It is asserted at power up. When written is stays asserted until written to 0. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: This when asserted resets all the register bits apart from the non-volatile registers, the bit self clears. i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: This when asserted resets all the non-volatile register bits e.g. RW-P bits, the bit self clears i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      BNK_CLK_SEL:
        description: Bnk Clock Selections
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BCLK_SEL:
            description: bclk mux select bits. 3 bits per mux
            bitOffset: 0
            bitWidth: 9
            access: read-write
      CDR_CLK_SEL:
        description: CDR Clock Selections
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CLK_SEL:
            description: cdr clock selctions. 4 muxes. (3 bits each)
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CODE_SEL:
        description: DLL Code selections
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CODE_SEL:
            description: Select 1 of 4 DLL code buses.
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DQS_MODE:
        description: dqs mode selection
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DQS_MD:
            description: DQS mode selection.(ddr1/2/3/4)
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CDR_MODE:
        description: CDR mode selection (number of pll phases)
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CDR_MD:
            description: CDR mode. (select number of pll phases used)
            bitOffset: 0
            bitWidth: 2
            access: read-write
      QDR_MODE:
        description: QDR mode selection
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          QDR:
            description: QDR mode. Use 2 bank clock select muses
            bitOffset: 0
            bitWidth: 1
            access: read-write
      FIFO:
        description: FIFO controls
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RXPTR:
            description: Fifo read pointer starting position
            bitOffset: 16
            bitWidth: 3
            access: read-write
          FIFO_RUN:
            description: Enable fifo free run mode
            bitOffset: 8
            bitWidth: 1
            access: read-write
          FIFO_EN:
            description: Enable fifo
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DIVCLK:
        description: DIVCLK contorls
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DIVCLK_SEL:
            description: Select divclk output port source. (divider or bclk1 or dqsi or dqsi_b)
            bitOffset: 8
            bitWidth: 2
            access: read-write
          DIV:
            description: Clock divider settings. (off or Divide by 1, 2, 3p5, 4 or 5)
            bitOffset: 0
            bitWidth: 3
            access: read-write
      RX_DELAY_CNTL:
        description: RX delay controls
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RXMVDLY_EN:
            description: Enable RX dynamic delay controls
            bitOffset: 16
            bitWidth: 1
            access: read-write
          RXDLY_DIR:
            description: RX dynamic delay move direction. (up or down)
            bitOffset: 8
            bitWidth: 1
            access: read-write
          RXDLY_EN:
            description: Enable RX delay
            bitOffset: 0
            bitWidth: 1
            access: read-write
      RX_DELAY_OFFSET:
        description: RX delay offset from DLL codes
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RXDLY_OFFSET:
            description: RX delay offset code
            bitOffset: 0
            bitWidth: 8
            access: read-write
      TX_DELAY_CNTL:
        description: TX delay controls
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TXMVDLY_EN:
            description: Enable TX dynamic delay controls
            bitOffset: 16
            bitWidth: 1
            access: read-write
          TXDLY_DIR:
            description: TX dynamic delay move direction. (up or down)
            bitOffset: 8
            bitWidth: 1
            access: read-write
          TXDLY_EN:
            description: Enable TX delay
            bitOffset: 0
            bitWidth: 1
            access: read-write
      TX_DELAY_OFFSET:
        description: TX delay offset from DLL codes
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TXDLY_OFFSET:
            description: TX delay offset code
            bitOffset: 0
            bitWidth: 8
            access: read-write
      LANE_CONTROLS:
        description: Misc. Lane control signals
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RANK2:
            description: enables eip control of rank 2 delay offsets
            bitOffset: 6
            bitWidth: 1
            access: read-write
          STOP_SEL:
            description: select stop clock for cdr
            bitOffset: 4
            bitWidth: 2
            access: read-write
          ODT_DYN_SEL:
            description: Select lane base odt control
            bitOffset: 3
            bitWidth: 1
            access: read-write
          GSR_DISABLE:
            description: Disable gsr function
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RST_INV:
            description: Invert reset
            bitOffset: 1
            bitWidth: 1
            access: read-write
          PAUSE_EN:
            description: Stop clocks
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOA_REG0:
        description: IO buffer control Registers
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0xA
        fields:
          HYST:
            description: Enable ratio receiver hysteresis
            bitOffset: 10
            bitWidth: 1
            access: read-write
          CLAMP:
            description: Enable pad clamp
            bitOffset: 9
            bitWidth: 1
            access: read-write
          COMP:
            description: Complementary output mode
            bitOffset: 8
            bitWidth: 1
            access: read-write
          DRV:
            description: Output buffer drive strength
            bitOffset: 1
            bitWidth: 4
            access: read-write
          ENDIFF:
            description: Enable differential output mode
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOA_REG1:
        description: IO buffer control Registers
        addressOffset: 0x3C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          LP_PERSIST:
            description: persist mode
            bitOffset: 24
            bitWidth: 1
            access: read-write
          LP_BYPASS:
            description: Low power bypass mode
            bitOffset: 16
            bitWidth: 1
            access: read-write
          IBUFMX:
            description: Receiver mixed mode settings
            bitOffset: 8
            bitWidth: 2
            access: read-write
          IBUFMD:
            description: Define receiver input mode
            bitOffset: 0
            bitWidth: 3
            access: read-write
      IOA_REG2:
        description: IO buffer control Registers
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ODT_STATIC:
            description: On Die Termination direction configuration
            bitOffset: 4
            bitWidth: 3
            access: read-write
          ODT:
            description: On Die Termination magnitude setting
            bitOffset: 0
            bitWidth: 4
            access: read-write
      IOA_REG3:
        description: IO buffer control Registers
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x3C
        fields:
          LOCKDN_EN:
            description: Enable security lock down capability
            bitOffset: 7
            bitWidth: 1
            access: read-write
          WPD:
            description: Enable weak pull down
            bitOffset: 6
            bitWidth: 1
            access: read-write
          WPU:
            description: Enable weak pull up
            bitOffset: 5
            bitWidth: 1
            access: read-write
          SPIO_SEL_DI:
            description: Enable ibuf special IO function
            bitOffset: 3
            bitWidth: 2
            access: read-write
          SPIO_SEL:
            description: Enable obuf special IO function
            bitOffset: 2
            bitWidth: 1
            access: read-write
          SLEW:
            description: Obuf slew rate control
            bitOffset: 0
            bitWidth: 2
            access: read-write
      IOA_REG4:
        description: IO buffer control Registers
        addressOffset: 0x48
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          LANE_PVT:
            description: select local lane pvt control comp
            bitOffset: 1
            bitWidth: 1
            access: read-write
          ATP_EN:
            description: analog test port enable
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOG_REG0:
        description: IO Gearing control Registers
        addressOffset: 0x4C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ESD:
            description: Enable SLE register synch. Data_b
            bitOffset: 6
            bitWidth: 1
            access: read-write
          OSD:
            description: Output SLE register synch. Data_b
            bitOffset: 5
            bitWidth: 1
            access: read-write
          ISD:
            description: Input SLE register synch. Data_b
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ECE_INV:
            description: Enable SLE register clock enable
            bitOffset: 3
            bitWidth: 1
            access: read-write
          OCE_INV:
            description: Output SLE register clock enable
            bitOffset: 2
            bitWidth: 1
            access: read-write
          ICE_INV:
            description: Input SLE register clock enable
            bitOffset: 1
            bitWidth: 1
            access: read-write
          GSR_DISABLE:
            description: Disable gsr function
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOG_REG1:
        description: IO Gearing control Registers
        addressOffset: 0x50
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DLY_MD:
            description: IOG delay mode. (input, output or both)
            bitOffset: 6
            bitWidth: 2
            access: read-write
          EAD:
            description: Enable SLE register asynch. Data_b
            bitOffset: 5
            bitWidth: 1
            access: read-write
          OAD:
            description: Output SLE register asynch. Data_b
            bitOffset: 4
            bitWidth: 1
            access: read-write
          IAD:
            description: Input SLE register asynch. Data_b
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ELAT:
            description: Enable SLE register latch mode
            bitOffset: 2
            bitWidth: 1
            access: read-write
          OLAT:
            description: Output SLE register latch mode
            bitOffset: 1
            bitWidth: 1
            access: read-write
          ILAT:
            description: Input SLE register latch mode
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOG_REG2:
        description: IO Gearing control Registers
        addressOffset: 0x54
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EYEWIDTH:
            description: Eyewidth setting (size of eye opening)
            bitOffset: 5
            bitWidth: 3
            access: read-write
          EYE_SDR:
            description: Eye monitor Singel Data Rate mode
            bitOffset: 4
            bitWidth: 1
            access: read-write
          EYE_EN:
            description: Enable eye monitor mode
            bitOffset: 3
            bitWidth: 1
            access: read-write
          INDLY_SEL:
            description: Enable eye delay mode
            bitOffset: 1
            bitWidth: 2
            access: read-write
          EDGEDET:
            description: Edge detect mode for dleay change
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOG_REG3:
        description: IO Gearing control Registers
        addressOffset: 0x58
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RX_MD:
            description: Receiver mode. (sd/dd/1/2/3/4)
            bitOffset: 16
            bitWidth: 4
            access: read-write
          FIFOWE:
            description: Enable fifo write
            bitOffset: 8
            bitWidth: 1
            access: read-write
          BCLK_SEL:
            description: Select bclk<5:0> or cdrclk or nxtclk (8:1 mux)
            bitOffset: 0
            bitWidth: 3
            access: read-write
      IOG_REG4:
        description: IO Gearing control Registers
        addressOffset: 0x5C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RXDLY:
            description: Receiver delay tap setting
            bitOffset: 0
            bitWidth: 7
            access: read-write
      IOG_REG5:
        description: IO Gearing control Registers
        addressOffset: 0x60
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TXDLY:
            description: Transmitter delay tap setting
            bitOffset: 0
            bitWidth: 7
            access: read-write
      IOG_REG6:
        description: IO Gearing control Registers
        addressOffset: 0x64
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          OE_MD:
            description: Enable logic mode. (x1/2/4, etc.)
            bitOffset: 5
            bitWidth: 3
            access: read-write
          MVDLY_EN:
            description: Enalbe dynamic dleay adjustments
            bitOffset: 4
            bitWidth: 1
            access: read-write
          SCLK1_INV:
            description: System clock Invert. (for transmitter logic)
            bitOffset: 3
            bitWidth: 1
            access: read-write
          SCLK1_EN:
            description: System clock enable. (for transmitter logic)
            bitOffset: 2
            bitWidth: 1
            access: read-write
          SCLK0_INV:
            description: System clock Invert. (for receiver logic)
            bitOffset: 1
            bitWidth: 1
            access: read-write
          SCLK0_EN:
            description: System clock enable. (for receiver logic)
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IOG_REG7:
        description: IO Gearing control Registers
        addressOffset: 0x68
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TX_MD:
            description: Transmitter logic mode (x1/2/4, etc.)
            bitOffset: 0
            bitWidth: 7
            access: read-write
      IOG_REG8:
        description: IO Gearing control Registers
        addressOffset: 0x6C
