            access: read-only
          SCB_DFT_TXDLYTSTA:
            description: tx delay test a results
            bitOffset: 26
            bitWidth: 1
            access: read-only
          SCB_DFT_RXDLYTSTB:
            description: rx delay test b results
            bitOffset: 25
            bitWidth: 1
            access: read-only
          SCB_DFT_RXDLYTSTA:
