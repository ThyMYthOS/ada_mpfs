            access: read-only
          POWERDOWN:
            description: Indicates that the USB CLK may be stopped to save power. Derived from combination of signals from CLK & XCLK flip-flops, AVALID, VBUSVALID and LINESTATE. When asserted the USB clock into the core is stopped.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          POWERDOWN_ENABLE:
            description: When '1' will stop the clock to the USB core when the core asserts its POWERDOWN output. For G4 compatibility this bit defaults to 0.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          DDR_SELECT:
            description: Configures USB for Single-Data Rate(SDR) mode or Double-Data Rate(DDR) mode. 0 - SDR Mode is selected 1 - DDR Mode is selected (Not supported in G5 or G5)
            bitOffset: 0
            bitWidth: 1
            access: read-only
      MESH_CR:
        description: Crypto Mesh control and status register
        addressOffset: 0xB0
        size: 32
        access: read-write
        resetValue: 0x4E
        fields:
          OKAY:
            description: Indicates that the Mesh is functioning correctly. Will be set approximately 520 clock cycles after mesh started and stay set as long as the mesh is not detecting any errors.
            bitOffset: 25
            bitWidth: 1
            access: read-only
          MESH_ERROR:
            description: Indicates that Mesh detected an error. Cleared by writing a '1'
            bitOffset: 24
            bitWidth: 1
            access: read-write
          INJECT_ERROR:
            description: When set will inject an error in the mesh
            bitOffset: 16
            bitWidth: 1
            access: read-write
          HOLD:
            description: Sets the amount of time that the mesh is held active for, actual hold time includes up to 256 us of random variation. Minimum Time = 1 + 256 * value us Maximum Time = 1 + 256 * (1+value) us Value must be greater than 0
            bitOffset: 1
            bitWidth: 12
            access: read-write
          START:
            description: Writing a 1 will start the Mesh System
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MESH_SEED_CR:
        description: Crypto mesh seed and update rate
        addressOffset: 0xB4
        size: 32
        access: read-write
        resetValue: 0xC7005EED
        fields:
          CLKRATE:
            description: Sets the rate that the mesh value is changed. Rate = AHBCLK/(clkrate+1). Rate must be less than 1MHz, setting slower will reduce power consumption.
            bitOffset: 24
            bitWidth: 8
            access: read-write
          SEED:
            description: Sets the mesh seed value, any value may be used, zero should be avoided
            bitOffset: 0
            bitWidth: 23
            access: read-write
      ENVM_CR:
        description: ENVM AHB Controller setup
        addressOffset: 0xB8
        size: 32
        access: read-write
        resetValue: 0x4005004F
        fields:
          TIMER:
            description: 'Sets the duration of the timer used to detect a non response of slow response from the PNVM on C and R bus accesses. Timer Duration = Value * (1000/AHBFREQMHZ) 0x00: Timer disabled. If the timer expires the AHB cycle is terminated using the HRESP protocol'
            bitOffset: 24
            bitWidth: 8
            access: read-write
          INTERRUPT_ENABLE:
            description: Enable the ENVM interrupt
            bitOffset: 18
            bitWidth: 1
            access: read-write
          SLOWREAD:
            description: When '1' the controller will initiate separate ENVM reads for all reads. No buffering or speculative operations will be carried out. When performing word reads incrementing through PNVM each location will be read twice (intended for test use)
            bitOffset: 17
            bitWidth: 1
            access: read-write
          READAHEAD:
            description: Enables "readahead" on the ENVM controller. The controller will automatically read the next PNVM location as soon as possible ahead of the AHB request. This will improve read performance when incrementing though memory as the NVM reads and AHB cycles are pipelined. When set non incrementing accesses will take longer as the controller may be in the process of reading the next address and the PNVM cycle needs to complete prior to starting the required read
            bitOffset: 16
            bitWidth: 1
            access: read-write
          CLOCK_SUPPRESS:
            description: When set suppresses clock edge between C-Bus access cycles so that they appear as consecutive access cycles.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          CLOCK_CONTINUOUS:
            description: When '1' the PNVM clock will be always generated, and not stopped between access cycles. Setting this will increase access latency but mean that the PNVM clock operates at a stable rate.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          CLOCK_OKAY:
            description: Indicates the eNVM is running at the configured divider rate.
            bitOffset: 6
            bitWidth: 1
            access: read-only
          CLOCK_PERIOD:
            description: Sets the number of AHB cycles used to generate the PNVM clock, Clock period = (Value+1) * (1000/AHBFREQMHZ) Value must be 1 to 63 (0 defaults to 15) e.g. 11 will generate a 40ns period 25MHz clock if the AHB clock is 250MHz 15 will generate a 40ns period 25MHz clock if the AHB clock is 400MHz
            bitOffset: 0
            bitWidth: 6
            access: read-write
