_add:
  SYSREG:
    description: SYSREG Controller
    baseAddress: 0x20002000
    registers:
      TEMP0:
        description: Register for software use
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0xAC7E1
        fields:
          DATA:
            description: Scratch register for CPUS
            bitOffset: 0
            bitWidth: 32
            access: read-write
      TEMP1:
        description: Register for software use
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DATA:
            description: Scratch register for CPUS
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CLOCK_CONFIG_CR:
        description: Master clock configuration
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x10
        fields:
          ENABLE_1MHZ:
            description: When '1' requests pfsoc_control to enable the 1mHz (2MHz) on-chip oscillator
            bitOffset: 8
            bitWidth: 1
            access: read-write
          DIVIDER:
            description: Sets the master synchronous clock divider bits [1:0] CPU clock divider (Reset=/1 =0) bits [3:2] AXI clock divider (Reset=/1 =0) bits [5:4] AHB/APB clock divider (Reset=/2 =1) 00=/1 01=/2 10=/4 11=/8 (AHB/APB divider may not be set to /1) Note at reset MSS corner clock is 80MHz, therefore divider is set to divide by 1
            bitOffset: 0
            bitWidth: 6
            access: read-write
      RTC_CLOCK_CR:
        description: RTC clock divider
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x10064
        fields:
          ENABLE:
            description: RTC Clock enable. When changing the divider the enable should be turned off first, the divider changed and the enable turned back on.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          PERIOD:
            description: Sets the division ratio to create the internal RTC clock from the reference clock. The defaults sets the reference clock to 1MHz assuming the reference clock is 100Mhz. If the reference clock is 125MHz then 125 will create a 1MHz clock Max divider value is 4095 and value must be an integer. RTC clock must be less 2X the AXI clock rate.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      FABRIC_RESET_CR:
        description: Fabric Reset mask
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE:
            description: This bitfield has no effect if changed
            bitOffset: 0
            bitWidth: 1
            access: read-write
      BOOT_FAIL_CR:
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BOOT:
            description: Written by firmware to indicate that the boot process failed, drives the fab_boot_fail signal to the fabric. Is cleared by the fabric asserting fab_boot_fail_clear
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MSS_RESET_CR:
        description: Allows the CPU to fully reset the MSS
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESET_VALUE:
            description: When written to 16'hDEAD will cause a full MSS reset. The Reset will clear this register. The register may be written to any value but only a value of 16'hDEAD will cause the reset to happen
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CONFIG_LOCK_CR:
        description: Configuration lock
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          LOCK:
            description: When written to '1' will cause all RWC registers to lock until a master reset occurs.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      RESET_SR:
        description: Indicates which reset caused the last reset. After a reset occurs register should be read and then zero written to allow the next reset event to be correctly captured.
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x1FF
        fields:
          CPU_SOFT_RESET:
            description: Indicates that the CPU reset the MSS using the soft reset register
            bitOffset: 8
            bitWidth: 1
            access: read-write
          SCB_BUS_RESET:
            description: Indicates that SCB bus reset occurred (which causes warm reset of MSS)
            bitOffset: 7
            bitWidth: 1
            access: read-write
          GPIO_RESET:
            description: Indicates that fabric asserted the GPIO reset inputs
            bitOffset: 6
            bitWidth: 1
            access: read-write
          WDOG_RESET:
            description: Reset was caused by the watchdog
            bitOffset: 5
            bitWidth: 1
            access: read-write
          FABRIC_RESET:
            description: Reset was caused by the fabric
            bitOffset: 4
            bitWidth: 1
            access: read-write
          DEBUGER_RESET:
            description: Reset was caused by the Risc-V Debugger
            bitOffset: 3
            bitWidth: 1
            access: read-write
          SCB_CPU_RESET:
            description: Reset was caused by the SCB CPU reset register
            bitOffset: 2
            bitWidth: 1
            access: read-write
          SCB_MSS_RESET:
            description: Reset was caused by the SCB MSS reset register
            bitOffset: 1
            bitWidth: 1
            access: read-write
          SCB_PERIPH_RESET:
            description: Reset was caused by the SCB periphery reset signal
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DEVICE_STATUS:
        description: Indicates the device status, in particular the state of the FPGA fabric and the MSS IO banks
        addressOffset: 0x24
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          IO_EN:
            description: Indicates the status of the io_en input from G5 Control.
            bitOffset: 12
            bitWidth: 1
            access: read-only
          IO_BANK_B6_STATUS:
            description: Power status of IO bank 6
            bitOffset: 11
            bitWidth: 1
            access: read-only
          IO_BANK_B5_STATUS:
            description: Power status of IO bank 5
            bitOffset: 10
            bitWidth: 1
            access: read-only
          IO_BANK_B4_STATUS:
            description: Power status of IO bank 4
            bitOffset: 9
            bitWidth: 1
            access: read-only
          IO_BANK_B2_STATUS:
            description: Power status of IO bank 2
            bitOffset: 8
            bitWidth: 1
            access: read-only
          FLASH_VALID:
            description: Indicates the status of the flash_valid input from G5 Control.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          FF_IN_PROGRESS:
            description: Indicates the status of the ff_in_progress input from G5 Control.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          LP_STATE:
            description: Indicates the status of the lp_state input from G5 Control.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          CORE_UP:
            description: Indicates the status of the core_up input from G5 Control.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      MSS_BUILD:
        description: MSS Build Info
        addressOffset: 0x28
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          REVISION:
            description: Set to the SVN revision of the pfsoc_mss_main.sv file
            bitOffset: 0
            bitWidth: 32
            access: read-only
      FAB_INTEN_U54_1:
        description: U54-1 Fabric interrupt enable
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE:
            description: Enables the F2H_interrupts[31:0] to interrupt U54_1 directly
            bitOffset: 0
            bitWidth: 32
            access: read-write
      FAB_INTEN_U54_2:
        description: U54-2 Fabric interrupt enable
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE:
            description: Enables the F2H_interrupts[31:0] to interrupt U54_1 directly
            bitOffset: 0
            bitWidth: 32
            access: read-write
      FAB_INTEN_U54_3:
        description: U54-3 Fabric interrupt enable
        addressOffset: 0x48
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE:
            description: Enables the F2H_interrupts[31:0] to interrupt U54_1 directly
            bitOffset: 0
            bitWidth: 32
            access: read-write
      FAB_INTEN_U54_4:
        description: U54-4 Fabric interrupt enable
        addressOffset: 0x4C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE:
            description: Enables the F2H_interrupts[31:0] to interrupt U54_1 directly
            bitOffset: 0
            bitWidth: 32
            access: read-write
      FAB_INTEN_MISC:
        description: Allows the Ethernet interrupts to be directly routed to the U54 CPUS.
        addressOffset: 0x50
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MAC1_U54_4:
            description: Enables the Ethernet MAC1 to interrupt U54_1 directly
            bitOffset: 3
            bitWidth: 1
            access: read-write
          MAC1_U54_3:
            description: Enables the Ethernet MAC1 to interrupt U54_1 directly
            bitOffset: 2
            bitWidth: 1
            access: read-write
          MAC0_U54_2:
            description: Enables the Ethernet MAC0 to interrupt U54_1 directly
            bitOffset: 1
            bitWidth: 1
            access: read-write
          MAC0_U54_1:
            description: Enables the Ethernet MAC0 to interrupt U54_1 directly
            bitOffset: 0
            bitWidth: 1
            access: read-write
      GPIO_INTERRUPT_FAB_CR:
        description: Switches GPIO interrupt from PAD to Fabric GPIO
        addressOffset: 0x54
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SELECT:
            description: Setting these bits will disable the Pad interrupt, and enable the fabric GPIO interrupt for bits 31:0. When the bit is set the Pad interrupt will be ORED into the GPIO0 & GPIO1 non-direct interrupts. When the bit is not set the Fabric interrupt is ORED into the GPIO2 non-direct interrupt. To prevent ORING then the interrupt should not be enabled in the GPIO block
            bitOffset: 0
            bitWidth: 32
            access: read-write
      APBBUS_CR:
        description: AMP Mode peripheral mapping register. When the register bit is '0' the peripheral is mapped into the 0x2000000 address range using AXI bus 5 from the Coreplex. When the register bit is '1' the peripheral is mapped into the 0x28000000 address range using AXI bus 6 from the Coreplex.
        addressOffset: 0x80
