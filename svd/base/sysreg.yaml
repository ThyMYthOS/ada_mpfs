      AHBAXI_CR:
        description: Configures how many outstanding transfers the AXI-AHB bridges in front of the USB and Crypto blocks should allow. (See Synopsys AXI-AHB bridge documentation)
        addressOffset: 0x8C
        size: 32
        access: read-write
        resetValue: 0xFFFF
        fields:
          ATHENA_RBCNT:
            description: Number of outstanding read transactions to Athena block
            bitOffset: 12
            bitWidth: 4
            access: read-write
          ATHENA_WBCNT:
            description: Number of outstanding write transactions to Athena block
            bitOffset: 8
            bitWidth: 4
            access: read-write
          USB_RBCNT:
            description: Number of outstanding read transactions to USB block
            bitOffset: 4
            bitWidth: 4
            access: read-write
          USB_WBCNT:
            description: Number of outstanding write transactions to USB block
            bitOffset: 0
            bitWidth: 4
            access: read-write
      AHBAPB_CR:
        description: Configures the two AHB-APB bridges on S5 and S6
        addressOffset: 0x90
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          APB1_POSTED:
            description: Enables posted mode on the AHB-APB bridge, when set the AHB write cycle will complete before the APB write cycle completes.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          APB0_POSTED:
            description: Enables posted mode on the AHB-APB bridge, when set the AHB write cycle will complete before the APB write cycle completes.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DFIAPB_CR:
        description: MSS Corner APB interface controls
        addressOffset: 0x98
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          RESET:
            description: Asserts the APB reset to the MSS corner, is asserted at MSS reset.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CLOCKON:
            description: Turns on the APB clock to the MSS Corner, is off at reset. Once corner blocks is configured the firmware may turn off the clock, but periodically should turn back on to allow refresh of TMR registers inside the corner block.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      GPIO_CR:
        description: GPIO Blocks reset control
        addressOffset: 0x9C
        size: 32
        access: read-write
        resetValue: 0xF0703
        fields:
          GPIO2_DEFAULT:
            description: Sets the reset value of the GPIO0 per byte Bit 0 controls GPIO0 [7:0] ,bit 1 GPIO[15:8] and bit 1 GPIO[23:16], and bit 3 GPIO[31:24]
            bitOffset: 20
            bitWidth: 4
            access: read-write
          GPIO2_SOFT_RESET_SELECT:
            description: 'This signal selects whether the associated byte is reset by soft reset or the MSS_GPIO_RESET_N signal from the FPGA fabric. The allowed values are: • 0: Selects MSS_GPIO_RESET_N signal from the FPGA fabric. • 1: Selects the GPIO to be reset by the GPIO block soft reset signal . Bit 0 controls GPIO0 [7:0] ,bit 1 GPIO[15:8] and bit 1 GPIO[23:16], and bit 3 GPIO[31:24] The master MSS reset will also reset the GPIO register if not configured to use fabric reset.'
            bitOffset: 16
            bitWidth: 4
            access: read-write
          GPIO1_DEFAULT:
            description: Sets the reset value of the GPIO0 per byte Bit 0 controls GPIO0 [7:0] ,bit 1 GPIO[15:8] and bit 2 GPIO[23:16]
            bitOffset: 12
            bitWidth: 3
            access: read-write
          GPIO1_SOFT_RESET_SELECT:
            description: 'This signal selects whether the associated byte is reset by soft reset or the MSS_GPIO_RESET_N signal from the FPGA fabric. The allowed values are: • 0: Selects MSS_GPIO_RESET_N signal from the FPGA fabric. • 1: Selects the GPIO to be reset by the GPIO block soft reset signal . Bit 0 controls GPIO0 [7:0] ,bit 1 GPIO[15:8] and bit 2 GPIO[23:16] The master MSS reset will also reset the GPIO register if not configured to use fabric reset.'
            bitOffset: 8
            bitWidth: 3
            access: read-write
          GPIO0_DEFAULT:
            description: Sets the reset value of the GPIO0 per byte Bit 0 controls GPIO0 [7:0] , and bit 1 GPIO[15:8]
            bitOffset: 4
            bitWidth: 2
            access: read-write
          GPIO0_SOFT_RESET_SELECT:
            description: 'This signal selects whether the associated byte is reset by soft reset or the MSS_GPIO_RESET_N signal from the FPGA fabric. The allowed values are: • 0: Selects MSS_GPIO_RESET_N signal from the FPGA fabric. • 1: Selects the GPIO to be reset by the GPIO block soft reset signal . Bit 0 controls GPIO0 [7:0] , and bit 1 GPIO[15:8] The master MSS reset will also reset the GPIO register if not configured to use fabric reset.'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      MAC0_CR:
        description: MAC0 configuration register
        addressOffset: 0xA4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
