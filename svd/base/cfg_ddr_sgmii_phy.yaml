_add:
  CFG_DDR_SGMII_PHY:
    description: CFG_DDR_SGMII_PHY Controller
    baseAddress: 0x20007000
    registers:
      SOFT_RESET_DDR_PHY:
        description: Compulsory register for all SCB slaves, facilitating global soft reset.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID_DDR_PHY:
            description: This returns the block type and chip location. The form of BLOCKID = {4'h0, SLVTYPE, CHIPID, SUBID}. SLVTYPE=4'h2 for PCIESS MAIN. CHIPID=4'h0 for PCIESS. SUBID=4'h4 for the MAIN page.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH_DDR_PHY:
            description: This asserts functional reset of the peripheral block. It is asserted and left asserted at power-up. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP_DDR_PHY:
            description: Resets all the volatile register bits. Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP_DDR_PHY:
            description: Resets all the non-volatile register bits (e.g. RW-P bits). Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DDRPHY_MODE:
        description: DDRPHY MODE Register
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          COMMAND_ADDRESS_PIPE:
            description: Added Command/Address pipelining
            bitOffset: 27
            bitWidth: 2
            access: read-write
          RANK:
            description: select rank
            bitOffset: 26
            bitWidth: 1
            access: read-write
          POWER_DOWN:
            description: Power down DDR PHY
            bitOffset: 25
            bitWidth: 1
            access: read-write
          PRESET_ODT_CLK:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 23
            bitWidth: 2
            access: read-write
          ADD_CMD_INPUT_PIN_TERMINATION:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 21
            bitWidth: 2
            access: read-write
          DQS_TERMINATION:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 19
            bitWidth: 2
            access: read-write
          DQ_TERMINATION:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 17
            bitWidth: 2
            access: read-write
          CLOCK_OUT_DRIVE:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 15
            bitWidth: 2
            access: read-write
          ADD_CMD_DRIVE:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 13
            bitWidth: 2
            access: read-write
          DQS_DRIVE:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 11
            bitWidth: 2
            access: read-write
          DQ_DRIVE:
            description: Default, +1,+2, -1 increment settings
            bitOffset: 9
            bitWidth: 2
            access: read-write
          DMI_DBI:
            description: Data mask or Data bus inversion on/off
            bitOffset: 8
            bitWidth: 1
            access: read-write
          BUS_WIDTH:
            description: DDR bus width (16 or 32)
            bitOffset: 5
            bitWidth: 3
            access: read-write
          CRC:
            description: CRC on/off
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ECC:
            description: ECC on/off
            bitOffset: 3
            bitWidth: 1
            access: read-write
          DDRMODE:
            description: DDR3, DDR3L, DDR4, LPDDR3, LPDDR4 decode. "000 ddr3 001 ddr33L 010 ddr4 011 LPDDR3 100 LPDDR4"
            bitOffset: 0
            bitWidth: 3
            access: read-write
      DDRPHY_STARTUP:
        description: DDRPHY STARTUP register
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x200000
        fields:
          RESERVED3:
            description: Reserved
            bitOffset: 22
            bitWidth: 10
            access: read-write
          DYNEN_APB_DECODER_PRESETS:
            description: Enable APB DECODER PRESET bit over rides
