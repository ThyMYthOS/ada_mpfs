            bitWidth: 1
            access: read-write
          DYNEN_APB_CFM:
            description: Enable APB CFM bit over rides
            bitOffset: 18
            bitWidth: 1
            access: read-write
          DYNEN_APB_PLL1:
            description: Enable APB PLL1 bit over rides
            bitOffset: 17
            bitWidth: 1
            access: read-write
          DYNEN_APB_PLL0:
            description: Enable APB PLL0 bit over rides
            bitOffset: 16
            bitWidth: 1
            access: read-write
          DYNEN_SCB_BANKCNTL:
            description: Enable SCB BANKCNTL bit over rides
            bitOffset: 12
            bitWidth: 1
            access: read-write
          DYNEN_SCB_IO_CALIB:
            description: Enable SCB IO CALIB bit over rides
            bitOffset: 11
            bitWidth: 1
            access: read-write
          DYNEN_SCB_CFM:
            description: Enable SCB CFM bit over rides
            bitOffset: 10
            bitWidth: 1
            access: read-write
          DYNEN_SCB_PLL1:
            description: Enable SCB PLL1 bit over rides
            bitOffset: 9
            bitWidth: 1
            access: read-write
          DYNEN_SCB_PLL0:
            description: Enable SCB PLL0 bit over rides
            bitOffset: 8
            bitWidth: 1
            access: read-write
          PERSIST_DATA:
            description: 'Persist all DATA Dqa dn DQS bits. When 1: write RPC_lp_persist_dqs to 1 write RPC_lp_persist_dqsp to 1 write RPC_lp_persist_dqsn to 1 else 0'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          PERSIST_CLKOUT:
            description: 'Persist all clkout bits. When 1: write RPC_lp_persist_clkp to 1 write RPC_lp_persist_clkn to 1 else 0'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          PERSIST_ADD_CMD:
            description: 'Persit all Addcmd bits . When 1: write RPC_lp_persist_addcmd to 1 else 0'
            bitOffset: 2
            bitWidth: 1
            access: read-write
