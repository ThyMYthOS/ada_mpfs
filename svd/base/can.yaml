            access: read-only
          RXMESSAGE3:
            description: Message available in RxMessage buffer 3
            bitOffset: 3
            bitWidth: 1
            access: read-only
          RXMESSAGE2:
            description: Message available in RxMessage buffer 2
            bitOffset: 2
            bitWidth: 1
            access: read-only
          RXMESSAGE1:
            description: Message available in RxMessage buffer 1
            bitOffset: 1
            bitWidth: 1
            access: read-only
          RXMESSAGE0:
            description: Message available in RxMessage buffer 0
            bitOffset: 0
            bitWidth: 1
            access: read-only
      TX_BUF_STATUS:
        description: Transmit (TX) message buffer status.
        addressOffset: 0xC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          TXMESSAGE31:
            description: Message available in TxMessage buffer 31
            bitOffset: 31
            bitWidth: 1
            access: read-only
          TXMESSAGE30:
            description: Message available in TxMessage buffer 30
            bitOffset: 30
            bitWidth: 1
            access: read-only
          TXMESSAGE29:
