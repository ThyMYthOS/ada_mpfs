          RXMESSAGE13:
            description: Message available in RxMessage buffer 13
            bitOffset: 13
            bitWidth: 1
            access: read-only
          RXMESSAGE12:
            description: Message available in RxMessage buffer 12
            bitOffset: 12
            bitWidth: 1
            access: read-only
          RXMESSAGE11:
            description: Message available in RxMessage buffer 11
            bitOffset: 11
            bitWidth: 1
            access: read-only
          RXMESSAGE10:
            description: Message available in RxMessage buffer 10
            bitOffset: 10
            bitWidth: 1
            access: read-only
          RXMESSAGE9:
            description: Message available in RxMessage buffer 9
            bitOffset: 9
            bitWidth: 1
            access: read-only
          RXMESSAGE8:
            description: Message available in RxMessage buffer 8
            bitOffset: 8
