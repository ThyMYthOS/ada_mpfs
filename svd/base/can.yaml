_add:
  CAN_A_LO:
    description: CAN_A_LO Controller
    groupName: CAN
    baseAddress: 0x2010C000
    registers:
      INT_STATUS:
        description: Interrupt status register
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SST_FAILURE:
            description: 'Single-shot transmission failure 0: Normal operation 1: A buffer set for single shot transmission experienced an arbitration loss or a bus error during transmission.'
            bitOffset: 15
            bitWidth: 1
            access: read-write
          STUCK_AT_0:
            description: 'Stuck at dominant error 0: Normal operation 1: Indicates if receive (RX) input remains stuck at 0 (dominant level) for more than 11 consecutive bit times.'
            bitOffset: 14
            bitWidth: 1
            access: read-write
          RTR_MSG:
            description: 'RTR auto-reply message sent 0: Normal operation 1: Indicates that a RTR auto-reply message was sent.'
            bitOffset: 13
            bitWidth: 1
            access: read-write
          RX_MSG:
            description: 'Receive message available 0: Normal operation 1: Indicates a new message was successfully received and stored in a receive buffer which has its RxIntEbl flag asserted.'
            bitOffset: 12
            bitWidth: 1
            access: read-write
          TX_MSG:
            description: 'Message transmitted 0: Normal operation 1: Indicates a message was successfully sent from a transmit buffer which has its TxIntEbl flag asserted.'
            bitOffset: 11
            bitWidth: 1
            access: read-write
          RX_MSG_LOSS:
            description: 'Received message lost 0: Normal operation 1: Indicates a newly received message couldn''t be stored because the target message buffer was full (for example.. its MsgAv flag was set).'
            bitOffset: 10
            bitWidth: 1
            access: read-write
          BUS_OFF:
            description: 'Bus Off 0: Normal operation 1: Indicates that the CAN controller entered the bus-off error state.'
            bitOffset: 9
            bitWidth: 1
            access: read-write
          CRC_ERR:
            description: 'CRC error 0: Normal operation 1: Indicates that a CAN crc error is detected.'
            bitOffset: 8
            bitWidth: 1
            access: read-write
          FORM_ERR:
            description: 'Format error 0: Normal operation 1: Indicates that a CAN format error is detected.'
            bitOffset: 7
            bitWidth: 1
            access: read-write
          ACK_ERR:
            description: 'Acknowledge error 0: Normal operation 1: Indicates that a CAN message acknowledgement error is detected.'
            bitOffset: 6
            bitWidth: 1
            access: read-write
          STUFF_ERR:
            description: 'Bit stuffing error 0: Normal operation 1: Indicates that a CAN bit stuffing error is detected.'
            bitOffset: 5
            bitWidth: 1
            access: read-write
          BIT_ERR:
            description: 'Bit error 0: Normal operation 1: Indicates that a CAN bit error is detected.'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          OVR_LOAD:
            description: 'Overload message detected 0: Normal operation 1: Indicates that a CAN overload message is detected.'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ARB_LOSS:
            description: 'Arbitration loss 0: Normal operation 1: The message arbitration was lost while sending a message. The message transmission is retried once the CAN bus is idle again.'
            bitOffset: 2
            bitWidth: 1
            access: read-write
      INT_ENABLE:
        description: Interrupt enable register
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SST_FAILURE_INT_ENBL:
            description: Single shot transmission failure interrupt enable.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          STUCK_AT_0_INT_ENBL:
            description: Stuck at dominant error interrupt enable.
            bitOffset: 14
            bitWidth: 1
            access: read-write
          RTR_MSG_INT_ENBL:
            description: RTR auto-reply message sent interrupt enable.
            bitOffset: 13
            bitWidth: 1
            access: read-write
          RX_MSG_INT_ENBL:
            description: Receive message available interrupt enable.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          TX_MSG_INT_ENBL:
            description: Message transmitted interrupt enable.
            bitOffset: 11
            bitWidth: 1
            access: read-write
          RX_MSG_LOSS_INT_ENBL:
            description: Received message lost interrupt enable.
            bitOffset: 10
            bitWidth: 1
            access: read-write
          BUS_OFF_INT_ENBL:
            description: Bus off interrupt enable.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          CRC_ERR_INT_ENBL:
            description: CRC error interrupt enable.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          FORM_ERR_INT_ENBL:
            description: Format error interrupt enable.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          ACK_ERR_INT_ENBL:
            description: Acknowledge error interrupt enable.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          STUFF_ERR_INT_ENBL:
            description: Bit stuffing error interrupt enable.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          BIT_ERR_INT_ENBL:
            description: Bit error interrupt enable.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          OVR_LOAD_INT_ENBL:
            description: Overload message detected interrupt enable.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ARB_LOSS_INT_ENBL:
            description: Arbitration loss interrupt enable.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          INT_ENBL:
            description: 'Global interrupt enable flag. 0: All interrupts are disabled 1: Enabled interrupt sources are available'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      RX_BUF_STATUS:
        description: Receive (RX) message buffer status. This bundles message available (MsgAv) flags from all 32 receive message buffers.
        addressOffset: 0x8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
