          TXBUFFEREBL:
            description: 'Transaction buffer enable; Control bit 0: Buffer is disabled 1: Buffer is enabled'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          RTRABORT:
            description: 'RTR abort request; Command bit 0: Idle 1: Requests removal of a pending RTR message reply. The flag is cleared when the message was removed or when the message won arbitration. The TxReq flag is cleared at the same time'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RTRP:
            description: 'RTReply pending; Command bit 0: No RTR reply request pending 1: RTR reply request pending'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          MSGAV_RTRS:
            description: 'Message available/RTR sent; Command bit If RTRreply flag is set.. this bit shows if an RTR auto-reply message has been sent.. otherwise it indicates if the buffer contains a valid message. Read 0: Idle 1: New message available (RTRreply = 0).. RTR auto-reply message sent (RTRreply = 1) Write 0: Idle 1: Acknowledges receipt of new message or transmission of RTR auto-reply message. Note: Before acknowledging receipt of a new message.. the message content must be copied into system memory. Acknowledging a message clears the MsgAv flag.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
