            access: read-only
      ERROR_STATUS:
        description: CAN error status indicator register
        addressOffset: 0x10
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RXGTE96:
            description: The receive error counter is greater or equal 96 dec.
            bitOffset: 19
            bitWidth: 1
            access: read-only
          TXGTE96:
            description: The transmit error counter is greater or equal 96 dec.
            bitOffset: 18
            bitWidth: 1
            access: read-only
          ERROR_STATE:
            description: 'The error state of the CAN mode: 00: error active (normal operation) 01: error passive 1x: bus off'
            bitOffset: 16
            bitWidth: 2
            access: read-only
          RX_ERR_CNT:
            description: The receive error counter as defined in CAN 2.0 specification. When in bus-off state.. this counter is used to count 128 groups of 11 receive bits.
            bitOffset: 8
            bitWidth: 8
            access: read-only
          TX_ERR_CNT:
            description: The transmit error counter as defined in CAN 2.0 specification. When it is greater than 255 dec.. it is fixed at 255 dec.
            bitOffset: 0
            bitWidth: 8
            access: read-only
      CAN_COMMAND:
        description: The CAN controller can be used in different operating modes. By disabling transmitting data.. it is possible to use the CAN in Listen-only mode.. enabling features such as automatic bit rate detection. Before starting the CAN controller.. all the CAN configuration registers have to be set according to the target application.
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x30000000
        fields:
          REVISION_CONTROL:
            description: 'This field contains the version of the CAN core in the following format. This is a read-only field. [major version].[minor version].[revision number] [31:28]: Major version [27:24]: Minor version [23:16]: Revision number'
            bitOffset: 16
            bitWidth: 16
            access: read-only
          SRAM_TEST_MODE:
            description: 'SRAM Test mode 0: Normal operation 1: Enable SRAM Test mode.'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          LOOPBACK_TEST_MODE:
            description: 'Loopback-test mode 0: Normal operation 1: Loopback mode is enabled[1]: Listen-only mode.'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          LISTEN_ONLY_MODE:
            description: 'Listen-only mode 0: Active 1: CAN listen only. The output is held at ''R'' level. The CAN controller is only listening.'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RUN_STOP_MODE:
            description: 'Run/Stop mode 0: Sets the CAN controller into Stop mode. Returns 0 when stopped. 1: Sets the CAN controller into Run mode. Returns 1 when running.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CAN_CONFIG:
        description: CAN configuration register.
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BITRATE:
            description: 'Configuration bit rate Prescaler for generating the time quantum which defines the TQ: 0: One time quantum equals 1 clock cycle 1: One time quantum equals 2 clock cycles 32767: One time quantum equals 32768 clock cycles'
            bitOffset: 16
            bitWidth: 15
            access: read-write
          ECR_MODE:
            description: 'Error-capture mode 0: Free running. The ECR register shows the current bit position within the CAN frame. 1: Capture mode. The ECR register shows the bit position and type of the last captured CAN error.'
            bitOffset: 14
            bitWidth: 1
            access: read-write
          SWAP_ENDIAN:
            description: 'The byte position of the CAN receive and transmit data fields can be modified to match the endian setting of the processor or the used CAN protocol. 0: CAN data byte position is not swapped (big endian). 1: CAN data byte position is swapped (little endian).'
            bitOffset: 13
            bitWidth: 1
            access: read-write
          CFG_ARBITER:
            description: 'Transmit buffer arbiter 0: Round robin arbitration. 1: Fixed priority arbitration.'
            bitOffset: 12
            bitWidth: 1
            access: read-write
          CFG_TSEG1:
            description: 'Time segment 1. Time segment 1 includes the propagation time Length of the first time segment: tseg1 = CFG_TSEG1+1 CFG_TSEG1 = 0 and CFG_TSEG1 = 1 are not allowed.'
            bitOffset: 8
            bitWidth: 4
            access: read-write
          CFG_TSEG2:
            description: 'Time segment 2 Length of the second time segment: tseg2 = CFG_TSEG2+1 CFG_TSEG2 = 0 is not allowed. CFG_TSEG2 = 1 is only allowed in Direct-sampling mode.'
            bitOffset: 5
            bitWidth: 3
            access: read-write
          AUTO_RESTART:
            description: 'The CAN can be set to restart either `by hand` or automatically after a bus-off. 0: After bus-off.. the CAN must be restarted ''by hand''. This is the recommended setting. 1: After bus-off.. the CAN restarts automatically after 128 groups of 11 recessive bits.'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          CFG_SJW:
            description: Synchronization Jump Width 1 sjw is less than or equal to tseg1 and sjw is less than or equal to tseg2
            bitOffset: 2
            bitWidth: 2
            access: read-write
          SAMPLING_MODE:
            description: 'CAN bus bit sampling 0: One sampling point is used in the receiver path. 1: Three sampling points with majority decision are used.'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          EDGE_MODE:
            description: 'CAN bus synchronization logic 0: Edge from ''R'' to ''D'' is used for synchronization. 1: Both edges are used.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      ECR:
        description: Error capture register
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        resetMask: 0xFFFE003F
        fields:
          FIELD:
            description: 'This specifies the field of the ECR 0x00: Stopped 0x01: Synchronize 0x05: Interframe 0x06: Bus idle 0x07: Start of frame 0x08: Arbitration 0x09: Control 0x0A: Data 0x0B: CRC 0x0C: ACK 0x0D: End of frame 0x10: Error flag 0x11: Error echo 0x12: Error delimiter 0x18: Overload flag 0x19: Overload echo 0x1A: Overload delimiter Others: N/A'
            bitOffset: 12
            bitWidth: 5
            access: read-only
          BIT_NUMBER:
            description: Bit number inside of field
            bitOffset: 6
            bitWidth: 6
            access: read-only
          RX_MODE:
            description: When asserted.. the CAN controller is the receiver.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          TX_MODE:
            description: When asserted.. the CAN controller is the transmitter.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ERROR_TYPE:
            description: 'Specifies different error types 0: Arbitration loss 1: Bit error 2: Bit stuffing error 3: Acknowledge error 4: Form error 5: CRC error Others: N/A'
            bitOffset: 1
            bitWidth: 3
            access: read-write
          STATUS:
            description: 'Status of the ECR register 0: The ECR register captured an error or is in free running mode. 1: The ECR register set to sample the event.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      TX_MSG0_CTRL_CMD:
        description: Transmit Message0 buffer control and command register
        addressOffset: 0x20
        size: 32
        access: read-write
        fields:
          WPN_B:
            description: 'Write protect not In case of control flag bit, 0: Bit[21:16] remain unchanged 1: The write protect is not set and bit[21:16] are modified.. by default. The read back value of this bit is undefined Note: Using the WPN flag enables simple retransmission of the same message by only having to set the TxReq and TxAbort flags without taking care of the special flags. In case of command flag bit, 0: Default and 1: prohibited'
            bitOffset: 23
            bitWidth: 1
            access: read-write
          RTR:
            description: 'RTR; Remote bit. control flag bit 0: Standard message 1: RTR message'
            bitOffset: 21
            bitWidth: 1
            access: read-write
          IDE:
            description: 'Extended identifier bit; Control flag bit 0: This is a standard format message 1: This is an extended format message'
            bitOffset: 20
            bitWidth: 1
            access: read-write
          DLC:
            description: 'Data length code; Control flag bit Invalid values are transmitted as they are.. but the number of data bytes is limited to eight 0: Message has 0 data bytes 1: Message has 1 data byte ... 8: Message has 8 data bytes 9:15: Message has 8 data bytes'
            bitOffset: 16
            bitWidth: 4
            access: read-write
          WPN_A:
            description: 'Write protect not. In case of control flag bit, 0: Bit[2] remains unchanged. 1: The write protect is not set and Bit[2] is modified.. default. In case of Command flag bit, 0:default, 1: prohibited'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          TXINTEBL:
            description: 'Tx interrupt enable; Control flag bit 0: Interrupt is disabled. 1: Interrupt enabled.. successful message transmission sets the TX_MSG flag in the interrupt controller.'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          TXABORT:
            description: 'Transmit abort request; Command flag bit 0: Idle 1: Requests removal of a pending message. The message is removed the next time an arbitration loss happens. The flag is cleared when the message is removed or when the message wins arbitration. The TxReq flag is cleared at the same time.'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          TXREQ:
            description: 'Transmit request; Command flag bit Write: 0: Idle. No message transmit request. 1: Message transmit request Note: The Tx message buffer must not be changed while TxReq is 1. Read: 0: TxReq completed 1: TxReq pending'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      TX_MSG0_ID:
        description: Transmit Message0 buffer identifier register
        addressOffset: 0x24
        size: 32
        access: read-write
        fields:
          ID:
            description: Transmit message0 buffer identifier (29-bit wide)
            bitOffset: 3
            bitWidth: 29
            access: read-write
      TX_MSG0_DATA_HIGH:
        description: Transmit Message0 buffer data high register
        addressOffset: 0x28
        size: 32
        access: read-write
        fields:
          TX_MSG0_DATA_HIGH:
            description: 'The byte mapping can be set using the CAN swap_endian configuration bit. swap_endian = 0.. default [31:24]: CAN data byte 1 [23:16]: CAN data byte 2 [15:8]: CAN data byte 3 [7:0]: CAN data byte 4 swap_endian = 1 [31:24]: CAN data byte 4 [23:16]: CAN data byte 3 [15:8]: CAN data byte 2 [7:0]: CAN data byte 1'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      TX_MSG0_DATA_LOW:
        description: Transmit Message0 buffer data low register
        addressOffset: 0x2C
        size: 32
        access: read-write
        fields:
          TX_MSG0_DATA_LOW:
            description: 'The byte mapping can be set using the CAN swap_endian configuration bit swap_endian = 0.. default [31:24]: CAN data byte 5 [23:16]: CAN data byte 6 [15:8]: CAN data byte 7 [7:0]: CAN data byte 8 swap_endian = 1 [31:24]: CAN data byte 8 [23:16]: CAN data byte 7 [15:8]: CAN data byte 6 [7:0]: CAN data byte 5'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      TX_MSG1_CTRL_CMD:
        description: Transmit Message0 buffer control and command register
        addressOffset: 0x30
        size: 32
        access: read-write
        fields:
          WPN_B:
            description: 'Write protect not 0: Bit[21:16] remain unchanged 1: The write protect is not set and bit[21:16] are modified.. by default. The read back value of this bit is undefined Note: Using the WPN flag enables simple retransmission of the same message by only having to set the TxReq and TxAbort flags without taking care of the special flags'
            bitOffset: 23
            bitWidth: 1
            access: read-write
          RTR:
            description: 'RTR; control flag bit 0: Standard message 1: RTR message'
            bitOffset: 21
            bitWidth: 1
