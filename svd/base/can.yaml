            bitWidth: 1
            access: read-write
          RTR:
            description: 'RTR bit; Control bit 0: This is a regular message 1: This is an RTR message.'
            bitOffset: 21
            bitWidth: 1
            access: read-write
          IDE:
            description: 'Extended identifier bit; Control bit 0: This is a standard format message. 1: This is an extended format message.'
            bitOffset: 20
            bitWidth: 1
            access: read-write
          DLC:
            description: 'Data length code; Control bits 0: Message has 0 data byte. 1: Message has 1 data byte. ... 8: Message has 8 data bytes. 9:15: Message has 8 data bytes.'
            bitOffset: 16
            bitWidth: 4
            access: read-write
          WPNL:
            description: 'Write protect not low 0: Bits[6:3] remain unchanged 1: This write protect is not set and bits[6:3] are modified.. default. This bit is always zero for read back'
            bitOffset: 7
            bitWidth: 1
            access: read-write
          LF:
            description: 'Link flag; Control bit 0: This buffer is not linked to the next buffer 1: This buffer is linked with the next buffer'
