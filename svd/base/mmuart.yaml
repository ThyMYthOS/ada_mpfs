_add:
  MMUART0_LO:
    description: MMUART0_LO Controller
    groupName: MMUART
    baseAddress: 0x20000000
    registers:
      RBR:
        description: Receiver buffer register
        addressOffset: 0x0
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RBR:
            description: This register holds the receive data bits for MMUART_x. The default value is unknown since the register is loaded with data in the receive FIFO. Bit 0 is the LSB and it is the first bit received. It may be configured as the MSB by configuring the E_MSB_RX bit in the MM1. The divisor latch access bit (DLAB).. bit 7 of LCR.. must be 0 to read this register. This register is read only. Writing to this register with the DLAB 0 changes the transmit holding register (THR) register value.
            bitOffset: 0
            bitWidth: 8
            access: read-only
      IER:
        description: Interrupt enable register
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EDSSI:
            description: 'Modem status interrupt enable 0: Disabled (default) 1: Enabled'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ELSI:
            description: 'Receiver line status interrupt enable 0: Disabled (default) 1: Enabled'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          ETBEI:
            description: 'Transmitter holding register empty interrupt enable 0: Disabled (default) 1: Enabled'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          ERBFI:
            description: 'Enables received data available interrupt 0: Disabled (default) 1: Enabled'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IIR:
        description: Interrupt identification register
        addressOffset: 0x8
        size: 32
        access: read-only
        resetValue: 0xC1
        fields:
          MODE:
            description: Always 0b11. Enables FIFO mode.
            bitOffset: 6
            bitWidth: 2
            access: read-only
          IIR:
            description: 'Interrupt identification bits. 0b0110: Highest priority. Receiver line status interrupts due to overrun error.. parity error.. framing error.. or break interrupt. Reading the line status register resets this interrupt. 0b0100: Second priority. Receive data available interrupt modem status interrupt. Reading the receiver buffer register (RBR) or the FIFO drops below the trigger level resets this interrupt. 0b1100: Second priority. Character timeout indication interrupt occurs when no characters have been read from the Rx FIFO during the last four character times and there was at least one character in it during this time. Reading the RBR resets this interrupt. 0b0010: Third priority. Transmit holding register empty interrupt. Reading the IIR or writing to the transmit holding register (THR) resets the interrupt. 0b0000: Fourth priority. Modem status interrupt due to clear to send.. data set ready.. ring indicator.. or data carrier detect being asserted. Reading the modem status register resets this interrupt. 0b0011: Fifth priority. Multi-mode interrupts can occur due to any of the interrupts mentioned in IIM. For more details refer to Table 12-15.'
            bitOffset: 0
            bitWidth: 4
            access: read-only
      LCR:
        description: Line control register
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DLAB:
            description: 'Divisor latch access bit. Enables access to the divisor latch registers during read or write operation to address 0 and 1. 0: Disabled (default) 1: Enabled'
            bitOffset: 7
            bitWidth: 1
            access: read-write
          SB:
            description: 'Set break. Enabling this bit sets MMUART_x_TXD to 0. This does not have any effect on transmitter logic. The break is disabled by setting the bit to 0. 0: Disabled (default) 1: Set break'
            bitOffset: 6
            bitWidth: 1
            access: read-write
          SP:
            description: 'Stick parity 0: Disabled (default) 1: Enabled When stick parity is enabled.. the parity is set according to bits [4:3] as follows: 11: 0 will be sent as a parity bit and checked when receiving. 01: 1 will be sent as a parity bit and checked when receiving.'
            bitOffset: 5
            bitWidth: 1
            access: read-write
          EPS:
            description: 'Even parity select 0: Odd parity (default) 1: Even parity'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          PEN:
            description: 'Parity enable 0: Disabled 1: Enabled. Parity is added in transmission and checked in receiving.'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          STB:
            description: 'Number of stop bits (STB) 0: 1 stop bit (default) 1: 11/2 stop bits when WLS=00 The number of stop bits is 2 for all other cases not described above (STB=1 and WLS=01.. 10.. or 11).'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          WLS:
            description: 'Word length select 0b00: 5 bits (default) 0b01: 6 bits 0b10: 7 bits 0b11: 8 bits'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      MCR:
        description: Modem control register
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RLOOP:
            description: 'Remote loopback enable bits. In the Remote loopback mode.. when a bit is received.. it is sent directly out the transmit line.. bypassing the transmitter block.. and disabling the receiver. In the Automatic echo mode.. when a bit is received.. it is sent directly out the transmit line.. bypassing the transmitter block.. while the receiver is still enabled. 00: Disabled (default) 01: Remote loopback enabled 10: Automatic echo enabled 11: Reserved Note: Local loopback mode has priority over the remote/echo loopback modes.'
            bitOffset: 5
            bitWidth: 2
            access: read-write
          LOOP:
            description: 'In the Loopback mode.. MMUART_x_TXD is set to 1. The MMUART_x_RXD.. MMUART_x_DSR.. MMUART_x_CTS.. MMUART_x_RI.. and MMUART_x_DCD inputs are disconnected. The output of the transmitter shift register is looped back into the receiver shift register. The modem control outputs (MMUART_x_DTR.. MMUART_x_RTS.. MMUART_x_OUT1.. and MMUART_x_OUT2) are connected internally to the modem control inputs.. and the modem control output pins are set as 1. The transmitted data is immediately received.. allowing Cortex-M3 processor to check the operation of the MMUART_x. The interrupts are operating in the Loopback mode. 0: Disabled (default) 1: Local loopback enabled Note: The local loopback mode has priority over the remote loopback modes. LOOPBACK is only implemented in basic UART mode. It does function in LIN IRDA or Smart card modes.'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          OUT2:
            description: 'Controls the output2 (OUT2) signal. Active Low 0: OUT2n is less than equal to 1 (default) 1: OUT2n is less than equal to 0'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          OUT1:
            description: 'Controls the output1 (OUT1) signal. Active Low 0: OUT1n is less than equal to 1 (default) 1: OUT1n is less than equal to 0'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RTS:
            description: 'Controls the request to send (MMUART_x_RTS) signal. Active Low 0: RTSn is less than equal to 1 (default) 1: RTSn is less than equal to 0'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          DTR:
            description: 'Data terminal ready (MMUART_x_DTR) output. Active Low 0: DTRn is less than or equal to 1 (default) 1: DTRn is less than or equal to 0'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      LSR:
        description: Line status register
        addressOffset: 0x14
        size: 32
        access: read-only
        resetValue: 0x60
        fields:
          FIER:
            description: This bit is set when there is at least one parity error.. framing error.. or break indication in the FIFO. FIER is cleared when Cortex-M3 processor reads the LSR.. if there are no subsequent errors in the FIFO.
            bitOffset: 7
            bitWidth: 1
            access: read-only
          TEMT:
            description: Transmit empty (TEMT). This bit is set to 1 when both the transmitter FIFO and shift registers are empty.
            bitOffset: 6
            bitWidth: 1
            access: read-only
          THRE:
            description: Transmitter holding register empty (THRE). Indicates that the MMUART_x is ready to transmit a new data byte. THRE causes an interrupt to the Cortex-M3 processor when bit 1 (ETBEI) in the interrupt enable register is 1. This bit is set when the Tx FIFO is empty. It is cleared when at least one byte is written to the Tx FIFO.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          BI:
            description: Break interrupt (BI). Indicates that the receive data is at 0 longer than a full word transmission time (start bit + data bits + parity + stop bits). BI is cleared when Cortex-M3 processor reads the line status register (LSR). This error is revealed to the Cortex-M3 processor when it is associated character is at the top of the FIFO. When break occurs.. only one zero character is loaded into the FIFO.
            bitOffset: 4
            bitWidth: 1
            access: read-only
          FE:
            description: Framing error (FE). Indicates that the receive byte did not have a valid stop bit. FE is cleared when Cortex-M3 processor reads the LSR. The MMUART_x tries to resynchronize after a framing error. To do this.. it assumes that the framing error was due to the next start bit.. so it samples this start bit twice.. and then starts receiving the data. This error is revealed to Cortex-M3 processor when it is associated character is at the top of the FIFO.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          PE:
            description: Parity error (PE). Indicates that the receive byte had a parity error. PE is cleared when the Cortex-M3 processor reads the LSR. This error is revealed to the Cortex-M3 processor when it is associated character is at the top of the FIFO.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          OE:
            description: Overrun error (OE). Indicates that the new byte was received before the Cortex-M3 processor reads the byte from the receive buffer.. and that the earlier data byte was destroyed. OE is cleared when the Cortex-M3 processor reads the LSR. If the data continues to fill the FIFO beyond the trigger level.. an overrun error occurs once the FIFO is full and the next character has been completely received in the shift register. The character in the shift register is overwritten.. but it is not transferred to the FIFO.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          DR:
            description: 'Data ready (DR). 1: Indicates when a data byte is received and stored in the receive buffer or the FIFO. DR is cleared to 0 when the Cortex-M3 processor reads the data from the receive buffer or the FIFO.'
            bitOffset: 0
            bitWidth: 1
            access: read-only
      MSR:
        description: Modem status register
        addressOffset: 0x18
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          DCD:
            description: Data carrier detect (DCD) (MMUART_x_DCD).The complement of DCD input. When bit 4 of the MCR is set to 1 (loop).. this bit is equivalent to OUT2 in the MCR.
            bitOffset: 7
            bitWidth: 1
            access: read-only
          RI:
            description: Ring indicator (RI) (MMUART_x_RI). The complement of the RI input. When bit 4 of the MCR is set to 1 (loop).. this bit is equivalent to OUT1 in the MCR.
            bitOffset: 6
            bitWidth: 1
            access: read-only
          DSR:
            description: Data set ready (DSR) (MMUART_x_DSR). The complement of the DSR input. When bit 4 of the MCR is set to 1 (loop).. this bit is equivalent to RTS in the MCR.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          CTS:
            description: Clear to send (CTS) (MMUART_x_CTS). The complement of the CTS input. When bit 4 of the MCR is set to 1 (loop).. this bit is equivalent to DTR in the MCR.
            bitOffset: 4
            bitWidth: 1
            access: read-only
          DDCD:
            description: Delta data carrier detect (DDCD) indicator. Indicates that DCD input has changed state. Whenever bit 0.. 1.. 2.. or 3 is set to 1.. a modem status interrupt is generated.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          TERI:
            description: Trailing edge of ring indicator (TERI) detector. Indicates that RI input has changed from 0 to 1. Whenever bit 0.. 1.. 2.. or 3 is set to 1.. a modem status interrupt is generated.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          DDSR:
            description: Delta data set ready (DDSR) indicator. Indicates that the DSRn input has changed state since the last time it was read by the Cortex-M3 processor. Whenever bit 0.. 1.. 2.. or 3 is set to 1.. a modem status interrupt is generated.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          DCTS:
            description: Delta clear to send (DCTS) indicator. Indicates that the CTSn input has changed state since the last time it was read by the Cortex-M3 processor. Whenever bit 0.. 1.. 2.. or 3 is set to 1.. a modem status interrupt is generated.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      SR:
        description: Scratch register
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SCR:
            description: Scratch register. This register has no effect on MMUART_x operation.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      Reserved:
        description: Reserved register
        addressOffset: 0x20
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED1:
            description: ''
            bitOffset: 8
            bitWidth: 24
            access: read-only
      IEM:
        description: Multi-mode interrupt enable register
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ELINSI:
            description: 'Enables the LIN sync detection interrupt. 0: Disabled (default) 1: Enabled'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ELINBI:
            description: 'Enables LIN break interrupt. 0: Disabled (default) 1: Enabled'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          EPID_PEI:
            description: 'Enables PID parity error interrupt 0: Disabled (default) 1: Enabled'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          ENACKI:
            description: 'Enables NACK interrupt. 0: Disabled (default) 1: Enabled'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          ERTOI:
            description: 'Enables receiver timeout interrupt. 0: Disabled (default) 1: Enabled'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      IIM:
        description: Multi-mode interrupt identification register
        addressOffset: 0x28
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          LINSI:
            description: LIN sync detection interrupt ID. This bit set when 5th falling edge is detected by the sync timer. It resets the FIFO address pointers so that the PID will be in the first location. Reading the IIM register clears this interrupt.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          LINBI:
            description: LIN break interrupt.. set automatically when break length of 11.5 Tbits is detected. Reading the IIM register clears this interrupt.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          PID_PEI:
            description: Protected identifier field (PID) parity error interrupt is generated when there is a mismatch in PID in LIN header.. that is.. when either the P0 or P1 bits in the incoming PID byte do not match the calculated P0 and P1 error.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          NACKI:
            description: NACK interrupt is asserted when EERR bit is set in MM2. Reading the MM2 clears the interrupt.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RTOII:
            description: Receiver time-out (RTO) interrupt ID. RTO interrupt is asserted when RTO value is reached by the counter. It gets cleared when writing to the RTO register.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      Reserved_1:
        addressOffset: 0x2C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED1:
            description: ''
            bitOffset: 8
            bitWidth: 24
            access: read-only
      MM0:
        description: Multi-mode control register0
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EFBR:
            description: 'Enable fractional baud rate (FBR) mode. 0: Disabled (default) 1: Enabled'
            bitOffset: 7
            bitWidth: 1
            access: read-write
          ERTO:
            description: 'Enable receiver timeout (RTO). Writing this bit enables the timeout and restarts the counter value. The timeout value is determined by the RTO register. 0: Disabled (default) 1: Enabled'
            bitOffset: 6
            bitWidth: 1
            access: read-write
          ETTG:
            description: 'Enable transmitter time guard (TTG). The time guard value is determined by the TTG Register. 0: Disabled (default) 1: Enabled'
            bitOffset: 5
            bitWidth: 1
            access: read-write
          ELIN:
            description: 'Enable LIN header detection and automatic baud rate calculation. 0: Disabled (default) 1: Enabled'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ESYN:
            description: 'Enable synchronous operation. There are four types of Synchronous Operation modes that can be enabled. 0b000: Disabled.. that is.. Asynchronous mode (default) 0b001: Synchronous slave enabled.. positive-edge clock 0b010: Synchronous slave enabled.. negative-edge clock 0b011: Synchronous master enabled.. positive-edge clock 0b100: Synchronous master enabled.. negative-edge clock 0b101.. 0b110.. and 0b111: Reserved'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      MM1:
        description: Multi-mode control register1
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EITP:
            description: 'Output pulse width for RZI mod can be modified using this bit. 0: 3/16th Tbit pulse width (default). 1: 1/4th Tbit pulse width.'
            bitOffset: 5
            bitWidth: 1
            access: read-write
          EITX:
            description: 'You can configure output polarity for RZI modulation. 0: RZI output pulses are active Low and signify a low NRZ value (default). 1: RZI output pulses are active High and signify a high NRZ value.'
            bitOffset: 4
            bitWidth: 1
            access: read-write
          EIRX:
            description: 'You can configure input polarity for RZI demodulation. 0: RZI input pulses are active Low.. signifying a low NRZ value (default). 1: RZI input pulses are active High.. signifying a high NRZ value.'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          EIRD:
            description: 'Enables RZI modulation/demodulation. 0: Disabled (default) 1: Enabled'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          E_MSB_TX:
            description: 'LSB or MSB can be sent first by configuring this bit. By default.. the "THR" bit 0 is the LSB.. and is the first transmitted bit. Bit 0 of the THR may be configured as the last transmitted bit.. MSB. 0: THR''s bit 0 is the first transmitted bit.(LSB). (default). 1: THR''s bit 0 is the last transmitted bit.(MSB).'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          E_MSB_RX:
            description: 'LSB or MSB can be received first by configuring this bit. By default.. the receiver buffer register''s (RBR) bit 0 is the LSB.. and is the first received bit. Bit 0 of the RBR may be configured as the last received bit.. MSB. 0: RBR''s bit 0 is the first received bit(LSB). (default). 1: RBR''s bit 0 is the last received bit(MSB).'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MM2:
        description: Multi-mode control register2
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ESWM:
            description: 'Enable single-wire.. half-duplex mode. 0: Disabled (default) 1: Enabled'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          EAFC:
            description: 'Enable a address flag clear (EAFC). When EAFM is enabled the Rx FIFO is disabled until another address flag with matching address is received. The bit gets cleared on write in multi-mode control registers 2. 0: Disabled (default) 1: Enabled'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          EAFM:
            description: 'Enable automatic 9-bit address flag mode (EAFM). It should be noted that for enabling this bit it requires.. the LCR should be in an 8-bit and stick parity (SP) bit configured to 0. If EAFM bit is disabled.. the Rx FIFO is enabled by receiving all the bytes. When EAFM bit is enabled.. the Rx FIFO is disabled until an address flag with matching address is received. Note: If an address match occurs and the Rx FIFO is enabled then it can be disabled.. if either another address flag occurs or there is a mismatch or the EAFC bit is set. In either case.. the Address flag compare will continue as long as the EAFM bit is set. 0: Disabled (default) 1: Enabled'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          EERR:
            description: 'When the EERR bit is set.. the receiver forces an error signal transmit out.. if an incoming parity error is detected. Error signal (ACK/NACK) is sent during stop time enable. Note: The EERR only applies in an 8-bit data length.. 2 stop bit configuration. Error signal occurs during the last 1.5 stop bits as per Figure 12-18 on page 529. 0: Disabled (default) 1: Enabled'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DFR:
        description: Fractional divisor register
        addressOffset: 0x3C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DFR:
            description: 'The fractional divisor register (DFR) is used to store the fractional divisor used to calculate the fractional baud rate value in 1/64th using EQ 5. 0x0: 0/64 0x1: 1/64 .... 0x3F: 63/64'
            bitOffset: 0
            bitWidth: 6
            access: read-write
      GFR:
        description: Glitch filter register
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          GLR:
            description: 'The glitch filter resynchronizes (GLR) and suppresses random input noise from MMUART_x_RXD (serial input data) and MMUART_x_SCK_IN (serial input clock in synchronous mode) based on the filter length given in number system clock cycles. The following are the different filter lengths in the APB clock cycles that can be written into the GLR register and their description. 0b000: Two resynchronize flip-flops are used but there is no spike suppression. 0b001: Three resynchronize flip-flops are used but there is no spike suppression. 0b010: Three resynchronize flip-flops are used and it also causes 1 APB clock cycle suppression. 0b011: Three resynchronize flip-flops are used and it also causes 2 APB clock cycle suppression. 0b100: Three resynchronize flip-flops are used and it also causes 3 APB clock cycle suppression. 0b101: Three resynchronize flip-flops are used and it also causes 4 APB clock cycle suppression. 0b110: Three resynchronize flip-flops are used and it also causes 5 APB clock cycle suppression. 0b111: Three resynchronize flip-flops are used and it also causes 6 APB clock cycle suppression.'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      TTG:
        description: Transmitter time guard register
        addressOffset: 0x48
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TTG:
            description: 'If the transmitter time guard is enabled from the multi-mode control register 0 (MM0).. the transmitter time guard value determines the amount of system clock cycles to wait between transmissions. The time guard equation is based on the baud rate bit time (Tbit) value as follows: Tx Time Guard Value = TTG x Bit Time (Tbit)'
            bitOffset: 0
            bitWidth: 8
            access: read-write
      RTO:
        description: Receiver time-out register
        addressOffset: 0x4C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RTO:
            description: 'Writing to the RTO register sets the counter value and enables.. if the ERTO bit in the MM0 is enabled. You can configure the timeout value by writing into this register. The RTO counts when the Rx block input state is idle; is reset when a start condition occurs.. and restarts counting upon returning to the idle state. When the RTO value is reached.. the RTOII interrupt is set. Re-writing the RTO register clears the interrupt and sets the counter. The receiver timeout value equation is based on the baud rate bit time (Tbit) as follows: Rx Timeout Value = 4 x RTO x Bit Time (Tbit)'
            bitOffset: 0
            bitWidth: 8
            access: read-write
      ADR:
        description: Address register
        addressOffset: 0x50
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ADR:
            description: The address register is used in 9-bit Address Flag mode. When an address flag is received on the 9th bit.. and EAFM is set in MM2.. the incoming data is checked against the address register. If a match occurs.. the Rx FIFO is enabled.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      DLR:
        description: 'Divisor latch (LSB, DLL of a 16550). The address (offset 0x80) is an alias of the data port at offset 0: it reaches the divisor latch only with LCR.DLAB 1; with DLAB 0 it reads and writes RBR/THR instead. The reset value 0x1 is the latch value, a read at LCR 0 after reset returns the RBR value (measured on an Icicle Kit MPFS250T with the clock enabled: +0x00, +0x80 and +0x100 read 0x01 at LCR 0x83, a write of 0x37 at +0x00 reads back at all three; at LCR 0 +0x80 reads the same as +0x00 and a write of 0x37 to +0x80 changes no readback).'
        addressOffset: 0x80
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          DLR:
            description: This divisor latch LSB register (DLR) holds the LSB of the integer divisor value used to calculate the baud rate. The baud rate can be calculated using EQ 1.. 2.. 3.. or 4. ** To access this register the divisor latch access bit (DLAB, bit 7) of the line control register (LCR) must be set.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      DMR:
        description: 'Divisor latch (MSB, DLM of a 16550). The address (offset 0x84) is an alias of the data port at offset 4: it reaches the divisor latch only with LCR.DLAB 1; with DLAB 0 it reads and writes IER instead. The reset value 0x0 is the latch value, a read at LCR 0 after reset returns the IER value (measured on an Icicle Kit MPFS250T with the clock enabled: +0x84 reads 0 at LCR 0 and at LCR 0x83, the IER value and the DLM reset value coincide). Measured again on 2026-10-28 with DLM 0x34 (MMUART1): +0x04, +0x84 and +0x104 read 0x34 at LCR 0x83.'
        addressOffset: 0x84
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DMR:
            description: This divisor latch MSB register (DMR) holds the MSB of the integer divisor value used to calculate the baud rate. The baud rate can be calculated using EQ 1.. 2.. 3.. or 4. ** To access this register the divisor latch access bit (DLAB, bit 7) of the line control register (LCR) must be set.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      THR:
        description: 'Transmit holding register. The address (offset 0x100) is an alias of the data port at offset 0 (RBR when read, THR when written): a read of this address is not an access to THR: it returns the receive FIFO like RBR and pops it (measured on an Icicle Kit MPFS250T with the clock enabled: +0x100 reads exactly what +0x00 reads at LCR.DLAB 0 and 1). Measured on 2026-10-28 in loopback (MMUART1): a read of +0x100 returned the received character 0x41 and LSR went from 0x61 to 0x60, the same as a read of +0x00; at LCR 0x83 +0x100 reads DLL like +0x00 and +0x80.'
        addressOffset: 0x100
        size: 32
        access: write-only
        resetValue: 0x0
        fields:
          THR:
            description: This register holds the data bits to be transmitted. Bit 0 is the LSB and is transmitted first. The MSB may be transmitted first.. if it is configured with the E_MSB_TX bit in the MM1. The reset value is unknown since the register is loaded with data in the transmit FIFO. The DLAB.. bit 7 of LCR.. must be 0 to write to this register. This register is write only. Reading from this register with the DLAB 0 reads the RBR register value and removes the oldest character from the receive FIFO (read side effect as RBR). With the DLAB 1 the address reads and writes the divisor latch LSB (DLR).
            bitOffset: 0
            bitWidth: 8
            access: write-only
      FCR:
        description: 'FIFO control register. The address (offset 0x108) is an alias of the data port at offset 8 (IIR when read, FCR when written): a read returns the interrupt identification register IIR, not the last value written (measured on an Icicle Kit MPFS250T with the clock enabled: +0x108 reads 0xC1, the IIR value at +0x08). The register is write-only; a read of this address is a read of IIR (which acknowledges a pending transmitter holding register empty interrupt, see IIR) and must not be used to read back FCR, so a read-modify-write of FCR is not allowed. Measured on 2026-10-28 in loopback (MMUART1): a write of 0x03 to +0x08, +0x88 and +0x108 each cleared the receive FIFO (LSR 0x61 to 0x60), so a write to either alias reaches FCR.'
        addressOffset: 0x108
        size: 32
        access: write-only
        resetValue: 0xC1
        fields:
          RX_TRIG:
            description: 'These bits are used to set the trigger level for the Rx FIFO interrupt. Rx FIFO trigger level (bytes) are: 0b00: 1 byte 0b01: 4 bytes 0b10: 8 bytes 0b11: 14 bytes'
            bitOffset: 6
            bitWidth: 2
            access: write-only
          ENABLE_TXRDY_RXRDY:
            description: Switches between RXRDY and TXRDY mode 0 and mode 1 functionality. 0-Mode 0. 1-Mode 1
            bitOffset: 3
            bitWidth: 1
            access: write-only
          CLEAR_TX_FIFO:
            description: 'Clears all bytes in the Tx FIFO and resets its counter logic. The shift register is not cleared. 0: Disabled (default) 1: Enabled'
            bitOffset: 2
            bitWidth: 1
            access: write-only
          CLEAR_RX_FIFO:
            description: 'Clears all bytes in Rx FIFO and resets counter logic. This shift register is not cleared. 0: Disabled (default) 1: Enabled'
            bitOffset: 1
            bitWidth: 1
            access: write-only
          ENABLE_TX_RX_FIFO:
            description: It enables both the Tx and Rx FIFOs and is hardwired to 1.. which means it is always enabled and cannot be changed.
            bitOffset: 0
            bitWidth: 1
            access: write-only
