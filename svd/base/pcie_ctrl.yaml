_add:
  PCIE_TOP_0_PCIE_CTRL:
    description: PCIE_TOP_0_PCIE_CTRL Controller
    groupName: PCIE_CTRL
    baseAddress: 0x33006000
    registers:
      SOFT_RESET:
        description: Compulsory register for all SCB slaves, facilitating global soft reset.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts functional reset of the peripheral block. It is asserted and left asserted at power-up. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: Resets all the volatile register bits. Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: Resets all the non-volatile register bits (e.g. RW-P bits). Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DEV_CONTROL:
        description: Controls the device configuration.
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x19110
        fields:
          ENABLE_NULLIFY_TLP_ON_TXBUF_ECC_ERR:
            description: When asserted; nullfy TLP when TX BUF ECC errors encountered is supported (k_gen); When cleared; nullify TLP when TX BUF ECC errors encountered is not supported; 0 1
            bitOffset: 19
            bitWidth: 1
            access: read-write
          USE_RXELECIDLE_TO_DETECT_ELECIDLE_ENTRY:
            description: When asserted; treat fall edge of rxelecidle as rcvd EIOS, see AppD of PCIE Ref Manual (k_gen); When cleared; do as per PCIe Specification 0 1
            bitOffset: 16
            bitWidth: 1
            access: read-write
          LANE_REVERSAL_SUPPORT:
            description: When asserted; lane reversal is supported (k_gen); When cleared; lane reversal is not supported; 0 1
            bitOffset: 15
            bitWidth: 1
            access: read-write
          LINK_SPEED_5GBPS_SUPPORT:
            description: When asserted; 5.0 Gbps link-speed is supported (k_gen); When cleared; 5.0 Gbps link-speed is not supported; 0 1
            bitOffset: 12
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X4_SUPPORT:
            description: When asserted; x4 lane link-width mode is supported (k_gen); When cleared; x4 lane link-width mode is not supported; 0 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X2_SUPPORT:
            description: When asserted; x2 lane link-width mode is supported (k_gen); When cleared; x2 lane link-width mode is not supported; 0 1
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ROOT_PORT_NEP:
            description: When asserted; the PCIE controller is in root port (k_gen); When cleared; the controller is in endpoint mode. 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CLOCK_CONTROL:
        description: Register for clock control
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x1FC00000
        fields:
          TL_CLOCK_FREQ:
            description: The 10 bit value specifies the frequency of transaction layer clock. It is used in Latency tolerating state machine
            bitOffset: 22
            bitWidth: 10
            access: read-write
      SOFT_RESET_DEBUG_INFO:
        description: Soft Reset Logic Debug Information
        addressOffset: 0x10
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RST_DBG_PIPE_RSTN:
            description: Captures the state of signal - pipe_rstn (input to PIPE logic)
            bitOffset: 29
            bitWidth: 1
            access: read-only
          RST_DBG_AXI4_SLVL_RSTN:
            description: Captures the state of signal - axi4_slvl_rstn (input to PCIE Core)
            bitOffset: 28
            bitWidth: 1
            access: read-only
          RST_DBG_AXI4_SLV_RSTN:
            description: Captures the state of signal - axi4_slv_rstn (input to PCIE Core)
            bitOffset: 27
            bitWidth: 1
            access: read-only
          RST_DBG_AXI4_MST_RSTN:
            description: Captures the state of signal - axi4_mst_rstn (input to PCIE Core)
            bitOffset: 26
            bitWidth: 1
            access: read-only
          RST_DBG_BR_RSTN:
            description: Captures the state of signal - br_rstn (input to PCIE Core)
            bitOffset: 25
            bitWidth: 1
            access: read-only
          RST_DBG_TL_CRSTN:
            description: Captures the state of signal - tl_crstn (input to PCIE Core)
            bitOffset: 24
            bitWidth: 1
            access: read-only
          RST_DBG_TL_RSTN:
            description: Captures the state of signal - tl_rstn (input to PCIE Core)
            bitOffset: 23
            bitWidth: 1
            access: read-only
          RST_DBG_TL_NPOR:
            description: Captures the state of signal - tl_npor (input to PCIE Core)
            bitOffset: 22
            bitWidth: 1
            access: read-only
          RST_DBG_PL_RSTN:
            description: Captures the state of signal - pl_rstn (input to PCIE Core)
            bitOffset: 21
            bitWidth: 1
            access: read-only
          RST_DBG_PL_NPOR:
            description: Captures the state of signal - pl_npor (input to PCIE Core)
            bitOffset: 20
            bitWidth: 1
            access: read-only
          RST_DBG_WAKE_REQ:
            description: Captures the state of signal - wake_req
            bitOffset: 12
            bitWidth: 1
            access: read-only
          RST_DBG_PIPE_POWERDOWN:
            description: Captures the state of signal - powerdown[1:0] (output from PIPE logic)
            bitOffset: 8
            bitWidth: 2
            access: read-only
          RST_DBG_PIPE_PHYSTATUS:
            description: Captures the state of signal - pipe_phystatus[3:0] (output from PIPE logic)
            bitOffset: 4
            bitWidth: 4
            access: read-only
          RST_DBG_PERIPH_RESET_B:
            description: Captures the state of signal - periph_reset_b
            bitOffset: 2
            bitWidth: 1
            access: read-only
          RST_DBG_MPERST_B:
            description: Captures the state of signal - mperst_b
            bitOffset: 1
            bitWidth: 1
            access: read-only
          RST_DBG_CORE_UP:
            description: Captures the state of signal - coreup
            bitOffset: 0
            bitWidth: 1
            access: read-only
      SOFT_RESET_CTLR:
        description: PCIe Controller Resets
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x100002
        fields:
          CFG_PCIE_CFGRESET_REL:
            description: When de-asserted, the PCIe Controller resets (PL, TL) are held under reset when pl_exit[2:0] conditions are detected; the reset releases are gated by the assertion of this register bit 0 1
            bitOffset: 20
            bitWidth: 1
            access: read-write
          CFG_BRGMAP_SOFTRST:
            description: When asserted, resets the bridge internal registers. 0 1
            bitOffset: 16
            bitWidth: 1
            access: read-write
          CFG_IGNORE_INBAND_RST_EVENT_4_CTRL_RST:
            description: When asserted, ignore the effect of DLUp|HotRst|L2Exit events by not resetting PCIe controller 0 1
            bitOffset: 12
            bitWidth: 1
            access: read-write
          CFG_IGNORE_MPERST:
            description: When asserted, ignore external PERST# pin and use internal periph_reset_b as fundamental reset 0 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          CFG_IGNORE_BRGAXI_SOFTRST_4_CTRL_RST:
            description: When asserted, do not reset PL and TL logic when CFG_BRGAXI_SOFTRST=1 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CFG_BRGAXI_SOFTRST:
            description: The register resets the Bridge and AXI layers in the PCIe controller. Internal FSM conditionally resets PL and TL Logic (see bit1 and bit2 settings) 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SEC_ERROR_EVENT_CNT:
        description: Indicates a single correctible error event occurred in the RAMS
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI2PCIE_RAM_SEC_ERR_CNT:
            description: This is a 8 bit counter valuefor single-correctible error in AXI to PCIe buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 24
            bitWidth: 8
            access: read-write
          PCIE2AXI_RAM_SEC_ERR_CNT:
            description: This is a 8 bit counter valuefor single-correctible error in PCIe-to-AXI buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 16
            bitWidth: 8
            access: read-write
          RX_RAM_SEC_ERR_CNT:
            description: This is a 8 bit counter value for single-correctible error in PCIe RX buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          TX_RAM_SEC_ERR_CNT:
            description: This is a 8 bit counter value for single-correctible error in PCIe TX buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      DED_ERROR_EVENT_CNT:
        description: Indicates a uncorrectible error event occurred in the RAMS
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI2PCIE_RAM_DED_ERR_CNT:
            description: This is a 4 bit counter value for uncorrectible errors in AXI to PCIe buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_DED_ERR_CNT:
            description: This is a 4 bit counter value for uncorrectible errors in PCIe-to-AXI buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_DED_ERR_CNT:
            description: This is a 4 bit counter value for uncorrectible errors in PCIe RX buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_DED_ERR_CNT:
            description: This is a 4 bit counter value for uncorrectible errors in PCIe TX buffer. The counter will not roll back and will stay at its max value.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      SEC_ERROR_INT:
        description: Interrupt contributor registers for SEC Errors
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI2PCIE_RAM_SEC_ERR_INT:
            description: Indicates a SEC_RAM_ERR occurred in the appropriate AXI2PCIe Buffer 0x0 0x1
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_SEC_ERR_INT:
            description: Indicates a SEC_RAM_ERR occurred in appropriate PCIe2AXI Buffer 0x0 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_SEC_ERR_INT:
            description: Indicates a SEC_RAM_ERR occurred in appropriate RX Buffer 0x0 0x1
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_SEC_ERR_INT:
            description: Indicates a SEC_RAM_ERR occurred in the appropriate TX Buffer 0x0 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-write
      SEC_ERROR_INT_MASK:
        description: Indicates the SEC error contributors to ram_err_int
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x1111
        fields:
          AXI2PCIE_RAM_SEC_ERR_INT_MASK:
            description: Indicates whether SEC error in AXI2PCIe buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_SEC_ERR_INT_MASK:
            description: Indicates whether SEC error in PCIe2AXI buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_SEC_ERR_INT_MASK:
            description: Indicates whether SEC error in RX buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_SEC_ERR_INT_MASK:
            description: Indicates whether SEC error in TX buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-write
      DED_ERROR_INT:
        description: Interrupt contributor registers for DED Errors
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI2PCIE_RAM_DED_ERR_INT:
            description: Indicates a DED_RAM_ERR occurred in AXI2PCIe Buffer 0x0 0x1
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_DED_ERR_INT:
            description: Indicates a SEC_RAM_ERR occurred in PCIe2AXI Buffer 0x0 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_DED_ERR_INT:
            description: Indicates a DED_RAM_ERR occurred in RX Buffer 0x0 0x1
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_DED_ERR_INT:
            description: Indicates a DED_RAM_ERR occurred in TX Buffer 0x0 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-write
      DED_ERROR_INT_MASK:
        description: Indicates the DED error contributors to ram_err_int
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x1111
        fields:
          AXI2PCIE_RAM_DED_ERR_INT_MASK:
            description: Indicates whether DED error in AXI2PCIe buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_DED_ERR_INT_MASK:
            description: Indicates whether DED error in PCIe2AXI buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_DED_ERR_INT_MASK:
            description: Indicates whether DED error in RX buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_DED_ERR_INT_MASK:
            description: Indicates whether DED error in TX buffer should contribute ram_err_int signal 0x0 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-write
      ECC_CONTROL:
        description: Manually injects ECC error or bypasses ECC.
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI2PCIE_RAM_ECC_BYPASS:
            description: ECC Generation and check is bypassed in AXI2PCIE RAM 0 1
            bitOffset: 27
            bitWidth: 1
            access: read-write
          PCIE2AXI_RAM_ECC_BYPASS:
            description: ECC Generation and check is bypassed in PCIE2AXI RAM 0 1
            bitOffset: 26
            bitWidth: 1
            access: read-write
          RX_RAM_ECC_BYPASS:
            description: ECC Generation and check is bypassed in RX RAM 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          TX_RAM_ECC_BYPASS:
            description: ECC Generation and check is bypassed in TX RAM 0 1
            bitOffset: 24
            bitWidth: 1
            access: read-write
          AXI2PCIE_RAM_INJ_ERR:
            description: Injects a ECC_RAM_ERR occurred in AXI2PCIe Buffer 0x0 0x1
            bitOffset: 12
            bitWidth: 4
            access: read-write
          PCIE2AXI_RAM_INJ_ERR:
            description: Injects a ECC_RAM_ERR occurred in PCIe2AXI Buffer 0x0 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-write
          RX_RAM_INJ_ERR:
            description: Injects a ECC_RAM_ERR occurred in RX Buffer 0x0 0x1
            bitOffset: 4
            bitWidth: 4
            access: read-write
          TX_RAM_INJ_ERR:
            description: Injects a ECC_RAM_ERR occurred in TX Buffer 0x0 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-write
      ECC_ERR_LOC:
        description: Manually injects ECC error as specified in the address and data location.
        addressOffset: 0x3C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE_ECC_ERR_BYTE_LOC:
            description: When a bit is '1', the error is inserted in the corresponding byte. The error inserted is specified by the appropriate ENABLE_ECC_ERR_BIT_LOC
            bitOffset: 16
            bitWidth: 10
            access: read-write
          ENABLE_ECC_ERR_BIT_LOC:
            description: Enables error on bits specified by the byte. When there is a '1' the error is inserted in the location.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          INJECT_ECC_ERR_ADDR:
            description: Injects ECC ERROR as specified at the adress specified by INJECT_ECC_ERR_ADDR[7:0]
            bitOffset: 0
            bitWidth: 8
            access: read-write
      RAM_MARGIN_1:
        description: Registers for RAM Read Margin control
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TX_BUF_MARGIN:
            description: Controls the read margin for the TX Buffer RAM. RAM[2:0] -> RAM_INST_0, RAM[5:3]-> RAM_INST_1.
            bitOffset: 16
            bitWidth: 12
            access: read-write
          RX_BUF_MARGIN:
            description: Controls the read margin for the RX Buffer RAM. RAM[2:0] -> RAM_INST_0, RAM[5:3]-> RAM_INST_1.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      RAM_MARGIN_2:
        description: Registers for RAM Read Margin control
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          A2P_BUF_MARGIN:
            description: Controls the read margin for the AXI2PCIE Buffer RAM. RAM[2:0] -> RAM_INST_0, RAM[5:3]-> RAM_INST_1.
            bitOffset: 16
            bitWidth: 12
            access: read-write
          P2A_BUF_MARGIN:
            description: Controls the read margin for the PCIE2AXI Buffer RAM. RAM[2:0] -> RAM_INST_0, RAM[5:3]-> RAM_INST_1.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      RAM_POWER_CONTROL:
        description: Registers for controlling power in RAMs
        addressOffset: 0x48
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          A2P_BUF_PWR_CTRL:
            description: Controls the power for AXI2PCIE Buffer. 0x0 0x1 0x2 0x4
            bitOffset: 24
            bitWidth: 3
            access: read-write
          P2A_BUF_PWR_CTRL:
            description: Controls the power for PCIE2AXI Buffer. 0x0 0x1 0x2 0x4
            bitOffset: 16
            bitWidth: 3
            access: read-write
          TX_BUF_PWR_CTRL:
            description: Controls the power for TX Buffer. 0x0 0x1 0x2 0x4
            bitOffset: 8
            bitWidth: 3
            access: read-write
          RX_BUF_PWR_CTRL:
            description: Controls the power for RX Buffer. 0x0 0x1 0x2 0x4
            bitOffset: 0
            bitWidth: 3
            access: read-write
      DEBUG_SEL:
        description: PCIe Controller fab_debug[31:0] select
        addressOffset: 0x50
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          FAB_DEBUG_SEL:
            description: Controls debug select mux logic
            bitOffset: 0
            bitWidth: 8
            access: read-write
      LTSSM_STATE:
        description: Captures the LTSSM state fromPCIE core
        addressOffset: 0x5C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          PL_LTSSM_OUT:
            description: Captures the LTSSM state Detect.Quiet= 5’h0 Detect.Active= 5’h1 Polling.Active= 5’h2 Polling.Compliance= 5’h3 Polling.Configuration= 5’h4 Configuration.Linkwidth.Start= 5’h5 Configuration.Linkwidth.Accept= 5’h6 Configuration.Lanenum.Wait= 5’h7 Configuration.Lanenum.Accept= 5’h8 Configuration.Complete= 5’h9 Configuration.Idle= 5’hA Recovery.RcvrLock= 5’hB Recovery.Equalization= 5’hC Recovery.Speed= 5’hD Recovery.RcvrCfg= 5’hE Recovery.Idle= 5’hF L0= 5’h10 L0s= 5’h11 L1.Entry= 5’h12 L1.Idle= 5’h13 L2.Idle= 5’h14 L2.TransmitWake= 5’h15 Disabled= 5’h16 Loopback.Entry= 5’h17 Loopback.Active= 5’h18 Loopback.Exit= 5’h19 Hot Reset= 5’h1A
            bitOffset: 0
            bitWidth: 5
            access: read-only
      PHY_COMMON_INTERFACE:
        description: Captures the state pf PCIE PHY signal which are common to al lanes
        addressOffset: 0x60
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          PL_TXDEMPH:
            description: Captures the TX demphasis
            bitOffset: 13
            bitWidth: 1
            access: read-only
          PL_TXSWING:
            description: Captures the TX swing
            bitOffset: 12
            bitWidth: 1
            access: read-only
          PL_TXMARGIN:
            description: Captures the TX margin
            bitOffset: 8
            bitWidth: 3
            access: read-only
          PL_RATE:
            description: Captures the link signaling rate
            bitOffset: 4
            bitWidth: 2
            access: read-only
          PL_POWERDOWN:
            description: Determines the power state (L0,L1,L2..)
            bitOffset: 0
            bitWidth: 2
            access: read-only
      PL_TX_LANEIF_0:
        description: Captures the per-lane interface signals between the PCIE and Pipe
        addressOffset: 0x64
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          PL_TXCOMPLAINCE:
            description: Captures the state of TX compliance per lane
            bitOffset: 8
            bitWidth: 4
            access: read-only
          PL_TXELECIDLE:
            description: Captures the state of Tx ElecIdle per lane
            bitOffset: 4
            bitWidth: 4
            access: read-only
          PL_TXDETRX:
            description: Captures the state of TX Detect RX per lane
            bitOffset: 0
            bitWidth: 4
            access: read-only
      PL_RX_LANEIF_0:
        description: Captures the per-lane interface signals between the PCIe and Pipe
        addressOffset: 0x68
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          PL_RXVALID:
            description: Captures the state of RxValid per lane
            bitOffset: 24
            bitWidth: 4
            access: read-only
          PL_RXSTATUS:
            description: Captures the three bit RX status per lane
            bitOffset: 12
            bitWidth: 12
            access: read-only
          PL_RXELECIDLE:
            description: Captures the state of Rx Elec Idle per lane
            bitOffset: 8
            bitWidth: 4
            access: read-only
          PL_PHYSTATUS:
            description: Captures the state of phystatus[3:0] per lane
            bitOffset: 4
            bitWidth: 4
            access: read-only
          PL_RXPOL:
            description: Captures the state of RX Polarity per lane
            bitOffset: 0
            bitWidth: 4
            access: read-only
      PL_WAKECLKREQ:
        description: Captures the state of Wake Management
        addressOffset: 0x6C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PL_WAKE_OVERRIDE:
            description: Overrides the value of WAKE_IN input 0 1
            bitOffset: 3
            bitWidth: 1
            access: read-write
          PL_WAKEIN:
            description: Captures the state of WAKE_IN Read 0 Read 1
            bitOffset: 1
            bitWidth: 1
            access: read-only
          PL_WAKEOEN:
            description: Captures the state of Wake_OEN Read 0 Read 1
            bitOffset: 0
            bitWidth: 1
            access: read-only
      PCICONF_PCI_IDS_OVERRIDE:
        description: PCI Configuration Override Enable
        addressOffset: 0x80
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PCICONF_OVERRIDE_EN:
            description: PC BIT override enable for PCIE Bridge Config registers 0x98, 0x9C, 0xA0 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      PCICONF_PCI_IDS_31_0:
        description: PCIe PCI Standard Configuration Identification Settings 31 to 0
        addressOffset: 0x84
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PCI_DEVICE_ID:
            description: PC BIT override value for PCIE Bridge Config register PCIE_PCI_IDS offset 0x98, bit field Device ID
            bitOffset: 16
            bitWidth: 16
            access: read-write
          PCI_VENDOR_ID:
            description: PC BIT override value for PCIE Bridge Config register PCIE_PCI_IDS offset 0x98, bit field Vendor ID
            bitOffset: 0
            bitWidth: 16
            access: read-write
      PCICONF_PCI_IDS_63_32:
        description: PCIe PCI Standard Configuration Identification Settings 63 to 32
        addressOffset: 0x88
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PCI_CLASS_CODE:
            description: PC BIT override value for PCIE Bridge Config register PCIE_PCI_IDS offset 0x9C, bit field Class Code
            bitOffset: 8
            bitWidth: 24
            access: read-write
          PCI_REVISION_ID:
            description: PC BIT override value for PCIE Bridge Config register PCIE_PCI_IDS offset 0x9C, bit field Revision ID
            bitOffset: 0
            bitWidth: 8
