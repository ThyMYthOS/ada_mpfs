            description: Defines on which interface the descriptors should be read 0x0 0x3 0x4 0x5 0x6 0x7
            bitOffset: 26
            bitWidth: 3
            access: read-write
          SG_TYPE:
            description: 'Defines the Scatter-Gather type for the DMA (only relevant if bit 3 of CTRL Field is set). 2?b00: independent SG for both Source and Destination. 2?b01: Source address is set according to Descriptor, Destination address is incremented. 2?b10: Destination address is set according to Descriptor, Source address is incremented. 2?b11: Source and Destination addresses are set according to Descriptor. When this register field is not hardwired by Core Constants, it is read/write and its default value after reset is 2?b0.'
            bitOffset: 24
            bitWidth: 2
            access: read-write
          DESC_UPDT:
            description: Set to 1 by the application to indicate to the DMA Engine that a Descriptor has been updated. It is only relevant when SG mode is enabled and the DESC_NEXT_RDY field was set to 0 (see DESC_NEXT_RDY). This bit is automatically cleared by the DMA Engine.
