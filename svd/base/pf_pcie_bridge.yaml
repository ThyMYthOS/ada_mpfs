      P2A_TC_QOS_CONV:
        description: 'Automatic conversion between PCIe Traffic Class and AXI Quality of Service: When automatic conversion is enabled, the Traffic Class or AxQoS values issued by the Bridge are computed based on the Traffic Class or AxQoS values received by the Address Translation modules. When automatic conversion is disabled, the Traffic Class or AxQoS values issued by the Bridge depends on the Transfer Parameters programmed in Address Translation Tables.'
        addressOffset: 0x3C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXQOS_TC_7:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 7 (recommended value is 1)
            bitOffset: 28
            bitWidth: 4
            access: read-write
          AXQOS_TC_6:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 6 (recommended value is 1)
            bitOffset: 24
            bitWidth: 4
            access: read-write
          AXQOS_TC_5:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 5 (recommended value is 1)
            bitOffset: 20
            bitWidth: 4
            access: read-write
          AXQOS_TC_4:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 4(recommended value is 1)
            bitOffset: 16
            bitWidth: 4
            access: read-write
          AXQOS_TC_3:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 3 (recommended value is 1)
            bitOffset: 12
            bitWidth: 4
            access: read-write
          AXQOS_TC_2:
            description: AxQoS[3:0] value corresponding to TC[2:0] = 2 (recommended value is 1)
            bitOffset: 8
            bitWidth: 4
            access: read-write
          AXQOS_TC_1:
            description: 'AxQoS[3:0] value corresponding to TC[2:0] = 1 (recommended value is 1). Note: The AxQoS[3:0] value corresponding to TC[2:0] = 0 is always 0'
            bitOffset: 4
            bitWidth: 4
            access: read-write
          RESERVED1:
            description: reserved
            bitOffset: 1
            bitWidth: 3
            access: read-write
          AUTO_CONV:
            description: When this bit is asserted, automatic conversion between PCIe Traffic Class and AXI Quality of Service is enabled. Otherwise it is disabled.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      P2A_ATTR_CACHE_CONV:
        description: 'Automatic conversion between PCIe No Snoop Attribute and AXI Memory types: When automatic conversion is enabled, the No Snoop Attribute or AxCACHE values issued by the Bridge are computed based on the No Snoop Attribute or AxCACHE values received by the Address Translation modules. Note: 1. The Bridge issues PCIe memory accesses with No Snoop Attribute set to 1 when the following requirements are set: ? AxCACHE[1] of an AXI received transaction is set to 0 (transaction is non-cacheable). ? Bit [0] and Bit [5] are asserted (automatic conversion is enabled between Memory cache and No Snoop). ? Enable No Snoop Bit is asserted in the Device ControlRegister of PCIe controller configuration space.2. All PCIe IO requests will be converted into AXI transaction with AxCACHE values equal to 4''b0000. 3. In Rootport mode, the Bridge can translate PCIe MSI requests into AXI transactions. However, these requests should be forwarded to an interrupt controller, and thus should not be cacheable. This means that you can define a PCIe Non-Cacheable Space in which all incoming transactions are translated into non-cacheable AXI transactions. ? When automatic conversion is disabled, the No Snoop Attribute or AxCACHE values issued by the Bridge depends on the Transfer Parameters programmed in Address Translation Tables.'
        addressOffset: 0x3C4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          NON_CACHE_SPACE_BUF:
            description: When asserted, all PCIe accesses whose address falls between Non-Cacheable Space Base Address and Non-Cacheable Space Base Address + 2^Non-Cacheable Space Size are set to AxCACHE = 4'b0001. Otherwise it is set to 4'b0000.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          NON_CACHE_SPACE_SIZE:
            description: When set to 0, this address space is disabled. Otherwise its size is equal to 2^Non-Cacheable Space Size in Bytes.
            bitOffset: 24
            bitWidth: 7
            access: read-write
          RESERVED8:
            description: Reserved
            bitOffset: 8
            bitWidth: 16
            access: read-write
          MEM_OTHER_ALLOC:
            description: When asserted, and PCIe No Snoop = 0 and Bit [5:4] = 2'b11, all PCIe memory accesses are marked as other allocate (AxCACHE[3] is set to 1) (recommended value = 0).
            bitOffset: 7
            bitWidth: 1
            access: read-write
          MEM_ALLOC:
            description: When asserted, and PCIe No Snoop = 0 and Bit [5:4] = 2'b11, all PCIe memory accesses are marked as allocate (AxCACHE[2] is set to 1) (recommended value = 0).
            bitOffset: 6
            bitWidth: 1
            access: read-write
          MEM_CACHEABLE:
            description: When asserted, and PCIe No Snoop = 0, all PCIe memory accesses are marked as cacheable (AxCACHE[1] is set to 1) (recommended value = 1).
            bitOffset: 5
            bitWidth: 1
            access: read-write
          MEM_BUFFERABLE:
            description: When asserted, all PCIe memory accesses are marked as bufferable (AxCACHE[0] is set to 1) (recommended value = 1).
            bitOffset: 4
            bitWidth: 1
            access: read-write
          RESERVED1:
            description: Reserved
            bitOffset: 1
            bitWidth: 3
            access: read-write
          AUTO_CONV_EN:
            description: When this bit is asserted, automatic conversion between PCIe No Snoop Attribute and AXI Memory types is enabled.
            bitOffset: 0
            bitWidth: 1
            access: read-write
