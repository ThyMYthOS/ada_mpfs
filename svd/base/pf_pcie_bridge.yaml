_add:
  PCIE_TOP_0_PF_PCIE_BRIDGE:
    description: PCIE_TOP_0_PF_PCIE_BRIDGE Controller
    groupName: PF_PCIE_BRIDGE
    baseAddress: 0x33004000
    registers:
      BRIDGE_VER:
        description: Bridge IP Version & Revision
        addressOffset: 0x0
        size: 32
        access: read-only
        resetValue: 0x2511154
        fields:
          RESERVED28:
            description: ''
            bitOffset: 28
            bitWidth: 4
            access: read-only
          DMA_NUM:
            description: Indicates the number of DMA Engines implemented in the Core.
            bitOffset: 24
            bitWidth: 4
            access: read-only
          PRODUCT_ID:
            description: Provides the Bridge IP Product ID, equal to 12?h511
            bitOffset: 12
            bitWidth: 12
            access: read-only
          VERSION:
            description: Provides the Bridge IP Core version
            bitOffset: 0
            bitWidth: 12
            access: read-only
      BRIDGE_BUS:
        description: Bridge Internal Bus
        addressOffset: 0x4
        size: 32
        access: read-only
        resetValue: 0x11885153
        fields:
          MAXRREQSIZE:
            description: Provides the maximum Read Request Size of the Bridge Internal Bus Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 28
            bitWidth: 4
            access: read-only
          MAXPAYLOAD:
            description: Provides the maximum Payload of the Bridge Internal Bus Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 24
            bitWidth: 4
            access: read-only
          WR_OUTREQ_N:
            description: Number of outstanding write requests Read 0x8
            bitOffset: 20
            bitWidth: 4
            access: read-only
          RD_OUTREQ_N:
            description: Number of outstanding read requests Read 0x8
            bitOffset: 16
            bitWidth: 4
            access: read-only
          DATAPATH:
            description: 'Indicates the Bridge Internal Bus Data Path width: #5 indicates 256-bits Read 0x5'
            bitOffset: 12
            bitWidth: 4
            access: read-only
          VERSION:
            description: Provides the Bridge Internal Bus version; for example,
            bitOffset: 0
            bitWidth: 12
            access: read-only
      BRIDGE_IMPL_IF:
        description: 'Describes the Bridge implemented interface: More detailed information on PCIe Interface is provided at addresses 0x0010 - 0x001B, and more detailed information on AXI Interfaces is provided at addresses 0x0020 - 0x006F'
        addressOffset: 0x8
        size: 32
        access: read-only
        resetValue: 0x32B
        fields:
          RESERVED24:
            description: Reserved
            bitOffset: 24
            bitWidth: 8
            access: read-only
          AXI4_STREAM_IN_3:
            description: Indicates if AXI4 Stream In 3 Interface is implemented
            bitOffset: 23
            bitWidth: 1
            access: read-only
          AXI4_STREAM_OUT_3:
            description: Indicates if AXI4 Stream Out 3 Interface is implemented
            bitOffset: 22
            bitWidth: 1
            access: read-only
          AXI4_STREAM_IN_2:
            description: Indicates if AXI4 Stream In 2 Interface is implemented
            bitOffset: 21
            bitWidth: 1
            access: read-only
          AXI4_STREAM_OUT_2:
            description: Indicates if AXI4 Stream Out 2 Interface is implemented
            bitOffset: 20
            bitWidth: 1
            access: read-only
          AXI4_STREAM_IN_1:
            description: Indicates if AXI4 Stream In 1 Interface is implemented
            bitOffset: 19
            bitWidth: 1
            access: read-only
          AXI4_STREAM_OUT_1:
            description: Indicates if AXI4 Stream Out 1 Interface is implemented
            bitOffset: 18
            bitWidth: 1
            access: read-only
          AXI4_STREAM_IN_0:
            description: Indicates if AXI4 Stream In 0 Interface is implemented
            bitOffset: 17
            bitWidth: 1
            access: read-only
          AXI4_STREAM_OUT_0:
            description: Indicates if AXI4 Stream Out 0 Interface is implemented
            bitOffset: 16
            bitWidth: 1
            access: read-only
          AXI4_SLAVE_3:
            description: Indicates if AXI4 Slave 3 Interface is implemented
            bitOffset: 15
            bitWidth: 1
            access: read-only
          AXI4_MASTER_3:
            description: Indicates if AXI4 Master 3 Interface is implemented
            bitOffset: 14
            bitWidth: 1
            access: read-only
          AXI4_SLAVE_2:
            description: Indicates if AXI4 Slave 2 Interface is implemented
            bitOffset: 13
            bitWidth: 1
            access: read-only
          AXI4_MASTER_2:
            description: Indicates if AXI4 Master 2 Interface is implemented
            bitOffset: 12
            bitWidth: 1
            access: read-only
          AXI4_SLAVE_1:
            description: Indicates if AXI4 Slave 1 Interface is implemented
            bitOffset: 11
            bitWidth: 1
            access: read-only
          AXI4_MASTER_1:
            description: Indicates if AXI4 Master 1 Interface is implemented
            bitOffset: 10
            bitWidth: 1
            access: read-only
          AXI4_SLAVE_0:
            description: Indicates if AXI4 Slave 0 Interface is implemented
            bitOffset: 9
            bitWidth: 1
            access: read-only
          AXI4_MASTER_0:
            description: Indicates if AXI4 Master 0 Interface is implemented
            bitOffset: 8
            bitWidth: 1
            access: read-only
          RESERVED7:
            description: Reserved
            bitOffset: 7
            bitWidth: 1
            access: read-only
          AXI4_MASTER_DESCRIPTOR:
            description: Indicates if AXI4 Master Descriptor Interface is implemented
            bitOffset: 6
            bitWidth: 1
            access: read-only
          AXI4L_SLAVE:
            description: Indicates if AXI4-Lite Slave Interface is implemented
            bitOffset: 5
            bitWidth: 1
            access: read-only
          AXI4L_MASTER:
            description: Indicates if AXI4-Lite Master Interface is implemented
            bitOffset: 4
            bitWidth: 1
            access: read-only
          PCIE_CONFIG:
            description: Indicates if PCIe Configuration Interface is implemented
            bitOffset: 3
            bitWidth: 1
            access: read-only
          PCIE_IF_WINDOW_1:
            description: Indicates if PCIe Interface Window 1 is implemented
            bitOffset: 2
            bitWidth: 1
            access: read-only
          PCIE_IF_WINDOW_0:
            description: Indicates if PCIe Interface Window 0 is implemented
            bitOffset: 1
            bitWidth: 1
            access: read-only
          PCIE_IF:
            description: Indicates if PCIe Interface is implemented
            bitOffset: 0
            bitWidth: 1
            access: read-only
      PCIE_IF_CONF:
        description: PCIe Interface Configuration
        addressOffset: 0x10
        size: 32
        access: read-only
        resetValue: 0x11440170
        fields:
          MAXRREQSIZE:
            description: Provides the maximum Read Request Size of the PCIe Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 28
            bitWidth: 4
            access: read-only
          MAXPAYLOAD:
            description: Provides the maximum Payload of the PCIe Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 24
            bitWidth: 4
            access: read-only
          P2B_MRD_OUTREQ_N:
            description: Number of Outstanding Read Requests from the PCIe domain the Bridge can handle simultaneously Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5 Read 0x6 Read 0x7
            bitOffset: 20
            bitWidth: 4
            access: read-only
          B2P_MRD_OUTREQ_N:
            description: Number of Outstanding Read Requests the Bridge can issue to the PCIe domain Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5 Read 0x6 Read 0x7
            bitOffset: 16
            bitWidth: 4
            access: read-only
          IF_ID:
            description: Provides the ID used to target this interface. This ID is used to specify the TRSL_ID fields of the DMA Engines and Address Translation registers (see Section 17.6) Read 0x0
            bitOffset: 12
            bitWidth: 4
            access: read-only
          VERSION:
            description: Provides the PCI Express Controller Core version
            bitOffset: 0
            bitWidth: 12
            access: read-only
      PCIE_BASIC_CONF:
        description: 'PCIe IP Basic Configuration. Note: Several LINK_WIDTH_[] can be asserted at the same time, same applies to LINK_SPEED_[].'
        addressOffset: 0x14
        size: 32
        access: read-only
        resetValue: 0x3110307
        fields:
          TYPE:
            description: Advertises the PCI Express Core type Read 0x0 Read 0x1
            bitOffset: 28
            bitWidth: 4
            access: read-only
          COMPL:
            description: Advertises the Core compliance to PCI Express 3.1 specification. The only supported value is 4'h3; other values are reserved.
            bitOffset: 24
            bitWidth: 4
            access: read-only
          VC_NUM:
            description: Advertises the number of Virtual Channels implemented in the Core. The only supported value is 4'h; other values are reserved
            bitOffset: 20
            bitWidth: 4
            access: read-only
          FUNC_NUM:
            description: Advertises the number of functions implemented in the Core. Supported values are between 4'h1 and 4'h8. Other values are reserved.
            bitOffset: 16
            bitWidth: 4
            access: read-only
          RESERVED11:
            description: ''
            bitOffset: 11
            bitWidth: 5
            access: read-only
          LINK_SPEED_8G:
            description: 8.0 Gbps link speed is supported
            bitOffset: 10
            bitWidth: 1
            access: read-only
          LINK_SPEED_5G:
            description: 5.0 Gbps link speed is supported
            bitOffset: 9
            bitWidth: 1
            access: read-only
          LINK_SPEED_2P5G:
            description: 2.5 Gbps link speed is supported
            bitOffset: 8
            bitWidth: 1
            access: read-only
          RESERVED4:
            description: ''
            bitOffset: 4
            bitWidth: 4
            access: read-only
          LINK_WIDTH_X8:
            description: 'Advertises the supported link width: x8 configuration is supported'
            bitOffset: 3
            bitWidth: 1
            access: read-only
          LINK_WIDTH_X4:
            description: 'Advertises the supported link width: x4 configuration is supported'
            bitOffset: 2
            bitWidth: 1
            access: read-only
          LINK_WIDTH_X2:
            description: 'Advertises the supported link width: x2 configuration is supported'
            bitOffset: 1
            bitWidth: 1
            access: read-only
          LINK_WIDTH_X1:
            description: 'Advertises the supported link width: x1 configuration is supported. (This bit is always asserted.)'
            bitOffset: 0
            bitWidth: 1
            access: read-only
      PCIE_BASIC_STATUS:
        description: PCIe IP Basic Status
        addressOffset: 0x18
        size: 32
        access: read-only
        resetValue: 0x20000100
        fields:
          NEG_MAXRREQSIZE:
            description: Reports the negotiated maximum Read Request Size of the PCIe link Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 28
            bitWidth: 4
            access: read-only
          NEG_MAXPAYLOAD:
            description: Reports the negotiated maximum Payload of the PCIe link. Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 24
            bitWidth: 4
            access: read-only
          RESERVED12:
            description: ''
            bitOffset: 12
            bitWidth: 12
            access: read-only
          NEG_LINK_SPEED:
            description: 'Reports the negotiated link speed of the PCIe link. Supported values are: Read 0x1 Read 0x2 Read 0x3'
            bitOffset: 8
            bitWidth: 4
            access: read-only
          NEG_LINK_WIDTH:
            description: 'Reports the negotiated link width of the PCIe link. Supported values are: Read 0x01 Read 0x02 Read 0x04 Read 0x08 Read 0x10'
            bitOffset: 0
            bitWidth: 8
            access: read-only
      AXI_SLVL_CONF:
        description: AXI4-Lite Slave Interface Configuration
        addressOffset: 0x24
        size: 32
        access: read-only
        resetValue: 0xBB002121
        fields:
          MAXRREQSIZE:
            description: Provides the maximum Read Request Size of the AXI Interface Read 0xB
            bitOffset: 28
            bitWidth: 4
            access: read-only
          MAXPAYLOAD:
            description: Provides the maximum Payload of the AXI Interface Read 0xB
            bitOffset: 24
            bitWidth: 4
            access: read-only
          WR_OUTREQ_N:
            description: Number of outstanding write requests Read 0x0
            bitOffset: 20
            bitWidth: 4
            access: read-only
          RD_OUTREQ_N:
            description: Number of outstanding read requests Read 0x0
            bitOffset: 16
            bitWidth: 4
            access: read-only
          DATA_PATH:
            description: Provides the AXI interface Data Path Width Read 0x2
            bitOffset: 12
            bitWidth: 4
            access: read-only
          CLK_DOM:
            description: Sets the Clock Domain of the AXI interface Read 0x1
            bitOffset: 8
            bitWidth: 4
            access: read-only
          IF_ID:
            description: 'Provides the ID used to target this interface: 2. This ID is used to specify the TRSL_ID fields of the DMA Engines and Address Translation registers'
            bitOffset: 4
            bitWidth: 4
            access: read-only
          IF_TYPE:
            description: Specifies the AXI Interface type Read 0x1
            bitOffset: 0
            bitWidth: 4
            access: read-only
      AXI_MST0_CONF:
        description: AXI4 Master 0 Interface Configuration
        addressOffset: 0x30
        size: 32
        access: read-only
        resetValue: 0x11883442
        fields:
          MAXRREQSIZE:
            description: Provides the maximum Read Request Size of the AXI Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 28
            bitWidth: 4
            access: read-only
          MAXPAYLOAD:
            description: Provides the maximum Payload of the AXI Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 24
            bitWidth: 4
            access: read-only
          WR_OUTREQ_N:
            description: Maximum number of outstanding write requests. This is a static value of embedded IP core Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 20
            bitWidth: 4
            access: read-only
          RD_OUTREQ_N:
            description: Maximum number of outstanding read requests. This is a static value of embedded IP core Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 16
            bitWidth: 4
            access: read-only
          DATA_PATH:
            description: Provides the AXI interface Data Path Width Read 0x3 Read 0x4 Read 0x5
            bitOffset: 12
            bitWidth: 4
            access: read-only
          CLK_DOM:
            description: Sets the Clock Domain of the AXI interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 8
            bitWidth: 4
            access: read-only
          IF_ID:
            description: Provides the ID used to target this interface. This ID is used to specify the SRC/DEST_ID, SG/SG2_ID and the TRSL_ID fields of the DMA Engines and Address Translation registers Read 0x4
            bitOffset: 4
            bitWidth: 4
            access: read-only
          IF_TYPE:
            description: Specifies the AXI Interface type Read 0x2 Read 0x6
            bitOffset: 0
            bitWidth: 4
            access: read-only
      AXI_SLV0_CONF:
        description: AXI4 Slave 0 Interface Configuration
        addressOffset: 0x34
        size: 32
        access: read-only
        resetValue: 0x44443443
        fields:
          MAXRREQSIZE:
            description: Provides the maximum Read Request Size of the AXI Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 28
            bitWidth: 4
            access: read-only
          MAXPAYLOAD:
            description: Provides the maximum Payload of the AXI Interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4 Read 0x5
            bitOffset: 24
            bitWidth: 4
            access: read-only
          WR_OUTREQ_N:
            description: Number of outstanding write requests Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 20
            bitWidth: 4
            access: read-only
          RD_OUTREQ_N:
            description: Number of outstanding read requests Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 16
            bitWidth: 4
            access: read-only
          DATA_PATH:
            description: Provides the AXI interface Data Path Width Read 0x3 Read 0x4 Read 0x5
            bitOffset: 12
            bitWidth: 4
            access: read-only
          CLK_DOM:
            description: Sets the Clock Domain of the AXI interface Read 0x0 Read 0x1 Read 0x2 Read 0x3 Read 0x4
            bitOffset: 8
            bitWidth: 4
            access: read-only
          IF_ID:
            description: Provides the ID used to target this interface. This ID is used to specify the SRC/DEST_ID, SG/SG2_ID and the TRSL_ID fields of the DMA Engines and Address Translation registers Read 0x4
            bitOffset: 4
            bitWidth: 4
            access: read-only
          IF_TYPE:
            description: Specifies the AXI Interface type Read 0x3 Read 0x7
            bitOffset: 0
            bitWidth: 4
            access: read-only
      GEN_SETTINGS:
        description: Bridge general settings. When these register?s bits are not hardwired by Core Constants, they are read/write and the local processor must initialize it at power-up.
        addressOffset: 0x80
        size: 32
        access: read-write
        resetValue: 0x19300
        fields:
          RESERVED21:
            description: Reserved
            bitOffset: 21
            bitWidth: 11
            access: read-write
          SRIS_MODE:
            description: Indicates that the device is operating in SRIS mode.
            bitOffset: 20
            bitWidth: 1
            access: read-write
          ERROR:
            description: Nullify TLP when TX ECC/parity error is detected.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          RESERVED18:
            description: reserved
            bitOffset: 18
            bitWidth: 1
            access: read-write
          PIE_8_MODE:
            description: 'Datapath PIE-8 compatibility mode. When set, the Core''s PHY data interface conforms to the PIE-8 1.00 specification, which means that: the Core does not perform data scrambling/descrambling at 8.0 Gbps speed. RxDataK/TxDataK are used instead of RxDataValid/TxDataValid at 8.0 Gbps speed. RxStatus encoding differs from the PIPE specification'
            bitOffset: 17
            bitWidth: 1
            access: read-write
          RXELECIDLE:
            description: Use RXELECIDLE to detect electrical idle entry
            bitOffset: 16
            bitWidth: 1
            access: read-write
          LANE_REVERSAL:
            description: Lane reversal supported
            bitOffset: 15
            bitWidth: 1
            access: read-write
          EQUPHASE_23:
            description: 'For downstream ports: setting this bit makes the Core execute phases 2/3; otherwise these phases are skipped. ? For upstream ports: setting this bit makes the Core perform remote transmitter adjustment during phase 2; otherwise the Core does not perform adjustment during this phase.'
            bitOffset: 14
            bitWidth: 1
            access: read-write
          SPEED_8G:
            description: 8.0 Gbps supported
            bitOffset: 13
            bitWidth: 1
            access: read-write
          SPEED_5G:
            description: 5.0 Gbps supported
            bitOffset: 12
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X16:
            description: Link width x16 is supported
            bitOffset: 11
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X8:
            description: Link width x8 is supported
            bitOffset: 10
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X4:
            description: Link width x4 is supported
            bitOffset: 9
            bitWidth: 1
            access: read-write
          LINK_WIDTH_X2:
            description: Link width x2 is supported
            bitOffset: 8
            bitWidth: 1
            access: read-write
          RESERVED1:
            description: reserved
            bitOffset: 1
            bitWidth: 7
            access: read-write
          PORT_TYPE:
            description: PCIe port type. 0 => Native Endpoint, 1=>Rootport
            bitOffset: 0
            bitWidth: 1
            access: read-write
      PCIE_CFGCTRL:
        description: 'PCIe IP Configuration Control: When the PCIe controller is in Endpoint mode and certain of the PCIe configuration setting?s registers (0x008C - 0x013F) are read/write , the local processor (on the AXI domain) must initialize it at power-up.'
        addressOffset: 0x84
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED27:
            description: Reserved
            bitOffset: 27
            bitWidth: 5
            access: read-write
          VIRTUAL_CH_NUM:
            description: When several virtual channels are implemented, it enables initializing the selected virtual channel?s PCIe configuration setting registers (0x0090 - 0x0097). Otherwise this sub-field is reserved.
            bitOffset: 24
            bitWidth: 3
            access: read-write
          RESERVED19:
            description: Reserved
            bitOffset: 19
            bitWidth: 5
            access: read-write
          FUNCTION_NUM:
            description: When several physical functions are implemented, it enables initializing the selected function?s PCIe configuration setting registers (0x0098 - 0x00BF, 0x00E0 - 0x00FF,0x0120 - 0x013F). Otherwise this sub-field is reserved.
            bitOffset: 16
            bitWidth: 3
            access: read-write
          RESERVED1:
            description: Reserved
            bitOffset: 1
            bitWidth: 15
            access: read-write
          CONF_NOTREADY:
            description: If the local processor need more time to load PCIe configuration settings, it can assert this bit until all physical function configuration settings are properly set. The PCIe Core will reply to all physical function configuration requests with Configuration Retry Status completions while this bit is asserted
            bitOffset: 0
            bitWidth: 1
            access: read-write
      PCIE_PIPE_DW0:
        description: PCIe optional pipeline settings bits [31:0]
        addressOffset: 0x88
        size: 32
        access: read-only
        resetValue: 0x20000000
        fields:
          RESERVED29:
            description: Reserved
            bitOffset: 29
            bitWidth: 3
            access: read-only
          DLLP_INS_TLP_ALEN_DISBALE:
            description: DLLP Insertion with TLP of atypical length is disabled
            bitOffset: 28
            bitWidth: 1
            access: read-only
          RESERVED21:
            description: Reserved
            bitOffset: 21
            bitWidth: 7
            access: read-only
          OS_DET_PIPE:
            description: De-Scrambled Data and 128b/130b OS Detection signals are pipelined
            bitOffset: 20
            bitWidth: 1
            access: read-only
          DC_OFFSET_PIPE:
            description: DC offset calculation is pipelined
            bitOffset: 19
            bitWidth: 1
            access: read-only
          TX_ALIGN_DATA_PIPE:
            description: 'Tx aligned data is pipelined.Note: When this bit is set, the TS1/TS2 DC symbol replacement logic is slightly modified to enable the logic to run at a much higher frequency. In this case, however, it no longer conforms exactly to the PCI Express specifications.'
            bitOffset: 18
            bitWidth: 1
            access: read-only
          PIPE_INPUT:
            description: PIPE input signals are registered
            bitOffset: 17
            bitWidth: 1
            access: read-only
          RESERVED0:
            description: Reserved
            bitOffset: 0
            bitWidth: 17
            access: read-only
      PCIE_PIPE_DW1:
        description: PCIe optional pipeline settings bits [63:32]
        addressOffset: 0x8C
        size: 32
        access: read-only
        resetValue: 0x8000001
        fields:
          RESERVED62:
            description: Reserved
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TLP_PIPE:
            description: TLP Decoding signals are pipelined
            bitOffset: 29
            bitWidth: 1
            access: read-only
          RXLCRC_CHECK_PIPE:
            description: RxLCRC Checking Result is pipelined
            bitOffset: 28
            bitWidth: 1
            access: read-only
          RXLCRC_DWORD2CHECK_PIPE:
            description: RxLCRC DWord to check is pipelined
            bitOffset: 27
            bitWidth: 1
            access: read-only
          RXLCRC_RESULT_PIPE:
            description: RxLCRC Results are pipelined
            bitOffset: 26
            bitWidth: 1
            access: read-only
          SEQ_RXL_DATA_PIPE:
            description: SeqNumber and RxLCRC Data XOR Computation are pipelined
            bitOffset: 25
            bitWidth: 1
            access: read-only
          TLP_DEC_IN_DATA_PIPE:
            description: TLP decoder input data are pipelined
            bitOffset: 24
            bitWidth: 1
            access: read-only
          RESERVED43:
            description: Reserved
            bitOffset: 11
            bitWidth: 13
            access: read-only
          RXLCRC_FC_PIPE:
            description: RxLCRC Field Computation is pipelined (for ECRC only)
            bitOffset: 10
            bitWidth: 1
            access: read-only
          TXLCRC_FG_PIPE:
            description: TxLCRC Field Generation is pipelined
            bitOffset: 9
            bitWidth: 1
            access: read-only
          TXLCRC_DATA_XOR_PIPE:
            description: TxLCRC Data Xor Computation is pipelined
            bitOffset: 8
            bitWidth: 1
            access: read-only
          RESERVED33:
            description: Reserved?? Need to confirm
            bitOffset: 1
            bitWidth: 7
            access: read-only
          DLLP_STATUS_STBUS_PIPE:
            description: DLLP Status StreamBus signals are pipelined
            bitOffset: 0
            bitWidth: 1
            access: read-only
      PCIE_VC_CRED_DW0:
        description: PCIe available Credit Settings (per virtual channel) bits [31:0]. When this register is not hardwired by Core Constants, it is read/write and the local processor must initialize it at power-up.
        addressOffset: 0x90
        size: 32
        access: read-write
        resetValue: 0x1000B818
        fields:
          NP_DATA_CREDITS:
            description: Non-Posted data credits(lower 4 bits)
            bitOffset: 28
            bitWidth: 4
            access: read-write
          NP_HDR_CREDITS:
            description: Non-Posted header credits
            bitOffset: 20
            bitWidth: 8
            access: read-write
          P_DATA_CREDITS:
            description: Posted data credits
            bitOffset: 8
            bitWidth: 12
            access: read-write
