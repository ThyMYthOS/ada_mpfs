        description: DMA control (DMA engine 0) This configuration is set by Libero.
        addressOffset: 0x41C
        size: 32
        access: read-write
        resetValue: 0x3000000
        fields:
          SG2_ID:
            description: If SG_TYPE is set to 2?b00, SG_ID is connected to the Source and SG2_ID is connected to the Destination. Otherwise, SG_ID is connected to the Source and/or Destination, and SG2_ID is irrelevant.Constants, they are read/write and their default value after reset is 'b0. 0x0 0x3 0x4 0x5 0x6 0x7
            bitOffset: 29
            bitWidth: 3
