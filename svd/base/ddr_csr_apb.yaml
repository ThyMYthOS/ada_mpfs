            bitOffset: 0
            bitWidth: 22
            access: read-write
      CFG_NUM_LOGICAL_RANKS_PER_3DS:
        addressOffset: 0x1960
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_NUM_LOGICAL_RANKS_PER_3DS:
            description: Indicates the number of logical ranks for each physical rank of DDR4 3DS devices. 0x0 Not DDR4 3DS devices 0x2 2H Stacked DDR4 devices 0x4 4H Stacked DDR4 devices 0x8 8H Stacked DDR4 devices
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_RFC_DLR1:
        addressOffset: 0x1964
        size: 32
        access: read-write
        resetValue: 0x48
        fields:
          CFG_RFC_DLR1:
            description: SDRAM refresh to activate or refresh command period between different logical ranks when in 1x fine granularity mode (tRFC_dlr1), specified in clocks. Only used for DDR4 3DS configurations.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_RFC_DLR2:
        addressOffset: 0x1968
        size: 32
        access: read-write
        resetValue: 0x2C
        fields:
          CFG_RFC_DLR2:
            description: SDRAM refresh to activate or refresh command period between different logical ranks when in 2x fine granularity mode (tRFC_dlr2), specified in clocks. Only used for DDR4 3DS configurations.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_RFC_DLR4:
        addressOffset: 0x196C
        size: 32
        access: read-write
        resetValue: 0x20
        fields:
          CFG_RFC_DLR4:
            description: SDRAM refresh to activate or refresh command period between different logical ranks when in 4x fine granularity mode (tRFC_dlr4), specified in clocks. Only used for DDR4 3DS configurations.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_RRD_DLR:
        addressOffset: 0x1970
        size: 32
        access: read-write
        resetValue: 0x4
        fields:
          CFG_RRD_DLR:
            description: SDRAM ACTIVATE-to-ACTIVATE command period when activate following another activate is to a different 3DS logical rank (tRRD_dlr), specified in clocks. Only used for DDR4 3DS configurations.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_FAW_DLR:
        addressOffset: 0x1974
        size: 32
        access: read-write
        resetValue: 0x10
        fields:
          CFG_FAW_DLR:
            description: Four bank activate period to different logical ranks (tFAW_dlr), specified in clocks. Only used for DDR4 3DS configurations.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_ADVANCE_ACTIVATE_READY:
        addressOffset: 0x1998
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ADVANCE_ACTIVATE_READY:
            description: Number of DFI clocks to advance the assertion of the l_activate_ready. A value of 0 will cause the assertion of the l_activate_ready to occur on the clock cycle that the controller determines that a bank can be activated. Increasing values of cfg_advance_activate_ready will cause l_activate_ready signals to assert earlier. Deassertion of l_activate_ready will always occur 1 clocks after a request is placed into the queue for that bank, regardless of the cfg_advance_activate_ready setting.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CTRLR_SOFT_RESET_N:
        addressOffset: 0x1C00
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CTRLR_SOFT_RESET_N:
            description: Memory controller soft reset. Controller is in reset when this is set to 0.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_LOOKAHEAD_PCH:
        addressOffset: 0x1C08
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_LOOKAHEAD_PCH:
            description: Look-ahead precharge enable. When enabled the controller will look ahead into the command queue and perform precharge and auto-precharge operations as early as possible in order to maximize command bus efficiency and reduce latency. It is recommended that this feature be disabled by hard connection of the port to '0' if the targeting the controller to FPGA running high internal timing frequencies. 0 - disable 1 - enable
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_LOOKAHEAD_ACT:
        addressOffset: 0x1C0C
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_LOOKAHEAD_ACT:
            description: Look-ahead activate enable. When enabled, the controller will look ahead into the command queue and analyze the queued requests and perform activate operations as soon as possible in order to maximize bandwidth efficiency. It is recommended that this feature be disabled by hard connection of the port to '0' if the targeting the controller to FPGA running high internal timing frequencies. 0 - disable 1 - enable
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_AUTOINIT_DISABLE:
        addressOffset: 0x1C10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_AUTOINIT_DISABLE:
            description: When set to '1', prevents the controller from generating the memory device initialization sequence. The user can then manually generate the initialization sequence using the remaining init_* controls. After the user has completed the initialization sequence, this signal must be set to '0'. This enables the controller to proceed to training and/or normal operation.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_FORCE_RESET:
        addressOffset: 0x1C14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_FORCE_RESET:
            description: Forces assertion of reset control signal (sd_reset_n) going to SDRAM.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_GEARDOWN_EN:
        addressOffset: 0x1C18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_GEARDOWN_EN:
            description: When set, causes controller to use geardown command timing. Only applies to DDR4, and is ignored for all other memory types.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_DISABLE_CKE:
        addressOffset: 0x1C1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_DISABLE_CKE:
            description: Forces de-assertion of clock enable signal going to SDRAM.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CS:
        addressOffset: 0x1C20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CS:
            description: Rank selection for mode register programming requests (using init_mr*), precharge-all requests (using init_precharge_all), refresh (using init_refresh), and ZQ calibration requests (using init_zq_cal_req)
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_PRECHARGE_ALL:
        addressOffset: 0x1C24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_PRECHARGE_ALL:
            description: Issue Precharge-all command to memory devices on the ranks selected by init_cs.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_REFRESH:
        addressOffset: 0x1C28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_REFRESH:
            description: Issue Refresh command to memory devices on the ranks selected by init_cs. It is illegal to assert init_refresh when cfg_auto_ref_en is asserted and init_autoinit_disable is deasserted.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_ZQ_CAL_REQ:
        addressOffset: 0x1C2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_ZQ_CAL_REQ:
            description: User-initiated ZQ calibration request. Causes ZQ calibration to be issued at the next opportunity to the ranks specified by init_cs. The ZQ calibration will be issued to the ranks corresponding to the asserted bits. The function of this signal is similar to 'l_zq_cal_req'. The port is included here for purposes of user control during initialization (perhaps under software control), whereas 'l_zq_cal_req' is intended to be used after initialization by high-speed synchronous user logic. For those memory types that support it (such as DDR4) the type of ZQ calibration that is performed when this signal is asserted (ZQCL or ZQCS) is determined by 'cfg_zq_cal_type'. It is illegal to assert init_zq_cal_req when cfg_auto_zq_cal_en is asserted and init_autoinit_disable is deasserted.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_ACK:
        addressOffset: 0x1C30
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_ACK:
            description: Acknowledge for init_refresh, init_precharge_all, init_mr_w_req, init_zq_cal_req, init_zq_cal_start (LPDDR4) and init_nop. Cleared on read.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_BL:
        addressOffset: 0x1C34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BL:
            description: 'SDRAM maximum burst length (encoded). For "full-rate" configurations of the controller operating in DDR2, LPDDR2, LPDDR3 and HBM modes, values are decoded as follows: cfg_bl = 0x0 - 1 local side transfers / burst (2 DDR transfers) cfg_bl = 0x1 - 2 local side transfers / burst (4 DDR transfers) cfg_bl = 0x2 - 4 local side transfers / burst (8 DDR transfers) cfg_bl = 0x3 - 8 local side transfers / burst (16 DDR transfers) For "half-rate" configurations of the controller operating in DDR2, LPDDR2, LPDDR3 and HBM modes, values are decoded as follows: cfg_bl = 0x0 - Invalid cfg_bl = 0x1 - 1 local side transfer / burst (4 DDR transfers) cfg_bl = 0x2 - 2 local side transfers / burst (8 DDR transfers) cfg_bl = 0x3 - 4 local side transfers / burst (16 DDR transfers) For "quarter-rate" configurations of the controller operating in DDR2, LPDDR2, and LPDDR3, values are decoded as follows: cfg_bl = 0x0 - Invalid cfg_bl = 0x1 - Invalid cfg_bl = 0x2 - 2 local side transfers / burst (8 DDR transfers) cfg_bl = 0x3 - 4 local side transfers / burst (16 DDR transfers) For LPDDR2 memory types, only settings of 0x1 and 0x2 are allowed. For DDR2 memory type, only settings of 0x1 and 0x2 are allowed. For LPDDR3 memory type, only setting of 0x2 is allowed. For HBM memory type, only setting of 0x1 is allowed when operating in the half-rate configuration or when using an HBM Pseudo channel device. Settings of 0x0 and 0x1 are allowed when operating at full-rate with an HBM legacy device.'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CTRLR_INIT:
        addressOffset: 0x1C38
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CTRLR_INIT:
            description: 'Causes the SDRAM Controller Core to re-issue the initialization sequence to SDRAM devices. The initialization will begin when a 0-1 transition is detected on this signal. Note: The SDRAM Controller Core will always issue the initialization sequence (including the startup delay) after reset regardless of the ''ctrlr_init'' state. This signal can be tied low if run-time re-initialization is not required.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CTRLR_INIT_DONE:
        addressOffset: 0x1C3C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CTRLR_INIT_DONE:
            description: Deasserted when in reset or after ctrlr_init is asserted, then asserts when initialization sequence has completed. If manual initialization is performed (init_autoinit_disable asserted at startup), this signal will not assert until init_autoinit_disable is deasserted by the user, indicating that the manual initialization sequence has completed.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      CFG_AUTO_REF_EN:
        addressOffset: 0x1C40
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_AUTO_REF_EN:
            description: Enables controller initiated refresh cycles at a periodic rate determined by 'cfg_ref_per'. When this is set to '0', the user logic must take control of refresh by using special addressing techniques or by using the 'l_ref_req' input to manually generate refresh cycles. Controller will postpone a refresh if the memory bus is busy at the end of a 'cfg_ref_per' and will initiate the refresh when the memory bus is available. Up to 8 refresh requests can be postponed. If the 'cfg_auto_ref_en' is disabled, any postponed refresh requests will be cleared.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RAS:
        addressOffset: 0x1C44
        size: 32
        access: read-write
        resetValue: 0x1C
        fields:
          CFG_RAS:
            description: SDRAM active to precharge (tRAS), specified in clocks.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_RCD:
        addressOffset: 0x1C48
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          CFG_RCD:
            description: SDRAM active to read or write delay (tRCD), specified in memory clocks. For HBM2 and GDDR6 memory see cfg_rcd_rd, cfg_rcd_wr.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_RRD:
        addressOffset: 0x1C4C
        size: 32
        access: read-write
        resetValue: 0x5
        fields:
          CFG_RRD:
            description: SDRAM active bank A to active bank B (tRRD), specified in clocks. 'cfg_rp' must be greater than or equal to 'cfg_rrd'.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_RP:
        addressOffset: 0x1C50
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          CFG_RP:
            description: SDRAM precharge command period (tRP), specified in clocks. 'cfg_rp' must be greater than or equal to 'cfg_rrd'.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_RC:
        addressOffset: 0x1C54
        size: 32
        access: read-write
        resetValue: 0x27
        fields:
          CFG_RC:
            description: SDRAM active to active / refresh command period (tRC), specified in clocks.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_FAW:
        addressOffset: 0x1C58
        size: 32
        access: read-write
        resetValue: 0x18
        fields:
          CFG_FAW:
            description: Four bank activate period (tFAW), specified in clocks
            bitOffset: 0
            bitWidth: 9
            access: read-write
      CFG_RFC:
        addressOffset: 0x1C5C
        size: 32
        access: read-write
        resetValue: 0x118
        fields:
          CFG_RFC:
            description: SDRAM refresh to active / refresh command period (tRFC) specified in clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_RTP:
        addressOffset: 0x1C60
        size: 32
        access: read-write
        resetValue: 0x6
        fields:
          CFG_RTP:
            description: SDRAM read to precharge delay (tRTP), specified in clocks
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_WR:
        addressOffset: 0x1C64
        size: 32
        access: read-write
        resetValue: 0xC
        fields:
          CFG_WR:
            description: SDRAM write recovery time (tWR), specified in clocks. If the calculated value is not available then the next higher value should be chosen.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_WTR:
        addressOffset: 0x1C68
        size: 32
        access: read-write
        resetValue: 0x6
        fields:
          CFG_WTR:
            description: SDRAM write to read command delay (tWTR), specified in clocks.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_PASR:
        addressOffset: 0x1C70
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PASR:
            description: Partial-Array Self Refresh (PASR) setting that written into PASR field of mode register during initialization.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_XP:
        addressOffset: 0x1C74
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_XP:
            description: SDRAM exit power-down mode to first valid command (tXP), specified in clocks.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_XSR:
        addressOffset: 0x1C78
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_XSR:
            description: SDRAM exit SELF REFRESH to next valid command delay (tXSR), specified in clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_CL:
        addressOffset: 0x1C80
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          CFG_CL:
            description: SDRAM CAS read latency, specified in clocks. Refer to SDRAM datasheet for list of supported values.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_READ_TO_WRITE:
        addressOffset: 0x1C88
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_READ_TO_WRITE:
            description: Delay between the end of a read DQS postamble to the start of a write preamble, specified in memory clocks. The controller will delay issuing any write command immediately following a read command to achieve the turnaround time specified by this port. If 2 clock write preamble is being used, this value is specified relative to the middle of the 2 clock preamble.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_WRITE_TO_WRITE:
        addressOffset: 0x1C8C
        size: 32
        access: read-write
        resetValue: 0x3
        fields:
          CFG_WRITE_TO_WRITE:
            description: Delay between back-to-back writes which address different ranks of memory, specified in memory clocks. Specifically, this value is the minimum number of clocks between the end of the last data phase on the DQ bus of a write to one rank to the beginning of the first data phase on the DQ bus of a write to another rank. If SDRAM ODT is not used, this can be set to 0 since bus turnaround is not required between back-to-back writes which are switching ranks.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_READ_TO_READ:
        addressOffset: 0x1C90
        size: 32
        access: read-write
        resetValue: 0x3
        fields:
          CFG_READ_TO_READ:
            description: Bus turnaround delay between back-to-back reads which address different ranks of memory. Specifically, this value is the minimum number of memory clocks between the end of the last data phase on the DQ bus of a read to one rank to the beginning of the first data phase on the DQ bus of a read to another rank. A minimum value of 1 is required or else the DQS preamble of a read to a new rank will contend with the DQS postamble of the read from the previous rank.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_WRITE_TO_READ:
        addressOffset: 0x1C94
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_WRITE_TO_READ:
            description: For DDR2, DDR3, DDR4, LPDDR2, LPDDR3, LPDDR4 and HBM memory types, this is the delay between the end of a write DQS postamble to the start of a read preamble when the read and write commands are to different ranks. If 2 clock read preamble is being used (for memory types that support it) this value is specified relative to the middle of the 2 clock preamble. Value is specified in memory clocks. The controller will delay issuing any read command immediately following a write command to achieve the turnaround time specified by this port. When a read follows a write and the read and write commands are to the same rank, the turnaround is specified by cfg_wtr.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_READ_TO_WRITE_ODT:
        addressOffset: 0x1C98
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_READ_TO_WRITE_ODT:
            description: Delay between the end of a read DQS postamble to the start of a write preamble, specified in memory clocks, when the ODT signals need to change as dictated by the settings of cfg_odt_wr_map_csN and cfg_odt_rd_map_csN. The controller will delay issuing any write command immediately following a read command to achieve the turnaround time specified by this port. If 2 clock write preamble is being used, this value is specified relative to the middle of the 2 clock preamble.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_WRITE_TO_WRITE_ODT:
        addressOffset: 0x1C9C
        size: 32
        access: read-write
        resetValue: 0x3
        fields:
          CFG_WRITE_TO_WRITE_ODT:
            description: Delay between back-to-back writes which address different ranks of memory, specified in memory clocks, when the ODT signals need to change as dictated by the settings of cfg_odt_wr_map_csN. Specifically, this value is the minimum number of clocks between the end of the last data phase on the DQ bus of a write to one rank to the beginning of the first data phase on the DQ bus of a write to another rank, where the write ODT settings are different between the two ranks. If SDRAM ODT is not used, this can be set to 0 since bus turnaround is not required between back-to-back writes which are switching ranks. Larger values are required to allow ODT to be properly established (as specified by the cfg_odt_wr_map_csN termination matrix) before the write to the new rank begins.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_READ_TO_READ_ODT:
        addressOffset: 0x1CA0
        size: 32
        access: read-write
        resetValue: 0x3
        fields:
          CFG_READ_TO_READ_ODT:
            description: Bus turnaround delay between back-to-back reads which address different ranks of memory, when the ODT signals need to change as dictated by the settings of cfg_odt_rd_map_csN. Specifically, this value is the minimum number of memory clocks between the end of the last data phase on the DQ bus of a read to one rank to the beginning of the first data phase on the DQ bus of a read to another rank, where the read ODT settings are different between the two ranks. A minimum value of 1 is required or else the DQS preamble of a read to a new rank will contend with the DQS postamble of the read from the previous rank. Larger values are desired when SDRAM ODT is used to allow ODT to be properly established (as specified by the cfg_odt_rd_map_csN termination matrix) before the read to the new rank begins.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_WRITE_TO_READ_ODT:
        addressOffset: 0x1CA4
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_WRITE_TO_READ_ODT:
            description: Delay between the end of a write DQS postamble to the start of a read preamble when the read and write commands are to different ranks and the ODT signals need to change as dictated by the settings of cfg_odt_wr_map_csN and cfg_odt_rd_map_csN. Value is specified in memory clocks. The controller will delay issuing any read command immediately following a write command to achieve the turnaround time specified by this port. When a read follows a write and the read and write commands are to the same rank, the turnaround is specified by cfg_wtr. If 2 clock read preamble is being used, this value is specified relative to the middle of the 2 clock preamble.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_MIN_READ_IDLE:
        addressOffset: 0x1CA8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MIN_READ_IDLE:
            description: Minimum number of clocks of idle time on the bus between non-consecutive read commands. If any two reads are not back-to-back, this is the minimum idle time (in clocks) on the data bus between the reads. Values of 0 and 1 cause no minimum bus idle time between non-consecutive reads to be enforced. There is no difference in behavior between the 0 and 1 settings. This setting is useful for interfacing with physical interfaces which require bus idle time to reset in between reads.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_MRD:
        addressOffset: 0x1CAC
        size: 32
        access: read-write
        resetValue: 0xC
        fields:
          CFG_MRD:
            description: SDRAM load mode register command to active or refresh command (tMRD), specified in clocks.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_BT:
        addressOffset: 0x1CB0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BT:
            description: SDRAM burst type written into "read burst type" field of mode register during initialization sequence. 0 - sequential (typical) 1 - interleaved
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_DS:
        addressOffset: 0x1CB4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DS:
            description: Output driver strength setting programmed into "Output Driver Impedance Control", "Pull-down Drive Strength" or "Driver Strength" field of mode register during initialization sequence. Refer to SDRAM datasheet for mapping to impedance values. Bits 2 and 3 are ignored for DDR4 and GDDR6 devices. Bit 3 ignored for LPDDR4 devices.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_QOFF:
        addressOffset: 0x1CB8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_QOFF:
            description: SDRAM output enable function. This signal is written to output buffer mode (Qoff) mode register bit during initialization. Typically set to '0' to enable data and strobe outputs from the SDRAM devices. Can be set to '1' for IDD characterization of read current.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RTT:
        addressOffset: 0x1CC4
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_RTT:
            description: ODT effective resistance Rtt. On-Die Termination effective resistance setting programmed into "RTT_NOM" field of mode register during initialization sequence. Refer to SDRAM device datasheet for the mapping to impedance values.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_DLL_DISABLE:
        addressOffset: 0x1CC8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DLL_DISABLE:
            description: Memory device DLL disable. Controls programming of "DLL Enable" field of mode register during initialization sequence. 0 - enable DLL 1 - disable DLL
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_REF_PER:
        addressOffset: 0x1CCC
        size: 32
        access: read-write
        resetValue: 0x1860
        fields:
          CFG_REF_PER:
            description: 'Period between refresh commands issued by the controller, specified in clocks. This value is calculated as: cfg_ref_per = required refresh time interval / tCK If cfg_only_srank_cmds is set to 1 and cfg_quad_rank is set to 0, then the internal refresh interval calculated by the controller will be cfg_ref_per divided by the number of ranks in the system (cfg_num_ranks) since each refresh event will only be refreshing one rank. In this case the internal refresh interval is calculated as: refresh interval = cfg_ref_per / cfg_num_ranks With cfg_only_srank_cmds set to 1 and cfg_quad_rank set to 0, the controller supports cfg_num_ranks settings of 1, 2, 3, 4, 6, 8, or 16. If cfg_only_srank_cmds is set to 1 and cfg_quad_rank is set to 1, then the internal refresh interval calculated by the controller will be cfg_ref_per divided by one-half the number of ranks in the system (cfg_num_ranks) since each refresh event will refresh two ranks (due to cfg_quad_rank). In this case the internal refresh interval is calculated as: refresh interval = cfg_ref_per / ( cfg_num_ranks / 2 ) With cfg_only_srank_cmds set to 1 and cfg_quad_rank set to 1, the controller supports cfg_num_ranks settings of 4, 8, or 16.'
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CFG_STARTUP_DELAY:
        addressOffset: 0x1CD0
        size: 32
        access: read-write
        resetValue: 0x27100
        fields:
          CFG_STARTUP_DELAY:
            description: 'Delay after a reset event that the controller waits before initializing the SDRAM, specified in clocks. The NWL controller supports 4 initialization modes: (1) Phy does all of the DRAM initialization (cfg_startup_delay is a don''t care and cfg_ctrlr_init_disable is set to 1) and the NWL controller just waits for dfi_init_complete/dfi_training_complete to be asserted before beginning normal operation (generating refresh requests, etc.) (2) Software does all of the DRAM initialization (cfg_startup delay is a don''t care and init_autoinit_disable is set to 1) and the NWL controller just waits for dfi_init_complete/dfi_training_complete to be asserted before beginning normal operation (generating refresh requests, etc.) (3) NWL controller does all of the DRAM initialization (cfg_startup_delay != 0 and phy/software initialization modes are not defined) and then waits for dfi_init_complete/dfi_training_complete to be asserted before beginning normal operation (generating refresh requests, etc.) (4) The phy does all of the early CKE/memory reset initialization of the memory (cfg_startup_delay = 0 and phy/software initialization modes are not defined) and the NWL controller waits for dfi_init_complete/dfi_training_complete to be asserted before sequencing out the final mode registers settings and beginning normal operation (generating refresh requests, etc.)'
            bitOffset: 0
            bitWidth: 19
            access: read-write
      CFG_MEM_COLBITS:
        addressOffset: 0x1CD4
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          CFG_MEM_COLBITS:
            description: Number of bits in the column address.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_MEM_ROWBITS:
        addressOffset: 0x1CD8
        size: 32
        access: read-write
        resetValue: 0x10
        fields:
          CFG_MEM_ROWBITS:
            description: Number of bits in the row address.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_MEM_BANKBITS:
        addressOffset: 0x1CDC
        size: 32
        access: read-write
        resetValue: 0x3
        fields:
          CFG_MEM_BANKBITS:
            description: Number of bits in the bank address (including DDR4/HBM bank group bits). For HBM pseudo channel memory, the pseudo channel select bit (BA4 in the JEDEC specification) does not count as a bank bit. If using an 8HI stack, the SID address bit counts as another bank group bit. Thus when using an HBM 8HI stack the cfg_mem_bankbits should be set to 5 (= 4 + 1) .
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_ODT_RD_MAP_CS0:
        addressOffset: 0x1CE0
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_ODT_RD_MAP_CS0:
            description: ODT selection matrix for reads. Selects which ODT outputs are enabled when reading from each chip select. For example, if cfg_odt_rd_cs0 is set to '00001100', then sd_odt[2] and sd_odt[3] will be asserted during a read from memory devices on chip select 0. If the controller is configured to support 8 ranks, the width of each port will be 8 bits and cfg_odt_rd_map_cs8 through cfg_odt_rd_map_cs15 will be unused. If the controller is configured to support 16 ranks, the width of each port will be 16 bits.
            bitOffset: 0
