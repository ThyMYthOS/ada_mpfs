_add:
  DDR_CSR_APB:
    description: DDR_CSR_APB Controller
    baseAddress: 0x20082400
    registers:
      CFG_MANUAL_ADDRESS_MAP:
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MANUAL_ADDRESS_MAP:
            description: Enables user selection of address mapping 0 - Default address mapping. Address mapping from l_addr based on settings of cfg_mem_rowbits, cfg_mem_colbits, as described in the SDRAM Controller User Guide. 1 - User selected address mapping. Address mapping from l_addr based on settings of cfg_chipaddr_map, cfg_rowaddr_map, cfg_bankaddr_map, cfg_coladdr_map, and cfg_cidaddr_map (DDR4 3DS)
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CHIPADDR_MAP:
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CHIPADDR_MAP:
            description: Four 6-bit quantities specifying how to map address bits from l_addr into the rank (chip select bits, sd_cs_n). bits 0-5 - Specify which bit of l_addr maps to chip address bit 0 bits 6-11 - Specifies which bit of l_addr maps to chip address bit 1 bits 12-17 - Specifies which bit of l_addr maps to chip address bit 2 bits 18-23 - Specifies which bit of l_addr maps to chip address bit 3
            bitOffset: 0
            bitWidth: 24
            access: read-write
      CFG_CIDADDR_MAP:
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CIDADDR_MAP:
            description: Three 6-bit quantities specifying how to map address bits from l_addr into 3DS chip ID bits (sd_cid[2:0]). bits 0-5 - Specify which bit of l_addr maps to chip ID bit 0 bits 6-11 - Specifies which bit of l_addr maps to chip ID bit 1 bits 12-17 - Specifies which bit of l_addr maps to chip ID bit 2
            bitOffset: 0
            bitWidth: 18
            access: read-write
      CFG_MB_AUTOPCH_COL_BIT_POS_LOW:
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x4
        fields:
          CFG_MB_AUTOPCH_COL_BIT_POS_LOW:
            description: 'This field together with the cfg_mb_autopch_col_bit_pos_high field set a contiguous column address region that allows customization of when auto precharge occurs within multiburst accesses. cfg_mb_autopch_col_bit_pos_low sets the low bit position of l_addr and cfg_mb_autopch_col_bit_pos_high sets the high bit position of l_addr bits that are used to define the last column address in an open bank. When the multiburst internal l_addr bits in the l_addr range defined by these two configuration fields are all one, an auto_precharge will be issued by the multiburst module internally for the sub-access. This field is unused if cfg_manual_address_map is set to 0. Setting this field to 0 disables this auto-precharge functionality. When it is used, the only valid values are a function of the memory technology being used as follows: DDR3 - 3 or 4. (3 is normal default) DDR4 - 3 or 4. (4 is normal default) HBM - 2,3,or 4 (4 is normal default)'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_MB_AUTOPCH_COL_BIT_POS_HIGH:
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0xA
        fields:
          CFG_MB_AUTOPCH_COL_BIT_POS_HIGH:
            description: 'This field together with the cfg_mb_autopch_col_bit_pos_low field set a contiguous column address region that allows customization of when auto precharge occurs within multiburst accesses. cfg_mb_autopch_col_bit_pos_low sets the low bit position of l_addr and cfg_mb_autopch_col_bit_pos_high sets the high bit position of l_addr bits that are used to define the last column address in an open bank. When the multiburst internal l_addr bits in the l_addr range defined by these two configuration fields are all one, an auto_precharge will be issued by the multiburst module internally for the sub-access. This field is unused if if cfg_manual_address_map is set to 0. When it is used, the only valid values are a function of the memory technology being used as follows: DDR3 - cfg_mem_colbits-1 to 4. (cfg_mem_colbits-1 is the normal default) DDR4 - 10 to 4. (10 is the normal default) HBM - 8 to 4. (8 is the normal default)'
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_BANKADDR_MAP_0:
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BANKADDR_MAP_0:
            description: Six 6-bit quantities specifying how to map address bits from l_addr into bank bits (sd_ba). bits 0-5 - Specify which bit of l_addr maps to bank address bit 0 (sd_ba[0]) bits 6-11 - Specifies which bit of l_addr maps to bank address bit 1 (sd_ba[1]) bits 12-17 - Specifies which bit of l_addr maps to bank address bit 2/group bit 0 (sd_ba[2], for HBM pseudo channel memory this is also the pseudo channel select bit) bits 18-23 - Specifies which bit of l_addr maps to bank address bit 3/group bit 1 (sd_ba[3]) bits 24-29 - Specifies which bit of l_addr maps to bank address bit 4/group bit 2 (sd_ba[4]) bits 30-35 - Specifies which bit of l_addr maps to bank address bit 5/group bit 3 (sd_ba[5], for HBM pseudo channel memory this is also the SID bank selection bit)
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_BANKADDR_MAP_1:
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BANKADDR_MAP_1:
            description: Six 6-bit quantities specifying how to map address bits from l_addr into bank bits (sd_ba). bits 0-5 - Specify which bit of l_addr maps to bank address bit 0 (sd_ba[0]) bits 6-11 - Specifies which bit of l_addr maps to bank address bit 1 (sd_ba[1]) bits 12-17 - Specifies which bit of l_addr maps to bank address bit 2/group bit 0 (sd_ba[2], for HBM pseudo channel memory this is also the pseudo channel select bit) bits 18-23 - Specifies which bit of l_addr maps to bank address bit 3/group bit 1 (sd_ba[3]) bits 24-29 - Specifies which bit of l_addr maps to bank address bit 4/group bit 2 (sd_ba[4]) bits 30-35 - Specifies which bit of l_addr maps to bank address bit 5/group bit 3 (sd_ba[5], for HBM pseudo channel memory this is also the SID bank selection bit)
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_ROWADDR_MAP_0:
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ROWADDR_MAP_0:
            description: 'Eighteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during activate command). bits 0-5 - Specify which bit of l_addr maps to row address bit 0 bits 6-11 - Specifies which bit of l_addr maps to row address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to row address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 9 rowaddr bit selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_ROWADDR_MAP_1:
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ROWADDR_MAP_1:
            description: 'Eighteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during activate command). bits 0-5 - Specify which bit of l_addr maps to row address bit 0 bits 6-11 - Specifies which bit of l_addr maps to row address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to row address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 9 rowaddr bit selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_ROWADDR_MAP_2:
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ROWADDR_MAP_2:
            description: 'Eighteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during activate command). bits 0-5 - Specify which bit of l_addr maps to row address bit 0 bits 6-11 - Specifies which bit of l_addr maps to row address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to row address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 9 rowaddr bit selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_ROWADDR_MAP_3:
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ROWADDR_MAP_3:
            description: 'Eighteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during activate command). bits 0-5 - Specify which bit of l_addr maps to row address bit 0 bits 6-11 - Specifies which bit of l_addr maps to row address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to row address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 9 rowaddr bit selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_COLADDR_MAP_0:
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_COLADDR_MAP_0:
            description: 'Sixteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during read/write commands). bits 0-5 - Specify which bit of l_addr maps to column address bit 0 bits 6-11 - Specifies which bit of l_addr maps to column address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to column address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 3 coladdr selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_COLADDR_MAP_1:
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_COLADDR_MAP_1:
            description: 'Sixteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during read/write commands). bits 0-5 - Specify which bit of l_addr maps to column address bit 0 bits 6-11 - Specifies which bit of l_addr maps to column address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to column address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 3 coladdr selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_COLADDR_MAP_2:
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_COLADDR_MAP_2:
            description: 'Sixteen 6-bit quantities specifying how to map address bits from l_addr into row bits (sd_a, during read/write commands). bits 0-5 - Specify which bit of l_addr maps to column address bit 0 bits 6-11 - Specifies which bit of l_addr maps to column address bit 1 ... bits 6*x-6*x+5 - Specifies which bit of l_addr maps to column address bit x Note: When 6''d00 is used, it means a hard-coded zero (not l_addr[0]) except in the case where zero is used in the lower 3 coladdr selections, in which case it refers to l_addr[0].'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_VRCG_ENABLE:
        addressOffset: 0x400
        size: 32
        access: read-write
        resetValue: 0x140
        fields:
          CFG_VRCG_ENABLE:
            description: LPDDR4 Vref high current mode enable time tVRCG_ENABLE, expressed in terms of memory clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_VRCG_DISABLE:
        addressOffset: 0x404
        size: 32
        access: read-write
        resetValue: 0xA0
        fields:
          CFG_VRCG_DISABLE:
            description: LPDDR4 Vref high current mode disable time tVRCG_DISABLE, expressed in terms of memory clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_WRITE_LATENCY_SET:
        addressOffset: 0x408
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WRITE_LATENCY_SET:
            description: LPDDR4 Write Latency Set A/B selection (MR2[6]).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_THERMAL_OFFSET:
        addressOffset: 0x40C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_THERMAL_OFFSET:
            description: LPDDR4 Thermal Offset (MR4[6:5]).
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_SOC_ODT:
        addressOffset: 0x410
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_SOC_ODT:
            description: LPDDR4 SOC ODT (MR22[2:0])
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_ODTE_CK:
        addressOffset: 0x414
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ODTE_CK:
            description: LPDDR4 ODTE-CK (MR22[3])
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ODTE_CS:
        addressOffset: 0x418
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ODTE_CS:
            description: LPDDR4 ODTE-CS (MR22[4])
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ODTD_CA:
        addressOffset: 0x41C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ODTD_CA:
            description: LPDDR4 ODTD-CA (MR22[5])
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_LPDDR4_FSP_OP:
        addressOffset: 0x420
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_LPDDR4_FSP_OP:
            description: User-selection for the operating frequency setpoint following LPDDR4 DRAM initialization. This value is written to MR13[7] at the end of the automatic initialization sequence. This value should typically be set to 0 to allow the PHY to perform Command Bus Training (CBT) prior to switching to the faster FSP.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_GENERATE_REFRESH_ON_SRX:
        addressOffset: 0x424
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_GENERATE_REFRESH_ON_SRX:
            description: When exiting self-refresh the controller will wait for a refresh to occur before allowing normal memory requests to resume. The controller can either generate the refresh request immediately or it can wait for the refresh timer to generate the refresh request naturally. In typical systems the controller should be programmed to generate the refresh immediately (cfg_generate_refresh_on_srx=1) for low latency following self-refresh exit. In some dual-controller systems it is advantageous to maintain synchronization in refresh requests and the cfg_generate_refresh_on_srx should be disabled (cfg_generate_refresh_on_srx=0) to allow the synchronized refresh timers to maintain refresh request synchronization.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_DBI_CL:
        addressOffset: 0x428
        size: 32
        access: read-write
        resetValue: 0x16
        fields:
          CFG_DBI_CL:
            description: DDR4 SDRAM DBI CAS read latency, specified in clocks. Refer to SDRAM datasheet for list of supported values.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_NON_DBI_CL:
        addressOffset: 0x42C
        size: 32
        access: read-write
        resetValue: 0x16
        fields:
          CFG_NON_DBI_CL:
            description: DDR4 SDRAM non-DBI CAS read latency, specified in clocks. Refer to SDRAM datasheet for list of supported values.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      INIT_FORCE_WRITE_DATA_0:
        addressOffset: 0x430
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_FORCE_WRITE_DATA_0:
            description: Data driven to memory device nibble lanes when init_force_write is asserted and a regular write is not being driven. Each bit corresponds to one nibble of the memory interface and drives all 4 bits of the corresponding nibble. Bit 0 - driven to DQ nibble [3:0] Bit 1 - driven to DQ nibble [7:4] ... Bit n-1 - driven to DQ nibble [n*4+3:n*4]
            bitOffset: 0
            bitWidth: 9
            access: read-write
      CFG_WRITE_CRC:
        addressOffset: 0x1800
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WRITE_CRC:
            description: Enables DDR4 write CRC mode, where controller automatically generates CRC in transfer 8 for x8 and x16 devices. The CRC is transmitted in transfers 8 and 9 in x4 devices.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_MPR_READ_FORMAT:
        addressOffset: 0x1804
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MPR_READ_FORMAT:
            description: 'Defines read format during DDR4 MPR reads: 0 - Serial 1 - Parallel (only valid for Page 0 MPR reads) 2 - Staggered (only valid for Page 0 MPR reads)'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_WR_CMD_LAT_CRC_DM:
        addressOffset: 0x1808
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WR_CMD_LAT_CRC_DM:
            description: DDR4 extra write command latency when CRC and DM are both enabled. This value is programmed into MR3(10:9). Memory devices use this value to determine the write recovery time required after write with auto-precharge command is issued. 0 - 4 clocks (1600 speed bin) 1 - 5 clocks (1866, 2133, 2400 speed bins) 2 - 6 clocks (TBD speed bin) 3 - RFU
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_FINE_GRAN_REF_MODE:
        addressOffset: 0x180C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_FINE_GRAN_REF_MODE:
            description: 'DDR4 fine granularity refresh mode: 0 - Normal (fixed 1x) 1 - Fixed 2x 2 - Fixed 4x 3 - Reserved 4 - Reserved 5 - On the fly 2x (not supported) 6 - On the fly 4x (not supported) 7 - Reserved When using either Fixed 2x or Fixed 4x fine granularity refresh mode, the refresh period specified by cfg_ref_per is divided internally by 2 or 4, respectively, to produce REFRESH commands at the proper interval.'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_TEMP_SENSOR_READOUT:
        addressOffset: 0x1810
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TEMP_SENSOR_READOUT:
            description: Enables DDR4 device temperature sensor
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_PER_DRAM_ADDR_EN:
        addressOffset: 0x1814
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PER_DRAM_ADDR_EN:
            description: Maps to bit 4 of Mode Register 3 during mode register programming. Must be set to 0 for automatic initialization ('init_autoinit_disable' = 0). Typically set to 0 for manual initialization also ('init_autoinit_disable' = 1), even when per-DRAM addressability mode is used. To enable per-DRAM addressability the mode register should be programmed directly using the 'init_mr_*' signaling. This process is described in Section 9.15 of the DDR4 SDRAM Controller User Guide.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_GEARDOWN_MODE:
        addressOffset: 0x1818
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_GEARDOWN_MODE:
            description: 'DDR4 geardown mode select: 0 - rate geardown mode 1 - rate geardown mode. Controller will switch to rate geardown mode during initialization sequence.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_WR_PREAMBLE:
        addressOffset: 0x181C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WR_PREAMBLE:
            description: 'Write preamble select: 0 - 1 clock write preamble 1 - 2 clock write preamble Note that it may also be necessary to program the PHY for the desired write preamble mode.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RD_PREAMBLE:
        addressOffset: 0x1820
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RD_PREAMBLE:
            description: 'DDR4 read preamble select: 0 - 1 clock read preamble 1 - 2 clock read preamble'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RD_PREAMB_TRN_MODE:
        addressOffset: 0x1824
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RD_PREAMB_TRN_MODE:
            description: DDR4 read preamble training mode. Must be set to 0 for automatic initialization ('init_autoinit_disable' = 0).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_SR_ABORT:
        addressOffset: 0x1828
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_SR_ABORT:
            description: 'Self refresh abort mode select, setting the appropriate mode register bit: 0 - Disable self-refresh abort mode 1 - Enable self-refresh abort mode Note: The controller does not perform operations any sooner after self-refresh exit when self-refresh abort mode is enabled.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CS_TO_CMDADDR_LATENCY:
        addressOffset: 0x182C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CS_TO_CMDADDR_LATENCY:
            description: 'DDR4 command/address latency mode setting: 0 - Disable command/address latency mode 1 - 3 clock command address latency 2 - 4 clock command address latency 3 - 5 clock command address latency 4 - 6 clock command address latency 5 - 8 clock command address latency 6 - Reserved 7 - Reserved Note: DDR4 command/address latency must be disabled in RDIMM/LRDIMM applications, as the RCD does not support this mode.'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_INT_VREF_MON:
        addressOffset: 0x1830
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_INT_VREF_MON:
            description: 'DDR4 internal Vref monitor: 0 - Disable Vref monitor 1 - Enable Vref monitor'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_TEMP_CTRL_REF_MODE:
        addressOffset: 0x1834
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TEMP_CTRL_REF_MODE:
            description: 'Used to control refresh for DDR4 and self-refresh for HBM. For DDR4 temperature controlled refresh mode: 0 - Disable temperature controlled refresh mode 1 - Enable temperature controlled refresh mode For HBM temperature controlled self-refresh mode: 0 - Disable temperature compensated self-refresh mode 1 - Enable temperature compensated self-refresh mode This bit is loaded into bit 2 (TCSR) of Mode register 0.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_TEMP_CTRL_REF_RANGE:
        addressOffset: 0x1838
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TEMP_CTRL_REF_RANGE:
            description: 'DDR4 temperature controlled refresh range. Only used when ''cfg_temp_ctrl_ref_mode'' is set to 1: 0 - Normal temperature mode. Below 45 degrees Celsius, DDR4 SDRAM may adjust internal refresh period to be longer than tREFI of the normal temperature range by skipping external refresh commands 1 - Extended temperature mode. In this mode it is expected that the cfg_ref_period is set for the extended temperature range tREFI. In the normal temperature range (0C - 85C), the DDR4 SDRAM adjusts its internal refresh period to tREFI of the normal temperature range. Below 45C, the DDR4 SDRAM may further adjust internal refresh period to be longer than tREFI of the normal temperature range.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_MAX_PWR_DOWN_MODE:
        addressOffset: 0x183C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MAX_PWR_DOWN_MODE:
            description: Enables DDR4 maximum power savings mode. Must be set to 0 for automatic initialization ('init_autoinit_disable' = 0).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_READ_DBI:
        addressOffset: 0x1840
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_READ_DBI:
            description: 'Read data bus inversion (DBI): 0 - Read DBI disabled 1 - Read DBI enabled'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_WRITE_DBI:
        addressOffset: 0x1844
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WRITE_DBI:
            description: 'Write data bus inversion (DBI): 0 - Write DBI disabled 1 - Write DBI enabled'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_DATA_MASK:
        addressOffset: 0x1848
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_DATA_MASK:
            description: 'Write data mask: 0 - Write data mask disabled 1 - Write data mask enabled For GDDR6 this enables the use of the write-with-single-byte-mask (WSM/A) and write-with-double-byte-mask (WDM/A) commands.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CA_PARITY_PERSIST_ERR:
        addressOffset: 0x184C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CA_PARITY_PERSIST_ERR:
            description: Persistent parity error mode. 0 - DRAM stops checking command/address parity until Parity Error Status bit is cleared 1 - DRAM resumes checking command/address parity after the alert_n is deasserted, even if Parity Error Status bit remains high
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RTT_PARK:
        addressOffset: 0x1850
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RTT_PARK:
            description: RTT_PARK termination value 0 - RTT_PARK disable 1 - RZQ/4 2 - RZQ/2 3 - RZQ/6 4 - RZQ/1 5 - RZQ/5 6 - RZQ/3 7 - RZQ/7
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_ODT_INBUF_4_PD:
        addressOffset: 0x1854
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ODT_INBUF_4_PD:
            description: ODT input buffer during power down mode. 0 - ODT input buffer is activated 1 - ODT input buffer is deactivated
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CA_PARITY_ERR_STATUS:
        addressOffset: 0x1858
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CA_PARITY_ERR_STATUS:
            description: When the controller does a write to MR5 this signal becomes MR5 bit 4 and clears the parity error status in the DDR4 SDRAM. It should always be set to 0 because the DDR4 spec says to only program it to 0.(C/A Parity error status)"
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CRC_ERROR_CLEAR:
        addressOffset: 0x185C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CRC_ERROR_CLEAR:
            description: CRC Error clear. Must be set to 0.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CA_PARITY_LATENCY:
        addressOffset: 0x1860
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CA_PARITY_LATENCY:
            description: 'Command / Address Parity setting: 0 - Command / Address Parity disabled 1 - 4 clock parity latency (1600, 1866, 2133 speed bins) 2 - 5 clock parity latency (2400 speed bin) 3 - 6 clock parity latency (TBD speed bin) 4 - 8 clock parity latency (TBD speed bin)'
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_CCD_S:
        addressOffset: 0x1864
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CCD_S:
            description: SDRAM CAS_n-to-CAS_n delay for different bank group (tCCD_S), specified in clocks. For HBM pseudo channel mode memory, this is tracked for each pseudo channel.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_CCD_L:
        addressOffset: 0x1868
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CCD_L:
            description: SDRAM CAS_n-to-CAS_n delay for same bank group (tCCD_L), specified in clocks. For HBM pseudo channel mode memory, this is tracked for each pseudo channel. Note that when issuing back to back read commands within a pseudo channel that are destined to different SID banks (i.e. SID = 0 in one command and SID = 1 in the other command), the second read will be delayed by cfg_ccd_l (to meet the worst case tCCDR read specification). For back to back writes with SID bit changing within a pseudo channel, the second command is only delayed by cfg_ccd_s l_clks from the first write command (meeting the tCCDR write requirements).
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_VREFDQ_TRN_ENABLE:
        addressOffset: 0x186C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_VREFDQ_TRN_ENABLE:
            description: Enables Vref training mode. Must be set to 0 for automatic initialization ('init_autoinit_disable' = 0).
