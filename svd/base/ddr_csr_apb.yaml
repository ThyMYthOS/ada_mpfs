            description: Allows timing adjustments for the ODT signals during reads. Value is expressed in two's complement form and represents the amount of shift from the nominal value of ODT turn-on and turn-off timing during reads. -8 ('b1000) - negative shift of 8 clocks ... -1 ('b1111) - negative shift of 1 clock 0 ('b0000) - use standard ODT timing 1 ('b0001) - positive shift of transition timing ... 7 ('b0111) - positive shift of 7 clocks Typically only a value of '0' will be used. However, negative values can be used to advance the turn-on relative to the nominal, while positive values will delay it.
