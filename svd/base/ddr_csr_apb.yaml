      CFG_NIBBLE_DEVICES:
        addressOffset: 0x18C4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_NIBBLE_DEVICES:
            description: Indicates memory configuration is composed of x4 memory devices or x8/x16 devices. CRC data for writes is generated differently for x4 devices then x8/x16 devices.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_BIT_MAP_INDEX_CS0_0:
        addressOffset: 0x18E0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BIT_MAP_INDEX_CS0_0:
            description: Specifies mapping of DQ pins between memory controller and DRAM devices. When DQ pins are swizzled on circuit board or DIMM modules, the memory controller needs to take this into account when computing CRC values. This is typically done to simplify printed circuit board trace routing. Each 4 bit nibble may be swizzled in a different way. A 6 bit index specifies the swizzle mapping for each DQ nibble. The number of nibbles (n) is equal to the total number of DQ pins divided by 4. The index value specifies the swizzle mapping according to the JEDEC JC-45 SPD contents specification. In addition to index values 1-48 defined there, a value of 0 can be used to specify 1-to-1 mapping.
            bitOffset: 0
            bitWidth: 32
            access: read-write
