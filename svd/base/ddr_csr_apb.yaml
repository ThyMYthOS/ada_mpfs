      CFG_DFI_T_PHY_WRLAT:
        addressOffset: 0xDC08
        size: 32
        access: read-write
        resetValue: 0x5
        fields:
          CFG_DFI_T_PHY_WRLAT:
            description: 'Used to derive the delay from assertion of the write command to dfi_wrdata_en assertion at the DFI interface. The resulting delay, referred to as tPHY_WRLAT in the DFI specification, is calculated below. Full-Rate: CAS write latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_phy_wrlat - 3 Half-Rate: CAS write latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_phy_wrlat - 6 Quarter-Rate: CAS write latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_phy_wrlat - 12 This value is typically established as a constant for a particular PHY and is not intended to be changed from its reset value. Since the tPHY_WRLAT that the controller generates is a function of the programmed latencies, cfg_dfi_phy_wrlat does not need to be reprogrammed whenever the latencies are changed.'
