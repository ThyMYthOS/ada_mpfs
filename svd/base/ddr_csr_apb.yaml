      CFG_AXI_AUTO_PCH:
        addressOffset: 0x11290
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_AXI_AUTO_PCH:
            description: This is AXI interface register that can be configured to be 8, 16, or 32 bits wide depending upon the number of AXI ports supported. Bit 0 of this register is always associated with axi port 0, bit 1 with axi port 1, etc. If port Y uses a local bus interface, then cfg_axi_auto_pch[Y] is not used and is considered a don't care. If it is an axi port input, cfg_axi_auto_pch serves solely as the auto_pch control for that AXI port. When cfg_axi_auto_pch is set and a long (multibeat) AXI read or write is issued by user logic, then the NWL axi interface logic will insure that only the last sdram controller request being issued (on behalf of a single long AXI request) asserts auto_precharge. If a reorder core is included and is enabled (cfg_reorder_queue_en = 1), then cfg_ro_closed_page_policy, when set, overrides the cfg_axi_auto_pch input and forces auto_pch asserted on all outgoing requests from the reorder core.
