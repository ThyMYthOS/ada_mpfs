        fields:
          CFG_ODT_WR_TURN_OFF:
            description: See description for cfg_odt_wr_turn_on.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_EMR3:
        addressOffset: 0x1D78
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_EMR3:
            description: Value programmed into Extended Mode Register 3 during initialization for DDR2 and DDR3 memory types. Typically this is set to 0. This port is provided in case additional bits are defined in this mode register at a future time. This field is ignored for all memory types other than DDR2 and DDR3.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CFG_TWO_T:
        addressOffset: 0x1D7C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TWO_T:
            description: Two cycle timing (2T) enable. When enabled, the controller extends the duration of all signals in the SDRAM address and control bus, except 'sd_cs_n' to be two clock cycles. 'sd_cs_n' is only asserted on either the first or second cycle, as specified by 'cfg_two_t_sel_cycle'. 2T timing is not supported when cfg_regdimm is set to '1'. 0 - disable 1 - enable For half-rate or quarter-rate memory controller configurations this must be set to 0. For half-rate configurations 2T timing is provided automatically. For quarter-rate configurations 4T timing is provided automatically.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_TWO_T_SEL_CYCLE:
        addressOffset: 0x1D80
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TWO_T_SEL_CYCLE:
            description: 'Controls which memory clock cycle of a multi-cycle command that cs_n is asserted on. For full-rate configurations: 0 - cs_n asserted during the first cycle 1 - cs_n asserted during the second cycle This setting is ignored if ''cfg_two_t'' is set to 0. For half-rate configurations: 0 - cs_n asserted during the first cycle. For DDR4, cs_n assertion may occur on the second cycle unless ''cfg_ccd_l'' and ''cfg_ccd_s'' settings are even numbers. Additionally, if write CRC is enabled ''cfg_ccd_s'' must be set to 6. 1 - cs_n asserted during the second cycle. When this setting is used with DDR4, ''cfg_ccd_l'' and ''cfg_ccd_s'' settings must be even numbers. Additionally, if write CRC is enabled, ''cfg_ccd_s'' must be set to 6. ''cfg_two_t'' must be set to 0 for half-rate configurations. For quarter-rate configurations: 0 - cs_n asserted during the first cycle 1 - cs_n asserted during the third cycle ''cfg_two_t'' must be set to 0 for quarter-rate configurations.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_REGDIMM:
        addressOffset: 0x1D84
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_REGDIMM:
            description: Set when using Registered DIMMs (RDIMMs) and Load-Reduced DIMMs (LRDIMMs). When using RDIMMs or LRDIMMs, 'cfg_rdimm_lat' typically needs to be set to a value corresponding to the number of clocks the DIMM register device adds to the command/address path. For DDR3 RDIMMs and LRDIMMs, cfg_only_srank_cmds also needs to be set to prevent multiple chip selects from asserting simultaneously (which can be interpreted by DDR3 register devices as a control word write).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_MOD:
        addressOffset: 0x1D88
        size: 32
        access: read-write
        resetValue: 0xC
        fields:
          CFG_MOD:
            description: SDRAM Mode Register Set command to any command (tMOD), specified in clocks. Min=24 for DDR4, 15 for HBM
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_XS:
        addressOffset: 0x1D8C
        size: 32
        access: read-write
        resetValue: 0x120
        fields:
          CFG_XS:
            description: SDRAM exit self-refresh to non-DLL command (tXS), specified in clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_XSDLL:
        addressOffset: 0x1D90
        size: 32
        access: read-write
        resetValue: 0x200
        fields:
          CFG_XSDLL:
            description: SDRAM exit self-refresh to any command requiring a locked DLL (tXSDLL), specified in clocks. Refer to memory device datasheet for the minimum required value based on the speed grade being used. If minimizing self-refresh exit time is not important to system performance (or if self-refresh is not being used) then a value that is larger than specified minimum can be used. For DDR3, a value of 512 exceeds the minimum required value for all speed grades. For DDR4, a value of 1024 exceeds the minimum required value for all speed grades.
            bitOffset: 0
            bitWidth: 11
            access: read-write
      CFG_XPR:
        addressOffset: 0x1D94
        size: 32
        access: read-write
        resetValue: 0x120
        fields:
          CFG_XPR:
            description: Delay from CKE high to valid command, after exiting reset (tXPR). Specified in clocks.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_AL_MODE:
        addressOffset: 0x1D98
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_AL_MODE:
            description: Additive latency mode 0 - Additive Latency Disabled (AL = 0) 1 - AL = CL - 1 (not valid for 3DS DDR4 SDRAM) 2 - AL = CL - 2 3 - AL = CL - 3 (only valid for 3DS DDR4 SDRAM)
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_CWL:
        addressOffset: 0x1D9C
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          CFG_CWL:
            description: SDRAM CAS write latency, specified in clocks. Refer to SDRAM datasheet for list of supported values.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_BL_MODE:
        addressOffset: 0x1DA0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BL_MODE:
            description: 'SDRAM burst length mode. This value sets the DDR3 or DDR4 burst length mode. The burst length mode determines the number of DDR transfers per burst. For "full-rate" configurations of the controller, values are decoded as follows: cfg_bl_mode = 0x0 - Fixed BL8 mode. 8 DDR transfers, 4 local side transfers per request cfg_bl_mode = 0x1 - BL8 or BC4 with on-the-fly selection cfg_bl_mode = 0x2 - Fixed BC4 (chop) (NOT CURRENTLY SUPPORTED) For "half-rate" configurations of the controller, values are decoded as follows: cfg_bl_mode = 0x0 - Fixed BL8 mode. 8 DDR transfers, 2 local side transfers per request cfg_bl_mode = 0x1 - BL8 or BC4 with on-the-fly selection cfg_bl_mode = 0x2 - Fixed BC4 (chop) (NOT CURRENTLY SUPPORTED) For "quarter-rate" configurations of the controller, there is only 1 local side transfer per request. Therefore, only one mode is supported: cfg_bl_mode = 0x0 - Fixed BL8 mode. 8 DDR transfers, 1 local side transfers per request cfg_bl_mode = 0x1 - BL8 or BC4 with on-the-fly selection (NOT SUPPORTED) cfg_bl_mode = 0x2 - Fixed BC4 (chop) (NOT SUPPORTED) Note: Refer to the SDRAM Controller Core User Guide for information on using non-aligned starting addresses with each burst length setting.'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_TDQS:
        addressOffset: 0x1DA4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_TDQS:
            description: Termination DQS enable. This signal is written into "TDQS enable" field of mode register during initialization sequence. Enables or disables the TDQS pin on all devices 0 - disable TDQS / enable data mask functionality 1 - enable TDQS / disable data mask functionality
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RTT_WR:
        addressOffset: 0x1DA8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RTT_WR:
            description: Dynamic ODT effective resistance (Rtt_wr). On-Die Termination effective resistance setting programmed into "RTT_WR" field of mode register during initialization sequence. Refer to SDRAM device datasheet for the mapping to impedance values.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_LP_ASR:
        addressOffset: 0x1DAC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_LP_ASR:
            description: Low Power Array Self Refresh (LP ASR) setting, DDR4 ONLY. Programmed into SDRAM device Mode Register during initialization sequence. Refer to SDRAM device datasheet for more information on LP_ASR.
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_AUTO_SR:
        addressOffset: 0x1DB0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_AUTO_SR:
            description: Auto Self Refresh (ASR) setting, DDR3 ONLY. Programmed into SDRAM device Mode Register during initialization sequence. Refer to SDRAM device datasheet for more information on ASR.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_SRT:
        addressOffset: 0x1DB4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_SRT:
            description: Self Refresh Temperature (SRT) setting, DDR3 ONLY. Programmed into SDRAM device Mode Register during initialization sequence. Refer to SDRAM device datasheet for more information on SRT.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ADDR_MIRROR:
        addressOffset: 0x1DB8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ADDR_MIRROR:
            description: Each bit is associated with the respective rank (bit 0 = rank 0, bit 7 = rank 7). If the bit is high, it indicates to the controller that that rank is using address mirroring on the DIMM layout.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_ZQ_CAL_TYPE:
        addressOffset: 0x1DBC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ZQ_CAL_TYPE:
            description: Type of ZQ calibration to be performed during automatic periodic ZQ calibrations or when user asserts 'l_zq_cal_req' or 'init_zq_cal_req'. Only used for DDR3, DDR4, LPDDR2, and LPDDR3 memory types. 0 - Short ZQ calibration (DDR3/DDR4/LPDDR2/LPDDR3) - The controller issues short ZQ-cal command and holds off subsequent commands until the delay specified by 'cfg_zq_cal_s_duration' is satisfied. 1 - Long ZQ calibration (DDR3/DDR4/LPDDR2/LPDDR3) - The controller issues a long ZQ-cal command and holds off subsequent commands until the delay specified by 'cfg_zq_cal_l_duration' is satisfied. 2 - Reset ZQ calibration (LPDDR2/LPDDR3) - The controller issues a reset ZQ-cal command and holds off subsequent commands until the delay specified by 'cfg_zq_cal_r_duration' is satisfied. 3 - Initialization ZQ calibration (LPDDR2/LPDDR3/DDR3/DDR4) - The controller issues a ZQINIT command (LPDDR2/LPDDR3) or long ZQ-cal command (DDR3/DDR4) and holds off subsequent commands until the delay specified by 'cfg_zqinit_cal_duration' is satisfied.
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_ZQ_CAL_PER:
        addressOffset: 0x1DC0
        size: 32
        access: read-write
        resetValue: 0x3F40
        fields:
          CFG_ZQ_CAL_PER:
            description: Period between automatic ZQ calibration commands issued by the controller, specified in memory clocks. The ZQ calibration is performed on a single rank at a time. Therefore the period between ZQ calibration commands in the system is the period specified divided by the number of ranks in the system (cfg_num_ranks). In this way each rank receives a ZQ calibration once per cfg_zq_cal_per.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_AUTO_ZQ_CAL_EN:
        addressOffset: 0x1DC4
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_AUTO_ZQ_CAL_EN:
            description: Enables automatic generation of ZQ calibration commands at a periodic rate determined by 'cfg_zq_cal_per'. When this is set to '0', the user logic must initiate periodic ZQ calibrations manually using the 'l_zq_cal_req' input.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_MEMORY_TYPE:
        addressOffset: 0x1DC8
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          CFG_MEMORY_TYPE:
            description: Applies to multi-mode memory controller configurations only. Selects memory type being used. 0x0004 = DDR2 0x0008 = DDR3 0x0020 = LPDDR2 0x0040 = RL3 0x0080 = DDR4 0x0100 = LPDDR3 0x0400 = LPDDR4 0x0800 = HBM2 legacy emulation using Pseudo channel memory 0x1000 = HBM2 native Pseudo channel memory 0x2000 = LL-HBM2 Pseudo channel memory
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CFG_ONLY_SRANK_CMDS:
        addressOffset: 0x1DCC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ONLY_SRANK_CMDS:
            description: 'When set, controller only issues commands to one rank at a time (i.e. only one chip select is ever asserted). Reasons for setting this include: 1) Use of DDR3 RDIMMs and DDR3 LRDIMMs. This must be set for DDR3 RDIMMs and DDR3 LRDIMMs since they do not allow commands to be issued to multiple ranks simultaneously. 2) Staggered refresh commands to reduce instantaneous current draw. 3) Enable read/write commands while other ranks are being refreshed. To utilize this, the user logic must be aware of which rank is about to be refreshed and avoid requests to that rank. When this is set, the refresh period provided on ''cfg_ref_per'' will be divided internally in the controller by the number of ranks in the system (as specified by ''cfg_num_ranks'') since each refresh event is only refreshing one rank. See the cfg_ref_per register description for details.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_NUM_RANKS:
        addressOffset: 0x1DD0
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_NUM_RANKS:
            description: Number of ranks in system. Used by ZQ-calibration and when cfg_only_srank_cmds is set to determine which ranks to cycle through for refresh and ZQ-calibration commands.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_QUAD_RANK:
        addressOffset: 0x1DD4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_QUAD_RANK:
            description: Set to indicate configuration with DIMMs that have four ranks. Quad-rank DIMMs expose two CKE pins, each driving two ranks. When this port is set to '1', ranks will only be put into power down and self-refresh in pairs which share CKE pins.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_EARLY_RANK_TO_WR_START:
        addressOffset: 0x1DDC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_EARLY_RANK_TO_WR_START:
            description: Controls timing behavior of dfi_wrdata_cs_pN relative to dfi_wrdata_en_pN. When set to 0, dfi_wrdata_cs_pN is guaranteed to be valid only while dfi_wrdata_en_pN is asserted. When set to 1, dfi_wrdata_cs_pN will also be guaranteed valid 1 DFI clock cycle prior to dfi_wrdata_en_pN, and will remain valid while dfi_wrdata_en_pN is valid. A value of 1 may cause the controller to delay a write to a different rank from the previous write in order to guarantee this timing. Some PHYs require a setting of 1 so that there is time for rank-specific delay values to be switched in prior to the start of data transfer on the DRAM bus. Only values of 1 and 0 are permitted.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_EARLY_RANK_TO_RD_START:
        addressOffset: 0x1DE0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_EARLY_RANK_TO_RD_START:
            description: Controls timing behavior of dfi_rddata_cs_pN relative to dfi_rddata_en_pN. When set to 0, dfi_rddata_cs_pN is guaranteed to be valid only while dfi_rddata_en_pN is asserted. When set to 1, dfi_rddata_cs_pN will also be guaranteed valid 1 DFI clock cycle prior to dfi_rddata_en_pN, and will remain valid while dfi_rddata_en_pN is valid. A value of 1 may cause the controller to delay a read to a different rank from the previous read in order to guarantee this timing. Some PHYs require a setting of 1 so that there is time for rank-specific delay values to be switched in prior to the start of data transfer on the DRAM bus. Only values of 1 and 0 are permitted.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_PASR_BANK:
        addressOffset: 0x1DE4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PASR_BANK:
            description: Partial-Array Self-Refresh Bank Mask settings programmed into the Mode Register.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_PASR_SEG:
        addressOffset: 0x1DE8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PASR_SEG:
            description: Partial-Array Self-Refresh Segment Mask settings programmed into the Mode Register.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_MRR_MODE:
        addressOffset: 0x1DEC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MRR_MODE:
            description: Set to direct SDRAM controller to issue mode register read commands for subsequent read accesses. It is recommended that this only be asserted when init_cal_select = 1'b1, or when the controller is idle (no other read/write activity in progress).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_MR_W_REQ:
        addressOffset: 0x1DF0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MR_W_REQ:
            description: Mode register write request. Initiates a mode register program to the mode register specified by init_mr_addr and rank(s) specified by init_cs. Assertion of init_ack signals the completion of the operation. All banks must be closed prior to making this request. This may be done using the init_precharge register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_MR_ADDR:
        addressOffset: 0x1DF4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MR_ADDR:
            description: Mode register address to be written to when init_mr_w_req is asserted.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_MR_WR_DATA:
        addressOffset: 0x1DF8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MR_WR_DATA:
            description: Value to be programmed into mode register. For HBM only bits 7 to 0 are used (OP7 = init_mr_wrdata[7],... OP0 = init_mr_wrdata[0]).
            bitOffset: 0
            bitWidth: 18
            access: read-write
      INIT_MR_WR_MASK:
        addressOffset: 0x1DFC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MR_WR_MASK:
            description: Mask for mode register writes. Mode register bits corresponding to bits asserted in this bus will be sourced from settings on cfg_* inputs to the controller rather than the init_mr_wr_data bus.
            bitOffset: 0
            bitWidth: 18
            access: read-write
      INIT_NOP:
        addressOffset: 0x1E00
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_NOP:
            description: Causes controller to issue NOP command. For DDR4, typically used for geardown mode.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_INIT_DURATION:
        addressOffset: 0x1E04
        size: 32
        access: read-write
        resetValue: 0x29B0
        fields:
          CFG_INIT_DURATION:
            description: Delay (tINIT5) after initialization RESET command that the controller waits before issuing ZQ initialization calibration (ZQINIT) command, specified in clocks.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CFG_ZQINIT_CAL_DURATION:
        addressOffset: 0x1E08
        size: 32
        access: read-write
        resetValue: 0x200
        fields:
          CFG_ZQINIT_CAL_DURATION:
            description: Delay from initialization ZQ calibration command to any subsequent command, specified in memory clocks. Based on tZQINIT timing specification. For DDR3, DDR4, LPDDR2 and LPDDR3 memory types this applies to the ZQ calibration command performed during the automatic initialization sequence. For DDR3 and DDR4 memory types, this also applies to any long ZQ calibration performed when 'cfg_zq_cal_type' is set to 3.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_ZQ_CAL_L_DURATION:
        addressOffset: 0x1E0C
        size: 32
        access: read-write
        resetValue: 0x100
        fields:
          CFG_ZQ_CAL_L_DURATION:
            description: Delay from long ZQ-cal command to any subsequent command, specified in memory clocks. Based on tZQCL timing specification for DDR3, LPDDR2 and LPDDR3. Based on tZQOper timing specification for DDR4.
            bitOffset: 0
            bitWidth: 11
            access: read-write
      CFG_ZQ_CAL_S_DURATION:
        addressOffset: 0x1E10
        size: 32
        access: read-write
        resetValue: 0x40
        fields:
          CFG_ZQ_CAL_S_DURATION:
            description: Delay from short ZQ-cal command to any subsequent command, specified in memory clocks. Based on tZQCS timing specification.
            bitOffset: 0
            bitWidth: 11
            access: read-write
      CFG_ZQ_CAL_R_DURATION:
        addressOffset: 0x1E14
        size: 32
        access: read-write
        resetValue: 0x35
        fields:
          CFG_ZQ_CAL_R_DURATION:
            description: Delay from ZQ-cal reset command to any subsequent command, specified in memory clocks. Based on tZQRESET timing specification.
            bitOffset: 0
            bitWidth: 11
            access: read-write
      CFG_MRR:
        addressOffset: 0x1E18
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          CFG_MRR:
            description: Mode register read command to valid mode read data (tMRR), specified in clocks.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CFG_MRW:
        addressOffset: 0x1E1C
        size: 32
        access: read-write
        resetValue: 0xC
        fields:
          CFG_MRW:
            description: Mode register write command period (tMRW), specified in clocks.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_ODT_POWERDOWN:
        addressOffset: 0x1E20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ODT_POWERDOWN:
            description: Set to enable ODT during powerdown.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_WL:
        addressOffset: 0x1E24
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          CFG_WL:
            description: Write latency, specified in clocks. Valid values for HBM are 6 through 8. Valid values for LPDDR4 are 4 through 34. Valid values for GDDR6 are 5 through 8.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_RL:
        addressOffset: 0x1E28
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          CFG_RL:
            description: Read latency, specified in clocks.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_CAL_READ_PERIOD:
        addressOffset: 0x1E2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CAL_READ_PERIOD:
            description: Period between calibration reads, specified in clocks. Set to 0 to disable periodic calibration reads. [This port only included in PHY configurations which require periodic calibration reads.]
            bitOffset: 0
            bitWidth: 22
            access: read-write
      CFG_NUM_CAL_READS:
        addressOffset: 0x1E30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_NUM_CAL_READS:
            description: Number of calibration reads that are issued each time cfg_cal_read_period timer expires. [This port only included in PHY configurations which require periodic calibration reads.]
            bitOffset: 0
            bitWidth: 2
            access: read-write
      INIT_SELF_REFRESH:
        addressOffset: 0x1E34
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_SELF_REFRESH:
            description: Self-refresh control. Causes the controller to put the selected SDRAM rank (chip select) into self-refresh mode at the next refresh event. Each bit in init_self_refresh corresponds to the selected rank; asserting init_self_refresh[0] puts the devices connected to cs_n[0] into self refresh, init_self_refresh[1] for cs_n[1] and so on. This bus performs the same function as l_self_refresh, however this bus is first level-synchronized to the memory controller clock domain within the controller. This allows it to be controlled from a different clock domain, as is typically the case when driven from a control / status register (CSR) module.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_SELF_REFRESH_STATUS:
        addressOffset: 0x1E38
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_SELF_REFRESH_STATUS:
            description: Indicates which ranks are in self-refresh
            bitOffset: 0
            bitWidth: 8
            access: read-only
      INIT_POWER_DOWN:
        addressOffset: 0x1E3C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_POWER_DOWN:
            description: Power down control. Causes the controller to put the selected SDRAM rank (chip select) into power down mode. The core will automatically continue to refresh all devices so that data is retained. This bus performs the same function as l_power_down, however this bus is first level-synchronized to the memory controller clock domain within the controller. This allows it to be controlled from a different clock domain, as is typically the case when driven from a control / status register (CSR) module.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_POWER_DOWN_STATUS:
        addressOffset: 0x1E40
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_POWER_DOWN_STATUS:
            description: Indicates which ranks are in power-down
            bitOffset: 0
            bitWidth: 8
            access: read-only
      INIT_FORCE_WRITE:
        addressOffset: 0x1E44
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_FORCE_WRITE:
            description: Forces assertion of 'dfi_wrdata_en' and 'dfi_odt' which will cause the PHY to drive its DQ, DQS and ODT outputs, regardless of whether a write command is issued or not. This feature can be used for software-driven write leveling as well as hardware debug of the write interface. When init_force_write is asserted and a regular write is not being driven by the controller, the data pattern is specified by 'init_force_write_data', and the rank driven to 'dfi_wrdata_cs' is specified by 'init_force_write_cs'. Whenever a regular write is being driven by the controller, the data pattern and rank come from the normal controller path, regardless of the state of 'init_force_write'.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_FORCE_WRITE_CS:
        addressOffset: 0x1E48
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_FORCE_WRITE_CS:
            description: Rank passed to PHY on dfi_wrdata_cs when init_force_write is asserted and a regular write is not being driven.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_CTRLR_INIT_DISABLE:
        addressOffset: 0x1E4C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_INIT_DISABLE:
            description: Controller initialization is bypassed when asserted, allowing PHY to perform initialization instead.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CTRLR_READY:
        addressOffset: 0x1E50
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CTRLR_READY:
            description: Deasserted when in reset or after ctrlr_init is asserted, then asserts after initialization sequence and training sequences (if required) have completed
            bitOffset: 0
            bitWidth: 1
            access: read-only
      INIT_RDIMM_READY:
        addressOffset: 0x1E54
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_RDIMM_READY:
            description: Signals to the application that the reset sequence has completed and that it may proceed with writing to the Register Control Words (RCW) and/or Buffer Control Words (BCW) of the RDIMM/LRDIMM, using the 'init_mr_w_req', 'init_mr_addr' and 'init_mr_wr_data' controls.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_RDIMM_COMPLETE:
        addressOffset: 0x1E58
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_RDIMM_COMPLETE:
            description: Set by the application to indicate that it has completed writing to the Register Control Word (RCW) and/or Buffer Control Words (BCW) of the RDIMM/LRDIMM. This enables the controller to proceed with the device initialization. If the application does not need to write to the RCWs or BCWs, it may set this control high all the time.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RDIMM_LAT:
        addressOffset: 0x1E5C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RDIMM_LAT:
            description: Specifies the latency of the register device used in Registered DIMMs (RDIMMs) and Load-Reduced DIMMs (LRDIMMs). This value is used to delay data-path related signal timing going to the PHY to compensate for the extra latency in the DIMM. For DDR2 and DDR3 RDIMMs, as well as DDR3 LRDIMMs, the register device always introduces a latency of 1 clock on the command and address signals. For DDR4 RDIMMs and LRDIMMs, the register clock driver (RCD) introduces a latency of at least 1 clock on the command and address signals. It can introduce additional latency (up to 4 additional clocks) based on the "Command Latency Adder" control word setting in the RCD. In most cases, this setting should reflect the exact value of latency introduced by the RDIMM or LRDIMM register device. An exception is when the controller is integrated with a PHY that automatically compensates for the RDIMM or LRDIMM latency during its training sequence, and expects the same data-path related signal timing regardless of the amount of latency introduced by the register device.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_RDIMM_BSIDE_INVERT:
        addressOffset: 0x1E60
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_RDIMM_BSIDE_INVERT:
            description: Set to 1 to indicate that the DDR4 RDIMM register clock driver (RCD) will invert the B-side addresses.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_LRDIMM:
        addressOffset: 0x1E64
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_LRDIMM:
            description: Set to 1 to indicate DDR4 LRDIMM is installed in the system.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_MEMORY_RESET_MASK:
        addressOffset: 0x1E68
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_MEMORY_RESET_MASK:
            description: When set, masks the reset output of the controller (dfi_reset_n_pN) so that it does not assert when the controller is in reset. This function can be useful in situations where the memory controller needs to be reset while holding the memory devices in the self-refresh state. This signal is connected to the reset_n pin of level synchronization flip-flops inside the memory controller. This guarantees synchronous assertion of the internal masking logic when the init_memory_reset_mask signal is not synchronized to the memory controller clock. However, this method does not guarantee synchronous de-assertion of the internal masking logic when init_memory_reset_mask transitions from 1 to 0. Therefore, 1 to 0 transitions should only happen while the memory controller is in reset (reset_n = 0).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RD_PREAMB_TOGGLE:
        addressOffset: 0x1E6C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RD_PREAMB_TOGGLE:
            description: Sets read preamble toggle bit in the mode register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RD_POSTAMBLE:
        addressOffset: 0x1E70
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RD_POSTAMBLE:
            description: Sets read postamble length bit in the mode register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_PU_CAL:
        addressOffset: 0x1E74
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PU_CAL:
            description: Sets pullup calibration point bit in the mode register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_DQ_ODT:
        addressOffset: 0x1E78
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DQ_ODT:
            description: Sets DQ ODT value in the mode register.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_CA_ODT:
        addressOffset: 0x1E7C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CA_ODT:
            description: Sets CA ODT value in the mode register.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_ZQLATCH_DURATION:
        addressOffset: 0x1E80
        size: 32
        access: read-write
        resetValue: 0x30
        fields:
          CFG_ZQLATCH_DURATION:
            description: Sets ZQ latch duration (tZQLAT) in memory clocks. Only applies to LPDDR4. This is the amount of time that the command bus must be in the deselect state after the ZQCAL latch command is issued by the controller.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      INIT_CAL_SELECT:
        addressOffset: 0x1E84
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CAL_SELECT:
            description: Calibration port select. Set to '1' prior to using init_cal_l_r_req to initiate a read on the memory bus.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CAL_L_R_REQ:
        addressOffset: 0x1E88
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CAL_L_R_REQ:
            description: A rising edge detected in this register setting causes a single read command to be issued by the controller.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CAL_L_B_SIZE:
        addressOffset: 0x1E8C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CAL_L_B_SIZE:
            description: Burst size for read requested using init_cal_l_r_req.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      INIT_CAL_L_R_ACK:
        addressOffset: 0x1E90
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_CAL_L_R_ACK:
            description: Asserts to acknowledge read requested by init_cal_l_r_req. Asserted when the read command has been accepted.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CAL_L_READ_COMPLETE:
        addressOffset: 0x1E94
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_CAL_L_READ_COMPLETE:
            description: Asserts to acknowledge read requested by init_cal_l_r_req. Asserted when the read command has occurred on the memory bus and the read data has been transferred.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_RWFIFO:
        addressOffset: 0x1EA0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_RWFIFO:
            description: Enables read/write access to the device FIFO. When set subsequent accesses are directed to FIFO rather than memory array until this bit is cleared. Rank is selected with init_cs register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_RD_DQCAL:
        addressOffset: 0x1EA4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_RD_DQCAL:
            description: Enables reading of DQ calibration pattern. When set any read will generate a DQ calibration read until this bit is cleared. Rank is selected with init_cs register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_START_DQSOSC:
        addressOffset: 0x1EA8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_START_DQSOSC:
            description: Issues a Start DQS Oscillator command to the memory device. Rank is selected with init_cs register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_STOP_DQSOSC:
        addressOffset: 0x1EAC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_STOP_DQSOSC:
            description: Issues a Stop DQS Oscillator command to the memory device. Rank is selected with init_cs register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_ZQ_CAL_START:
        addressOffset: 0x1EB0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_ZQ_CAL_START:
            description: Issues a ZQ calibration start command to the memory device. Rank is selected with init_cs register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_WR_POSTAMBLE:
        addressOffset: 0x1EB4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_WR_POSTAMBLE:
            description: Sets write postamble bit in the mode register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CAL_L_ADDR_0:
        addressOffset: 0x1EBC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CAL_L_ADDR_0:
            description: Address used for read requested using init_cal_l_r_req.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      INIT_CAL_L_ADDR_1:
        addressOffset: 0x1EC0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CAL_L_ADDR_1:
            description: Address used for read requested using init_cal_l_r_req.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_CTRLUPD_TRIG:
        addressOffset: 0x1EC4
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_CTRLUPD_TRIG:
            description: Specifies the trigger for the controller initiated update signal ('dfi_ctrlupd_req'). 0 - Disable 1 - Any refresh event triggers controller initiated update request 2 - Any ZQ-calibration event triggers controller initiated update request (for memory technologies that support it)
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_CTRLUPD_START_DELAY:
        addressOffset: 0x1EC8
        size: 32
        access: read-write
        resetValue: 0x16
        fields:
          CFG_CTRLUPD_START_DELAY:
            description: Delay from the DFI MC-initiated update trigger event command (as specified by 'cfg_ctrlupd_trig') to when the controller asserts 'dfi_ctrlupd_req'. This delay is specified in DFI clocks and is measured at the DFI interface to the PHY and can take on values of 0 (not recommended) to 1023. When DDR4 Command-Address-Latency (CAL) mode is used, the delay is from the assertion of the command at the DFI interface (which occurs sometime after the associated chip-select assertion in CAL mode). Note that this register defaults to the minimum recommended value of 5; however it is possible that some phys that support dfi_ctrlupd_req will require a larger cfg_ctrlupd_start_delay value to guarantee that a previous read in progress has completed before the NWL controller asserts dfi_ctrlupd_req as determined by this value and the cfg_ctrlupd_trig CSR.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_DFI_T_CTRLUPD_MAX:
        addressOffset: 0x1ECC
        size: 32
        access: read-write
        resetValue: 0xC8
        fields:
          CFG_DFI_T_CTRLUPD_MAX:
            description: Duration of 'dfi_ctrlupd_req' assertion. 0 - 'dfi_ctrlupd_req' will only de-assert after 'dfi_ctrlupd_ack' is asserted and then deasserted. 1-1023 - Duration of 'dfi_ctrlupd_req' assertion, specified in dfi clocks. 'dfi_ctrlupd_req' will deassert if 'dfi_ctrlupd_ack' asserts and deasserts before this time has elapsed. Otherwise 'dfi_ctrlupd_req' will deassert immediately after this time has elapsed.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_CTRLR_BUSY_SEL:
        addressOffset: 0x1ED0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_SEL:
            description: Selects source of dfi_ctrlr_busy signal going to PHY 0 - dfi_ctrlr_busy generated based on read/write traffic and delay timings specified by cfg_ctrlr_busy_turn_off_delay, cfg_ctrlr_busy_slow_restart_window, and cfg_ctrlr_busy_restart_holdoff 1 - dfi_ctrlr_busy driven by static value specified by cfg_ctrlr_busy_value. This mode is typically used only for debug or for disabling the dynamic ctrlr_busy functionality.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CTRLR_BUSY_VALUE:
        addressOffset: 0x1ED4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_VALUE:
            description: Value driven on dfi_ctrlr_busy going to PHY if cfg_ctrlr_busy_sel = 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CTRLR_BUSY_TURN_OFF_DELAY:
        addressOffset: 0x1ED8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_TURN_OFF_DELAY:
            description: Delay from last dfi_rddata_en or dfi_wrdata_en to deassertion of dfi_ctrlr_busy.
            bitOffset: 0
            bitWidth: 9
            access: read-write
      CFG_CTRLR_BUSY_SLOW_RESTART_WINDOW:
        addressOffset: 0x1EDC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_SLOW_RESTART_WINDOW:
            description: If a command is received while the window is active then assert busy and then wait for restart holdoff before sending commands to the controller. If a command is received after the window is closed then assert busy and allow commands to go to the controller immediately. If the window is programmed to 0 then always wait for the command holdoff.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_CTRLR_BUSY_RESTART_HOLDOFF:
        addressOffset: 0x1EE0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_RESTART_HOLDOFF:
            description: The delay from asserting busy = 1 to allowing commands to go the controller. If this is 0 then dfi_ctrlr_busy is always 1 and commands are never held off. This delay is also used when init_force_write is asserted to assure that there is enough time between the assertion of dfi_ctrlr_busy and the assertion of dfi_wrdata_en.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CFG_PARITY_RDIMM_DELAY:
        addressOffset: 0x1EE4
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_PARITY_RDIMM_DELAY:
            description: Delay the command address parity_in signal by 1 cycle. Typically needed to be set to 1 with regdimm configurations. Some PHYs provide this delay, in which case it should be set to 0.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CTRLR_BUSY_ENABLE:
        addressOffset: 0x1EE8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_CTRLR_BUSY_ENABLE:
            description: Enables the controller busy function. If cfg_ctrlr_busy_enable is set to 0 dfi_ctrlr_busy is always high.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ASYNC_ODT:
        addressOffset: 0x1EEC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ASYNC_ODT:
            description: Enable asynchronous ODT operation for non-DLL mode of operation. 0 - disable asynchronous ODT operation 1 - enable asynchronous ODT operation
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ZQ_CAL_DURATION:
        addressOffset: 0x1EF0
        size: 32
        access: read-write
        resetValue: 0x640
        fields:
          CFG_ZQ_CAL_DURATION:
            description: Delay from LPDDR4 ZQ-cal start command to ZQ-cal latch command, specified in memory clocks. Based on LPDDR4 tZQCAL timing specification.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_MRRI:
        addressOffset: 0x1EF4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MRRI:
            description: Additional time required following power-down state before issuing a command (tMRRI). Time from power-down exit to first command is tXP + tMRRI.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      INIT_ODT_FORCE_EN:
        addressOffset: 0x1EF8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_ODT_FORCE_EN:
            description: Turn on ODT per write selection matrix specified by 'cfg_odt_wr_map_csN' ports. Rank is specified by 'init_odt_force_rank'. This port may be used to set up the ODT signals for user controlled write leveling.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_ODT_FORCE_RANK:
        addressOffset: 0x1EFC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_ODT_FORCE_RANK:
            description: Rank selection when 'init_odt_force_en' is asserted.
            bitOffset: 0
            bitWidth: 3
            access: read-write
      CFG_PHYUPD_ACK_DELAY:
        addressOffset: 0x1F00
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_PHYUPD_ACK_DELAY:
            description: Delay in DFI clocks before the dfi_phyupd_ack signal is asserted. The delay is measured from the time the DFI bus is idle after receiving a dfi_phyupd_req, providing additional margin between the request and acknowledge.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      CFG_MIRROR_X16_BG0_BG1:
        addressOffset: 0x1F04
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_MIRROR_X16_BG0_BG1:
            description: For DDR4 DIMMs populated with x16 devices, when set to 1'b1 will force mirroring of bank group bits BG0/1 when address mirroring is enabled for those ranks. Normally x16 devices do not have BG1 so the bank group bits are not mirrored. However, some PHY or DIMM applications may still require mirroring of the bank group bits.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_PDA_MR_W_REQ:
        addressOffset: 0x1F08
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_PDA_MR_W_REQ:
            description: Per-DRAM addressability mode register write request. Initiates mode register write to the mode register specified by init_mr_addr, rank specified by init_cs, and devices selected by init_pda_nibble_select. The data to be written to the mode register is specified using init_mr_wr_data and init_mr_wr_mask. Assertion of init_ack signals completion of the operation.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_PDA_NIBBLE_SELECT:
        addressOffset: 0x1F0C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_PDA_NIBBLE_SELECT:
            description: Selects nibbles for Per-DRAM addressability mode writes initiated using init_pda_mr_w_req. Each bit corresponds to one nibble of the memory interface and drives all 4 bits of the corresponding nibble during the PDA mode register write. If the interface consists of x8 or x16 devices, then it is recommended that both nibbles of each byte are set to the same select value, in case there is a nibble swap on the DIMM or PCB. Note that at the memory interface, devices are selected with a '0' value on DQ, so the values driven on the DQ bus are the invert of the corresponding init_pda_nibble_select bit setting.
            bitOffset: 0
            bitWidth: 18
            access: read-write
      CFG_DRAM_CLK_DISABLE_IN_SELF_REFRESH:
        addressOffset: 0x1F10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DRAM_CLK_DISABLE_IN_SELF_REFRESH:
            description: When set, all clock outputs to DRAM are disabled after all ranks are put into self-refresh. Clocks are automatically restarted before ranks exit self-refresh. Clocks are controlled using the dfi_dram_clk_disable port going to the PHY. It is expected that the DB in an LRDIMM application will need to be retrained after the clocks have been stopped. Therefore this feature is not used in an LRDIMM configuration. The init_dfi_dram_clk_disable port may be used to stop the DRAM clocks for an LRDIMM.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_CKSRE:
        addressOffset: 0x1F14
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          CFG_CKSRE:
            description: Valid DRAM clock requirement after self-refresh entry (tCKSRE), specified in memory clocks. For DDR4 the controller automatically includes parity latency so that tCKSRE_PAR is satisfied as well.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_CKSRX:
        addressOffset: 0x1F18
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          CFG_CKSRX:
            description: Valid DRAM clock requirement before self-refresh exit (tCKSRX), specified in memory clocks.
            bitOffset: 0
            bitWidth: 5
            access: read-write
      CFG_RCD_STAB:
        addressOffset: 0x1F1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RCD_STAB:
            description: Value for RDIMM RCD clock stabilization time (tSTAB), specified in memory clocks. When clocks are disabled using cfg_dram_clk_disable_in_self_refresh, this delay is combined with cfg_cksrx when the clocks are restarted before the CKE inputs to the RCD are asserted.
            bitOffset: 0
            bitWidth: 14
            access: read-write
      CFG_DFI_T_CTRL_DELAY:
        addressOffset: 0x1F20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DFI_T_CTRL_DELAY:
            description: Number of memory clocks required for the DFI control signals presented to the PHY to reach the DRAM interface of the PHY. This value is used to delay the disable of the clock going to memory via dfi_dram_clk_disable, after self-refresh entry when cfg_dram_clk_disable_in_self_refresh is set to 1.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_DFI_T_DRAM_CLK_ENABLE:
        addressOffset: 0x1F24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_DFI_T_DRAM_CLK_ENABLE:
            description: Number of memory clock cycles from the deassertion of the dfi_dram_clk_disable signal until the first valid rising clock edge at the DRAM interface of the PHY.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_IDLE_TIME_TO_SELF_REFRESH:
        addressOffset: 0x1F28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_IDLE_TIME_TO_SELF_REFRESH:
            description: Duration from the last data transaction to when the controller automatically puts all ranks in self-refresh, specified in memory clocks. A value of 0 disables the automatic self-refresh entry feature.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_IDLE_TIME_TO_POWER_DOWN:
        addressOffset: 0x1F2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_IDLE_TIME_TO_POWER_DOWN:
            description: Duration from the last data transaction to when the controller automatically puts all ranks in power-down, specified in memory clocks. A value of 0 disables the automatic power-down entry feature.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CFG_BURST_RW_REFRESH_HOLDOFF:
        addressOffset: 0x1F30
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_BURST_RW_REFRESH_HOLDOFF:
            description: When set, refresh request is held off until all writes or reads of current burst has been executed. In this mode, refresh is demoted to priority level below that of writes and reads.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_REFRESH_COUNT:
        addressOffset: 0x1F34
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_REFRESH_COUNT:
            description: Indicates the number of REFRESH commands that are in the automatic refresh queue when cfg_auto_ref_en = 1. Values > 1 indicate that REFRESH commands are being postponed.
            bitOffset: 0
            bitWidth: 6
            access: read-only
      CFG_BG_INTERLEAVE:
        addressOffset: 0x1F84
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_BG_INTERLEAVE:
            description: Enables interleaving of bank-groups in back-to-back transactions to avoid tCCD_L delays in DRAM architectures with bank groups (DDR4 and HBM). When set, the address is mapped such that the BG0 bit toggles on each successive read/write command as l_addr is sequentially increased. The Multi-burst core also uses this register to determine when to issue requests with the auto-precharge attribute. When this register is set and l_auto_pch is set for a request, the multiburst module sets the auto-precharge attribute with the last two requests in a multi-burst series so that both of the accessed banks are closed. When this register is clear and l_auto_pch is set, the multiburst module sets the auto-precharge attribute with only the last request since that is the only bank group that has been accessed.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_REFRESH_DURING_PHY_TRAINING:
        addressOffset: 0x1FFC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_REFRESH_DURING_PHY_TRAINING:
            description: Use in conjunction with cfg_auto_ref_en to enable controller-initiated refresh cycles during PHY training. When this is set to '0', the controller will not issue refresh while PHY training is active.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_EN:
        addressOffset: 0x2000
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_EN:
            description: Rising edge on 'mt_en' or 'mt_enable_single" starts a test.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_EN_SINGLE:
        addressOffset: 0x2004
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_EN_SINGLE:
            description: Enables single memory test. The memory test will only start after a low to high transition of this signal. The memory test will not repeat if 'mt_en_single' remains asserted at the end of the memory test.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_STOP_ON_ERROR:
        addressOffset: 0x2008
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_STOP_ON_ERROR:
            description: When mt_en is held asserted so that the memory test repeats multiple times, setting this bit will prevent the test from repeating again if an error was detected on the previous run. This is useful for debugging very infrequent errors which require many repetitions of the test before the error occurs. For example, once the error has occurred and the test has stopped, the test can be repeated with the 'mt_read_only' flag set, to help determine if the error occurred on a write or a read.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_RD_ONLY:
        addressOffset: 0x200C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_RD_ONLY:
            description: Causes only reads to be performed when the memory test is enabled. Should not be set when 'mt_wr_only' is also set.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_WR_ONLY:
        addressOffset: 0x2010
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_WR_ONLY:
            description: Causes only writes to be performed when the memory test is enabled. Should not be set when 'mt_rd_only' is also set.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_DATA_PATTERN:
        addressOffset: 0x2014
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_DATA_PATTERN:
            description: 'Memory test data pattern selection: 0x0 : Counting pattern 0x1 : Walking 1''s 0x2 : Repeating Pseudo-random data (generated with LFSR). Repeats pattern sequence on each pass when test is run repetitively with ''mt_en'' held high. 0x3 : Non-Repeating Pseudo-random data (generated with LFSR). Pattern continues from where it left off on previous test when ''mt_en'' is held high. 0x4 : Alternating all 1''s and all 0''s 0x5 : Alternating 5''s and a''s 0x6 : User-specified pattern, specified with mt_user_data_pattern. Pattern copied across all bytes of data bus on memory writes, and all bytes of expected data on memory reads. 0x7 : Pseudo-random 16-bit data (generated with LFSR), copied across all words of data bus. 0x8 : Pseudo-random 8-bit data (generated with LFSR), copied across all bytes of data bus.'
            bitOffset: 0
            bitWidth: 4
            access: read-write
      MT_ADDR_PATTERN:
        addressOffset: 0x2018
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ADDR_PATTERN:
            description: 'Memory test address pattern selection: 0x0 : Counting pattern 0x1 : LFSR 0x2 : Arbitrary Pattern Generator 0x3 : Reserved The LFSR address pattern is used only when the LFSR address pattern is selected and (mt_addr_bits - cfg_bl - 1) is greater than 2. Otherwise, counting address pattern is used, regardless of which address pattern is selected.'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      MT_DATA_INVERT:
        addressOffset: 0x201C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_DATA_INVERT:
            description: Invert data pattern
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_ADDR_BITS:
        addressOffset: 0x2020
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          MT_ADDR_BITS:
            description: 'Address range to test. Test will start at ''mt_start_addr'' and continue to addresses ''mt_start_addr'' + 2 ^ mt_addr_bits. Note: The minimum valid value is a function of memory burst length: 1 - (memory burst length = 2) 2 - (memory burst length = 4) 3 - (memory burst length = 8)'
            bitOffset: 0
            bitWidth: 6
            access: read-write
      MT_ERROR_STS:
        addressOffset: 0x2024
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          MT_ERROR_STS:
            description: Goes true when the memory test module detects a mismatch between expected data and the data read from the sdram. Cleared immediately after reading this csr.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_DONE_ACK:
        addressOffset: 0x2028
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          MT_DONE_ACK:
            description: Indicates completion of memory test through address range specified by 'mt_addr_bits'. Signal is asserted when final test completes after mt_en has been cleared.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      MT_START_ADDR_0:
        addressOffset: 0x20B4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_START_ADDR_0:
            description: Address to start memory test at. This port is not used when 'mt_addr_pattern' is set to 0x1 (pseudo-random).
            bitOffset: 0
            bitWidth: 32
            access: read-write
      MT_START_ADDR_1:
        addressOffset: 0x20B8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_START_ADDR_1:
            description: Address to start memory test at. This port is not used when 'mt_addr_pattern' is set to 0x1 (pseudo-random).
            bitOffset: 0
            bitWidth: 7
            access: read-write
      MT_ERROR_MASK_0:
        addressOffset: 0x20BC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ERROR_MASK_0:
            description: Error mask. All bits set in this field will mask read-back errors in corresponding data bits. The 'mt_error_sts' flag will not get set when errors are encountered on those data bits.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      MT_ERROR_MASK_1:
        addressOffset: 0x20C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ERROR_MASK_1:
            description: Error mask. All bits set in this field will mask read-back errors in corresponding data bits. The 'mt_error_sts' flag will not get set when errors are encountered on those data bits.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      MT_ERROR_MASK_2:
        addressOffset: 0x20C4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ERROR_MASK_2:
            description: Error mask. All bits set in this field will mask read-back errors in corresponding data bits. The 'mt_error_sts' flag will not get set when errors are encountered on those data bits.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      MT_ERROR_MASK_3:
        addressOffset: 0x20C8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ERROR_MASK_3:
            description: Error mask. All bits set in this field will mask read-back errors in corresponding data bits. The 'mt_error_sts' flag will not get set when errors are encountered on those data bits.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      MT_ERROR_MASK_4:
        addressOffset: 0x20CC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ERROR_MASK_4:
            description: Error mask. All bits set in this field will mask read-back errors in corresponding data bits. The 'mt_error_sts' flag will not get set when errors are encountered on those data bits.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      MT_USER_DATA_PATTERN:
        addressOffset: 0x2270
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_USER_DATA_PATTERN:
            description: User-specified data pattern for use with Algorithmic Pattern Generator, when mt_data_pattern selects user-specified pattern.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      MT_ALG_AUTO_PCH:
        addressOffset: 0x227C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MT_ALG_AUTO_PCH:
            description: Causes auto_precharge to be asserted when the memory test is enabled and the algorithmic pattern generator is being used.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_STARVE_TIMEOUT_P0:
        addressOffset: 0x2800
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P0:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P1:
        addressOffset: 0x2804
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P1:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P2:
        addressOffset: 0x2808
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P2:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P3:
        addressOffset: 0x280C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P3:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P4:
        addressOffset: 0x2810
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P4:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P5:
        addressOffset: 0x2814
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P5:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P6:
        addressOffset: 0x2818
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P6:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_STARVE_TIMEOUT_P7:
        addressOffset: 0x281C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_STARVE_TIMEOUT_P7:
            description: Amount of time that may elapse (in system clocks) before this port is serviced. If a request is pending to this port for a period of time longer than 'cfg_starve_timeout_pN', it will automatically be promoted to the highest priority and serviced next. Any port having this value set to '0' will have its starvation timeout disabled.
            bitOffset: 0
            bitWidth: 12
            access: read-write
      CFG_REORDER_EN:
        addressOffset: 0x2C00
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_REORDER_EN:
            description: Enable for request reordering. 0 - Request reordering disabled 1 - Request reordering enabled This port is only used in configurations of the Reorder Core where request reordering is supported. Refer to section 3.4 for details on request reordering. When this port is set to '1' and 'cfg_reorder_queue_en' is also '1', reordering of buffered entries is enabled, otherwise the buffered entries are issued in fifo order. If 'cfg_reorder_queue_en' is set to '0', cfg_reorder_en is a don't care.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_REORDER_QUEUE_EN:
        addressOffset: 0x2C04
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_REORDER_QUEUE_EN:
            description: Reorder queue enable. When set to '1', allows requests to stack up in reorder queue. Reordering will occur if 'cfg_reorder_en' is also set to 1. This port is only used in configurations of the Reorder Core where request reordering is supported. Refer to section section 3.4 for details on request reordering. This port is typically only provided for ASIC configurations. Under normal circumstances this port will always be set to '1'. It is provided for debugging purposes.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_INTRAPORT_REORDER_EN:
        addressOffset: 0x2C08
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_INTRAPORT_REORDER_EN:
            description: Enable intra-port reordering. 0 - Intra-port request reordering disabled 1 - Intra-port request reordering enabled This port is ignored if cfg_reorder_en is set to '0'. Refer to section section 3.4 for details on request reordering and intraport reordering.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_MAINTAIN_COHERENCY:
        addressOffset: 0x2C0C
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_MAINTAIN_COHERENCY:
            description: Causes data coherency to be maintained by preventing reordering of requests addressing the same memory region. Refer to Reorder Core User Guide for a description of memory regions.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_Q_AGE_LIMIT:
        addressOffset: 0x2C10
        size: 32
        access: read-write
        resetValue: 0xFF
        fields:
          CFG_Q_AGE_LIMIT:
            description: Reorder core queue entry age limit. The age limit value prevents the oldest entry in the queue from being 'stuck' in the reorder queue for too long. When the oldest entry in the queue changes, the age limit counter is reset and starts counting. Each time a newer entry exits the reorder queue (has been issued to the controller) without the oldest entry in the queue being issued, the 'age' of the oldest entry in the queue is incremented. If cfg_q_age_limit newer entries are issued before the oldest entry is issued, then the oldest entry in the queue becomes the highest priority and is always issued next. The width of the cfg_q_age_limit value is set by the parameter QUEUE_AGE_BITS. QUEUE_AGE_BITS can be set to as small as 1 (but this is not recommended) and can be set to as large of a value that the application needs; however when using cfg_q_age_limit values larger than the REORDER_QUEUE_DEPTH, this can result in the oldest entry being "stuck" in the queue for too long. This port is only useful in configurations of the Reorder Core where request reordering is supported. Refer to section 3.4 for details on request reordering. Both 'cfg_reorder_en' and 'cfg_reorder_queue_en' must be set to '1'. When either of these configuration bits are set to 0, the reorder queue entries are issued in the order that they arrived at the input to the reorder queue.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      CFG_RO_CLOSED_PAGE_POLICY:
        addressOffset: 0x2C18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RO_CLOSED_PAGE_POLICY:
            description: Reorder core closed page policy control. When this bit is set, the reorder core adjusts its reordering algorithm (currently only when using Criteria 0) to optimize for the case that all read/write accesses are issued with the auto_precharge bit set. When the reorder_queue entry buffering is enabled (cfg_reorder_queue_en = 1), this bit forces all accesses that exit the reorder core to have the auto-precharge bit set if the closed page policy mode has been selected. In other words, cfg_ro_closed_page_policy must be clear or cfg_reorder_queue_en must be clear to allow l_auto_pch inputs (per port) to control the auto precharge function per mpfe input port.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_REORDER_RW_ONLY:
        addressOffset: 0x2C1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_REORDER_RW_ONLY:
            description: 'Reorder core read/write reordering only. When this bit is set, the reorder core adjusts its reordering algorithm (currently only when using Criteria 0)to maximize the grouping of reads and writes together (normal Criteria 0 filtering is not used). Switching between issuing reads and writes only occur if one of the following things occur: o Issuing a stream of reads (or writes) and there are no more coherent, priority-enabled reads (or writes) to issue o The oldest entry in the reorder queue times out. Note that if cfg_manual_address_map is set and reordering is enabled, then the cfg_reorder_rw_only bit should normally be set as well (normal reordering algorithms will not work as expected if using manual address mapping in the controller core). When cfg_reorder_rw_only is clear and reordering is enabled, then the normal filtering algorithm is used to select the next request to issue from the reorder core.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RO_PRIORITY_EN:
        addressOffset: 0x2C20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_RO_PRIORITY_EN:
            description: Reorder_core QOS/priority enable. When this bit is set (and REORDER_PRIORITY_ENABLE parameter was set during synthesis), the reorder core will normally send out only requests that have the highest priority (except if the oldest entry in the reorder core has aged/timed-out). If clear (or the REORDER_PRIORITY_ENABLE parameter was clear during synthesis), the reorder core ignores any incoming priority and selects the next request from the reorder_queue to maximize bandwidth/performance.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_DM_EN:
        addressOffset: 0x3000
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_DM_EN:
            description: When set to '1' the RMW Core will use data mask signals to the memory in order to optimize certain RMW operations. This port must be set to '0' if the DRAM data mask signals are not connected to the memory devices.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_RMW_EN:
        addressOffset: 0x3004
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_RMW_EN:
            description: Enable or disable RMW. 0 - disables RMW operations. 1 - enables RMW operations. When disabled, the RMW Core requires that the memory support data mask functionality (no ECC, data mask pins connected through to memory devices) and cfg_dm_en must be set to '1'. A setting of '0' also enables use of the 'l_dm_in' data mask inputs.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ECC_CORRECTION_EN:
        addressOffset: 0x3400
        size: 32
        access: read-write
        resetValue: 0x1
        fields:
          CFG_ECC_CORRECTION_EN:
            description: Enables ECC error correction and detection 0x1 - Correction and detection function is enabled, 1 bit errors will be corrected, multi-bit errors will not be corrected. Errors occurring in an odd number of bits (3,5,7, etc.) could have additional bit inversions due to attempted correction. 0x0 - Correction and detection function is disabled. ECC errors are not reported.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CFG_ECC_BYPASS:
        addressOffset: 0x3440
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ECC_BYPASS:
            description: When set to 1, the controller will not compute ECC check data or perform ECC correction on received data. When in ECC bypass mode, axiN_wdata_parity input pins are repurposed to be the data that gets written to ECC memory. Likewise, axiN_rdata_parity outputs are repurposed to be the data that gets read out of ECC memory.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_WRITE_DATA_1B_ECC_ERROR_GEN:
        addressOffset: 0x3444
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_WRITE_DATA_1B_ECC_ERROR_GEN:
            description: Memory controller write data path 1-bit ECC error generation. This register contains one bit per 64-bits (ECC generators are used per 64-bits of data path width) of user interface data path width. When set, will invert the corresponding ECC generator's least significant ECC check bit (causing a 1-bit ECC error) on the next cycle of write data. Error generation will persist for only one cycle. To cause a subsequent 1-bit ECC error generation cycle, a bit must be written to 0 and then back to 1.
            bitOffset: 0
            bitWidth: 2
            access: read-write
      INIT_WRITE_DATA_2B_ECC_ERROR_GEN:
        addressOffset: 0x3448
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_WRITE_DATA_2B_ECC_ERROR_GEN:
            description: Memory controller write data path 2-bit ECC error generation. This register contains one bit per 64-bits (ECC generators are used per 64-bits of data path width) of user interface data path width. When set, will invert the corresponding ECC generator's 2 most significant of the 3 least significant ECC check bits (causing a 2-bit ECC error) on the next cycle of write data. Error generation will persist for only one cycle. To cause a subsequent 2-bit ECC error generation cycle, a bit must be written to 0 and then back to 1.
            bitOffset: 0
            bitWidth: 2
            access: read-write
      CFG_ECC_1BIT_INT_THRESH:
        addressOffset: 0x345C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CFG_ECC_1BIT_INT_THRESH:
            description: This 8-bit value defines the number of ECC 1-bit error corrections that must be exceeded before the stat_int_ecc_1bit_thresh status bit (and interrupt output pin) are set and the error summing register is cleared to start summing new ECC 1bit error correction counts. Setting this value to 0 means that each new correctable ecc error will signal an interrupt/set the status bit. Setting this value to the maximum value of 0xff will disable generating the interrupt and interrupt status. Note that if the parity error retry module is included, 1bit error corrections signaled into that unit are not counted and only the 1bit corrected errors that are passed on to the user logic interface from this unit are counted. Also if the RMW unit is included and a read prefetch is performed to allow data to be merged with a user write and the read prefetch results in a 1bit ecc correction, this 1bit correction will be counted by the ecc_1bit_int_threshold detection logic. Finally, if the ECC Scrub logic is included, any ECC corrections detected by this unit will also be counted.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      STAT_INT_ECC_1BIT_THRESH:
        addressOffset: 0x3460
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          STAT_INT_ECC_1BIT_THRESH:
            description: This bit is set when the number of 1bit ECC error corrections is greater-than the cfg_ecc_1bit_thresh. This status bit should be read to clear the status and associated interrupt pin output as soon as possible, to avoid missing the setting of this status/interrupt due to new 1bit ECC error corrections.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_READ_CAPTURE_ADDR:
        addressOffset: 0x3800
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_READ_CAPTURE_ADDR:
            description: 'Address to be read from read capture buffer. The address is referenced to the location of the buffer corresponding to the oldest data captured (i.e. location 0 is the oldest captured data). A write to this register will strobe the init_read_capture_data ''holding register'' with new data from the specified address. The first subsequent read to init_read_capture_data will get this data from the ''holding register''; thus an update of init_read_capture_addr should only occur after the read data has been captured in the controller and the controller is quiesced (not performing new local bus or csr initiated reads). The read capture buffer has a depth based on the frequency ratio and the supported memory type. For memory controller configurations that support LPDDR4 memory, the depth is as follows: Frequency ratio 1 - depth is 8 entries Frequency ratio 2 - depth is 4 entries Frequency ratio 4 - depth is 2 entries For all other memory controller configurations, the depth is as follows: Frequency ratio 1 - depth is 4 entries Frequency ratio 2 - depth is 2 entries Frequency ratio 4 - depth is 1 entry'
            bitOffset: 0
            bitWidth: 4
            access: read-write
      INIT_READ_CAPTURE_DATA_0:
        addressOffset: 0x3804
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          INIT_READ_CAPTURE_DATA_0:
            description: A read returns data from read capture buffer holding register that must first be set to the new value at an offset set by a write to the 'init_read_capture_addr'. Each read of the 'init_read_capture_data' register will automatically increment the read address after the read to the next location of the buffer and update the read capture buffer holding register with the new data to allow efficiently reading the locations sequentially. Note that the user must not initiate any new memory device reads that will update read capture buffer, until the init_read_capture buffer has been read-out for the prior memory device read.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      INIT_READ_CAPTURE_DATA_1:
        addressOffset: 0x3808
        size: 32
        access: read-only
        resetValue: 0x0
