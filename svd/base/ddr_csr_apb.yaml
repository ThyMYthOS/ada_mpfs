            description: 'For DDR4: Asserts when an assertion is detected on the ''ALERT_n'' pin. Each occurrence of a write CRC error or CA parity error will cause assertion of the DDR4 device ''ALERT_n'' pin. For HBM: Asserts when an assertion is detected on the ''AERR'' pin. Each occurrence of an address parity error will cause an assertion of the HBM device ''AERR'' pin. The value is cleared on read.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CA_PARITY_ERROR_GEN_REQ:
        addressOffset: 0x5C0C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CA_PARITY_ERROR_GEN_REQ:
            description: When asserted, causes parity error to be introduced on command/address bus on the next command corresponding to that specified in the init_ca_parity_error_gen_cmd register. The parity error is generated by inverting the 'parity_in' bit going to the PHY from the calculated even parity value. Only one parity error is introduced per 'init_ca_parity_error_gen_req' / 'init_ca_parity_error_gen_ack' cycle.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      INIT_CA_PARITY_ERROR_GEN_CMD:
        addressOffset: 0x5C10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          INIT_CA_PARITY_ERROR_GEN_CMD:
            description: 'Specifies command for which parity error will be generated when ''init_ca_parity_error_gen_req'' is asserted. The controller will wait for this command before generating the error. Command encoding is as follows: 0x0 - Reserved 0x1 - Reserved 0x2 - Reserved 0x3 - Reserved 0x4 - Reserved 0x5 - Reserved 0x6 - Reserved 0x7 - ACT 0x8 - MRS 0x9 - REF 0xa - PRE / PREA 0xb - Reserved 0xc - WR/WRA 0xd - RD/RDA 0xe - ZQ-Cal 0xf - NOP'
            bitOffset: 0
