      CFG_DFI_T_RDDATA_EN:
        addressOffset: 0xDC00
        size: 32
        access: read-write
        resetValue: 0x14
        fields:
          CFG_DFI_T_RDDATA_EN:
            description: 'Used to derive the delay from assertion of read command to dfi_rddata_en assertion at the DFI interface. The resulting delay, referred to as tRDDATA_EN in the DFI specification, is calculated below. Full-Rate: CAS read latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_rddata_en - 9 Half-Rate: CAS read latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_rddata_en - 19 Quarter-Rate: CAS read latency + Additive Latency + Parity Latency (DDR4 only) + Command Address Latency (DDR4 only) + cfg_regdimm + cfg_dfi_t_rddata_en - 36 This value is typically established as a constant for a particular PHY and is not intended to be changed from its reset value. Since the tRDDATA_EN that the controller generates is a function of the programmed latencies, cfg_dfi_t_rddata_en does not need to be reprogrammed whenever the latencies are changed.'
            bitOffset: 0
            bitWidth: 6
            access: read-write
      CFG_DFI_T_PHY_RDLAT:
        addressOffset: 0xDC04
        size: 32
        access: read-write
        resetValue: 0x5
        fields:
          CFG_DFI_T_PHY_RDLAT:
            description: Number of memory clocks from assertion of dfi_rddata_en to dfi_rddata_valid assertion. This parameter is only valid for PHY configurations where the dfi_rddata_valid is generated within the controller and the dfi_rddata_valid from the PHY is unused or unavailable. When the controller is generating the dfi_rddata_valid, this value is set based on PHY requirements.
