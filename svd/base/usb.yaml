# status: unverified (checked against the Linux MUSB driver, drivers/usb/musb, with the corrections below; the register layout, the endpoint and DMA channel count, the stored bits and the reset values were measured on silicon on 2026-10-28; the interrupt status bits and their clear on read, VBUS_CSR and the effect of SOFT_RST are not yet verified)
# source: Microchip platform drivers/mss/mss_usb (register layout for up to 16 endpoints, 32-bit DMA words, FIFO size encoding) and Linux drivers/usb/musb/{musb_regs.h,musb_dma.h,musb_core.c,musbhsdma.c,mpfs.c}: register names, DMA interrupt register, FIFO size encoding, writable flags, MISC, read side effects
# source: hardware probe on an Icicle Kit (MPFS250T): EP_INFO reads 0x44 (4 TX and 4 RX endpoints besides EP0), TX_IRQ_ENABLE reads 0x1F and RX_IRQ_ENABLE 0x1E (EP0..EP4), RAM_INFO reads 0x4B, INDEXED_FIFO_SIZE reads 0xDE at INDEX 0
# source: hardware probe on an Icicle Kit (MPFS250T), boot mode 0, 2026-10-28, OpenOCD with the clocks on: EP1..EP4 store the indexed, FIFO and host address registers, EP5, EP8 and EP15 read 0 and store nothing; DMA channels 0 and 3 store ADDR, COUNT and CNTL (32-bit access), channels 4 and 7 read 0; the reset values of the registers named in their descriptions; with a USB cable to a host and POWER.SOFT_CONN set no interrupt arrived (DEV_CTRL stayed 0x80, VBUS below the session level), so the status bits were not exercised
# source: Linux drivers/usb/musb/musb_host.c: h_addr_reg |= 0x80 for a multi-TT hub (the multi-TT flag is bit 7 of the hub address register; the vendor header TARGET_DEVICE_HUB_MT_MASK 0x10 at shift 7 does not fit)
# owner: Manuel Stahl
#
# The register layout is that of the MUSB core for up to 16 endpoints. The MPFS250T implements the control endpoint
# EP0 and the endpoints EP1..EP4 (TX and RX each); the registers and interrupt bits of EP5..EP15 are part of the layout
# and read 0 there (measured: the indexed, FIFO, host address and RQ_PKT_CNT registers of EP5, EP8 and EP15 read 0 and store
# nothing). The register arrays keep all 16 entries.
_add:
  USB:
    description: MSS USB 2.0 OTG High-Speed Controller
    baseAddress: 0x20201000
    registers:
      FADDR:
        description: Function Address Register (peripheral mode)
        addressOffset: 0x0
        size: 8
        access: read-write
        fields:
          FUNC_ADDR:
            description: USB function address (0–127)
            bitOffset: 0
            bitWidth: 7
      POWER:
        description: Power Management and High-Speed Control Register
        addressOffset: 0x1
        size: 8
        access: read-write
        resetValue: 0x20
        fields:
          ENSUSPEND:
            description: Enable the SuspendM signal output
            bitOffset: 0
            bitWidth: 1
          SUSPEND_MODE:
            description: 'Suspend mode: set by software to enter suspend (SUSPENDM), read back as the suspend state'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RESUME_SIGNAL:
            description: Drive resume signalling on the bus
            bitOffset: 2
            bitWidth: 1
          BUS_RESET_SIGNAL:
            description: USB bus reset signalling active (read-only in device mode)
            bitOffset: 3
            bitWidth: 1
          HS_MODE:
            description: High-speed mode negotiated and active (read-only)
            bitOffset: 4
            bitWidth: 1
            access: read-only
          ENABLE_HS:
            description: Enable high-speed negotiation during reset
            bitOffset: 5
            bitWidth: 1
          SOFT_CONN:
            description: Soft connect / disconnect control (peripheral mode)
            bitOffset: 6
            bitWidth: 1
          ISO_UPDATE:
            description: 'Isochronous update: wait for SOF before sending (peripheral)'
            bitOffset: 7
            bitWidth: 1
      TX_IRQ:
        description: TX Endpoint Interrupt Status Register (read-clears; EP0..EP4 are implemented on the MPFS250T)
        addressOffset: 0x2
        size: 16
        access: read-only
        fields:
          EP0:
            description: EP0 interrupt pending
            bitOffset: 0
            bitWidth: 1
            readAction: clear
          EP1:
            description: TX EP1 interrupt pending
            bitOffset: 1
            bitWidth: 1
            readAction: clear
          EP2:
            description: TX EP2 interrupt pending
            bitOffset: 2
            bitWidth: 1
            readAction: clear
          EP3:
            description: TX EP3 interrupt pending
            bitOffset: 3
            bitWidth: 1
            readAction: clear
          EP4:
            description: TX EP4 interrupt pending
            bitOffset: 4
            bitWidth: 1
            readAction: clear
          EP5:
            description: TX EP5 interrupt pending
            bitOffset: 5
            bitWidth: 1
            readAction: clear
          EP6:
            description: TX EP6 interrupt pending
            bitOffset: 6
            bitWidth: 1
            readAction: clear
          EP7:
            description: TX EP7 interrupt pending
            bitOffset: 7
            bitWidth: 1
            readAction: clear
          EP8:
            description: Endpoint 8
            bitOffset: 8
            bitWidth: 1
            readAction: clear
          EP9:
            description: Endpoint 9
            bitOffset: 9
            bitWidth: 1
            readAction: clear
          EP10:
            description: Endpoint 10
            bitOffset: 10
            bitWidth: 1
            readAction: clear
          EP11:
            description: Endpoint 11
            bitOffset: 11
            bitWidth: 1
            readAction: clear
          EP12:
            description: Endpoint 12
            bitOffset: 12
            bitWidth: 1
            readAction: clear
          EP13:
            description: Endpoint 13
            bitOffset: 13
            bitWidth: 1
            readAction: clear
          EP14:
            description: Endpoint 14
            bitOffset: 14
            bitWidth: 1
            readAction: clear
          EP15:
            description: Endpoint 15
            bitOffset: 15
            bitWidth: 1
            readAction: clear
      RX_IRQ:
        description: RX Endpoint Interrupt Status Register (read-clears; bit 0 unused; EP1..EP4 are implemented on the MPFS250T)
        addressOffset: 0x4
        size: 16
        access: read-only
        fields:
          EP1:
            description: RX EP1 interrupt pending
            bitOffset: 1
            bitWidth: 1
            readAction: clear
          EP2:
            description: RX EP2 interrupt pending
            bitOffset: 2
            bitWidth: 1
            readAction: clear
          EP3:
            description: RX EP3 interrupt pending
            bitOffset: 3
            bitWidth: 1
            readAction: clear
          EP4:
            description: RX EP4 interrupt pending
            bitOffset: 4
            bitWidth: 1
            readAction: clear
          EP5:
            description: RX EP5 interrupt pending
            bitOffset: 5
            bitWidth: 1
            readAction: clear
          EP6:
            description: RX EP6 interrupt pending
            bitOffset: 6
            bitWidth: 1
            readAction: clear
          EP7:
            description: RX EP7 interrupt pending
            bitOffset: 7
            bitWidth: 1
            readAction: clear
          EP8:
            description: Endpoint 8
            bitOffset: 8
            bitWidth: 1
            readAction: clear
          EP9:
            description: Endpoint 9
            bitOffset: 9
            bitWidth: 1
            readAction: clear
          EP10:
            description: Endpoint 10
            bitOffset: 10
            bitWidth: 1
            readAction: clear
          EP11:
            description: Endpoint 11
            bitOffset: 11
            bitWidth: 1
            readAction: clear
          EP12:
            description: Endpoint 12
            bitOffset: 12
            bitWidth: 1
            readAction: clear
          EP13:
            description: Endpoint 13
            bitOffset: 13
            bitWidth: 1
            readAction: clear
          EP14:
            description: Endpoint 14
            bitOffset: 14
            bitWidth: 1
            readAction: clear
          EP15:
            description: Endpoint 15
            bitOffset: 15
            bitWidth: 1
            readAction: clear
      TX_IRQ_ENABLE:
        description: "TX Endpoint Interrupt Enable Register (EP0..EP4 are implemented on the MPFS250T; the board reads 0x1F). Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0x1F, a write of 0xFFFF reads back 0x1F (bits of EP0..EP4 only)."
        addressOffset: 0x6
        size: 16
        access: read-write
        resetValue: 0x1F
        fields:
          EP0:
            description: EP0 / control endpoint interrupt enable
            bitOffset: 0
            bitWidth: 1
          EP1:
            description: TX EP1 interrupt enable
            bitOffset: 1
            bitWidth: 1
          EP2:
            description: TX EP2 interrupt enable
            bitOffset: 2
            bitWidth: 1
          EP3:
            description: TX EP3 interrupt enable
            bitOffset: 3
            bitWidth: 1
          EP4:
            description: TX EP4 interrupt enable
            bitOffset: 4
            bitWidth: 1
          EP5:
            description: TX EP5 interrupt enable
            bitOffset: 5
            bitWidth: 1
          EP6:
            description: TX EP6 interrupt enable
            bitOffset: 6
            bitWidth: 1
          EP7:
            description: TX EP7 interrupt enable
            bitOffset: 7
            bitWidth: 1
          EP8:
            description: Endpoint 8
            bitOffset: 8
            bitWidth: 1
          EP9:
            description: Endpoint 9
            bitOffset: 9
            bitWidth: 1
          EP10:
            description: Endpoint 10
            bitOffset: 10
            bitWidth: 1
          EP11:
            description: Endpoint 11
            bitOffset: 11
            bitWidth: 1
          EP12:
            description: Endpoint 12
            bitOffset: 12
            bitWidth: 1
          EP13:
            description: Endpoint 13
            bitOffset: 13
            bitWidth: 1
          EP14:
            description: Endpoint 14
            bitOffset: 14
            bitWidth: 1
          EP15:
            description: Endpoint 15
            bitOffset: 15
            bitWidth: 1
      RX_IRQ_ENABLE:
        description: "RX Endpoint Interrupt Enable Register (EP1..EP4 are implemented on the MPFS250T; the board reads 0x1E). Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0x1E, a write of 0xFFFF reads back 0x1E (bits of EP1..EP4 only)."
        addressOffset: 0x8
        size: 16
        access: read-write
        resetValue: 0x1E
        fields:
          EP1:
            description: RX EP1 interrupt enable
            bitOffset: 1
            bitWidth: 1
          EP2:
            description: RX EP2 interrupt enable
            bitOffset: 2
            bitWidth: 1
          EP3:
            description: RX EP3 interrupt enable
            bitOffset: 3
            bitWidth: 1
          EP4:
            description: RX EP4 interrupt enable
            bitOffset: 4
            bitWidth: 1
          EP5:
            description: RX EP5 interrupt enable
            bitOffset: 5
            bitWidth: 1
          EP6:
            description: RX EP6 interrupt enable
            bitOffset: 6
            bitWidth: 1
          EP7:
            description: RX EP7 interrupt enable
            bitOffset: 7
            bitWidth: 1
          EP8:
            description: Endpoint 8
            bitOffset: 8
            bitWidth: 1
          EP9:
            description: Endpoint 9
            bitOffset: 9
            bitWidth: 1
          EP10:
            description: Endpoint 10
            bitOffset: 10
            bitWidth: 1
          EP11:
            description: Endpoint 11
            bitOffset: 11
            bitWidth: 1
          EP12:
            description: Endpoint 12
            bitOffset: 12
            bitWidth: 1
          EP13:
            description: Endpoint 13
            bitOffset: 13
            bitWidth: 1
          EP14:
            description: Endpoint 14
            bitOffset: 14
            bitWidth: 1
          EP15:
            description: Endpoint 15
            bitOffset: 15
            bitWidth: 1
      USB_IRQ:
        description: USB Common Interrupt Status Register
        addressOffset: 0xa
        size: 8
        access: read-only
        fields:
          SUSPEND:
            description: Suspend condition detected
            bitOffset: 0
            bitWidth: 1
            readAction: clear
          RESUME:
            description: Resume signalling detected
            bitOffset: 1
            bitWidth: 1
            readAction: clear
          RESET_BABBLE:
            description: Bus reset (device) or babble (host) detected
            bitOffset: 2
            bitWidth: 1
            readAction: clear
          SOF:
            description: Start-of-Frame token received / generated
            bitOffset: 3
            bitWidth: 1
            readAction: clear
          CONN:
            description: Device connected (host mode)
            bitOffset: 4
            bitWidth: 1
            readAction: clear
          DISCONN:
            description: Device disconnected
            bitOffset: 5
            bitWidth: 1
            readAction: clear
          SESSION_REQ:
            description: Session-request protocol event (OTG)
            bitOffset: 6
            bitWidth: 1
            readAction: clear
          VBUS_ERROR:
            description: VBUS error (OTG)
            bitOffset: 7
            bitWidth: 1
            readAction: clear
      USB_ENABLE:
        description: "USB Common Interrupt Enable Register. Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0x06 (RESUME and RESET_BABBLE), all 8 bits are stored."
        addressOffset: 0xb
        size: 8
        access: read-write
        resetValue: 0x6
        fields:
          SUSPEND:
            description: Suspend interrupt enable
            bitOffset: 0
            bitWidth: 1
          RESUME:
            description: Resume interrupt enable
            bitOffset: 1
            bitWidth: 1
          RESET_BABBLE:
            description: Reset/babble interrupt enable
            bitOffset: 2
            bitWidth: 1
          SOF:
            description: SOF interrupt enable
            bitOffset: 3
            bitWidth: 1
          CONN:
            description: Connect interrupt enable
            bitOffset: 4
            bitWidth: 1
          DISCONN:
            description: Disconnect interrupt enable
            bitOffset: 5
            bitWidth: 1
          SESSION_REQ:
            description: Session-request interrupt enable
            bitOffset: 6
            bitWidth: 1
          VBUS_ERROR:
            description: VBUS error interrupt enable
            bitOffset: 7
            bitWidth: 1
      FRAME:
        description: USB Frame Number Register (read-only)
        addressOffset: 0xc
        size: 16
        access: read-only
        fields:
          FRAME_NUM:
            description: Current USB SOF frame number (0–2047)
            bitOffset: 0
            bitWidth: 11
      INDEX:
        description: Endpoint Index Register — selects which endpoint CSRs appear at 0x010–0x01F
        addressOffset: 0xe
        size: 8
        access: read-write
        fields:
          ENDPOINT_INDEX:
            description: Active endpoint number (0–15) for indexed CSR window; the MPFS250T implements EP0..EP4
            bitOffset: 0
            bitWidth: 4
      TEST_MODE:
        description: USB Test Mode Control Register
        addressOffset: 0xf
        size: 8
        access: read-write
        fields:
          SE0NAK:
            description: Force SE0/NAK test
            bitOffset: 0
            bitWidth: 1
          TEST_J:
            description: Force HS Test_J state
            bitOffset: 1
            bitWidth: 1
          TEST_K:
            description: Force HS Test_K state
            bitOffset: 2
            bitWidth: 1
          TEST_PACKET:
            description: Transmit test packet
            bitOffset: 3
            bitWidth: 1
          FORCE_HS:
            description: Force high-speed operation
            bitOffset: 4
            bitWidth: 1
          FORCE_FS:
            description: Force full-speed operation
            bitOffset: 5
            bitWidth: 1
          FIFO_ACCESS:
            description: Enable FIFO access mode (self-clearing)
            bitOffset: 6
            bitWidth: 1
          FORCE_HOST:
            description: Force host mode
            bitOffset: 7
            bitWidth: 1
      INDEXED_TX_MAX_P:
        description: "Indexed TX Maximum Packet Size (endpoint selected by INDEX). Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): at INDEX 1 and 4 a write of 0xFFFF reads back 0xFFFF (all 16 bits are stored); at INDEX 0, 5, 8 and 15 it reads 0."
        addressOffset: 0x10
        size: 16
        access: read-write
        fields:
          MAX_PAYLOAD:
            description: Maximum TX packet payload in bytes (bits[10:0])
            bitOffset: 0
            bitWidth: 11
          NUM_USB_PKTS:
            description: High-bandwidth packets per micro-frame minus 1 (bits[15:11])
            bitOffset: 11
            bitWidth: 5
      INDEXED_TX_CSR:
        description: "Indexed TX Control/Status Register — EPN view (N>0).\n            Upper byte (TxCSRH) carries DMA and mode control.\n            Bit semantics differ between device and host mode."
        addressOffset: 0x12
        size: 16
        access: read-write
        fields:
          TX_PKT_RDY:
            description: Set to indicate TX FIFO loaded; cleared by hardware after transmission
            bitOffset: 0
            bitWidth: 1
          TX_FIFO_NE:
            description: TX FIFO not empty (read-only)
            bitOffset: 1
            bitWidth: 1
            access: read-only
          UNDERRUN_RESPONSE_ERR:
            description: Underrun error (device) / no response error (host)
            bitOffset: 2
            bitWidth: 1
          FLUSH_FIFO:
            description: Flush TX FIFO (self-clearing)
            bitOffset: 3
            bitWidth: 1
          SEND_STALL_SETUP_PKT:
            description: Issue STALL handshake (device) / send SETUP token (host)
            bitOffset: 4
            bitWidth: 1
          STALL_SENT_STALL_RCVD:
            description: STALL handshake sent (device) / STALL received (host)
            bitOffset: 5
            bitWidth: 1
          CLR_DATA_TOG:
            description: Reset TX data toggle to DATA0
            bitOffset: 6
            bitWidth: 1
          ISO_INCOMP_NAK_TIMEOUT:
            description: Incomplete ISO TX (device) / NAK timeout (host)
            bitOffset: 7
            bitWidth: 1
          DATA_TOG:
            description: Current TX data toggle value (host only, read-only) (written only with DATA_TOG_WE set)
            bitOffset: 8
            bitWidth: 1
            access: read-write
          DATA_TOG_WE:
            description: Enable write to DATA_TOG bit (host only, self-clearing)
            bitOffset: 9
            bitWidth: 1
          DMA_MODE:
            description: 'DMA request mode: 0=mode0, 1=mode1'
            bitOffset: 10
            bitWidth: 1
          FRC_DATA_TOG:
            description: Force data toggle (used for bulk transactions)
            bitOffset: 11
            bitWidth: 1
          ENABLE_DMA:
            description: Enable DMA request for this TX endpoint
            bitOffset: 12
            bitWidth: 1
          TXRX_MODE:
            description: 'Direction mode: 1=TX only when endpoint is bidirectional'
            bitOffset: 13
            bitWidth: 1
          ENABLE_ISO:
            description: Isochronous mode enable (device only)
            bitOffset: 14
            bitWidth: 1
          ENABLE_AUTOSET:
            description: Auto-set TxPktRdy when FIFO full
            bitOffset: 15
            bitWidth: 1
      INDEXED_CSR0:
        description: "Indexed EP0 Control/Status Register — EP0 view only (INDEX=0).\n            Overlaps INDEXED_TX_CSR; bit definitions differ completely."
        addressOffset: 0x12
        size: 16
        access: read-write
        fields:
          RX_PKT_RDY:
            description: Data packet received in EP0 RX FIFO (device) / RX ready (host) (cleared by writing 0)
            bitOffset: 0
            bitWidth: 1
            access: read-write
          TX_PKT_RDY:
            description: Data packet loaded in EP0 TX FIFO (device/host)
            bitOffset: 1
            bitWidth: 1
          STALL_SENT_STALL_RCVD:
            description: STALL sent (device) / STALL received (host)
            bitOffset: 2
            bitWidth: 1
            access: read-only
          DATA_END_SETUP_PKT:
            description: Signal data end (device) / SETUP packet (host)
            bitOffset: 3
            bitWidth: 1
          SETUP_END_RETRY_ERR:
            description: Setup end condition (device, read-only) / retry error (host)
            bitOffset: 4
            bitWidth: 1
            access: read-only
          SEND_STALL_IN_PKT_REQ:
            description: Issue STALL (device) / IN packet request (host)
            bitOffset: 5
            bitWidth: 1
          SERVICED_RX_PKT_RDY_STATUS_PKT:
            description: ServicedRxPktRdy (device) / status packet (host)
            bitOffset: 6
            bitWidth: 1
          SERVICED_SETUP_END_NAK_TIMEOUT:
            description: ServicedSetupEnd (device) / NAK timeout (host)
            bitOffset: 7
            bitWidth: 1
          FLUSH_FIFO:
            description: Flush EP0 FIFO (self-clearing)
            bitOffset: 8
            bitWidth: 1
          DATA_TOG:
            description: Data toggle value (host only) (written only with DATA_TOG_WE set)
            bitOffset: 9
            bitWidth: 1
            access: read-write
          DATA_TOG_WE:
            description: Enable write to DATA_TOG (host only, self-clearing)
            bitOffset: 10
            bitWidth: 1
          DISABLE_PING:
            description: Disable PING token generation (host only)
            bitOffset: 11
            bitWidth: 1
      INDEXED_RX_MAX_P:
        description: "Indexed RX Maximum Packet Size (endpoint selected by INDEX). Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): at INDEX 1 and 4 a write of 0xFFFF reads back 0xFFFF (all 16 bits are stored); at INDEX 0, 5, 8 and 15 it reads 0."
        addressOffset: 0x14
        size: 16
        access: read-write
        fields:
          MAX_PAYLOAD:
            description: Maximum RX packet payload in bytes (bits[10:0])
            bitOffset: 0
            bitWidth: 11
          NUM_USB_PKTS:
            description: High-bandwidth packets per micro-frame minus 1 (bits[15:11])
            bitOffset: 11
            bitWidth: 5
      INDEXED_RX_CSR:
        description: "Indexed RX Control/Status Register — EPN view (N>0).\n            Upper byte (RxCSRH) carries DMA, ISO and mode bits.\n            Bit semantics differ between device and host mode."
        addressOffset: 0x16
        size: 16
        access: read-write
        fields:
          RX_PKT_RDY:
            description: Data packet available in RX FIFO (cleared by software) (cleared by writing 0)
            bitOffset: 0
            bitWidth: 1
            access: read-write
          RX_FIFO_FULL:
            description: RX FIFO full (read-only)
            bitOffset: 1
            bitWidth: 1
            access: read-only
          OVERRUN_RESPONSE_ERR:
            description: Overrun (device) / no response error (host)
            bitOffset: 2
            bitWidth: 1
          DATA_ERR_NAK_TIMEOUT:
            description: Data CRC/bit-stuff error (device) / NAK timeout (host)
            bitOffset: 3
            bitWidth: 1
          FLUSH_FIFO:
            description: Flush RX FIFO (self-clearing)
            bitOffset: 4
            bitWidth: 1
          SEND_STALL_IN_PKT_REQ:
            description: Issue STALL (device) / IN packet request (host)
            bitOffset: 5
            bitWidth: 1
          STALL_SENT_STALL_RCVD:
            description: STALL sent (device) / STALL received (host)
            bitOffset: 6
            bitWidth: 1
          CLR_DATA_TOG:
            description: Reset RX data toggle to DATA0
            bitOffset: 7
            bitWidth: 1
          RX_ISO_INCOMP:
            description: Incomplete ISO RX in this frame
            bitOffset: 8
            bitWidth: 1
            access: read-only
          DATA_TOG:
            description: Current RX data toggle (host only, read-only) (written only with DATA_TOG_WE set)
            bitOffset: 9
            bitWidth: 1
            access: read-write
          DATA_TOG_WE:
            description: Enable write to DATA_TOG (host only)
            bitOffset: 10
            bitWidth: 1
          DMA_MODE:
            description: 'DMA request mode: 0=mode0, 1=mode1'
            bitOffset: 11
            bitWidth: 1
          ISO_PID_ERR_BI_DIS_NYET:
