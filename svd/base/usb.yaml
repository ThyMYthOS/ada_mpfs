              TARGET_EP_NUM:
                description: Target endpoint number (bits[3:0])
                bitOffset: 0
                bitWidth: 4
              PROTOCOL:
                description: 00=Control, 01=Isoch, 10=Bulk, 11=Interrupt
                bitOffset: 4
                bitWidth: 2
              SPEED:
                description: 00=same, 01=High, 10=Full, 11=Low
                bitOffset: 6
                bitWidth: 2
          TX_INTERVAL:
            description: TX Polling Interval / NAK Limit (host mode)
            addressOffset: 0xb
            size: 8
            access: read-write
          RX_TYPE:
            description: RX Type Register — target EP, protocol, speed (host mode)
            addressOffset: 0xc
            size: 8
            access: read-write
            fields:
              TARGET_EP_NUM:
                description: Target endpoint number (bits[3:0])
                bitOffset: 0
                bitWidth: 4
              PROTOCOL:
                description: 00=Control, 01=Isoch, 10=Bulk, 11=Interrupt
                bitOffset: 4
                bitWidth: 2
              SPEED:
                description: 00=same, 01=High, 10=Full, 11=Low
                bitOffset: 6
                bitWidth: 2
          RX_INTERVAL:
            description: RX Polling Interval / NAK Limit (host mode)
            addressOffset: 0xd
            size: 8
            access: read-write
          FIFO_SIZE:
            description: TX/RX FIFO Size Encoding Register (read-only)
            addressOffset: 0xf
            size: 8
            access: read-only
            fields:
              TX_FIFO_SZ:
                description: TX FIFO size encoding (log2(size/8)) [3:0]
                bitOffset: 0
                bitWidth: 4
              RX_FIFO_SZ:
                description: RX FIFO size encoding (log2(size/8)) [7:4]
                bitOffset: 4
                bitWidth: 4
      DMA_CHANNEL[%s]:
        description: "DMA Channel %s Registers. Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): only channels 0..3 exist (RAM_INFO.DMA_CHANNELS is 4): channels 0 and 3 store a write, channels 4 and 7 read 0. The 32-bit accesses of the vendor driver work, and a 16-bit read returns the low half."
        dim: 8
        dimIncrement: 0x10
        dimIndex: 0,1,2,3,4,5,6,7
        addressOffset: 0x200
        registers:
          CNTL:
            description: "DMA Channel Control Register. Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0; a write of 0x6FE reads back 0x6FE with a 32-bit access (START_XFR was never written)."
            addressOffset: 0x4
            size: 32
            access: read-write
            resetValue: 0x0
            fields:
              START_XFR:
                description: Enable the DMA transfer (cleared by the driver to abort)
                bitOffset: 0
                bitWidth: 1
              DMA_DIR:
                description: 'Direction: 0=RX (write to memory), 1=TX (read from memory)'
                bitOffset: 1
                bitWidth: 1
              DMA_MODE:
                description: 'DMA mode: 0=mode0 (single packet), 1=mode1 (multi-packet)'
                bitOffset: 2
                bitWidth: 1
              ENABLE_DMA_IRQ:
                description: Enable DMA completion interrupt
                bitOffset: 3
                bitWidth: 1
              DMA_EP_NUM:
                description: Endpoint associated with this DMA channel (bits[7:4])
                bitOffset: 4
                bitWidth: 4
              DMA_BUS_ERR:
                description: AHB bus error flag (read-only; cleared by START_XFR)
                bitOffset: 8
                bitWidth: 1
                access: read-only
              DMA_BURST_MODE:
                description: 'AHB burst size: 00=unspecified, 01=INCR4, 10=INCR8, 11=INCR16 (bits[10:9])'
                bitOffset: 9
                bitWidth: 2
          ADDR:
            description: "DMA Channel Transfer Start Address Register. Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0; a write of 0x12345678 reads back the same."
            addressOffset: 0x8
            size: 32
            access: read-write
            resetValue: 0x0
          COUNT:
            description: "DMA Channel Transfer Byte Count Register. Measured on an Icicle Kit MPFS250T (boot mode 0, 2026-10-28): reset 0; a write of 0x00ABCDEF reads back the same."
            addressOffset: 0xc
            size: 32
            access: read-write
            resetValue: 0x0
