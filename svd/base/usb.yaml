            size: 16
            access: read-write
            fields:
              MAX_PAYLOAD:
                description: Maximum RX payload bytes (bits[10:0])
                bitOffset: 0
                bitWidth: 11
              NUM_USB_PKTS:
                description: High-bandwidth packets per micro-frame minus 1 (bits[15:11])
                bitOffset: 11
                bitWidth: 5
          RX_CSR:
            description: RX Control and Status Register (RxCSRL[7:0] + RxCSRH[15:8])
