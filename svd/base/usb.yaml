              TX_PKT_RDY:
                description: TX FIFO loaded; hardware clears after transmit
                bitOffset: 0
                bitWidth: 1
              TX_FIFO_NE:
                description: TX FIFO not empty (read-only)
                bitOffset: 1
                bitWidth: 1
                access: read-only
              UNDERRUN_RESPONSE_ERR:
                description: Underrun (device) / no-response error (host)
