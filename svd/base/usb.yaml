                description: High-bandwidth packets per micro-frame minus 1 (bits[15:11])
                bitOffset: 11
                bitWidth: 5
          TX_CSR:
            description: TX Control and Status Register (TxCSRL[7:0] + TxCSRH[15:8])
            addressOffset: 0x2
            size: 16
            access: read-write
