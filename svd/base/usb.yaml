                bitWidth: 1
              DATA_ERR_NAK_TIMEOUT:
                description: Data error (device) / NAK timeout (host)
                bitOffset: 3
                bitWidth: 1
              FLUSH_FIFO:
                description: Flush RX FIFO (self-clearing)
                bitOffset: 4
                bitWidth: 1
              SEND_STALL_IN_PKT_REQ:
                description: Issue STALL (device) / IN packet request (host)
                bitOffset: 5
                bitWidth: 1
              STALL_SENT_STALL_RCVD:
                description: STALL sent (device) / STALL received (host)
