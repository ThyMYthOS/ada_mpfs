            bitOffset: 16
            bitWidth: 16
            access: read-only
          QUANTUM:
            description: Received pause quantum - stores the current value of the received pause quantum register which is decremented every 512 bit times.
            bitOffset: 0
            bitWidth: 16
            access: read-only
      emac_tx_pause_quantum:
