_add:
  GEM_A_LO:
    description: GEM_A_LO Controller
    baseAddress: 0x20110000
    registers:
      network_control:
        description: The network control register contains general MAC control functions for both receiver and transmitter.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 31
            bitWidth: 1
            access: read-only
          IFG_EATS_QAV_CREDIT:
            description: Setting this bit high modifies the CBS algorithm so the IFG/IPG associated with a transmit frame counts towards its 802.1Qav credit.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          TWO_PT_FIVE_GIG:
            description: 2.5G operation selected - setting this bit high drives the speed_mode[3] top level output pin high and also adjusts the link timer in the PCS auto-negotiation block to ensure it delivers 10ms for 2500BASE-X and 1.6ms in SGMII mode, and also ensures int_moderation counts 800ns periods with the speeded up MAC clocks.
            bitOffset: 29
            bitWidth: 1
            access: read-write
          SEL_MII_ON_RGMII:
            description: If the RGMII interface is being used, set this bit high to configure the RGMII interface for MII operation (in 802.3br configurations this bit has no effect for the eMAC).
            bitOffset: 28
            bitWidth: 1
            access: read-write
          OSS_CORRECTION_FIELD:
            description: 1588 One Step Correction Field Update. Set this bit high to enable updating the correction field of PTP 1588 version 2 sync frames by adding the current TSU timer value.
            bitOffset: 27
            bitWidth: 1
            access: read-write
          EXT_RXQ_SEL_EN:
            description: Enable external selection of receive queue. When this bit is high the ext_match1, ext_match2, ext_match3 and ext_match4 inputs will determine which receive queue a frame is routed to. This will be the case regardless of the state of the external address match enable bit 9 of the network config register. Note that receive frames will be dropped unless they are matched by the internal frame filtering functionality. If the external address match enable bit 9 in the network config register is set frames may be matched by an external address match filter as long as one of the ext_match1, ext_match2, ext_match3 and ext_match4 inputs is asserted early enough. When set ext_rxq_sel_en takes precedence over the existing screener functionality. This bit is only relevant if priority queuing is configured.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          PFC_CTRL:
            description: Enable multiple PFC pause quantums, one per pause priority.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          ONE_STEP_SYNC_MODE:
            description: 1588 One Step Sync Mode. Write 1 to enable. Replace timestamp field in the 1588 header for TX Sync Frames with current TSU timer value.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          RESERVED_23:
            description: Reserved for external TSU timer port enable, read as 0, ignored on write.
            bitOffset: 23
            bitWidth: 1
            access: read-only
          STORE_UDP_OFFSET:
            description: Store UDP / TCP offset to memory. Setting this bit to one will cause the upper 16-bits of the CRC of every received frame to be replaced with the offset from start of frame to the beginning of the UDP or TCP header. The lower 16-bits of the CRC are replaced with zero and reserved for future use. The offset is measured in units of 2 bytes. Set to zero for normal operation.
            bitOffset: 22
            bitWidth: 1
            access: read-write
          ALT_SGMII_MODE:
            description: Alternative sgmii mode. If asserted with sgmii_mode in the network control register the ACK bit is driven before ability detect during transfer of status information from the PHY to the MAC.
            bitOffset: 21
            bitWidth: 1
            access: read-write
          PTP_UNICAST_ENA:
            description: Enable detection of unicast PTP unicast frames.
            bitOffset: 20
            bitWidth: 1
            access: read-write
          TX_LPI_EN:
            description: Enable LPI transmission when set LPI (low power idle) is immediately transmitted. Depending on configuration LPI is indicated on the GMII, RGMII or MII interface and can be encoded by the PCS used for SGMII. LPI is transmitted even if bit 3 transmit enable is disabled. Setting this bit also sends a pause signal to the transmit datapath. In 802.3br configurations LPI can only be controlled from the pMAC.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          FLUSH_RX_PKT_PCLK:
            description: Flush the next packet from the external RX DPRAM. This bit flushes the frame that is the next in line to be pushed out to the AXI interface. Writing one to this bit will only have an effect if the DMA is not currently writing a packet already stored in the DPRAM to memory.
            bitOffset: 18
            bitWidth: 1
            access: read-write
          TRANSMIT_PFC_PRIORITY_BASED_PAUSE_FRAME:
            description: Write a one to transmit PFC priority based pause frame. Takes the values stored in the Transmit PFC Pause Register.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          PFC_ENABLE:
            description: Enable PFC Priority Based Pause Reception capabilities. Setting this bit will enable PFC negotiation and recognition of priority based pause frames.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          STORE_RX_TS:
            description: Store receive time stamp to memory. Setting this bit to one will cause the CRC of every received frame to be replaced with the value of the nanoseconds field of the 1588 timer that was captured as the receive frame passed the message time stamp point (for releases prior to 1p10 bits 31 and 30 of the value written to the CRC field were hardwired to zero, from release 1p10 onwards these bits represent the two least significant seconds bit of the captured timer value). Set to zero for normal operation.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          RESERVED_14_13:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 13
            bitWidth: 2
            access: read-only
          TX_PAUSE_FRAME_ZERO:
            description: Transmit zero quantum pause frame - writing one to this bit causes a pause frame with zero quantum to be transmitted.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          TX_PAUSE_FRAME_REQ:
            description: Transmit pause frame - writing one to this bit causes a pause frame to be transmitted.
            bitOffset: 11
            bitWidth: 1
            access: read-write
          TRANSMIT_HALT:
            description: Transmit halt - writing one to this bit resets the tx_go variable and halts the dma from reading more transmit frames into the transmit SRAM buffer. Any frames already read into the transmit SRAM will still be transmitted.
            bitOffset: 10
            bitWidth: 1
            access: read-write
          TRANSMIT_START:
            description: Start transmission - writing one to this bit starts transmission.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          BACK_PRESSURE:
            description: Back pressure if set in 10M or 100M half-duplex mode will force collisions on all received frames. Ignored in gigabit half-duplex mode.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          STATS_WRITE_EN:
            description: Write enable for statistics registers - setting this bit to one means the statistics registers can be written for functional test purposes.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          INC_ALL_STATS_REGS:
            description: Incremental statistics registers - this bit is write only. Writing a one increments all the statistics registers by one for test purposes.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          CLEAR_ALL_STATS_REGS:
            description: Clear statistics registers - this bit is write only. Writing a one clears the statistics registers.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          MAN_PORT_EN:
            description: Management port enable - set to one to enable the management port. When zero forces mdio to high impedance state and mdc low.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ENABLE_TRANSMIT:
            description: Transmit enable - when set, it enables the GEM transmitter to send data. When reset transmission will stop immediately, the transmit pipeline and control registers will be cleared and the transmit queue pointer register will reset to point to the start of the transmit descriptor list. This bit needs to be set before bit 9 the start transmission bit. (Setting this bit low resets the transmit queue pointer however reading the transmit queue pointer register through the APB interface may still return an old value until transmission is restarted.)
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ENABLE_RECEIVE:
            description: Receive enable - when set, it enables the GEM to receive data. When reset frame reception will stop immediately and the receive pipeline will be cleared. The receive queue pointer register is unaffected.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          LOOPBACK_LOCAL:
            description: Loopback local - asserts the loopback_local signal to the system clock generator. Also connects txd to rxd, tx_en to rx_dv and forces full duplex mode. If the GEM configuration contains the PCS then bit 11 of the network configuration register must be set low to disable TBI mode when in internal loopback. rx_clk and tx_clk may malfunction as the GEM is switched into and out of internal loopback. It is important that receive and transmit circuits have already been disabled when making the switch into and out of internal loopback. Local loopback functionality is optional and may not be supported by some instantiations of the GEM.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          LOOPBACK:
            description: Loopback - controls the loopback output pin.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      network_config:
        description: The network configuration register contains functions for setting the mode of operation for the Gigabit Ethernet MAC.
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x280000
        fields:
          UNI_DIRECTION_ENABLE:
            description: Uni-direction-enable. When low the PCS will transmit idle symbols if the link goes down. When high the PCS can transmit frame data when the link is down.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          IGNORE_IPG_RX_ER:
            description: Ignore IPG rx_er. When set rx_er has no effect on the GEMs operation when rx_dv is low. Set this when using the RGMII wrapper in half-duplex mode.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          NSP_ACCEPT:
            description: Receive bad preamble. When set frames with non-standard preamble are not rejected (the first byte of preamble needs to be 55 and the last D5, bytes other than 55 or D5 may be inserted in between).
            bitOffset: 29
            bitWidth: 1
            access: read-write
          IPG_STRETCH_ENABLE:
            description: IPG stretch enable - when set the transmit IPG can be increased above 96 bit times depending on the previous frame length using the IPG stretch register.
            bitOffset: 28
            bitWidth: 1
            access: read-write
          SGMII_MODE_ENABLE:
            description: SGMII mode enable - changes behaviour of the auto-negotiation advertisement and link partner ability registers to meet the requirements of SGMII and reduces the duration of the link timer from 10 ms to 1.6 ms.
            bitOffset: 27
            bitWidth: 1
            access: read-write
          IGNORE_RX_FCS:
            description: Ignore RX FCS - when set frames with FCS/CRC errors will not be rejected. FCS error statistics will still be collected for frames with bad FCS and FCS status will be recorded in frame's DMA descriptor. For normal operation this bit must be set to zero.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          EN_HALF_DUPLEX_RX:
            description: Enable frames to be received in half-duplex mode while transmitting.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          RECEIVE_CHECKSUM_OFFLOAD_ENABLE:
            description: Receive checksum offload enable - when set, the receive checksum engine is enabled. Frames with bad IP, TCP or UDP checksums are discarded.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          DISABLE_COPY_OF_PAUSE_FRAMES:
            description: Disable copy of pause frames - set to one to prevent pause frames being copied to memory. When set, neither control frames with type id 8808, nor pause frames with destination address 010000c28001 are copied to memory, this functionality was enhanced in release 1p09. Note that valid pause frames received will still increment pause statistics and pause the transmission of frames as required.
            bitOffset: 23
            bitWidth: 1
            access: read-write
          DATA_BUS_WIDTH:
            description: 'Data bus width - set according to AMBA (AHB/AXI) or external FIFO data bus width. The reset value for this can be changed by defining a new value for gem_dma_bus_width_def in gem_defs. Only valid bus widths may be written if the system is configured to a maximum width less than 128-bits., :00: 32 bit data bus width, :01: 64 bit AMBA (AHB/AXI) data bus width, :10: 128 bit AMBA (AHB/AXI) data bus width, :11: invalid, :Note. The reset value of this field is equal to the gem_dma_bus_width_def define, which is user configurable.'
            bitOffset: 21
            bitWidth: 2
            access: read-write
          MDC_CLOCK_DIVISION:
            description: 'MDC clock division - set according to pclk speed. These three bits determine the number pclk will be divided by to generate MDC. For conformance with the 802.3 specification, MDC must not exceed 2.5 MHz (MDC is only active during MDIO read and write operations). The reset value for this can be changed by defining a new value for gem_mdc_clock_div in gem_defs.v, :000: divide pclk by 8 (pclk up to 20 MHz), :001: divide pclk by 16 (pclk up to 40 MHz), :010: divide pclk by 32 (pclk up to 80 MHz), :011: divide pclk by 48 (pclk up to 120MHz), :100: divide pclk by 64 (pclk up to 160 MHz), :101: divide pclk by 96 (pclk up to 240 MHz), :110: divide pclk by 128 (pclk up to 320 MHz), :111: divide pclk by 224 (pclk up to 540 MHz)., :Note. The reset value of this field is equal to the gem_mdc_clock_div define, which is user configurable.'
            bitOffset: 18
            bitWidth: 3
            access: read-write
          FCS_REMOVE:
            description: FCS remove - setting this bit will cause received frames to be written to memory without their frame check sequence (last 4 bytes). The frame length indicated will be reduced by four bytes in this mode.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          LENGTH_FIELD_ERROR_FRAME_DISCARD:
            description: Length field error frame discard - setting this bit causes frames with a measured length shorter than the extracted length field (as indicated by bytes 13 and 14 in a non-VLAN tagged frame) to be discarded. This only applies to frames with a length field less than 0x0600.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          RECEIVE_BUFFER_OFFSET:
            description: Receive buffer offset - indicates the number of bytes by which the received data is offset from the start of the receive buffer. Note that when the define gem_pbuf_rsc has been set then these bits cannot be used.
            bitOffset: 14
            bitWidth: 2
            access: read-write
          PAUSE_ENABLE:
            description: Pause enable - when set, transmission will pause if a non-zero 802.3 classic pause frame is received and PFC has not been negotiated.
            bitOffset: 13
            bitWidth: 1
            access: read-write
          RETRY_TEST:
            description: Retry test - must be set to zero for normal operation. If set to one the backoff between collisions will always be one slot time. Setting this bit to one helps test the too many retries condition. Also used in the pause frame tests to reduce the pause counter's decrement time from 512 bit times, to every rx_clk cycle.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          PCS_SELECT:
            description: 'PCS select - selects between MII/GMII and TBI. Must be set for SGMII operation., :0: GMII/MII interface enabled, TBI disabled, :1: TBI enabled, GMII/MII disabled, :(in 802.3br configurations this bit must be set identically in the eMAC and pMAC)'
            bitOffset: 11
            bitWidth: 1
            access: read-write
          GIGABIT_MODE_ENABLE:
            description: 'Gigabit mode enable - setting this bit configures the GEM for 1000 Mbps operation., :0: 10/100 operation using MII or TBI interface, :1: Gigabit operation using GMII or TBI interface, :(in 802.3br configurations this bit must be set identically in the eMAC and pMAC)'
            bitOffset: 10
            bitWidth: 1
            access: read-write
          EXTERNAL_ADDRESS_MATCH_ENABLE:
            description: External address match enable - when set the external address match interface can be used to copy frames to memory.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          RECEIVE_1536_BYTE_FRAMES:
            description: Receive 1536 byte frames - setting this bit means the GEM will accept frames up to 1536 bytes in length. Normally the GEM would reject any frame above 1518 bytes.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          UNICAST_HASH_ENABLE:
            description: Unicast hash enable - when set, unicast frames will be accepted when the 6 bit hash function of the destination address points to a bit that is set in the hash register.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          MULTICAST_HASH_ENABLE:
            description: Multicast hash enable - when set, multicast frames will be accepted when the 6 bit hash function of the destination address points to a bit that is set in the hash register.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          NO_BROADCAST:
            description: No broadcast - when set to logic one, frames addressed to the broadcast address of all ones will not be accepted.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          COPY_ALL_FRAMES:
            description: Copy all frames - when set to logic one, all valid frames will be accepted.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          JUMBO_FRAMES:
            description: Jumbo frames - set to one to enable jumbo frames up to `gem_jumbo_max_length bytes to be accepted. The default length is 10,240 bytes.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          DISCARD_NON_VLAN_FRAMES:
            description: Discard non-VLAN frames - when set only VLAN tagged frames will be passed to the address matching logic.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          FULL_DUPLEX:
            description: Full duplex - if set to logic one, the transmit block ignores the state of collision and carrier sense and allows receive while transmitting. Also controls the half_duplex pin.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          SPEED:
            description: Speed - set to logic one to indicate 100Mbps operation, logic zero for 10Mbps. The value of this pin is reflected on the speed_mode[0] output pin (in 802.3br configurations this bit has no effect for the eMAC).
            bitOffset: 0
            bitWidth: 1
            access: read-write
      network_status:
        description: The network status register returns status information with respect to the PHY management MDIO interface, the PCS, priority flow control, LPI and other status.
        addressOffset: 0x8
        size: 32
        access: read-only
        resetValue: 0x4
        fields:
          RESERVED_31_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 21
            access: read-only
          LINK_FAULT_INDICATION:
            description: 'For 2.5GBASE-X operation these two bits return the state of link_fault in the LFSM defined in Figure 46-11 of IEEE 802.3:, : 00 - OK, : 01 - local fault, : 10 - remote fault, : 11 - link interruption, :If the link fault state machine is not enabled (by setting the 2.5G, AN enable, uni directional enable and tbi control bits) these two bits are set to zero.'
            bitOffset: 9
            bitWidth: 2
            access: read-only
          AXI_XACTION_OUTSTANDING:
            description: Outstanding AXI Transactions - This status bit is set when one or more AXI read or write transactions have been issued by the DUT but the responses have not yet been fully collected.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          LPI_INDICATE_PCLK:
            description: LPI Indication - Low power idle has been detected on receive. This bit is set when LPI is detected and reset when normal idle is detected. An interrupt is generated when the state of this bit changes.
            bitOffset: 7
            bitWidth: 1
            access: read-only
          PFC_NEGOTIATE_PCLK:
            description: Set when PFC Priority Based Pause has been negotiated.
            bitOffset: 6
            bitWidth: 1
            access: read-only
          MAC_PAUSE_TX_EN:
            description: PCS auto-negotiation pause transmit resolution.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          MAC_PAUSE_RX_EN:
            description: PCS auto-negotiation pause receive resolution.
            bitOffset: 4
            bitWidth: 1
            access: read-only
          MAC_FULL_DUPLEX:
            description: PCS auto-negotiation duplex resolution. Set to one if the resolution function determines that both devices are capable of full duplex operation. If zero half-duplex operation is possible as long as bit 0 (PCS link state) is also one.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          MAN_DONE:
            description: The PHY management logic is idle (i.e. has completed).
            bitOffset: 2
            bitWidth: 1
            access: read-only
          MDIO_IN:
            description: Returns status of the mdio_in pin.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          PCS_LINK_STATE:
            description: Returns status of PCS link state. If auto-negotiation is disabled this returns the synchronisation status. If auto-negotiation is enabled it is set in the LINK_OK state as long as a compatible duplex mode is resolved, it is always set in the LINK_OK state in SGMII mode.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      user_io_register:
        description: The GEM design provides up to 16 inputs and 16 outputs so that the I/O may be read or set under the control of the processor interface. The number of inputs and outputs are set by the user_in_width and user_out_width verilog macro defines. If the user I/O is disabled as a configuration option, this address space is defined as reserved, and hence will be a read-only register of the value 0x0. If enabled, the number of inputs and outputs can be configured separately. The first output will be represented in bit 0 of the user I/O register, the second output will use bit 1 and so on. The first input will be represented in bit 16 of the user I/O register, the second input will use bit 17 and so on.
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_22:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 22
            bitWidth: 10
            access: read-only
          USER_PROGRAMMABLE_INPUTS:
            description: User programmable inputs - the upper 16 bits of this register are used to monitor the state of the user inputs. A logic one read from a bit in this range will correspond to the input being in a high state. A logic zero read from a bit in this range will correspond to the input being in a low state. Any unused bits will be read as 0. Writing to any bits in this range will have no functional effect.
            bitOffset: 16
            bitWidth: 6
            access: read-only
          RESERVED_15_6:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 6
            bitWidth: 10
            access: read-only
          USER_PROGRAMMABLE_OUTPUTS:
            description: User programmable outputs - the lower 16 bits of this register are used to control the state of the user outputs. A logic one written to a bit in this range will cause the corresponding output to be set high. A logic zero written to a bit in this range shall cause the corresponding output to be forced low. Any unused bits will be read as logic zero. Writing to any unused bits in this range will have no functional effect.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      dma_config:
        description: DMA Configuration Register
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x20704
        fields:
          RESERVED_31:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 31
            bitWidth: 1
            access: read-only
          DMA_ADDR_BUS_WIDTH_1:
            description: DMA address bus width. 0 = 32b, 1 = 64b.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          TX_BD_EXTENDED_MODE_EN:
            description: Enable TX extended BD mode. See TX BD control register definition for description of feature.
            bitOffset: 29
            bitWidth: 1
            access: read-write
          RX_BD_EXTENDED_MODE_EN:
            description: Enable RX extended BD mode. See RX BD control register definition for description of feature.
            bitOffset: 28
            bitWidth: 1
            access: read-write
          RESERVED_27:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 27
            bitWidth: 1
            access: read-only
          FORCE_MAX_AMBA_BURST_TX:
            description: Force max length bursts on TX. Force the TX DMA to always issue max length bursts on EOP (end of packet) or EOB (end of buffer) transfers as defined by bits 4:0 of this register, even when there is less than max burst data bytes to read. Residual data read is ignored. AHB only - does not apply on AXI bursts (prior to release 1p10) or bursts that break 1k boundary rule - supported on AXI from release 1p10.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          FORCE_MAX_AMBA_BURST_RX:
            description: Force max length bursts on RX. Force the RX DMA to always issue max length bursts on EOP (end of packet) or EOB (end of buffer) transfers, even if there is less than max burst real packet data required to write. Any extra bytes of pad data is set to 0x00. AHB only - does not apply on AXI bursts (prior to release 1p10) or bursts that break 1k boundary rule - supported on AXI from release 1p10.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          FORCE_DISCARD_ON_ERR:
            description: Auto Discard RX frames during lack of resource. When set, the GEM DMA will automatically discard the next frame (that is the oldest frame) from the receiver packet buffer memory when a receive buffer descriptor is read with its used bit set. When low, then received frames will remain to be stored in the SRAM based packet buffer until AMBA (AHB/AXI) buffer resource next becomes available. In this case if the SRAM memory fills up then there will be a receive overflow condition and the most recently received frame (that is the newest) will be discarded. A write to this bit is ignored if the DMA is not configured in the packet buffer full store and forward mode.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          RX_BUF_SIZE:
            description: 'DMA receive buffer size in external AMBA (AHB/AXI) system memory. The value defined by these bits determines the size of buffer to use in main system memory when writing received data. The value is defined in multiples of 64 bytes., :0x01 corresponds to buffers of 64 bytes, :0x02 corresponds to 128 bytes etc., :For example:, :0x02: 128 byte., :0x18: 1536 byte (1*max length frame/buffer), :0xA0: 10240 byte (1*10K jumbo frame/buffer), :0xFF: 16320 byte , :Note that this value should never be written as zero., :Note. The reset value of this field is equal to the gem_rx_buffer_length_def define, which is user configurable.'
            bitOffset: 16
            bitWidth: 8
            access: read-write
          RESERVED_15_14:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 14
            bitWidth: 2
            access: read-only
          CRC_ERROR_REPORT:
            description: When the bit is set, bit 16 of the receive buffer descriptor will represent FCS/CRC error (only if frames with FCS are copied to memory as enabled by bit 26 in the network config register). When this bit is clear, bit 16 of the receive buffer descriptor will represent the Canonical format indicator (CFI) bit as extracted from the receive frame (if the receive buffer descriptor is pointing to the last data buffer of the receive frame and the received frame was VLAN tagged).
            bitOffset: 13
            bitWidth: 1
            access: read-write
          INFINITE_LAST_DBUF_SIZE_EN:
            description: Forces the receive DMA to consider the data buffer pointed to by last descriptor in the descriptor list to be of elastic size (the last descriptor is the one with its wrap bit set). This means the first buffer pointed to in the list will always contain the beginning of a frame (this helps if there is a desire to build custom logic that interfaces with the receive buffer directly without software intervention). When set the rx_buf_size bits 23:16 in the dma configuration register are ignored for the last receive buffer in the descriptor list and data will be written into the buffer sequentially until the frame is completely received and the buffer descriptor status will be updated with the frame length as normal.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          TX_PBUF_TCP_EN:
            description: Transmitter IP, TCP and UDP checksum generation offload enable (not supported when in TX Partial Store and Forward mode). When set, the transmitter checksum generation engine is enabled, to calculate and substitute checksums for transmit frames. When clear, frame data is unaffected. If the GEM is not configured to use the DMA packet buffer, this bit is not implemented and will be treated as reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 1
            access: read-write
          TX_PBUF_SIZE:
            description: 'Transmitter packet buffer memory size select. Having this bit at zero halves the amount of memory used for the transmit packet buffer. This reduces the amount of memory used by the GEM. It is important to set this bit to one if the full configured physical memory is available. The value in brackets below represents the size that would result for the default maximum configured memory size of 4 Kbytes., :1: Use full configured addressable space (4 Kb), :0: Do not use top address bit (2 Kb), :If the GEM is not configured to use the DMA packet buffer, this bit is not implemented and will be treated as reserved, read as 0, ignored on write., :Note. The reset value of this field is equal to the gem_tx_pbuf_size_def define, which is user configurable.'
            bitOffset: 10
            bitWidth: 1
            access: read-write
          RX_PBUF_SIZE:
            description: 'Receiver packet buffer memory size select. Having these bits at less than 11 reduces the amount of memory used for the receive packet buffer. This reduces the amount of memory used by the GEM. It is important to set these bits both to one if the full configured physical memory is available. The value in brackets below represents the size that would result for the default maximum configured memory size of 8 Kbytes., :11: Use full configured addressable space (8 Kb), :10: Do not use top address bit (4 Kb), :01: Do not use top two address bits (2 Kb), :00: Do not use top three address bits (1 Kb), :If the GEM is not configured to use the DMA packet buffer, these bits are not implemented and will be treated as reserved, read as 0, ignored on write., :Note. The reset value of this field is equal to the gem_rx_pbuf_size_def define, which is user configurable.'
            bitOffset: 8
            bitWidth: 2
            access: read-write
          ENDIAN_SWAP_PACKET:
            description: endian swap mode enable for packet data accesses. When set, selects swapped endianism for AMBA (AHB/AXI) transfers. When clear, selects little endian mode.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          ENDIAN_SWAP_MANAGEMENT:
            description: endian swap mode enable for management descriptor accesses. When set, selects swapped endianism for AMBA (AHB/AXI) transfers. When clear, selects little endian mode.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          HDR_DATA_SPLITTING_EN:
            description: Enable header data Splitting. When set, receive frames will be forwarded to main memory using a minimum of two DMA data buffers. The first X data buffers will contain the frame header, consisting of the Ethernet,VLAN,(IPv4 or IPv6),(TCP or UDP). X= (frame header size divided by rx_buf_size as defined in bits 23:16 of this register). The last Y data buffers will contain the frame payload. Y= (frame payload size divided by rx_buf_size). Note that for non VLAN/IP/TCP/UDP frames, the header will always be 14 bytes. When this feature is disabled, the frame is forwarded to main memory in blocks of rx_buf_size.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          AMBA_BURST_LENGTH:
            description: 'Selects the burst length to use on the AMBA (AHB/AXI) when transferring frame data. Not used for DMA management operations and only used where space and data size allow and respecting AXI/AHB burst boundary rules. One-hot priority encoding enforced automatically on register writes as follows, where x represents don''t care:, :1xxxx: Attempt to use bursts of up to 16., :01xxx: Attempt to use bursts of up to 8., :001xx: Attempt to use bursts of up to 4., :0001x: Always use SINGLE bursts., :00001: Always use SINGLE bursts., :00000: Attempt to use bursts of up to 256.'
            bitOffset: 0
            bitWidth: 5
            access: read-write
      transmit_status:
        description: This register, when read, provides details of the status of the transmit path. Once read, individual bits may be cleared by writing 1 to them. It is not possible to set a bit to 1 by writing to the register.
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 21
            access: read-only
          TX_DMA_LOCKUP_DETECTED:
            description: TX DMA lockup detected - set when lockup has been detected the transmit DMA lockup monitor.
            bitOffset: 10
            bitWidth: 1
            access: read-write
          TX_MAC_LOCKUP_DETECTED:
            description: TX MAC lockup detected - set when lockup has been detected by the lockup monitor on the MAC transmit path.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          RESP_NOT_OK:
            description: bresp/hresp not OK - set when the DMA block sees bresp/hresp not OK. Cleared by writing a one to this bit.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          LATE_COLLISION_OCCURRED:
            description: Late collision occurred - only set if the condition occurs in gigabit mode, as retry is not attempted. Cleared by writing a one to this bit.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          TRANSMIT_UNDER_RUN:
            description: Transmit under run - this bit is set if the transmitter was forced to terminate a frame that it had already began transmitting due to further data being unavailable. This bit is set if a transmitter status write back has not completed when another status write back is attempted. When using the DMA interface configured for internal FIFO mode, this bit is also set when the transmit DMA has written the SOP data into the FIFO and either the AHB bus was not granted in time for further data, or because an AHB not OK response was returned, or because a used bit was read. When using the DMA interface configured for packet buffer mode, this bit will never be set. When using the external FIFO interface, this bit is also set when the tx_r_underflow input is asserted during a frame transfer. Cleared by writing a 1.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          TRANSMIT_COMPLETE:
            description: Transmit complete - set when a frame has been transmitted. Cleared by writing a one to this bit.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          AMBA_ERROR:
            description: Transmit frame corruption due to AMBA (AHB/AXI) errors. Set if an error occurs whilst midway through reading transmit frame from external memory including HRESP(AHB), RRESP or BRESP(AXI) errors and buffers exhausted mid frame (if the buffers run out during transmission of a frame then transmission stops, FCS shall be bad and tx_er asserted). Also set in DMA packet buffer mode if single frame is too large for configured packet buffer memory size. Some AXI errors cause immediate reset of the transmit MAC datapath, in these cases tx_er will not be asserted and this bit will not be set. Cleared by writing a one to this bit.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          TRANSMIT_GO:
            description: Transmit go - if high transmit is active. When using the exposed FIFO interface, this bit represents the transmit enable bit (bit 3) of the network control register. When using the DMA interface this bit represents the tx_go variable as specified in the transmit buffer description.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          RETRY_LIMIT_EXCEEDED:
            description: Retry limit exceeded - cleared by writing a one to this bit.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          COLLISION_OCCURRED:
            description: Collision occurred - set by the assertion of collision. Cleared by writing a one to this bit. When operating in 10/100 mode, this status indicates either a collision or a late collision. In gigabit mode, this status is not set for a late collision.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          USED_BIT_READ:
            description: Used bit read - set when a transmit buffer descriptor is read with its used bit set. Cleared by writing a one to this bit.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      receive_q_ptr:
        description: This register holds the start address of the receive buffer queue (receive buffers descriptor list). The receive buffer queue base address must be initialized before receive is enabled through bit 2 of the network control register. Once reception is enabled, any write to the receive buffer queue base address register is ignored. Reading this register returns the location of the descriptor currently being accessed. This value increments as buffers are used. Software should not use this register for determining where to remove received frames from the queue as it constantly changes as new frames are received. Software should instead work its way through the buffer descriptor queue checking the used bits. In terms of AMBA (AHB/AXI) operation, the receive descriptors are read from memory using a single 32bit AHB/AXI access. When the datapath is configured at 64bit or 128bit, the receive descriptors should be aligned at 64-bit boundaries and each pair of 32-bit descriptors is written to using a single 64bit AHB/AXI access. For 32bit datapaths, the receive descriptors should be aligned at 32-bit boundaries and are written to using two individual non sequential 32-bit accesses.
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DMA_RX_Q_PTR:
            description: Receive buffer queue base address - written with the address of the start of the receive queue.
            bitOffset: 2
            bitWidth: 30
            access: read-write
          RESERVED_1:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          DMA_RX_DIS_Q:
            description: Disable queue if set to 1. This can be used to reduce the number of active queues and should only be changed while receive is not enabled.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      transmit_q_ptr:
        description: This register holds the start address of the transmit buffer queue (transmit buffers descriptor list). The transmit buffer queue base address register must be initialized before transmit is started through bit 9 of the network control register. Once transmission has started, any write to the transmit buffer queue base address register is illegal and therefore ignored. Note that due to clock boundary synchronization, it takes a maximum of four pclk cycles from the writing of the transmit start bit before the transmitter is active. Writing to the transmit buffer queue base address register during this time may produce unpredictable results. Reading this register returns the location of the descriptor currently being accessed. Because the DMA can store data for multiple frames at once, this may not necessarily be pointing to the current frame being transmitted. In terms of AMBA AHB/AXI operation, the transmit descriptors are written to memory using a single 32bit AHB access. When the datapath is configured as 64bit or 128bit, the transmit descriptors should be aligned at 64-bit boundaries and each pair of 32-bit descriptors is read from memory using a single AHB/AXI access. For 32bit datapaths, the descriptors should be aligned at 32-bit boundaries and the descriptors are read from memory using two individual 32-bit non sequential accesses.
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DMA_TX_Q_PTR:
            description: Transmit buffer queue base address - written with the address of the start of the transmit queue.
            bitOffset: 2
            bitWidth: 30
            access: read-write
          RESERVED_1:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          DMA_TX_DIS_Q:
            description: Disable queue if set to 1. This can be used to reduce the number of active queues and should only be changed while transmit is not enabled.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      receive_status:
        description: This register, when read provides details of the status of the receive path. Once read, individual bits may be cleared by writing 1 to them. It is not possible to set a bit to 1 by writing to the register.
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_6:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 6
            bitWidth: 26
            access: read-only
          RX_DMA_LOCKUP_DETECTED:
            description: RX DMA lockup detected - set when lockup has been detected the receive DMA lockup monitor.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          RX_MAC_LOCKUP_DETECTED:
            description: RX MAC lockup detected - set when lockup has been detected by the lockup monitor on the MAC receive path.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          RESP_NOT_OK:
            description: bresp/hresp not OK - set when the DMA block sees bresp/hresp not OK. Cleared by writing a one to this bit.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          RECEIVE_OVERRUN:
            description: Receive overrun - this bit is set if either the gem_dma RX FIFO or external RX FIFO were unable to store the receive frame due to a FIFO overflow, or if the receive status, reported by the gem_rx module to the gem_dma was not taken at end of frame. This bit is also set in DMA packet buffer mode if the packet buffer overflows. For DMA operation the buffer will be recovered if an overrun occurs. This bit is cleared by writing a one to it.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          FRAME_RECEIVED:
            description: Frame received - one or more frames have been received and placed in memory. Cleared by writing a one to this bit.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          BUFFER_NOT_AVAILABLE:
            description: Buffer not available - an attempt was made to get a new buffer and the pointer indicated that it was owned by the processor. The DMA will reread the pointer each time an end of frame is received until a valid pointer is found. This bit is set following each descriptor read attempt that fails, even if consecutive pointers are unsuccessful and software has in the meantime cleared the status flag. Cleared by writing a one to this bit.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      int_status:
        description: If not configured for priority queuing, the GEM generates a single interrupt. This register indicates the source of this interrupt. The corresponding bit in the mask register must be clear for a bit to be set. If any bit is set in this register the ethernet_int signal will be asserted. For test purposes each bit can be set or reset by writing to the interrupt mask register. The default configuration is shown below whereby all bits are reset to zero on read. Changing the validity of the `gem_irq_read_clear define will instead require a one to be written to the appropriate bit in order to clear it. In this mode reading has no effect on the status of the bit.
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TX_LOCKUP_DETECTED:
            description: TX lockup detection - set when lockup has been detected by any of the lockup monitors on the transmit datapath.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          RX_LOCKUP_DETECTED:
            description: RX lockup detection - set when lockup has been detected by any of the lockup monitors on the receive datapath.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          TSU_TIMER_COMPARISON_INTERRUPT:
            description: TSU timer comparison interrupt. Indicates when TSU timer count value is equal to programmed value.
            bitOffset: 29
            bitWidth: 1
            access: read-write
          WOL_INTERRUPT:
            description: WOL interrupt. Indicates a WOL event has been received.
            bitOffset: 28
            bitWidth: 1
            access: read-write
          RECEIVE_LPI_INDICATION_STATUS_BIT_CHANGE:
            description: Receive LPI indication status bit change
            bitOffset: 27
            bitWidth: 1
            access: read-write
          TSU_SECONDS_REGISTER_INCREMENT:
            description: TSU seconds register increment indicates the register has incremented. Cleared on read.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          PTP_PDELAY_RESP_FRAME_TRANSMITTED:
            description: PTP pdelay_resp frame transmitted indicates a PTP pdelay_resp frame has been transmitted. Cleared on read.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          PTP_PDELAY_REQ_FRAME_TRANSMITTED:
            description: PTP pdelay_req frame transmitted indicates a PTP pdelay_req frame has been transmitted. Cleared on read.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          PTP_PDELAY_RESP_FRAME_RECEIVED:
            description: PTP pdelay_resp frame received indicates a PTP pdelay_resp frame has been received. Cleared on read.
            bitOffset: 23
            bitWidth: 1
            access: read-write
          PTP_PDELAY_REQ_FRAME_RECEIVED:
            description: PTP pdelay_req frame received indicates a PTP pdelay_req frame has been received. Cleared on read.
            bitOffset: 22
            bitWidth: 1
            access: read-write
          PTP_SYNC_FRAME_TRANSMITTED:
            description: PTP sync frame transmitted indicates a PTP sync frame has been transmitted. Cleared on read.
            bitOffset: 21
            bitWidth: 1
            access: read-write
          PTP_DELAY_REQ_FRAME_TRANSMITTED:
            description: PTP delay_req frame transmitted indicates a PTP delay_req frame has been transmitted. Cleared on read.
            bitOffset: 20
            bitWidth: 1
            access: read-write
          PTP_SYNC_FRAME_RECEIVED:
            description: PTP sync frame received indicates a PTP sync frame has been received. Cleared on read.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          PTP_DELAY_REQ_FRAME_RECEIVED:
            description: PTP delay_req frame received indicates a PTP delay_req frame has been received. Cleared on read.
            bitOffset: 18
            bitWidth: 1
            access: read-write
          PCS_LINK_PARTNER_PAGE_RECEIVED:
            description: PCS link partner page received - set when a new base page or next page is received from the link partner. The first time this interrupt is received, it will indicate base page received and subsequent reads will indicate next pages. The next page and base page registers should only be read when this interrupt is signalled. For next pages, the link partner next page register should be read first to avoid the register being over written. This interrupt also indicates when the host should write a new page into the next page register. If further next page exchange is only required by the link partner, this register should be written with a null message page (0x2001). Cleared on read.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          PCS_AUTO_NEGOTIATION_COMPLETE:
            description: PCS auto-negotiation complete - set once the internal PCS layer has completed auto-negotiation. Cleared on read.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          EXTERNAL_INTERRUPT:
            description: External interrupt - set when a rising edge has been detected on the ext_interrupt_in input pin. Cleared on read.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          PAUSE_FRAME_TRANSMITTED:
            description: Pause frame transmitted - indicates a pause frame has been successfully transmitted after being initiated from the network control register or from the tx_pause control pin. Cleared on read.
            bitOffset: 14
            bitWidth: 1
            access: read-write
          PAUSE_TIME_ELAPSED:
            description: Pause Time elapsed - set when either the pause time register at address 0x38 decrements to zero, or when a valid pause frame is received with a zero pause quantum field. Not set for PFC pause frames. Cleared on read.
            bitOffset: 13
            bitWidth: 1
            access: read-write
          PAUSE_FRAME_WITH_NON_ZERO_PAUSE_QUANTUM_RECEIVED:
            description: Pause frame with non-zero pause quantum received - indicates a valid legacy pause frame with a non-zero pause quantum field has been received or any valid PFC pause frame has been received. Cleared on read.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          RESP_NOT_OK:
            description: bresp/hresp not OK - set when the DMA block sees bresp/hresp not OK. Cleared on read.
            bitOffset: 11
            bitWidth: 1
            access: read-write
          RECEIVE_OVERRUN:
            description: Receive overrun - set when the receive overrun status bit gets set. Cleared on read.
            bitOffset: 10
            bitWidth: 1
            access: read-write
          LINK_CHANGE:
            description: Link change - set when the PCS link status changes. If auto-negotiation is enabled then link status goes high when it completes. If AN is disabled link status goes high when synchronization is achieved. If 802.3cb link fault signalling is enabled a link change interrupt is triggered when the link fault indication as reported in the network status register changes. Cleared on read.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          RESERVED_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          TRANSMIT_COMPLETE:
            description: Transmit complete - set when a frame has been transmitted. Cleared on read.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          AMBA_ERROR:
            description: Transmit frame corruption due to AMBA (AHB/AXI) error. Set if an error occurs whilst midway through reading transmit frame from external system memory, including HRESP errors(AHB), RRESP or BRESP(AXI) errors and buffers exhausted mid frame (if the buffers run out during transmission of a frame then transmission stops, FCS shall be bad and tx_er asserted). Also set in DMA packet buffer mode if single frame is too large for configured packet buffer memory size. Cleared on a read.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          RETRY_LIMIT_EXCEEDED_OR_LATE_COLLISION:
            description: Retry limit exceeded or late collision - transmit error. Late collision will only cause this status bit to be set in gigabit mode (as a retry is not attempted). Cleared on read.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          TRANSMIT_UNDER_RUN:
            description: Transmit under run - this interrupt is set if the transmitter was forced to terminate a frame that it has already began transmitting due to further data being unavailable. If an under run occurs, the transmitter will force bad crc and tx_er high. This interrupt is set if a transmitter status write back has not completed when another status write back is attempted. When using the DMA interface configured for internal FIFO mode, this interrupt is also set when the transmit DMA has written the SOP data into the FIFO and either the AHB bus was not granted in time for further data, or because an AHB/AXI error response was returned by the connected slave, or because a used bit was read. When using the DMA interface configured for packet buffer mode, this bit will never be set. When using the external FIFO interface, this interrupt is also set when the tx_r_underflow input was asserted during a frame transfer. Cleared on read.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          TX_USED_BIT_READ:
            description: TX used bit read - set when a transmit buffer descriptor is read with its used bit set. Cleared on read.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          RX_USED_BIT_READ:
            description: RX used bit read - set when a receive buffer descriptor is read with its used bit set. Cleared on read.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RECEIVE_COMPLETE:
            description: Receive complete - a frame has been stored in memory. Cleared on read.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          MANAGEMENT_FRAME_SENT:
            description: Management frame sent - the PHY management register has completed its operation. Cleared on read.
            bitOffset: 0
            bitWidth: 1
            access: read-write
