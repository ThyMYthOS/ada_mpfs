            description: '2 byte Compare Value., :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+2 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+3., :, :If bit 9 of the associated compare_word1 register is clear, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+1., :'
            bitOffset: 16
            bitWidth: 16
            access: read-write
          MASK_VALUE:
            description: These bits can be either a 2 byte mask field or an additional 2 byte Compare Value. , :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [7:0] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [15:8] is compared against the byte in the received frame from the selected offset+1. , :, :If bit 9 of the associated compare_word1 register is clear, these bits become a direct 2-byte mask for the 2-byte compare register in bits [31:16]. A value of zero in a mask bit masks the corresponding data bit, a value of 1 enables the comparison.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      type2_compare_3_word_1:
        description: Type2 Compare Word 1
        addressOffset: 0x71C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 21
            access: read-only
          COMPARE_VLAN_ID:
            description: If set bits 9, 8 and 6:0 must be 0 and bit 7 of compare_offset is used as follows:, :0 Compare C-TAG VID (VLAN has EtherType of 0x8100), :1 Compare S-TAG VID comparison (VLAN has EtherType of the value in the stacked VLAN register at 0x00C0), :Note the byte order is such that if 81 00 00 20 is received to indicate a C-TAG frame with VID 020 0x00200FFF would be written to the compare register. So in the special case of VLAN comparison the last byte received is the least significant byte in the compare register
            bitOffset: 10
            bitWidth: 1
            access: read-write
          DISABLE_MASK:
            description: This bit is used to control whether the compare register word_0 contains a 4-byte compare value, or a 2-byte compare value with a 2-byte mask value., :1 - 4-byte compare value, :0 - 2-byte compare, 2-byte mask
            bitOffset: 9
            bitWidth: 1
            access: read-write
          COMPARE_OFFSET:
            description: 'Compare byte offset., :00 : Offset from beginning of the frame., :01 : Offset from byte after Ether Type., :10 : Offset from byte following end of IP header., :11 : Offset from byte following end of TCP/UDP header'
            bitOffset: 7
            bitWidth: 2
            access: read-write
          OFFSET_VALUE:
            description: Offset value in bytes
            bitOffset: 0
            bitWidth: 7
            access: read-write
