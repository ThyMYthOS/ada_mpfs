        description: 1588 Timer Seconds Register 31:0
        addressOffset: 0x11D0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TIMER:
            description: 1588 Timer Seconds Register. TSU timer value (s). Least significant 32 bits of seconds timer count. This register is writeable. The 48-bit counter increments by one when the 1588 nanoseconds counter counts to one second. It may also be incremented or decremented when the timer adjust register is written (if decremented from zero the 48-bit combined count would roll back to 0xFFFFFFFFFFFF).
            bitOffset: 0
            bitWidth: 32
            access: read-write
