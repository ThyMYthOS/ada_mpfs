      scr2_reg0_rate_limit:
        description: Screener type 2 maximum rate register. This register defines the maximum receive rate for the corresponding type 2 screener. This is a traffic policing function and is relevant to the 802.1Qci standard. If the maximum rate is exceeded all frames matched by the corresponding type 2 screener will be discarded until the receive rate falls below the specified value.
        addressOffset: 0xB40
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MAX_RATE_VAL:
            description: This is the maximum number of bytes this screener is permitted to match in the programmed interval time.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          INTERVAL_TIME:
            description: If during the interval time the total number of bytes of received frames matched by the screener exceeds max_rate_val then the current frame and frames subsequently matched will dropped until an interval time passes where max_rate_val is not exceeded. If this value is set to zero, then no rate limiting will be performed. The interval time is specified in units of 64 rx_clk periods.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      scr2_reg1_rate_limit:
        description: Screener type 2 maximum rate register. This register defines the maximum receive rate for the corresponding type 2 screener. This is a traffic policing function and is relevant to the 802.1Qci standard. If the maximum rate is exceeded all frames matched by the corresponding type 2 screener will be discarded until the receive rate falls below the specified value.
