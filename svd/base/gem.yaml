        addressOffset: 0x1070
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_1:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 1
            bitWidth: 31
            access: read-only
          DMA_TX_LOCKUP_EN_Q_0:
            description: Enable DMA TX lockup timer for queue 0.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      emac_rx_water_mark:
        description: rx_water_mark - Receive water mark register. This register contains the high and low water-marks for automatic transmission of pause frames. The water-marks are compared against the internal signal rx_dpram_fill_lvl which is readable in the dpram_fill_dbg register; rx_dpram_fill_lvl indicates the number of words used in the receive SRAM (word length is configuration dependent and may be 4, 8 and 16 bytes). A value of zero in a field disables the corresponding functionality.
        addressOffset: 0x107C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RX_LOW_WATERMARK:
            description: If this field is non-zero and the last pause frame transmitted was non-zero then a zero length pause frame is transmitted when the receive SRAM fill level falls below this value.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          RX_HIGH_WATERMARK:
            description: If this field is non-zero and the receive SRAM fill level exceeds this value then a pause frame is transmitted
            bitOffset: 0
            bitWidth: 16
            access: read-write
