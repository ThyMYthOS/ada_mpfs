            description: Reflects the state of the rx_pfc_paused signals. Each bit in the vector corresponds to a priority indicated within the received PFC priority based pause frame. A bit is set when a PFC priority based pause frame has been received, and the associated priority pause time quantum is non-zero. The bit is cleared when the associated pause time has elapsed.
