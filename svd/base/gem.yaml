        addressOffset: 0x10D0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MASK_VALUE:
            description: Data Buffer Address Mask Value. Values used to force bits 31:28 of the receive data buffer AHB address to a particular value when the associated enable bits stored in this register [3:0] are set. Any changes to this register will be ignored while the DMA is currently processing a receive packet. It will only affect the next full packet to be written to external system memory.
            bitOffset: 28
            bitWidth: 4
            access: read-write
          RESERVED_27_4:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 4
            bitWidth: 24
            access: read-only
          MASK_ENABLE:
            description: Data Buffer Address Mask Enable. These bits are associated directly with bits[31:28].When bit 0 is set, the AHB address bit 28 used for accessing the receive data buffers will be forced to the value stored in bit 28 of this register. When bit 1 is set, the AHB address bit 29 used for accessing the receive data buffers will be forced to the value stored in bit 29 of this register. When bit 2 is set, the AHB address bit 30 used for accessing the receive data buffers will be forced to the value stored in bit 30 of this register. When bit 3 is set, the AHB address bit 31 used for accessing the receive data buffers will be forced to the value stored in bit 31 of this register. When these bits are clear, the associated value stored in bits 31:28 have no effect on the AHB address used for receive data buffer accesses. Any changes to this register will be ignored while the DMA is currently processing a receive packet. It will only affect the next full packet to be written to external memory.
