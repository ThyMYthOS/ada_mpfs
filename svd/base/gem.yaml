      dma_rxbuf_size_q1:
        description: Receive Buffer Size
        addressOffset: 0x4A0
        size: 32
        access: read-write
        resetValue: 0x2
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          DMA_RX_Q_BUF_SIZE:
            description: 'DMA receive buffer size in system memory. The value defined by these bits determines the size of buffer to use in main system memory when writing received data. The value is defined in multiples of 64 bytes., :0x01 corresponds to buffers of 64 bytes., :0x02 corresponds to 128 bytes etc., :For example:, :0x02: 128 byte, :0x18: 1536 byte (1*max length frame/buffer), :0xA0: 10240 byte (1*10K jumbo frame/buffer), :0xFF: 16320 byte, :Note that this value should never be written as zero., :Note. The reset value of this field is equal to the gem_rx_buffer_length_def define, which is user configurable.'
