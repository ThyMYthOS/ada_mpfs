        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          COUNT:
            description: Transmitted octets in frame without errors [31:0]. The number of octets transmitted in valid frames of any type. This counter is 48-bits, and is read through two registers. This count does not include octets from automatically generated pause frames.
