            description: '2 byte Compare Value., :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+2 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+3., :, :If bit 9 of the associated compare_word1 register is clear, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+1., :'
            bitOffset: 16
            bitWidth: 16
            access: read-write
          MASK_VALUE:
            description: These bits can be either a 2 byte mask field or an additional 2 byte Compare Value. , :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [7:0] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [15:8] is compared against the byte in the received frame from the selected offset+1. , :, :If bit 9 of the associated compare_word1 register is clear, these bits become a direct 2-byte mask for the 2-byte compare register in bits [31:16]. A value of zero in a mask bit masks the corresponding data bit, a value of 1 enables the comparison.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_type2_compare_4_word_1:
        description: Type2 Compare Word 1
        addressOffset: 0x1724
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 21
            access: read-only
          COMPARE_VLAN_ID:
            description: If set bits 9, 8 and 6:0 must be 0 and bit 7 of compare_offset is used as follows:, :0 Compare C-TAG VID (VLAN has EtherType of 0x8100), :1 Compare S-TAG VID comparison (VLAN has EtherType of the value in the stacked VLAN register at 0x00C0), :Note the byte order is such that if 81 00 00 20 is received to indicate a C-TAG frame with VID 020 0x00200FFF would be written to the compare register. So in the special case of VLAN comparison the last byte received is the least significant byte in the compare register
            bitOffset: 10
            bitWidth: 1
            access: read-write
          DISABLE_MASK:
            description: This bit is used to control whether the compare register word_0 contains a 4-byte compare value, or a 2-byte compare value with a 2-byte mask value., :1 - 4-byte compare value, :0 - 2-byte compare, 2-byte mask
            bitOffset: 9
            bitWidth: 1
            access: read-write
          COMPARE_OFFSET:
            description: 'Compare byte offset., :00 : Offset from beginning of the frame., :01 : Offset from byte after Ether Type., :10 : Offset from byte following end of IP header., :11 : Offset from byte following end of TCP/UDP header'
            bitOffset: 7
            bitWidth: 2
            access: read-write
          OFFSET_VALUE:
            description: Offset value in bytes
            bitOffset: 0
            bitWidth: 7
            access: read-write
      emac_type2_compare_5_word_0:
        description: Compare A, B and C fields of the screener type 2 match register are pointers to a pool of up to 32 compare registers. If enabled the compare is true if the data at the OFFSET into the frame, ANDed with the MASK Value if the mask is enabled, is equal to the COMPARE Value. Either a 16 bit comparison or a 32 bit comparison is done. This selection is made via the associated compare word1 register bit 9. If a 16 bit comparison is selected, then a 16 bit mask is also available to the user to select which bits should be compared. If the 32 bit compare option is selected, then no mask is available. The byte at the OFFSET number of bytes from the index start is compared thru bits 7:0 of the configured VALUE. The byte at the OFFSET number of bytes + 1 from the index start is compared thru bits 15:8 of the configured VALUE and so on. The OFFSET can be configured to be from 0 to 127 bytes from either the start of the frame, the byte following the therType field (last EtherType in the header if the frame is VLAN tagged), the byte following the IP header (IPv4 or IPv6) or from the byte following the start of the TCP/UDP header. The required number of Type 2 screening registers up to a maximum of 32 is configurable in the gem defines file and have been allocated APB address space between 0x700 and 0x7fc. Note. when using RX Partial Store and Forward mode and priority queues, the frame offset must be less than the Partial Store and Forward watermark. If the offset is higher than the watermark value it's not possible to identify the priority queue before the frame is sent to the AMBA interface, and an incorrect priority queue may be used.
        addressOffset: 0x1728
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          COMPARE_VALUE:
            description: '2 byte Compare Value., :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+2 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+3., :, :If bit 9 of the associated compare_word1 register is clear, then the byte stored in bits [23:16] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [31:24] is compared against the byte in the received frame from the selected offset+1., :'
            bitOffset: 16
            bitWidth: 16
            access: read-write
          MASK_VALUE:
            description: These bits can be either a 2 byte mask field or an additional 2 byte Compare Value. , :, :If bit 9 of the associated compare_word1 register is set, then the byte stored in bits [7:0] is compared against the byte in the received frame from the selected offset+0 and the byte stored in bits [15:8] is compared against the byte in the received frame from the selected offset+1. , :, :If bit 9 of the associated compare_word1 register is clear, these bits become a direct 2-byte mask for the 2-byte compare register in bits [31:16]. A value of zero in a mask bit masks the corresponding data bit, a value of 1 enables the comparison.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_type2_compare_5_word_1:
        description: Type2 Compare Word 1
        addressOffset: 0x172C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 21
            access: read-only
          COMPARE_VLAN_ID:
            description: If set bits 9, 8 and 6:0 must be 0 and bit 7 of compare_offset is used as follows:, :0 Compare C-TAG VID (VLAN has EtherType of 0x8100), :1 Compare S-TAG VID comparison (VLAN has EtherType of the value in the stacked VLAN register at 0x00C0), :Note the byte order is such that if 81 00 00 20 is received to indicate a C-TAG frame with VID 020 0x00200FFF would be written to the compare register. So in the special case of VLAN comparison the last byte received is the least significant byte in the compare register
            bitOffset: 10
            bitWidth: 1
            access: read-write
          DISABLE_MASK:
            description: This bit is used to control whether the compare register word_0 contains a 4-byte compare value, or a 2-byte compare value with a 2-byte mask value., :1 - 4-byte compare value, :0 - 2-byte compare, 2-byte mask
            bitOffset: 9
            bitWidth: 1
            access: read-write
          COMPARE_OFFSET:
            description: 'Compare byte offset., :00 : Offset from beginning of the frame., :01 : Offset from byte after Ether Type., :10 : Offset from byte following end of IP header., :11 : Offset from byte following end of TCP/UDP header'
            bitOffset: 7
            bitWidth: 2
            access: read-write
          OFFSET_VALUE:
            description: Offset value in bytes
            bitOffset: 0
            bitWidth: 7
            access: read-write
      emac_enst_start_time:
        description: This register sets the absolute time at which queue q0 starts EnST transmit scheduling
        addressOffset: 0x1800
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          START_TIME_SEC:
            description: Bits 31:30 of the start time (seconds field), for q0
            bitOffset: 30
            bitWidth: 2
            access: read-write
          START_TIME_NSEC:
            description: Bits 29:0 of the start time (nanoseconds field), for q0
            bitOffset: 0
            bitWidth: 30
            access: read-write
      emac_enst_on_time:
        description: 'This register sets the time period for which queue q0 is to be open, (on_time_nsec), this register has to be written according to the speed mode as:, : ||1Gbps or 2.5Gbps|| : on_time = on_time_nsec/8, : ||100Mbps|| : on_time = on_time_nsec/80, : ||10Mbps|| : on_time = on_time_nsec/800'
        addressOffset: 0x1820
        size: 32
        access: read-write
        resetValue: 0x1FFFF
        fields:
          RESERVED_31_17:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 17
            bitWidth: 15
            access: read-only
          ON_TIME:
            description: on_time, for q0
            bitOffset: 0
            bitWidth: 17
            access: read-write
      emac_enst_off_time:
        description: 'This register sets the time period for which queue q0 is to be blocked, (off_time_nsec), this register has to be written according to the speed mode as:, : ||1Gbps or 2.5Gbps|| => off_time = off_time_nsec/8, : ||100Mbps|| => off_time = off_time_nsec/80, : ||10Mbps|| => off_time = off_time_nsec/800'
        addressOffset: 0x1840
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_17:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 17
            bitWidth: 15
            access: read-only
          OFF_TIME:
            description: Off_time, for q0
            bitOffset: 0
            bitWidth: 17
            access: read-write
      emac_enst_control:
        description: Enhancement for Scheduled Traffic control register. EnST scheduling can only be applied to a maximum number of 8 queues. If 802.3br operation has been configured and both an eMAC and pMAC are present then the eMAC only supports a single queue and EnST is enabled on the eMAC by writing to bit 0 of emac_enst_control.
        addressOffset: 0x1880
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          RESERVED_7_4:
            description: Reserved.
            bitOffset: 4
            bitWidth: 4
            access: read-write
          ENST_ENABLE_Q3:
            description: Set to enable enhanced scheduler traffic (ENST), for q3
            bitOffset: 3
            bitWidth: 1
            access: read-write
          ENST_ENABLE_Q2:
            description: Set to enable enhanced scheduler traffic (ENST), for q2
            bitOffset: 2
            bitWidth: 1
            access: read-write
          ENST_ENABLE_Q1:
            description: Set to enable enhanced scheduler traffic (ENST), for q1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          ENST_ENABLE_Q0:
            description: Set to enable enhanced scheduler traffic (ENST), for q0
            bitOffset: 0
            bitWidth: 1
            access: read-write
      emac_frer_timeout:
        description: FRER timeout register. This determines when the sequence recovery reset timers are reset and is used by all of the configured CB streams. It is programmed as a count of 8192 rx_clk periods. 8192 rx_clk periods is 65.536 microseconds at gigabit speeds and 327.68 microseconds at 100M speeds, this allows a max timeout value of about 4 seconds at gigabit speeds - for test purposes if bit 12 (retry_test) is set in the network configuration register at 0x004 then the timeout value just becomes a count of rx_clk periods (ie a speed-up of 8192 in the time-out process).
        addressOffset: 0x18A0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          TIMEOUT:
            description: Count of 8192 rx_clk periods.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_frer_red_tag:
        description: FRER redundancy tag register. This defines the Ethertype used to identify the R-TAG (redundancy tag) and contains a control bit to enable stripping of the R-TAG from received frames. IEEE 802.1CB has defined the value of this Ethertype to be 0xF1C1. Whether or not a particular stream uses the redundancy tag to locate the sequence number is determined by bit 28 in that streams control register.
        addressOffset: 0x18A4
        size: 32
        access: read-write
        resetValue: 0x4000F1C1
        fields:
          STRIP_R_TAG:
            description: If set the redundancy tag is stripped from received frames. If this bit is set then the receive octet counters reflect post deletion frame size so the FRER functionality is transparent to higher level management if the stripping function is enabled. If the statistics counters need to reflect the actual number of octets received, then the stripping functionality should be disabled.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          SIX_BYTE_TAG:
            description: Draft 2.4 and earlier drafts of the 802.1CB standard defined a four-byte redundancy tag. Drafts 2.5 and later specified a six-byte tag. Releases 1p10 and 1p11 were implemented in accordance with draft 2.4 of the standard. Set this bit to zero to inter-operate with implementations that use a four-byte tag.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          RESERVED_29_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 14
            access: read-only
          REDUNDANCY_TAG:
            description: Ethertype value used to identify the redundancy tag (R-TAG).
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_frer_control_1_a:
        description: FRER control register A
        addressOffset: 0x18C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          EN_ELIMINATION:
            description: Enable 802.1CB elimination of received frames
            bitOffset: 31
            bitWidth: 1
            access: read-write
          EN_VECTOR_REC_ALG:
            description: 'Enable 802.1CB vector recovery algorithm, : 0 enables the match recovery algorithm, : 1 enables the vector recovery algorithm, :This bit should only be changed when bit 31 en_elimination is low'
            bitOffset: 30
            bitWidth: 1
            access: read-write
          EN_SEQRECRST_TIMER:
            description: Enable 802.1CB sequence recovery reset timer - this bit may be changed when bit 31 en_elimination is low
            bitOffset: 29
            bitWidth: 1
            access: read-write
          USE_R_TAG:
            description: Set to one to use redundancy tag to identify sequence number otherwise use offset value to identify bottom of sequence number - this bit should only be changed when bit 31 en_elimination is low
            bitOffset: 28
            bitWidth: 1
            access: read-write
          RESERVED_27_17:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 17
            bitWidth: 11
            access: read-only
          OFFSET_VALUE:
            description: Offset value in bytes from the start packet delimiter to the most significant byte of the 802.1CB sequence number - 9 bits allow a maximum value of 511 - allowing a TCP sequence number to be used with IPv6 - this bit should only be changed when en_elimination is low
            bitOffset: 8
            bitWidth: 9
            access: read-write
          MEMBER_STREAM_2:
            description: Pointer to screener type 2 register used for member stream identification. The member stream 1 and 2 values may be programmed to identical values. - this bit should only be changed when en_elimination is low
            bitOffset: 4
            bitWidth: 4
            access: read-write
          MEMBER_STREAM_1:
            description: Pointer to screener type 2 register used for member stream identification. The member stream 1 and 2 values may be programmed to identical values. - this bit should only be changed when en_elimination is low
            bitOffset: 0
            bitWidth: 4
            access: read-write
      emac_frer_control_1_b:
        description: FRER control register B. This register has default values where the sequence number length defaults to 16 and the vector recovery window defaults to the size of the history vector. It is not expected that the user will need to change these default values.
        addressOffset: 0x18C4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_13:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 13
            bitWidth: 19
            access: read-only
          SEQ_NUM_LENGTH:
            description: Number of significant bits of the 802.1CB sequence number. The value 0x00 or numbers greater than 16 bits are equivalent to 16, but the number written will still be read back if it is greater than 16. If a value of less than 16 is written, then the sequence recovery algorithm will only consider that number of LSBs of the sequence number. The minimum size of seq_num_length has to be such that 2^seq_num_len is at least 2xgem_seq_history_len otherwise the vector recovery algorithm will not work correctly - this bit should only be changed when en_elimination is low
            bitOffset: 8
            bitWidth: 5
            access: read-write
          RESERVED_7_6:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 6
            bitWidth: 2
            access: read-only
          SEQ_REC_WINDOW:
            description: Vector recovery window, defines the window size used by the vector recovery algorithm to determine whether to reject a packet. Six bits allow a window size of 63, for effective operation of FRER users should not write a value greater than the gem_seq_history_len configuration define, a value of zero means the entire history vector is used - this bit should only be changed when en_elimination is low.
            bitOffset: 0
            bitWidth: 6
            access: read-write
      emac_frer_statistics_1_a:
        description: FRER statistics register A. This register is cleared on a read and does not roll over if its maximum value is reached.
        addressOffset: 0x18C8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_26:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 26
            bitWidth: 6
            access: read-only
          VEC_REC_ROGUE:
            description: Count of number of frames dropped by the vector recovery algorithm for being out of range
            bitOffset: 16
            bitWidth: 10
            access: read-write
          RESERVED_15_10:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 10
            bitWidth: 6
            access: read-only
          LATENT_ERRORS:
            description: Count of sequence numbers seen without a duplicate. The latent error count is updated when a frame is dropped from the history vector. So the update only happens after a new frame is received.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      emac_frer_statistics_1_b:
        description: FRER statistics register B. This register is cleared on a read and does not roll over if its maximum value is reached.
        addressOffset: 0x18CC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_24:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 24
            bitWidth: 8
            access: read-only
          SEQRST_COUNT:
            description: Count of number of times the sequence recovery reset timer decrements to zero.
            bitOffset: 16
            bitWidth: 8
            access: read-write
          RESERVED_15_10:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 10
            bitWidth: 6
            access: read-only
          OUT_OF_ORDER:
            description: Count of out of order sequence numbers received. Incremented when a frame is accepted but the sequence number is not +1 of the highest stored value.
            bitOffset: 0
            bitWidth: 10
            access: read-write
