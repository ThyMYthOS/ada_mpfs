        addressOffset: 0x103C
        size: 32
        access: read-write
        resetValue: 0xFFFFFFFF
        fields:
          QUANTUM_P1:
            description: Transmit pause quantum - written with the pause quantum value for pause frame transmission of priority 1.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          QUANTUM:
            description: Transmit pause quantum - written with the pause quantum value for pause frame transmission.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_pbuf_txcutthru:
        description: Transmit Partial Store and Forward Register. Partial store and forward is only applicable when using the DMA configured in SRAM based packet buffer mode. It is also not available when using multi buffer frames. This register contains the enable bit and watermark value for transmit cut-through operation.
        addressOffset: 0x1040
        size: 32
        access: read-write
        resetValue: 0x1FF
        fields:
          DMA_TX_CUTTHRU:
            description: Enable TX partial store and forward operation
            bitOffset: 31
            bitWidth: 1
            access: read-write
          DMA_TX_CUTTHRU_THRESHOLD:
            description: Watermark value corresponding to number of SRAM locations. This value must be >= 0x14. The actual number of bytes for the watermark is obtained by multiplying the watermark value by the value of the gem_tx_pbuf_data define divided by 8. The reset value depends on the value of the configuration option `gem_emac_tx_pbuf_addr, which is defined in the verilog defs configuration file.
            bitOffset: 0
            bitWidth: 9
            access: read-write
      emac_pbuf_rxcutthru:
        description: Receive Partial Store and Forward Register. Partial store and forward is only applicable when using the DMA configured in SRAM based packet buffer mode. It is also not available when using multi buffer frames. This register contains the enable bit and watermark value for receive cut-through operation.
        addressOffset: 0x1044
        size: 32
        access: read-write
        resetValue: 0x1FF
        fields:
          DMA_RX_CUTTHRU:
            description: Enable RX partial store and forward operation
            bitOffset: 31
            bitWidth: 1
            access: read-write
          DMA_RX_CUTTHRU_THRESHOLD:
            description: Watermark value corresponding to number of SRAM locations. The actual number of bytes for the watermark is obtained by multiplying the watermark value by the value of the gem_rx_pbuf_data define divided by 8. The reset value depends on the value of the configuration option `gem_emac_rx_pbuf_addr, which is defined in the verilog defs configuration file.
            bitOffset: 0
            bitWidth: 9
            access: read-write
      emac_jumbo_max_length:
        description: Maximum Jumbo Frame Size.
        addressOffset: 0x1048
        size: 32
        access: read-write
        resetValue: 0x2800
        fields:
          RESERVED_31_14:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 14
            bitWidth: 18
            access: read-only
          JUMBO_MAX_LENGTH:
            description: Maximum Jumbo Frame Size - resets to the gem_jumbo_max_length define value.
            bitOffset: 0
            bitWidth: 14
            access: read-write
      emac_axi_max_pipeline:
        description: Used to set the maximum amount of outstanding transactions on the AXI bus between AR / R channels and AW / W channels. Cannot be more than the depth of the configured AXI pipeline FIFO (defined in verilog defs.v)
        addressOffset: 0x1054
        size: 32
        access: read-write
        resetValue: 0x101
        fields:
          USE_AW2B_FILL:
            description: For the write issuing capability as defined in bits 15:8 of this register, select whether the max number of transactions operates between the AW to W AXI channel or the AW to B channel. Set to 0 to operate between the AW and W channels. Set to 1 to operate between the AW and B channels.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          AW2W_MAX_PIPELINE:
            description: Defines the maximum number of outstanding AXI write requests that can be issued by the DMA via the AW channel. This is effectively the write issuing capability.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          AR2R_MAX_PIPELINE:
            description: Defines the maximum number of outstanding AXI read requests that can be issued by the DMA via the AR channel. This is effectively the read issuing capability.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      emac_int_moderation:
        description: Used to moderate the number of transmit and receive complete interrupts issued. With interrupt moderation enabled receive and transmit interrupts are not generated immediately a frame is transmitted or received. Instead when a receive or transmit event occurs a timer is started and the interrupt is asserted after it times out. This limits the frequency with which the CPU receives interrupts. When interrupt moderation is enabled interrupt status bit one is always used for receive and bit 7 is always used for transmit even when priority queuing is enabled. With interrupt moderation 800ns periods are counted. GEM determines what constitutes an 800ns period by looking at the tbi (bit 11), gigabit bit (10) and speed (bit 0) bits in the network configuration register and counting tx_clk cycles. Bit 0 needs to be set to 1 for 100M operation., :From release 1p11 onwards a frame threshold value may also be used to moderate interrupts. If both time based and frame threshold moderation is enabled the interrupt will be asserted as soon as the first moderation method expires.
        addressOffset: 0x105C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TX_INT_MOD_THRESH:
            description: Count of transmitted frames before bit 7 is set in the interrupt status register. A non-zero value indicates transmit interrupt moderation will be performed.
            bitOffset: 24
            bitWidth: 8
            access: read-write
          TX_INT_MODERATION:
            description: Count of 800ns periods before bit 7 is set in the interrupt status register after a frame is transmitted. A non-zero value indicates transmit interrupt moderation will be performed.
            bitOffset: 16
            bitWidth: 8
            access: read-write
          RX_INT_MOD_THRESH:
            description: Count of received frames before bit 1 is set in the interrupt status register. A non-zero value indicates receive interrupt moderation will be performed.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          RX_INT_MODERATION:
            description: Count of 800ns periods before bit 1 is set in the interrupt status register after a frame is received. A non-zero value indicates receive interrupt moderation will be performed.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      emac_sys_wake_time:
        description: Used to pause transmission after deassertion of tx_lpi_en. Each unit in this register corresponds to 25.6ns in 2.5G mode, 64ns in gigabit mode, 320ns in 100M mode and 3200ns at 10M. After tx_lpi_en is deasserted transmission will pause for the set time.
        addressOffset: 0x1060
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          SYS_WAKE_TIME:
            description: Count of 25.6ns, 64ns, 320ns or 3200ns intervals before transmission starts after deassertion of tx_lpi_en (each interval is equivalent to eight tx_clk periods and so varies with data rate).
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_lockup_config:
        description: The lockup detection and recovery configuration register.
        addressOffset: 0x1068
        size: 32
        access: read-write
        resetValue: 0x7FFFFFF
        fields:
          TX_DMA_LOCKUP_MON_EN:
            description: Enable the TX DMA lockup detector. Enable the monitor that detects lockups in the transmit DMA.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          TX_MAC_LOCKUP_MON_EN:
            description: Enable the TX MAC lockup detector. Enable the monitor that detects lockups in the MAC transmit path.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          RX_DMA_LOCKUP_MON_EN:
            description: Enable the RX DMA lockup detector. Enable the monitor that detects lockups in the receive DMA.
            bitOffset: 29
            bitWidth: 1
            access: read-write
          RX_MAC_LOCKUP_MON_EN:
            description: Enable the RX MAC lockup detector. Enable the monitor that detects lockups in the MAC receive path.
            bitOffset: 28
            bitWidth: 1
            access: read-write
          LOCKUP_RECOVERY_EN:
            description: Lockup recovery. If this bit is set then the module will go into a soft reset state if a lockup is detected on the transmit or receive data paths.
            bitOffset: 27
            bitWidth: 1
            access: read-write
          DMA_LOCKUP_TIME:
            description: Prior to release 1p11 this field was reserved. From release 1p11 onwards this field defines the timeout value for transmit and receive DMA lockup detection defined as a multiple of the prescaler value stored in bits 15:0 of this register.
            bitOffset: 16
            bitWidth: 11
            access: read-write
          PRESCALER_VALUE:
            description: For release 1p10 this field defined the time (measured in units of 1024 tx_clk periods) after which the lockup detection monitors would trigger, except for the receive MAC lock up detector which had its lockup time register. From release 1p11 onwards this field defines a prescaler value which is the number of tx_clk periods used to scale the timeout registers.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_mac_lockup_time:
        description: MAC lockup detection time register. For receive this register specifies the maximum time between received frames. If no valid EOP is seen at the receive FIFO interface within the timer period then a lockup is considered to have occurred in the receive MAC. For transmit the MAC lockup time is simply the time it takes for data to be seen on the MII output pins after entering on the MAC FIFO interface.
        addressOffset: 0x106C
        size: 32
        access: read-write
        resetValue: 0x7FFFFFF
        fields:
          RESERVED_31_27:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 27
            bitWidth: 5
            access: read-only
          TX_MAC_LOCKUP_TIME:
            description: Prior to release 1p11 this field was reserved. From release 1p11 onwards this field defines the timeout value for transmit MAC lockup detection defined as a multiple of the prescaler value stored in bits 15:0 of the lockup config register.
            bitOffset: 16
            bitWidth: 11
            access: read-write
          RX_MAC_LOCKUP_TIME:
            description: The time after which the receive MAC lockup detection monitor will trigger. For release 1p10 this was measured in units of 1024 tx_clk periods. From release 1p11 onwards it is used in conjunction with the prescaler stored in bits 15:0 of the lockup config register.
            bitOffset: 0
            bitWidth: 16
            access: read-write
