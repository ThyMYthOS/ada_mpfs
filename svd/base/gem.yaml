            bitOffset: 17
            bitWidth: 15
            access: read-only
          FILTER_TYPE:
            description: This control bit selects whether this filter should be comparing the MAC source address or the MAC destination address of the received Ethernet frame. When set to zero, the filter is a destination address filter. When set to one, the filter is a source address filter.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          ADDRESS:
            description: Specific address 1. Octets 5 and 4 of the destination/source address that is to be compared, that is bits 47:32. See MAC Filtering Block of the user guide for more information.
