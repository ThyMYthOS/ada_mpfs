        fields:
          RESERVED_31_10:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 10
            bitWidth: 22
            access: read-only
          COUNT:
            description: Receive symbol errors - a 10-bit register counting the number of frames that had rx_er asserted during reception. For 10/100 mode symbol errors are counted regardless of frame length checks. For gigabit mode the frame must satisfy slot time requirements in order to count a symbol error. Additionally, in gigabit half-duplex mode, carrier extension errors are also recorded. Receive symbol errors will also be counted as an FCS or alignment error if the frame is between 64 and 1518 bytes (1536 bytes if bit 8 is set in the network configuration register, 10240 bytes if bit 3 is set in the network configuration register). If the frame is larger it will be recorded as a jabber error.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      alignment_errors:
        description: Alignment Errors
        addressOffset: 0x19C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_10:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 10
            bitWidth: 22
            access: read-only
          COUNT:
            description: Alignment errors - a 10 bit register counting frames that are not an integral number of bytes long and have bad CRC when their length is truncated to an integral number of bytes and are between 64 and 1518 bytes in length (1536 if bit 8 set in network configuration register, 10,240 bytes if bit 3 is set in the network configuration register). This register is also incremented if a symbol error is detected and the frame is of valid length and does not have an integral number of bytes.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      rx_resource_errors:
        description: Receive Resource Errors
        addressOffset: 0x1A0
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_18:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 18
            bitWidth: 14
            access: read-only
          COUNT:
            description: Receive resource errors - an 18 bit register counting the number of times a receive buffer descriptor was read with its used bit set. This can be used as a means of checking the efficiency of the software in processing and releasing receive buffers. In an ideally configured system, this counter would not increase.
            bitOffset: 0
            bitWidth: 18
            access: read-write
      rx_overruns:
        description: Receive Overruns
        addressOffset: 0x1A4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_10:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 10
            bitWidth: 22
            access: read-only
          COUNT:
            description: Receive overruns - a 10 bit register counting the number of frames that are address recognized but were not copied to memory due to a receive overrun.
            bitOffset: 0
            bitWidth: 10
            access: read-write
      rx_ip_ck_errors:
        description: IP Header Checksum Errors
        addressOffset: 0x1A8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          COUNT:
            description: IP header checksum errors - an 8-bit register counting the number of frames discarded due to an incorrect IP header checksum, but are between 64 and 1518 bytes (1536 bytes if bit 8 is set in the network configuration register or 10240 bytes if bit 3 is in the network configuration register) and do not have a CRC error, an alignment error, nor a symbol error.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      rx_tcp_ck_errors:
        description: TCP Checksum Errors
        addressOffset: 0x1AC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          COUNT:
            description: TCP checksum errors - an 8-bit register counting the number of frames discarded due to an incorrect TCP checksum, but are between 64 and 1518 bytes (1536 bytes if bit 8 is set in the network configuration register or 10240 bytes if bit 3 is in the network configuration register) and do not have a CRC error, an alignment error, nor a symbol error.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      rx_udp_ck_errors:
        description: UDP Checksum Errors
        addressOffset: 0x1B0
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          COUNT:
            description: UDP checksum errors - an 8-bit register counting the number of frames discarded due to an incorrect UDP checksum, but are between 64 and 1518 bytes (1536 bytes if bit 8 is set in the network configuration register or 10240 bytes if bit 3 is in the network configuration register) and do not have a CRC error, an alignment error, nor a symbol error.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      auto_flushed_pkts:
        description: Receive DMA Flushed Packets
        addressOffset: 0x1B4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          COUNT:
            description: Flushed RX packets counter. A 16 bit register counting the number of frames that have been flushed from the receive SRAM based packet buffer due to one of the following reasons:, :1. When either partial store and forward mode, bit 24 of the DMA configuration register, or the drop_on_resource_err mode of the traffic policing feature is active, and a packet is received while there is no AMBA (AHB/AXI) resource (no free descriptors for the DUT to use)., :2. When partial store and forward mode is enabled and an AMBA (AHB/AXI) error is encountered while writing the packet data to external memory., :3. When bit 18 of the network control register (software action to flush a packet from the head of the PBUF queue) is pulsed and the GEM DMA is not currently busy., :4. When a frame is dropped due to the policing actions defined in the rx_qX_flush registers located at 0x0b00-0x0b3c.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      tsu_timer_incr_sub_nsec:
        description: 1588 Timer Increment Register sub nsec. From release 1p08f1 onwards this register must be written before the tsu_timer_incr register and the value written will not take effect until the tsu_timer_incr register is written to.
        addressOffset: 0x1BC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SUB_NS_INCR_LSB:
            description: These are the least significant bits [7:0] of the sub-ns value by which the 1588 timer will be incremented each clock cycle.
            bitOffset: 24
            bitWidth: 8
            access: read-write
          RESERVED_23_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          SUB_NS_INCR:
            description: These are the most significant bits [23:8] of the sub-ns value by which the 1588 timer will be incremented each clock cycle. 24 bits of sub nanosecond precision gives resolution of approximately 5.86E-17 seconds (16 bits gives 15.2 femtoseconds).
            bitOffset: 0
            bitWidth: 16
            access: read-write
      tsu_timer_msb_sec:
        description: 1588 Timer Seconds Register 47:32
        addressOffset: 0x1C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          TIMER:
            description: 'TSU timer value (s). Most significant 16 bits of seconds timer count. The register is writeable. The 48-bit counter increments by one when the 1588 nanoseconds counter counts to one second. It may also be incremented or decremented when the timer adjust register is written (if decremented from zero the 48-bit combined count would roll back to 0xFFFFFFFFFFFF). Note: The value of this register is used only when the lower 32 bit register is written to. This is to ensure a single update of the 48 bit seconds value'
            bitOffset: 0
            bitWidth: 16
            access: read-write
      tsu_strobe_msb_sec:
        description: 1588 Timer Sync Strobe Seconds Register 47:32
        addressOffset: 0x1C4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          STROBE:
            description: 1588 Timer Sync Strobe Seconds. The most significant 16-bit value of the Timer Seconds register captured when gem_tsu_ms and gem_tsu_inc_ctrl are zero.
            bitOffset: 0
            bitWidth: 16
            access: read-only
      tsu_strobe_sec:
        description: 1588 Timer Sync Strobe Seconds Register 31:0
        addressOffset: 0x1C8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          STROBE:
            description: 1588 Timer Sync Strobe Seconds. The lowest significant 32-bit value of the Timer Seconds register captured when gem_tsu_ms and gem_tsu_inc_ctrl are zero.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      tsu_strobe_nsec:
        description: 1588 Timer Sync Strobe Nanoseconds Register
        addressOffset: 0x1CC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          STROBE:
            description: 1588 Timer Sync Strobe Nanoseconds. The value of the Timer Nanoseconds register captured when gem_tsu_ms and gem_tsu_inc_ctrl are zero.
            bitOffset: 0
            bitWidth: 30
            access: read-only
      tsu_timer_sec:
        description: 1588 Timer Seconds Register 31:0
        addressOffset: 0x1D0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TIMER:
            description: 1588 Timer Seconds Register. TSU timer value (s). Least significant 32 bits of seconds timer count. This register is writeable. The 48-bit counter increments by one when the 1588 nanoseconds counter counts to one second. It may also be incremented or decremented when the timer adjust register is written (if decremented from zero the 48-bit combined count would roll back to 0xFFFFFFFFFFFF).
            bitOffset: 0
            bitWidth: 32
            access: read-write
      tsu_timer_nsec:
        description: 1588 Timer Nanoseconds Register
        addressOffset: 0x1D4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: Timer count in nanoseconds. This register is writeable. It can also be adjusted by writes to the 1588 timer adjust register. It increments by the value of the 1588 timer increment register each clock cycle (if this register is close to zero and a write to the timer adjust register causes a decrement the seconds register will be decremented if necessary and the nanoseconds register will roll back to 9999999xx (decimal)).
            bitOffset: 0
            bitWidth: 30
            access: read-write
      tsu_timer_adjust:
        description: This register is used to adjust the value of the timer in the TSU. It allows an integral number of nanoseconds to be added or subtracted from the timer in a one-off operation. This register returns all zeroes when read.
        addressOffset: 0x1D8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ADD_SUBTRACT:
            description: Write as one to subtract from the 1588 timer. Write as zero to add to it.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          RESERVED_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 1
            access: read-only
          INCREMENT_VALUE:
            description: Timer increment value. The number of nanoseconds to increment or decrement the 1588 timer nanoseconds register. If necessary the 1588 seconds register will be incremented or decremented.
            bitOffset: 0
            bitWidth: 30
            access: read-write
      tsu_timer_incr:
        description: 1588 Timer Increment Register. From release 1p08f1 onwards this register must be written after the tsu_timer_incr_sub_ns register and the write operation will cause the value written to the tsu_timer_incr_sub_ns register to take effect.
        addressOffset: 0x1DC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_24:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 24
            bitWidth: 8
            access: read-only
          NUM_INCS:
            description: Number of incs before alt inc. The number of increments after which the alternative increment is used.
            bitOffset: 16
            bitWidth: 8
            access: read-write
          ALT_NS_INCR:
            description: Alternative nanoseconds count. Alternative count of nanoseconds by which the 1588 timer nanoseconds register will be incremented each clock cycle.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          NS_INCREMENT:
            description: A count of nanoseconds by which the 1588 timer nanoseconds register will be incremented each clock cycle. These are the most significant 8 bits of the 32 bit timer_increment counter. The tsu_timer_incr_sub_nsec register holds the least significant 24 bits of the increment.
            bitOffset: 0
            bitWidth: 8
            access: read-write
      tsu_ptp_tx_sec:
        description: PTP Event Frame Transmitted Seconds Register 31:0
        addressOffset: 0x1E0
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          TIMER:
            description: PTP Event Frame Transmitted Seconds. The register is updated with the value that the 1588 timer seconds register held when the SFD of a PTP transmit primary event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP sync or delay_req frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      tsu_ptp_tx_nsec:
        description: PTP Event Frame Transmitted Nanoseconds Register
        addressOffset: 0x1E4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: PTP Event Frame Transmitted Nanoseconds. The register is updated with the value that the 1588 timer nanoseconds register held when the SFD of a PTP transmit primary event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP sync or delay_req frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 30
            access: read-only
      tsu_ptp_rx_sec:
        description: PTP Event Frame Received Seconds Register 31:0
        addressOffset: 0x1E8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          TIMER:
            description: PTP Event Frame Received Seconds. The register is updated with the value that the 1588 timer seconds register held when the SFD of a PTP receive primary event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP sync or delay_req frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      tsu_ptp_rx_nsec:
        description: PTP Event Frame Received Nanoseconds Register
        addressOffset: 0x1EC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: PTP Event Frame Received Nanoseconds. The register is updated with the value that the 1588 timer nanoseconds register held when the SFD of a PTP receive primary event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP sync or delay_req frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 30
            access: read-only
      tsu_peer_tx_sec:
        description: PTP Peer Event Frame Transmitted Seconds Register 31:0
        addressOffset: 0x1F0
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          TIMER:
            description: PTP Peer Event Frame Received Seconds. The register is updated with the value that the 1588 timer seconds register held when the SFD of a PTP transmit peer event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP pdelay_req or pdelay_resp frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      tsu_peer_tx_nsec:
        description: PTP Peer Event Frame Transmitted Nanoseconds Register
        addressOffset: 0x1F4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: PTP Peer Event Frame Transmitted Nanoseconds. The register is updated with the value that the 1588 timer nanoseconds register held when the SFD of a PTP transmit peer event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP pdelay_req or pdelay_resp frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 30
            access: read-only
      tsu_peer_rx_sec:
        description: PTP Peer Event Frame Received Seconds Register 31:0
        addressOffset: 0x1F8
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          TIMER:
            description: PTP Peer Event Frame Received Seconds. The register is updated with the value that the 1588 timer seconds register held when the SFD of a PTP receive peer event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP pdelay_req or pdelay_resp frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      tsu_peer_rx_nsec:
        description: PTP Peer Event Frame Received Nanoseconds Register
        addressOffset: 0x1FC
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: PTP Peer Event Frame Received Nanoseconds. The register is updated with the value that the 1588 timer nanoseconds register held when the SFD of a PTP receive peer event crosses the MII interface. The actual update occurs when the GEM recognizes the frame as a PTP pdelay_req or pdelay_resp frame. An interrupt is issued when the register is updated.
            bitOffset: 0
            bitWidth: 30
            access: read-only
      pcs_control:
        description: 'Note: All PCS registers are defined in the IEEE 802.3 Standard. PCS Control Register. This register provides the main control functions with respect to the PCS.'
        addressOffset: 0x200
        size: 32
        access: read-write
        resetValue: 0x9040
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PCS_SOFTWARE_RESET:
            description: PCS software reset - written by software to force the hardware logic into a reset state. This bit is self-clearing. When reading this bit, logic 1 is returned until both the soft reset has completed and the PCS is enabled through the PCS select bit of the network configuration register. Writing logic 0 has no effect.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          LOOPBACK_MODE:
            description: 'Loopback mode - the ewrap output pin of the GEM reflects this control bit, and can be used to select loopback mode in the PHY transceiver. 0: Loopback mode disabled. 1: Loopback mode enabled.'
            bitOffset: 14
            bitWidth: 1
            access: read-write
          SPEED_SELECT_BIT_1:
            description: Speed select bit 1 - combined with speed select [0] to indicate the speed of operation of the PCS. As the GEM PCS is only intended to operate at 1000 Mbps, this bit is hardwired to logic 0.
            bitOffset: 13
            bitWidth: 1
            access: read-only
          ENABLE_AUTO_NEG:
            description: Enable auto-negotiation - when set active high, auto-negotiation operation is enabled.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          RESERVED_11_10:
            description: Reserved. Set to zero.
            bitOffset: 10
            bitWidth: 2
            access: read-only
          RESTART_AUTO_NEG:
            description: Restart auto-negotiation - when set active high, the hardware restarts auto-negotiation. This bit is self-clearing, but once set shall remain in this state until auto-negotiation has restarted. Writing logic 0 has no effect.
            bitOffset: 9
            bitWidth: 1
            access: read-write
          MAC_DUPLEX_STATE:
            description: MAC Duplex state. This returns the value of the MAC's duplex state as indicated in bit 1 of the MAC's network configuration register.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          COLLISION_TEST:
            description: Collision test - when set active high, the PCS generates collisions on transmit. This bit should only be set for test purposes.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          SPEED_SELECT_BIT_0:
            description: Speed select bit 0 - combined with speed select [1] to indicate the speed of operation of the PCS. As the GEM PCS is only intended to operate at 1000 Mbps, this bit is hardwired to logic 1.
            bitOffset: 6
            bitWidth: 1
            access: read-only
          RESERVED_5_0:
            description: Reserved. Set to zero.
            bitOffset: 0
            bitWidth: 6
            access: read-only
      pcs_status:
        description: This register indicates general status information concerning the PCS.
        addressOffset: 0x204
        size: 32
        access: read-only
        resetValue: 0x109
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          BASE_100_T4:
            description: 100 BASE-T4 - the GEM PCS does not support 100 BASE-T4. This bit is hardwired to logic 0.
            bitOffset: 15
            bitWidth: 1
            access: read-only
          BASE_100_X_FULL_DUPLEX:
            description: 100 BASE-X full duplex - the GEM PCS does not support 100 BASE-X. This bit is hardwired to logic 0.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          BASE_100_X_HALF_DUPLEX:
            description: 100 BASE-X half-duplex - the GEM PCS does not support 100 BASE-X. This bit is hardwired to logic 0.
            bitOffset: 13
            bitWidth: 1
            access: read-only
          MBPS_10_FULL_DUPLEX:
            description: 10 Mbps full duplex - the GEM PCS does not support this mode. This bit is hardwired to logic 0.
            bitOffset: 12
            bitWidth: 1
            access: read-only
          MBPS_10_HALF_DUPLEX:
            description: 10 Mbps half-duplex - the GEM PCS does not support this mode. This bit is hardwired to logic 0.
            bitOffset: 11
            bitWidth: 1
            access: read-only
          BASE_100_T2_FULL_DUPLEX:
            description: 100 BASE-T2 full duplex - the GEM PCS does not support 100 BASE-T2. This bit is hardwired to logic 0.
            bitOffset: 10
            bitWidth: 1
            access: read-only
          BASE_100_T2_HALF_DUPLEX:
            description: 100 BASE-T2 half-duplex - the GEM PCS does not support 100 BASE-T2. This bit is hardwired to logic 0.
            bitOffset: 9
            bitWidth: 1
            access: read-only
          EXTENDED_STATUS:
            description: Extended status - when set active high, indicates extended status information is present in the PCS auto-negotiation extended status register. This bit is hardwired to logic 1.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          RESERVED_7_6:
            description: Reserved. Set to zero.
            bitOffset: 6
            bitWidth: 2
            access: read-only
          AUTO_NEG_COMPLETE:
            description: Auto-negotiation complete - set active high by the PCS hardware to indicate auto-negotiation has completed.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          REMOTE_FAULT:
            description: Remote fault - set active high if the link partner remote fault bits in the PCS auto-negotiation link partner ability register, indicates an error. Resets low when read.
            bitOffset: 4
            bitWidth: 1
            access: read-only
          AUTO_NEG_ABILITY:
            description: 'Auto-negotiation ability - this bit indicates whether the PCS has auto-negotiation ability and reflects the value of the auto-negotiation enable bit in the PCS control register. 0: PCS is not able to perform auto-negotiation. 1: PCS is able to perform auto-negotiation.'
            bitOffset: 3
            bitWidth: 1
            access: read-only
          LINK_STATUS:
            description: Link status - indicates the status of the physical connection to the link partner. When set to logic 1 the link is up, and when set to logic 0, the link is down. If auto-negotiation is disabled this returns the synchronisation status. Held at logic 0 if the link goes down until this bit is read.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          RESERVED_1:
            description: Reserved. Set to zero.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          EXTENDED_CAPABILITIES:
            description: Extended register capabilities - when set active high, indicates the PCS supports extended register capabilities. This bit is hardwired to logic 1.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      pcs_phy_top_id:
        description: The value of this register indicates the upper 16-bits of the PHY's identification code. This is a read-only register with a value defined by `gem_phy_id_top
        addressOffset: 0x208
        size: 32
        access: read-only
        resetValue: 0x107
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          ID_CODE:
            description: Upper 16-bits of the PHY identification code, corresponding to the fixed identification for the GEM IP.
            bitOffset: 0
            bitWidth: 16
            access: read-only
      pcs_phy_bot_id:
        description: The value of this register indicates the lower 16-bits of the PHY's identification code. This is a read-only register with a value defined by `gem_phy_id_bot
        addressOffset: 0x20C
        size: 32
        access: read-only
        resetValue: 0x10C
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          ID_CODE:
            description: Lower 16-bits of the PHY identification code, corresponding to the revision of the GEM IP, which is incremented after each release of the IP.
            bitOffset: 0
            bitWidth: 16
            access: read-only
      pcs_an_adv:
        description: The value of this register is used to transmit the base page of the GEM PCS advertised capabilities as long as SGMII mode is not enabled. If SGMII mode is enabled by setting bit 27 in the network configuration register then this register becomes read only with a fixed value of 0x00000001. (SGMII specifies that the transmit configuration information sent from the MAC to the PHY is fixed with bit 14 set to 1 to indicate acknowledge, bit 0 set to 1 to indicate SGMII and all other bits set to 0.)
        addressOffset: 0x210
        size: 32
        access: read-write
        resetValue: 0x20
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          NEXT_PAGE:
            description: Next page. When set active high, this bit is used during auto-negotiation to indicate to the link partner that the PCS requires exchanging next pages.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          RESERVED_14:
            description: Reserved. Set to zero.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          REMOTE_FAULT:
            description: 'Remote fault [1:0] - indicates and classifies a remote fault condition to the link partner:, :00: No error, Link OK, :01: Link Failure. , :10: Off line. , :11: Auto-negotiation error.'
            bitOffset: 12
            bitWidth: 2
            access: read-write
          RESERVED_11_9:
            description: Reserved. Set to zero.
            bitOffset: 9
            bitWidth: 3
            access: read-only
          PAUSE:
            description: 'Pause[1:0] - used to provide a pause capability mechanism as follows:, :00: No pause. , :01: Symmetric pause. , :10: Asymmetric pause toward link partner. , :11: Both symmetric pause and asymmetric pause toward link device.'
            bitOffset: 7
            bitWidth: 2
            access: read-write
          HALF_DUPLEX:
            description: 'half-duplex - this bit defines to the link partner whether the GEM is capable of supporting half-duplex operation., :0: The GEM cannot support half-duplex. , :1: The GEM can support half-duplex.'
            bitOffset: 6
            bitWidth: 1
            access: read-write
          FULL_DUPLEX:
            description: 'Full duplex - this bit defines to the link partner whether the GEM is capable of supporting full duplex operation. , :0: The GEM cannot support full duplex. , :1: The GEM can support full duplex.'
            bitOffset: 5
            bitWidth: 1
            access: read-write
          RESERVED_4_0:
            description: Reserved. Set to zero.
            bitOffset: 0
            bitWidth: 5
            access: read-only
      pcs_an_lp_base:
        description: When SGMII mode is not enabled, the value of this register contains the link partner's base page received information. This register is updated in the ABILITY_DETECT state of the PCS auto-negotiation state machine so bit 14 will only be set if the link partner is sending acknowledge while the PCS in this state. The register is not updated in the ACK_DETECT state. For SGMII mode, the contents of this register change to the one defined in the SGMII standard. The value of this register contains the link partner's base page received information. In this case the link partner is the PHY connected by the SGMII.
        addressOffset: 0x214
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          LINK_PARTNER_NEXT_PAGE_STATUS:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Link partner next page - when set active high, this bit indicates the link partner''s intention to exchange next pages., :, :SGMII Mode: , :Link Status., :0 : Link Down., :1 : Link Up.'
            bitOffset: 15
            bitWidth: 1
            access: read-only
          LINK_PARTNER_ACKNOWLEDGE:
            description: Link partner acknowledge - indicates the link partner has successfully received the transmitted base page
            bitOffset: 14
            bitWidth: 1
            access: read-only
          LINK_PARTNER_REMOTE_FAULT_DUPLEX_MODE:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Link partner remote fault [1:0] - indicates and classifies a remote fault condition has been detected by the link partner as follows:, :00: No error, Link OK, :01: Link Failure., :10: Off line. , :11: Auto-negotiation error., :, :SGMII Mode:, :Bit 13: Reserved. read as 0., :Bit 12 : 0 : half-duplex. 1: Full Duplex.'
            bitOffset: 12
            bitWidth: 2
            access: read-only
          SPEED_RESERVED:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Reserved. Set to zero., :, :SGMII Mode :, :Bits 11:10 : Speed : , :11 : Reserved, :10 : 1000 Mbps, :01 : 100Mbps, :00 : 10 Mbps, :Bit 9 : Reserved. read as 0.'
            bitOffset: 9
            bitWidth: 3
            access: read-only
          PAUSE:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Pause[1:0] - provides the link partner''s pause frame capability as follows:, :00: No pause. , :01: Symmetric pause. , :10: Asymmetric pause toward link partner. , :11: Both symmetric pause and asymmetric pause toward link device., :, :SGMII Mode:, :Reserved. read as 0.'
            bitOffset: 7
            bitWidth: 2
            access: read-only
          LINK_PARTNER_HALF_DUPLEX:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Link partner half-duplex - this bit indicates whether the link partner is capable of supporting half-duplex operation. , :0: The link partner cannot support half-duplex. , :1: The link partner can support half-duplex., :, :SGMII Mode: , :Reserved. read as 0.'
            bitOffset: 6
            bitWidth: 1
            access: read-only
          LINK_PARTNER_FULL_DUPLEX:
            description: 'The contents of this register change depending on SGMII or non SGMII mode., :, :non SGMII Mode:, :Link partner full duplex - this bit indicates whether the link partner is capable of supporting full duplex operation. , :0: The link partner cannot support full duplex. , :1: The link partner can support full duplex., :, :SGMII Mode: , :Reserved. read as 0.'
            bitOffset: 5
            bitWidth: 1
            access: read-only
          RESERVED_4_0:
            description: Reserved. Set to zero.
            bitOffset: 0
            bitWidth: 5
            access: read-only
      pcs_an_exp:
        description: This register contains auto-negotiation next page ability and page received information.
        addressOffset: 0x218
        size: 32
        access: read-only
        resetValue: 0x4
        fields:
          RESERVED_31_3:
            description: Reserved. Set to zero.
            bitOffset: 3
            bitWidth: 29
            access: read-only
          NEXT_PAGE_CAPABILITY:
            description: Next page capability - hard wired to logic 1 to indicate that the GEM PCS supports next page operation.
            bitOffset: 2
            bitWidth: 1
            access: read-only
          PAGE_RECEIVED:
            description: Page received - this bit is set active high when a new page has been received from the link partner. It is cleared when the link partner next page register has been read.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          RESERVED_0:
            description: Reserved. Set to zero.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      pcs_an_np_tx:
        description: The value of this register is used to transmit the next page information for the GEM PCS. For next page exchange to work this register must be written within 10 ms of receiving a new page from the link partner. If the link partner is requesting next pages and the GEM has none or no more to send then this register should be written with the null message (0x2001). The value 0x0000 must not be written to this register.
        addressOffset: 0x21C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          NEXT_PAGE_TO_TRANSMIT:
            description: 'Next page to transmit - this bit indicates whether this is the last next page to be transmitted:0: Last page. 1: Additional page(s) to follow.'
            bitOffset: 15
            bitWidth: 1
            access: read-write
          RESERVED_14:
            description: Reserved. Set to zero.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          MESSAGE_PAGE_INDICATOR:
            description: 'Message page indicator - this bit identifies the message. 0: Unformatted page. 1: Message page.'
            bitOffset: 13
            bitWidth: 1
            access: read-write
          ACKNOWLEDGE_2:
            description: Acknowledge 2 - when set active high, indicates that the GEM PCS has the ability to comply with the last received message.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          RESERVED_11:
            description: Reserved. Set to zero.
            bitOffset: 11
            bitWidth: 1
            access: read-only
          MESSAGE:
            description: Message - contains data as defined by the message page indicator bit.
            bitOffset: 0
            bitWidth: 11
            access: read-write
      pcs_an_lp_np:
        description: This value of this register contains the next page received information from the link partner.
        addressOffset: 0x220
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          NEXT_PAGE_TO_RECEIVE:
            description: 'Next page to receive - this bit indicates whether this is the last page to be received in the sequence by the GEM PCS:, :0: Last page. , :1: Additional page(s) to follow.'
            bitOffset: 15
            bitWidth: 1
            access: read-only
          ACKNOWLEDGE:
            description: Acknowledge - this bit indicates whether as part of the next page function, the link partner has successfully received the last message transmitted.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          MESSAGE_PAGE_INDICATOR:
            description: 'Message page indicator - this bit identifies the message. , :0: Unformatted page. , :1: Message page.'
            bitOffset: 13
            bitWidth: 1
            access: read-only
          ACKNOWLEDGE_2:
            description: Acknowledge 2 - set active high by the link partner to indicate when it has the ability to comply with the last message received.
            bitOffset: 12
            bitWidth: 1
            access: read-only
          TOGGLE:
            description: Toggle - this bit toggles with every received page.
            bitOffset: 11
            bitWidth: 1
            access: read-only
          MESSAGE:
            description: Message - contains data as defined by the message page indicator bit.
            bitOffset: 0
            bitWidth: 11
            access: read-only
      pcs_an_ext_status:
        description: This register contains PCS auto-negotiation extended status information.
        addressOffset: 0x23C
        size: 32
        access: read-only
        resetValue: 0x8000
        fields:
          RESERVED_31_16:
            description: Reserved. Set to zero.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          FULL_DUPLEX_1000BASE_X:
            description: Full duplex 1000BASE-X - hardwired to logic 1, indicates the GEM PCS can support full duplex operation of 1000BASE-X.
            bitOffset: 15
            bitWidth: 1
            access: read-only
          HALF_DUPLEX_1000BASE_X:
            description: half-duplex 1000BASE-X - hardwired to logic 0, indicates the GEM MAC cannot support half-duplex operation at gigabit speeds.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          FULL_DUPLEX_1000BASE_T:
            description: Full duplex 1000BASE-T - hardwired to logic 0, indicates the GEM PCS cannot support 1000BASE-T full duplex operation.
            bitOffset: 13
            bitWidth: 1
            access: read-only
          HALF_DUPLEX_1000BASE_T:
            description: half-duplex 1000BASE-T - hardwired to logic 0, indicates the GEM PCS cannot support 1000BASE-T half-duplex operation.
            bitOffset: 12
            bitWidth: 1
            access: read-only
          RESERVED_11_0:
            description: Reserved. Set to zero.
            bitOffset: 0
            bitWidth: 12
            access: read-only
