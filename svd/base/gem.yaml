      tx_sched_ctrl:
        description: This register controls the transmit scheduling algorithm the user can select for each active transmit queue. By default all queues are initialized to fixed priority, with the top indexed queue having overall priority.
        addressOffset: 0x580
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_8:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 8
            bitWidth: 24
            access: read-only
          TX_SCHED_Q3:
            description: 'Queue 3 selection., : 00 : Fixed Priority, : 01 : CBS Enabled only valid for top two enabled queues and if CBS capability selected., : 10 : DWRR Enabled, : 11 : ETS Enabled'
            bitOffset: 6
            bitWidth: 2
            access: read-write
          TX_SCHED_Q2:
            description: 'Queue 2 selection., : 00 : Fixed Priority, : 01 : CBS Enabled only valid for top two enabled queues and if CBS capability selected., : 10 : DWRR Enabled, : 11 : ETS Enabled'
            bitOffset: 4
            bitWidth: 2
            access: read-write
          TX_SCHED_Q1:
            description: 'Queue 1 selection., : 00 : Fixed Priority, : 01 : CBS Enabled only valid for top two enabled queues and if CBS capability selected., : 10 : DWRR Enabled, : 11 : ETS Enabled'
            bitOffset: 2
            bitWidth: 2
            access: read-write
          TX_SCHED_Q0:
            description: 'Queue 0 selection., : 00 : Fixed Priority, : 01 : CBS Enabled only valid for top two enabled queues and if CBS capability selected., : 10 : DWRR Enabled, : 11 : ETS Enabled'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      bw_rate_limit_q0to3:
        description: This register holds the DWRR weighting value or the ETS bandwidth percentage value used by the transmit scheduler for queues 0 to 3.
        addressOffset: 0x590
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DWRR_ETS_WEIGHT_Q3:
            description: DWRR Weighting / ETS Bandwidth Allocation for queue 3
            bitOffset: 24
            bitWidth: 8
            access: read-write
          DWRR_ETS_WEIGHT_Q2:
            description: DWRR Weighting / ETS Bandwidth Allocation for queue 2
            bitOffset: 16
            bitWidth: 8
            access: read-write
          DWRR_ETS_WEIGHT_Q1:
            description: DWRR Weighting / ETS Bandwidth Allocation for queue 1
            bitOffset: 8
            bitWidth: 8
            access: read-write
          DWRR_ETS_WEIGHT_Q0:
            description: DWRR Weighting / ETS Bandwidth Allocation for queue 0
            bitOffset: 0
            bitWidth: 8
            access: read-write
      tx_q_seg_alloc_q_lower:
        description: This register allows the user to distribute the Transmit SRAM used by the DMA across the priority queues, for queues 0 to 3. The SRAM itself is split into a number of evenly sized segments (this is defined in the verilog configuration defs file - for the configuration used to generate this register description, the total number of segments was set to '4'). Those segments can then be freely distributed across the active queues, in powers of 2. I.e. a value of 0 would mean 1 segment has been allocated to the queue. A value of 1 would mean 2 segments, a value of 2 means 4 segments and so on. The reset values of these registers are defined in the configuration defs file.
        addressOffset: 0x5A0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          RESERVED_15_15:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 15
            bitWidth: 1
            access: read-only
          SEGMENT_ALLOC_Q3:
            description: Number of segments allocated to q3. This should be entered as a log 2, for example entering a value of 2 would grant 4 segments. A maximum of 16 segments can be granted.
            bitOffset: 12
            bitWidth: 3
            access: read-write
          RESERVED_11_11:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 11
            bitWidth: 1
            access: read-only
          SEGMENT_ALLOC_Q2:
            description: Number of segments allocated to q2. This should be entered as a log 2, for example entering a value of 2 would grant 4 segments. A maximum of 16 segments can be granted.
            bitOffset: 8
            bitWidth: 3
            access: read-write
          RESERVED_7_7:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 7
            bitWidth: 1
            access: read-only
          SEGMENT_ALLOC_Q1:
            description: Number of segments allocated to q1. This should be entered as a log 2, for example entering a value of 2 would grant 4 segments. A maximum of 16 segments can be granted.
            bitOffset: 4
            bitWidth: 3
            access: read-write
          RESERVED_3_3:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          SEGMENT_ALLOC_Q0:
            description: Number of segments allocated to q0. This should be entered as a log 2, for example entering a value of 2 would grant 4 segments. A maximum of 16 segments can be granted.
            bitOffset: 0
            bitWidth: 3
            access: read-write
