        access: read-write
        resetValue: 0x0
        fields:
          WRITE0:
            description: Must be written with 0.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          WRITE1:
            description: Must be written to 1 for a valid Clause 22 frame and to 0 for a valid Clause 45 frame.
            bitOffset: 30
            bitWidth: 1
            access: read-write
          OPERATION:
            description: 'Operation. For a Clause 45 frame: 00 is an addr, 01 is a write, 10 is a post read increment, 11 is a read frame. For a Clause 22 frame: 10 is a read, 01 is a write.'
            bitOffset: 28
            bitWidth: 2
            access: read-write
          PHY_ADDRESS:
            description: PHY address.
            bitOffset: 23
            bitWidth: 5
            access: read-write
          REGISTER_ADDRESS:
            description: Register address - specifies the register in the PHY to access.
            bitOffset: 18
            bitWidth: 5
            access: read-write
          WRITE10:
            description: Must be written with 10.
            bitOffset: 16
            bitWidth: 2
            access: read-write
          PHY_WRITE_READ_DATA:
            description: For a write operation this is written with the data to be written to the PHY. After a read operation this contains the data read from the PHY.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_pause_time:
