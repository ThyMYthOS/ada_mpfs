        description: 1588 Timer Nanoseconds Register
        addressOffset: 0x11D4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_30:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 30
            bitWidth: 2
            access: read-only
          TIMER:
            description: Timer count in nanoseconds. This register is writeable. It can also be adjusted by writes to the 1588 timer adjust register. It increments by the value of the 1588 timer increment register each clock cycle (if this register is close to zero and a write to the timer adjust register causes a decrement the seconds register will be decremented if necessary and the nanoseconds register will roll back to 9999999xx (decimal)).
            bitOffset: 0
            bitWidth: 30
            access: read-write
      emac_tsu_timer_adjust:
