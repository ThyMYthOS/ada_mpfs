            description: Transmit pause quantum - written with the pause quantum value for pause frame transmission of priority 1.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          QUANTUM:
            description: Transmit pause quantum - written with the pause quantum value for pause frame transmission.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      pbuf_txcutthru:
        description: Transmit Partial Store and Forward Register. Partial store and forward is only applicable when using the DMA configured in SRAM based packet buffer mode. It is also not available when using multi buffer frames. This register contains the enable bit and watermark value for transmit cut-through operation.
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x7FF
        fields:
          DMA_TX_CUTTHRU:
            description: Enable TX partial store and forward operation
            bitOffset: 31
            bitWidth: 1
            access: read-write
          DMA_TX_CUTTHRU_THRESHOLD:
            description: Watermark value corresponding to number of SRAM locations. This value must be >= 0x14. The actual number of bytes for the watermark is obtained by multiplying the watermark value by the value of the gem_tx_pbuf_data define divided by 8. The reset value depends on the value of the configuration option `gem_tx_pbuf_addr, which is defined in the verilog defs configuration file. The value chosen for the generation of the userguide was `gem_tx_pbuf_addr = 14
            bitOffset: 0
            bitWidth: 11
            access: read-write
      pbuf_rxcutthru:
        description: Receive Partial Store and Forward Register. Partial store and forward is only applicable when using the DMA configured in SRAM based packet buffer mode. It is also not available when using multi buffer frames. This register contains the enable bit and watermark value for receive cut-through operation.
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x7FF
        fields:
          DMA_RX_CUTTHRU:
            description: Enable RX partial store and forward operation
            bitOffset: 31
            bitWidth: 1
            access: read-write
          DMA_RX_CUTTHRU_THRESHOLD:
            description: Watermark value corresponding to number of SRAM locations. The actual number of bytes for the watermark is obtained by multiplying the watermark value by the value of the gem_rx_pbuf_data define divided by 8. The reset value depends on the value of the configuration option `gem_rx_pbuf_addr, which is defined in the verilog defs configuration file. The value chosen for the generation of the userguide was `gem_rx_pbuf_addr = 11
            bitOffset: 0
            bitWidth: 11
            access: read-write
      jumbo_max_length:
