      rx_q0_flush:
        description: Receive Queue flush register. This register defines the traffic policing mode of operation. Each mode can be set simultaneously with the exception of bits 2 and 3, which are exclusive. If bits 2 and 3 are both set then only bit 3 is treated as active.
        addressOffset: 0xB00
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          MAX_VAL:
            description: This 16 bit vector is used when either bit 2 or 3 of this register is asserted. Refer to the description in those bits for details.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          RESERVED_15_4:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 4
            bitWidth: 12
            access: read-only
          LIMIT_FRAME_SIZE:
            description: When set max_val (bits 31:16) indicates the maximum frame-length in bytes that may be received. Frames exceeding this length will be dropped. This traffic policing function is relevant to the 802.1Qci standard which specifies stream filtering based on a maximum SDU (service data unit) size.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          LIMIT_NUM_BYTES:
            description: When set, the number of 128 byte chunks of data received for this queue and already stored in the SRAM awaiting DMA memory writes cannot exceed max_val (bits 31:16).
            bitOffset: 2
            bitWidth: 1
            access: read-write
          DROP_ON_RESOURCE_ERR:
            description: When set, if a free DMA descriptor for this queue cannot be obtained (also referred to as lack of descriptor resource and occurs when the software either cannot free up descriptors quickly enough to meet the receive traffic rate or has deliberately decided not to free any descriptors), all new frames received on this queue will be automatically discarded.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          DROP_ALL_FRAMES:
            description: When set, all frames on this queue will be dropped.
            bitOffset: 0
            bitWidth: 1
            access: read-write
