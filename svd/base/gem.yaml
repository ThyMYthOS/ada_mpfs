      emac_auto_flushed_pkts:
        description: Receive DMA Flushed Packets
        addressOffset: 0x11B4
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          COUNT:
            description: Flushed RX packets counter. A 16 bit register counting the number of frames that have been flushed from the receive SRAM based packet buffer due to one of the following reasons:, :1. When either partial store and forward mode, bit 24 of the DMA configuration register, or the drop_on_resource_err mode of the traffic policing feature is active, and a packet is received while there is no AMBA (AHB/AXI) resource (no free descriptors for the DUT to use)., :2. When partial store and forward mode is enabled and an AMBA (AHB/AXI) error is encountered while writing the packet data to external memory., :3. When bit 18 of the network control register (software action to flush a packet from the head of the PBUF queue) is pulsed and the GEM DMA is not currently busy., :4. When a frame is dropped due to the policing actions defined in the rx_qX_flush registers located at 0x0b00-0x0b3c.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_tsu_timer_incr_sub_nsec:
        description: 1588 Timer Increment Register sub nsec. From release 1p08f1 onwards this register must be written before the tsu_timer_incr register and the value written will not take effect until the tsu_timer_incr register is written to.
        addressOffset: 0x11BC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SUB_NS_INCR_LSB:
            description: These are the least significant bits [7:0] of the sub-ns value by which the 1588 timer will be incremented each clock cycle.
            bitOffset: 24
            bitWidth: 8
            access: read-write
          RESERVED_23_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          SUB_NS_INCR:
            description: These are the most significant bits [23:8] of the sub-ns value by which the 1588 timer will be incremented each clock cycle. 24 bits of sub nanosecond precision gives resolution of approximately 5.86E-17 seconds (16 bits gives 15.2 femtoseconds).
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_tsu_timer_msb_sec:
        description: 1588 Timer Seconds Register 47:32
        addressOffset: 0x11C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          TIMER:
            description: 'TSU timer value (s). Most significant 16 bits of seconds timer count. The register is writeable. The 48-bit counter increments by one when the 1588 nanoseconds counter counts to one second. It may also be incremented or decremented when the timer adjust register is written (if decremented from zero the 48-bit combined count would roll back to 0xFFFFFFFFFFFF). Note: The value of this register is used only when the lower 32 bit register is written to. This is to ensure a single update of the 48 bit seconds value'
            bitOffset: 0
            bitWidth: 16
            access: read-write
