          TX_BD_TS_MODE:
            description: 'Transmit Descriptor Timestamp Insertion mode - bit 23 in transmit buffer descriptor word 1 when extended buffer descriptor mode is enabled,, : 00: Bit 23 always zero,, : 01: Bit 23 high for PTP Event Frames only,, : 10: Bit 23 high for all PTP Frames only,, : 11: Bit 23 always high'
