      emac_wol_register:
        description: Wake on LAN Register
        addressOffset: 0x10B8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_20:
            description: Reserved - read 0, ignored when written.
            bitOffset: 20
            bitWidth: 12
            access: read-only
          WOL_MASK_3:
            description: Wake on LAN multicast hash event enable. When set multicast hash events will cause the wol output to be asserted.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          WOL_MASK_2:
            description: Wake on LAN specific address register 1 event enable. When set specific address 1 events will cause the wol output to be asserted.
            bitOffset: 18
            bitWidth: 1
            access: read-write
          WOL_MASK_1:
            description: Wake on LAN ARP request event enable. When set ARP request events will cause the wol output to be asserted.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          WOL_MASK_0:
            description: Wake on LAN magic packet event enable. When set magic packet events will cause the wol output to be asserted.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          ADDR:
            description: Wake on LAN ARP request IP address. Written to define the least significant 16 bits of the target IP address that is matched to generate a Wake on LAN event. A value of zero will not generate an event, even if this is matched by the received frame.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_stretch_ratio:
        description: IPG stretch register
        addressOffset: 0x10BC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVED_31_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 16
            access: read-only
          IPG_STRETCH:
            description: IPG Stretch. Bits 7:0 are multiplied with the previously transmitted frame length (including preamble) bits 15:8 +1 divide the frame length. If the resulting number is greater than 96 and bit 28 is set in the network configuration register then the resulting number is used for the transmit inter-packet-gap. 1 is added to bits 15:8 to prevent a divide by zero.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_stacked_vlan:
        description: Stacked VLAN Register
        addressOffset: 0x10C0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ENABLE_PROCESSING:
            description: Enable stacked VLAN processing mode
            bitOffset: 31
            bitWidth: 1
            access: read-write
          RESERVED_30_16:
            description: Reserved, read as 0, ignored on write.
            bitOffset: 16
            bitWidth: 15
            access: read-only
          MATCH:
            description: User defined VLAN_TYPE field. When Stacked VLAN is enabled, the first VLAN tag in a received frame will only be accepted if the VLAN type field is equal to this user defined VLAN_TYPE OR equal to the standard VLAN type (0x8100). Note that the second VLAN tag of a Stacked VLAN packet will only be matched correctly if its VLAN_TYPE field equals 0x8100.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      emac_tx_pfc_pause:
