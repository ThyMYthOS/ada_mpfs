_add:
  EMMC_SD:
    description: EMMC_SD Controller
    baseAddress: 0x20008000
    registers:
      HRS00:
        description: HRS00 - General Information Register
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x10000
        fields:
          HRS00_HWINIT1:
            description: HWINIT field
            bitOffset: 24
            bitWidth: 8
            access: read-only
          SAV:
            description: SAV - Slot Available\n\n This field provides a number of implemented slots. Each bit of the field is assigned to one of the slots (slot 0 is assigned to bit 16 of HRS00 register, slot 1 to bit 17, etc.). If given slot is implemented, the bit is read as 1. Otherwise, if given slot in unavailable, corresponding bit is 0. The slot 0 is always available. If slot n is implemented, the slot n-1 also is implemented.\n\n This configuration supports one slot and this field is equal to 0x01 (although the value can be altered by changing HWINIT_HRS00 value).\n\n HWINIT Field - Note this field is hardware initialized after reset and the value read back will match the IP configuration.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          HRS00_HWINIT0:
            description: HWINIT field
            bitOffset: 1
            bitWidth: 15
            access: read-only
          SWR:
            description: SWR - Software Reset\n\n When set to 1, the entire core is reset. After reset operation complete, SWR bit is automatically cleared. It takes some time to complete the requested reset operation, so the software should always poll SWR bit status, and continue the other operations only when SWR is cleared to 0.\n\n There is no difference between SWR and SRS11.SRFA software resets. Both resets the same flip-flops.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      HRS01:
        description: HRS01 - Debounce Setting Register
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x32
        fields:
          HRS01_HWINIT0:
            description: HWINIT field
            bitOffset: 24
            bitWidth: 8
            access: read-only
          DP:
            description: DP - Debounce Period\n\n Defines the number of system (clk) clock cycles used by the debounce logic, which detects card insertion and removal events. The debounce period is equal to DP * tclk, where tclk is the period of clk clock. If there is no change on s#_sdcd_n signal level for a programmed debounce period, the core logic decodes the card state as stable and triggers card_inserted or card_removed event. Typically, DP value should be chosen to obtain the period of 20ms.\n\n This register is reset to DEBOUNCE_PERIOD (HWINIT_HRS01) after reset.
            bitOffset: 0
            bitWidth: 24
            access: read-write
      HRS02:
        description: HRS02 - Bus Setting Register
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x30000
        fields:
          HRS02_HWINIT1:
            description: HWINIT field
            bitOffset: 18
            bitWidth: 14
            access: read-only
          OTN:
            description: OTN - Number of Outstanding Transfers\n\n Specifies number of outstanding transfers on DMA (Master) interface. The number of outstandings is (OTN + 1), where OTN can be defined in range 0 to 3.\n\n This register is set to 3 after reset (i.e. 4 outstanding transfers) (HWINIT_HRS02).
            bitOffset: 16
            bitWidth: 2
            access: read-write
          HRS02_HWINIT0:
            description: HWINIT field
            bitOffset: 4
            bitWidth: 12
            access: read-only
          PBL:
            description: PBL - Programmable Burst Length\n\n This field defines a maximum number of beats in DMA burst. The value can be changed when no active transfer.\n This register is 0 after reset.\n 0001b - 1 beat in burst\n 0010b - 2 beats in burst\n 0011b - 4 beats in burst\n 0100b - 8 bits in burst\n other - 16 beats in burst
            bitOffset: 0
            bitWidth: 4
            access: read-write
      HRS03:
        description: HRS03 - AXI ERROR Responses Register\n\n These registers extend the standard set of SD-HOST interrupt statuses by information about AXI interface exceptions.\n The registers are divided into three groups:\n - Signal Enable registers allow to enable/mask signaling the Interrupt Status registers (HRS03[3:0]) on interrupt port\n - Status Enable registers allow to enable/disable interrupt source for each Interrupt Status separately\n - Interrupt Status are triggered whenever the interrupt source is detected and the Status Enable register is enabled\n
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AER_IEBS:
            description: 'AER_IEBS - Signal Enable for AXI ERROR Response B channel: SLVERR\n 1 - interrupt enable\n 0 - interrupt masked'
            bitOffset: 19
            bitWidth: 1
            access: read-write
          AER_IEBD:
            description: 'AER_IEBD - Signal Enable for AXI ERROR Response B channel: DECERR\n\n 1 - interrupt enable\n 0 - interrupt masked'
            bitOffset: 18
            bitWidth: 1
            access: read-write
          AER_IERS:
            description: 'AER_IERS - Signal Enable for AXI ERROR Response R channel: SLVERR\n 1 - interrupt enable\n 0 - interrupt masked'
            bitOffset: 17
            bitWidth: 1
            access: read-write
          AER_IERD:
            description: 'AER_IERD - Signal Enable for AXI ERROR Response R channel: DECERR\n 1 - interrupt enable\n 0 - interrupt masked'
            bitOffset: 16
            bitWidth: 1
            access: read-write
          AER_SENBS:
            description: 'AER_SENBS - Status Enable for AXI ERROR Response B channel: SLVERR\n\n 1 - status enable\n 0 - status disable'
            bitOffset: 11
            bitWidth: 1
            access: read-write
          AER_SENBD:
            description: 'AER_SENBD - Status Enable for AXI ERROR Response B channel: DECERR\n\n 1 - status enable\n 0 - status disable'
            bitOffset: 10
            bitWidth: 1
            access: read-write
          AER_SENRS:
            description: 'AER_SENRS - Status Enable for AXI ERROR Response R channel: SLVERR\n\n 1 - status enable\n 0 - status disable'
            bitOffset: 9
            bitWidth: 1
            access: read-write
          AER_SENRD:
            description: 'AER_SENRD - Status Enable for AXI ERROR Response R channel: DECERR\n\n 1 - status enable\n 0 - status disable'
            bitOffset: 8
            bitWidth: 1
            access: read-write
          AER_BS:
            description: 'AER_BS - AXI ERROR Response B channel: SLVERR\n\n This bit is set when a SLVERR is detected on AXI Master bus in B channel (Write Response Channel).'
            bitOffset: 3
            bitWidth: 1
            access: read-write
          AER_BD:
            description: 'AER_BD - AXI ERROR Response B channel: DECERR\n\n This bit is set when a DECERR is detected on AXI Master bus in B channel (Write Response Channel).'
            bitOffset: 2
            bitWidth: 1
            access: read-write
          AER_RS:
            description: 'AER_RS - AXI ERROR Response R channel: SLVERR\n\n This bit is set when a SLVERR is detected on AXI Master bus in R channel (READ Response Channel).'
            bitOffset: 1
            bitWidth: 1
            access: read-write
          AER_RD:
            description: 'AER_RD - AXI ERROR Response R channel: DECERR\n\n This bit is set when a DECERR is detected on AXI Master bus in R channel (READ Response Channel).'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      HRS04:
        description: HRS04 - SD/eMMC PHY Registers Interface\n\n This register enables access to the SD/eMMC PHY registers. The interface behavior is described in section SD/eMMC PHY Register Interface.
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          UIS_ACK:
            description: UIS_ACK - PHY Transaction Acknowledge\n\n This bit is set 1 when UIS_WR or UIS_RD is confirmed, so either read data is available in UIS_RDATA, or written data is already updated PHY register.
            bitOffset: 26
            bitWidth: 1
            access: read-only
          UIS_RD:
            description: UIS_RD - PHY Read Transaction Request\n\n This bit requests read transaction from PHY Register.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          UIS_WR:
            description: UIS_WR - PHY Write Transaction Requests\n\n This bit requests write transaction to PHY Register.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          UIS_RDATA:
            description: UIS_RDATA - PHY Read Data\n\n This field stories data read from PHY Register.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          UIS_WDATA:
            description: UIS_WDATA - PHY Write Data\n\n This field stories data to be written to PHY Register.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          UIS_ADDR:
            description: 'UIS_ADDR - PHY Register Address\n\n This filed stories address of PHY Register which is to be read of written. Refer to the Integration Manual (cdns_sd4hc_integration_manual.pdf), Table: Remapping register address to address of registers described in SD/eMMC PHY User Guide (cdns_sd_emmc_dll_phy_user_guide.pdf).'
            bitOffset: 0
            bitWidth: 6
            access: read-write
      HRS06:
        description: HRS06 - eMMC control registers
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ETR:
            description: ETR - eMMC Tune Request\n\n Setting this bit 1, the tune value is updated by ETV. This bit is set 1 until the requested value is applied. The tuning command request is to be set after this bit is automatically clear to 0.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          ETV:
            description: ETV - eMMC Tune Value\n\n This register contains value can update the tune value and in consequence sample point. The value become tune value when the ETR transits from 1 to 0.
            bitOffset: 8
            bitWidth: 6
            access: read-write
          EMM:
            description: EMM - eMMC Mode select\n\n This field sets eMMC mode. The mode should reflect to the eMMC device setting. If the SD card is in use, this field needs to be 0000b.\n 0000b - SD Card in use\n 0010b - SDR\n 0011b - DDR\n 0100b - HS200\n 0101b - HS400\n 0110b - HS400 Enhanced Strobe\n others - Legacy
            bitOffset: 0
            bitWidth: 3
            access: read-write
      HRS07:
        description: HRS07 - IO Delay Information Register
        addressOffset: 0x1C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ODELAY_VAL:
            description: ODELAY_VAL - Output delay value for IO. \n Designer should update this register with delay value of IO with appropriate output delay. \n Delay is count in half of period of sdmclk. If sdmclk is working at 200MHz frequency, \n then 1 is 2,5 ns. \n This value will be used to compensate delay of DAT line when controller is READ WAIT. \n The sum value of IDELAY_VAL, ODELAY_VAL should be less equal 5'd20 for controller to work properly. \n
            bitOffset: 16
            bitWidth: 5
            access: read-write
          IDELAY_VAL:
            description: IDELAY_VAL - Input delay value for IO. \n Designer should update this register with delay value of IO with appropriate input delay. \n Delay is count in half of period of sdmclk. If sdmclk is working at 200MHz frequency, \n then 1 is 2,5 ns. \n This value will be used to compensate delay of DAT line when controller is driving READ WAIT. \n The sum value of IDELAY_VAL, ODELAY_VAL should be less equal 5'd20 for controller to work properly. \n
            bitOffset: 0
            bitWidth: 5
            access: read-write
      HRS30:
        description: HRS30 - Host Capability Register\n This register states whether configurable options are available or are not available in the SD/eMMC Host Controller configuration. This register gives such information about features not been covered by the standard capability registers (SRS16-SRS18).
        addressOffset: 0x78
        size: 32
        access: read-only
        resetValue: 0x3
        fields:
          HS400ESSUP:
            description: High Speed 400 Enhance Strobe supported\n This field informs whether HS400 Enhance Strobe mode is supported (1) or is not supported (0).
            bitOffset: 1
            bitWidth: 1
            access: read-only
          CQSUP:
            description: Command Queuing supported\n This field informs whether Command Queuing is supported (1) or is not supported (0).
            bitOffset: 0
            bitWidth: 1
            access: read-only
      HRS31:
        description: HRS31 - Host Controller Version\n This register contains the host controller version number.
        addressOffset: 0x7C
        size: 32
        access: read-only
        resetValue: 0x4110000
        fields:
          HOSTCTRLVER:
            description: Host Controller Version\n Release number of the Host Controller
            bitOffset: 16
            bitWidth: 12
            access: read-only
          HOSTFIXVER:
            description: Fix Version Number\n Number of the fix related to the Host Controller Version.
            bitOffset: 0
            bitWidth: 8
            access: read-only
      HRS32:
        description: HRS32 - FSM Monitor Register
        addressOffset: 0x80
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          LOAD:
            description: LOAD - FSM monitor update request\n Setting this bit to 1 starts internal FSM monitor to load value from selected FSM.\n After finishing this bit will be automatically cleared by hardware and FSM status can be read.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          ADDR:
            description: ADDR - FSM address\n This field selects which FSM status will be read.\n All available status machines are listed in Debug section of User Guide.
            bitOffset: 16
            bitWidth: 15
            access: read-write
          DATA:
            description: DATA - FSM status\n This register contains read FSM status. Before reading it user should select FSM address (ADDR), set LOAD bit and wait until hardware clears it.
            bitOffset: 0
            bitWidth: 16
            access: read-only
      HRS33:
        description: HRS33 - Tune Status 0 Register
        addressOffset: 0x84
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          STAT0:
            description: STAT0 - Tune status 0\n After invoking UHS-I tuning procedure each bit of this register represents status of one tuning step.\n This field correspond to tuning steps 31-0.\n 0 - Step failed\n 1 - Step passed
            bitOffset: 0
            bitWidth: 32
            access: read-only
      HRS34:
        description: HRS34 - Tune Status 1 Register
        addressOffset: 0x88
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          STAT1:
            description: STAT1 - Tune status 1\n This field is continuation of STAT0 field.\n Its value represents status of tuning steps 39-32.
            bitOffset: 0
            bitWidth: 8
            access: read-only
      HRS35:
        description: HRS35 - Tune Debug Register
        addressOffset: 0x8C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          TFR:
            description: TFR - Tune Force Request\n Setting this bit 1, the tune value is updated by TFV.\n This bit is set 1 until the requested value is applied.\n The tuning command request is to be set after this bit is automatically clear to 0.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          TFV:
            description: TFV - Tune Force Value\n This register contains value which can update the tune value and in consequence sample point.\n The new tune value becomes valid when the TFR transits from 1 to 0.
            bitOffset: 16
            bitWidth: 6
            access: read-write
          TVAL:
            description: TVAL - Tune Current Value\n This field represents selected value of UHS-I delay.
            bitOffset: 0
            bitWidth: 6
            access: read-only
      HRS36:
        description: HRS36 - Boot Status Register
        addressOffset: 0x90
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          BOOT_EDE:
            description: Boot Error - End Bit Error
            bitOffset: 5
            bitWidth: 1
            access: read-only
          BOOT_EDC:
            description: Boot Error - Data CRC Error
            bitOffset: 4
            bitWidth: 1
            access: read-only
          BOOT_EDT:
            description: Boot Error - Data Timeout Error
            bitOffset: 3
            bitWidth: 1
            access: read-only
          BOOT_EAI:
            description: Boot Error - Invalid Acknowledge Error
            bitOffset: 2
            bitWidth: 1
            access: read-only
          BOOT_EAT:
            description: Boot Error - Acknowledge Timeout Error
            bitOffset: 1
            bitWidth: 1
            access: read-only
          BOOT_ACT:
            description: Boot Active\n Informs that the BOOT is active and the operation cannot be interfere by writing any registers.
            bitOffset: 0
            bitWidth: 1
            access: read-only
      HRS37:
        description: HRS37 - Read block gap coefficient interface mode select
        addressOffset: 0x94
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RGB_COEFF_IFM:
            description: RGB_COEFF_IFM - Read Block Gap Coefficient\n This register selects a target Read Block Coefficient.\n The Host Controller has a set of Read Block Coefficient registers. Each SD and eMMC speed mode has one dedicated register. While HRS38 is updated to set a Coefficient value, this register selects a target Read Block Coefficient. Following list shows the addresses to speed modes relation:\n 000000b - Default Speed (DS) \n 000001b - High Speed (HS) \n 001000b - UHS-I SDR12 \n 001001b - UHS-I SDR25 \n 001010b - UHS-I SDR50 \n 001011b - UHS-I SDR104 \n 001100b - UHS-I DDR50 \n 100000b - eMMC Legacy \n 100001b - eMMC SDR \n 100010b - eMMC DDR \n 100011b - eMMC HS200 \n 100100b - eMMC HS400 \n 100101b - eMMC HS400 Enhanced Strobe\n
            bitOffset: 0
            bitWidth: 6
            access: read-write
      HRS38:
        description: HRS38 - Read block gap coefficient
        addressOffset: 0x98
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RGB_COEFF:
            description: Read block gap coefficient.\n Read block gap timing can be variable based on pad timing when the clock is stopped for flow control or stop at block gap purposes. When stopping the clock the host controller has default settings for each interface mode that ensures read block gap timing is met with pad delays up to 5ns (input and output path). If pad delays are longer than 5ns then the default settings can changed (increased) to ensure read block gap timing is not violated.\n HRS38 has a register for each interface mode and the interface mode is selected by using HRS38.
            bitOffset: 0
            bitWidth: 4
            access: read-write
      CRS63:
        description: CRS63 - Host Controller Version/Slot Interrupt Status
        addressOffset: 0xFC
        size: 32
        access: read-only
        resetValue: 0x30000
        fields:
          CRS63_HWINIT1:
            description: HWINIT field
            bitOffset: 24
            bitWidth: 8
            access: read-only
          SVN:
            description: SVN - Specification Version Number.\n This field identifies the Host Controller Specification Version.\n 0h - Version 1.00\n 1h - Version 2.00\n 2h - Version 3.00\n 3h - Version 4.00\n 4h-FFh - reserved\n The host is compatible with SD Host Specification Version 4.00.\n HWINIT Field - Note this field is hardware initialized after reset and the value read back will match the IP configuration.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          CRS63_HWINIT0:
            description: HWINIT field
            bitOffset: 8
            bitWidth: 8
            access: read-only
          ISES:
            description: ISES - Interrupt Signal For Each Slot.\n This field allows to determine which slot is currently signaling Interrupt/Wakeup signals. Each bit is logical OR of all Interrupts Signal and Wakeup Signal implemented in given slot.\n 0 - Slot 1\n 1 - Slot 2\n ...\n 7 - Slot 8
            bitOffset: 0
            bitWidth: 8
            access: read-only
      SRS00:
        description: SRS00 - SDMA System Address / Argument 2
        addressOffset: 0x200
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SAAR:
            description: SAAR - System Address / Argument 2 This field is used as:\n - SDMA system memory address\n - Auto CMD23 Argument\n\n System Address:\n This register is used as base address when SDMA engine is selected (SRS03.DMAE=1 and SRS10.DMASEL=0) and SRS15.HV4E=0. When the SDMA has stopped at the SDMA block gap, writing to SAAR[31:24] resumes SDMA transfer. If the SDMA engine is stopped, value of the SAAR[31:24] register is set to the next contiguous system address of the next data position\n\n Auto CMD23 Argument:\n This mode is used when non-DMA or ADMA2 engine is selected or SRS15.HV4E=1. When the block count is enabled, software will set value from range 00000000h to 0000FFFFh.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SRS01:
        description: SRS01 - Block Size / Block Count
        addressOffset: 0x204
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BCCT:
            description: BCCT - Block Count For Current Transfer\n With this field, the number of data blocks can be defined for next transfer.\n This register is used when SRS03.BCE is set 1, otherwise it will be ignored.\n The value is decremented after each block transfer. When this field is set 0, no data blocks will be transferred.\n During data transfer read operation may return invalid value, and write operations are ignored.\n 0000h - no block transfer\n 0001h..FFFFh - 1..65535 block(s) transfer.
            bitOffset: 16
            bitWidth: 16
            access: read-write
          SDMABB:
            description: SDMABB - SDMA Buffer Boundary\n\n In this field, the system address boundary can be set for SDMA engine.\n The SDMA transfer stops crossing the address boundary and generates the DMA Interrupt (SRS12.DMAINT).\n After the DMA Interrupt, when the SRS15.HV4E is 0, the software should write new SDMA System Address (SRS00.SAAR / SRS22.DMASA1) in order to resume the SDMA transaction.\n 0 - 4k bytes address boundary\n 1 - 8k bytes address boundary\n 2 - 16k bytes address boundary\n 3 - 32k bytes address boundary\n 4 - 64k bytes address boundary\n 5 - 128k bytes address boundary\n 6 - 256k bytes address boundary\n 7 - 512k bytes address boundary\n
            bitOffset: 12
            bitWidth: 3
            access: read-write
          TBS:
            description: 'TBS - Transfer Block Size\n\n This field defines block size for block data transfers. During data transfer, read operations may return an invalid value, and write operations are ignored.\n The software will not set value that exceeds the physically implemented internal FIFO buffer size. The buffer size is equal to 2^FIFODEPTH, where FIFODEPTH is the generic parameter of the core.\n The SD/MMC (memory) uses block size up to 512 bytes.\n The SDIO can use up to 2048 bytes.\n 000h - not used\n 001h - 1 data block\n 002h - 2 data blocks\n 003h - 3 data blocks\n ...\n 1FFh - 511 data blocks\n 200h - 512 data blocks\n ...\n 800h - 2048 data blocks\n others - not used.\n\n Note: It is recommended for the software to use native data block size (512B) in case of multiple data block transfer (SRS03.MSBS==1). Using smaller block may cause unexpected response error when flow control is activated (i.e. SDCLK is disabled) during response transfer.'
            bitOffset: 0
            bitWidth: 12
            access: read-write
      SRS02:
        description: SRS02 - Argument 1
        addressOffset: 0x208
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ARG1:
            description: ARG1 - Command Argument 1\n\n This field contains 32-bits argument for command issued by SRS03.CIDX file write.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SRS03:
        description: SRS03 - Command/Transfer Mode
        addressOffset: 0x20C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CIDX:
            description: CIDX - Command Index\n\n This field contains a command number (index) of the command to be sent.\n The index can be defined in range 00-63, which means all commands (CMD00-CMD63 and ACMD00-ACMD63) defined in related specifications are supported.\n Writing this filed triggers the actual command transfer. This field is to be written only when Command Inhibit CMD bit is 0 in Present State Register (SRS09.CICMD).\n To check the list of available commands, refer to the appropriate card/device specifications.
            bitOffset: 24
            bitWidth: 6
            access: read-write
          CT:
            description: CT - Command Type\n\n This field defines specific type of command.\n - Normal Command (0) - used by default when other command types are not intended to be used\n - Suspend Command (01b) - not used\n - Resume Command (10b) - not used\n - Abort Command (11b) - used when the software wants to stop the current data transfer (read or write data transfer). The read transfer ends by stopping transfer to the internal buffer. The write transfer ends with releasing DAT line to High-Z state. Then, after sending an Abort Command, the software will issue the software reset.\n\n The Suspend and Resume Mechanism is not supported by the SD Host version 4.00 and later, and the Suspend and Resume Commands will not be used.
            bitOffset: 22
            bitWidth: 2
            access: read-write
          DPS:
            description: DPS - Data Present Select\n\n Set to 1 for commands which transfer data (i.e. read or write data using DAT line).\n Set to 0 for all other commands, including:\n - Commands using only CMD line\n - Commands with busy signalized on DAT[0] line (SRS03.RTS=11b)
            bitOffset: 21
            bitWidth: 1
            access: read-write
          CICE:
            description: 'CICE - Command Index Check Enable\n\n When set to 1, the host checks if the Command Index field in the response is equal to the SRS03.CIDX value.\n When 0, the check is not performed and Command Index field of the response is ignored.\n Recommended settings depends on response type, see following table for details:\n SRS03.RTS=00: 0 - No Response\n SRS03.RTS=01: 0 - R2\n SRS03.RTS=10: 0 - R3, R4\n SRS03.RTS=10: 1 - R1, R5, R6, R7\n SRS03.RTS=11: 1 - R1b, R5b'
            bitOffset: 20
            bitWidth: 1
            access: read-write
          CRCCE:
            description: 'CRCCE - Command CRC Check Enable\n When set to 1, the host checks if the CRC field of the response is valid.\n When 0, the CRC check is disabled and the CRC field of the response is ignored.\n The CRC check should be disabled for responses which do not contain an actual CRC value (some responses contain all 1s in place of the CRC field), and enabled for all other kinds of responses.\n Recommended settings depends on response type, see following table for details:\n SRS03.RTS=00: 0 - No Response\n SRS03.RTS=01: 0 - R2\n SRS03.RTS=10: 0 - R3, R4\n SRS03.RTS=10: 1 - R1, R5, R6, R7\n SRS03.RTS=11: 1 - R1b, R5b'
            bitOffset: 19
            bitWidth: 1
            access: read-write
          RTS:
            description: RTS - Response Type Select\n\n Defines the expected response length.\n 00b - no response\n 01b - 136-bit response\n 10b - 48-bit response\n 11b - 48-bit response with BUSY\n Every command implies one of the response types listed above. To check the response type corresponding to a given command, please refer to the appropriate card/device specifications.
            bitOffset: 16
            bitWidth: 2
            access: read-write
          RID:
            description: RID - Response Interrupt Disable\n\n When set to 1, the Command Complete Interrupt (SRS12.CC) will be disabled. The host will ignore the SRS13.CC_SE and behave as the SRS13.CC_SE would be 0.\n When set to 0, the SRS12.CC will be enabled or disabled depend on the SRS13.CC_SE bit only.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          RECE:
            description: RECE - Response Error Check Enable\n\n When set 1, the host will look after R1/R5 responses.\n If any error will be detected in the response, the SRS12.ERSP bit is set to 1.\n The software will set this bit only when R1/R5 response is expected.\n The software will set SRS03.RID and RECE bits to 1 when the host checks R1/R5 errors. And both bits will be clear to 0, when the Software Driver will checks R1/R5 errors. On response error, the SRS12.ERSP bit (in Interrupt Status) is set 1.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          RECT:
            description: RECT - Response Type R1/R5\n\n Select R1 or R5 response type for the response content checker. Listed below error bits will be evaluated.\n RECT = 0, Response Type - R1 (SD Memory):\n bit 31 OUT_OF_RANGE\n bit 30 ADDRESS_ERROR\n bit 29 BLOCK_LEN_ERROR\n bit 26 WP_VIOLATION\n bit 25 CARD_IS_LOCKED\n bit 23 COM_CRC_ERROR\n bit 21 CARD_ECC_FAILED\n bit 20 CC_ERROR\n bit 19 ERRORRECT = 1\n\n RECT = 1, Response Type - R5 (SDIO):\n bit 7 COM_CRC_ERROR\n bit 3 ERROR\n bit 1 FUNCTION_NUMBER\n bit 0 OUT_OF_RANGE\n\n This field is ignored when SRS03.RECE=0.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          MSBS:
            description: MSBS - Multi/Single Block Select\n\n Multi-block or single-block data transfer can be selected with this field.\n 0 - Single-block\n 1 - Multi-block\n This field is hardware-protected by Command Inhibit DAT bit in Present State Register (SRS09.CIDAT). When CIDAT=1, all writes to this field are ignored.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          DTDS:
            description: DTDS - Data Transfer Direction Select\n\n Selects direction of data transfer for commands with DPS=1.\n 0 - Write\n 1 - Read\n For commands with SRS03.DPS=0, this field is ignored.\n This field is hardware-protected by Command Inhibit DAT bit in Present State Register (SRS09.CIDAT). When CIDAT=1, all writes to this field are ignored.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          ACE:
            description: ACE - Auto CMD Enable\n\n The field allows to send one additional command to the card/device when the command is issued.\n 00b - No auto command\n 01b - Auto CMD12\n 10b - Auto CMD23\n 11b - Reserved\n If Auto CMD disable (00b) is set, the host does not send any additional command. This setting will be used when auto command is not required or not intended.\n If Auto CMD12 (01b) is set, the host sends CMD12 (Abort) automatically when last block of multi-block transfer is completed.\n If Auto CMD23 (10b) is set, the host sends CMD23 (Set Block Count) automatically before issued transfer data command. An argument of this command can be set in SRS00.\n On any error the issued command will not be sent.\n This field is hardware-protected by Command Inhibit DAT bit in Present State Register (SRS09.CIDAT). When SRS09.CIDAT=1, all writes to this field are ignored.
            bitOffset: 2
            bitWidth: 2
            access: read-write
          BCE:
            description: BCE - Block Count Enable\n When set to 1, the SRS01.BCCT Block Count is enabled.\n Each transferred block automatically decrements the counter value. The multi-block transfer will end, when the counter reaches 0. So the finite transfer can not be performed with this setting.\n When 0, block counting is disabled, and SRS01.BCCT retains its value.\n The transfer will be infinite in non-DMA and SDMA modes. For ADMA mode the transfer can be infinite or finite. The finite transfer ends on reading the descriptor with END status (so the transfer length is designated by the table of descriptors). In case of infinite transfer, the software will explicitly set ABORT command type to stop transfer.\n This field is hardware-protected by Command Inhibit DAT bit in Present State Register (SRS09.CIDAT). When CIDAT=1, all writes to this field are ignored.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          DMAE:
            description: 'DMAE - DMA Enable\n\n When set to 1, it enables DMA functionality. DMA can be enabled only if it is supported as indicated in the DMA Support in the SRS16.DMAS register. If DMA is not supported (due to host configuration), this bit is ignored.\n This field is hardware-protected by Command Inhibit DAT bit in Present State Register (SRS09.CIDAT).\n When SRS09.CIDAT=1, all writes to this field are ignored.\n Note: The ADMA2 mode uses only the finite transfer mode, i.e. this bit is to be set 1.'
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SRS04:
        description: 'The SRS04 - SRS07 registers store the response returned by the card.\n The mapping of the actual device response and the SRS04 - SRS07 contents depends on the type of response. The type of response is determined by the RTS field (Response Type) for all user-defined commands.\n The separate cases are the Auto-CMD12 response (called R1b in the SD Memory Specification) and Auto-CMD23 response (called R1 in the SD Memory Specification). Auto-CMD12 and Auto-CMD23 responses are handled by the core automatically and goes to the SRS07 register regardless of the RTS value.\n\n SRS04-SRS07 relation to received response field:\n Auto-CMD12 resp:\n Response field R[39:8] - RESP3[31:0]\n\n Auto-CMD23 resp:\n Response field R[39:8] - RESP3[31:0]\n\n No response:\n RTS=00b\n\n 136-bit:\n RTS=01b, Response field R[127:8] - {RESP3[23:0], RESP2[31:0], RESP1[31:0], RESP0[31:0]}\n\n 48-bit:\n RTS=10b, Response field R[39:8] - RESP1[31:0]\n\n 48-bit with BUSY:\n RTS=11b, Response field R[39:8] - RESP1[31:0]\n\n Implementation note: Registers value are undefined after reset, and will be valid after response is received.'
        addressOffset: 0x210
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESP1:
            description: 'RESP1 - Response Register #1'
            bitOffset: 0
            bitWidth: 32
            access: read-only
      SRS05:
        description: Described in SRS04.
        addressOffset: 0x214
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESP2:
            description: 'RESP2 - Response Register #2'
            bitOffset: 0
            bitWidth: 32
            access: read-only
      SRS06:
        description: Described in SRS04.
        addressOffset: 0x218
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESP3:
            description: 'RESP3 - Response Register #3'
            bitOffset: 0
            bitWidth: 32
            access: read-only
      SRS07:
        description: Described in SRS04.
        addressOffset: 0x21C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          RESP4:
            description: 'RESP4 - Response Register #4'
            bitOffset: 0
            bitWidth: 32
            access: read-only
      SRS08:
        description: SRS08 - Data Buffer
        addressOffset: 0x220
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BDP:
            description: BDP - Buffer Data Port\n\n The field is to access the internal buffer (data block) in non-DMA transfer mode. 8-bit, 16-bit, or 32-bit access to SRS08 is possible with the following restrictions:\n - Only sequential contiguous access in Little Endian mode is possible. For example, if the software accesses BDP[7:0], then the next transfer will access BDP[15:8]. No byte skipping is allowed.\n - Each new block will start at the least significant byte of BDP, which is BDP[7:0].\n - If the block size is not a multiple of 32-bits, and the software accesses BDP using 32-bit words, then the excess bytes of the last word are ignored. This allows the software driver to use only 32-bit data transfers regardless of the block size.\n - Access to the register with precaution - the FIFO pointers can be damaged when buffer is not ready or when number of accesses exceed the transfer block size (SRS01.TBS ).\n\n Following shows all transfers (byte enable variations) that are allowed on SRS08:\n Transfer width = 32-bit:\n be[3:0] = 'b1111 -> BDP[31:0]\n Transfer width = 16-bit:\n be[3:0] = 'b0011 -> BDP[15:0]\n be[3:0] = 'b1100 -> BDP[31:16]\n Transfer width = 8-bit:\n be[3:0] = 'b0001 -> BDP[7:0]\n be[3:0] = 'b0010 -> BDP[15:8]\n be[3:0] = 'b0100 -> BDP[23:16]\n be[3:0] = 'b1000 -> BDP[31:24]
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SRS09:
        description: SRS09 - Present State Register
        addressOffset: 0x224
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CMDSL:
            description: CMDSL - CMD Line Signal Level (SD Mode only)\n\n The value is equal to the actual signal level on CMD line of the SD interface (s#_cmd_i).\n Is useful for debugging purposes.
            bitOffset: 24
            bitWidth: 1
            access: read-only
          DATSL1:
            description: DATSL1 - DAT[3:0] Line Signal Level (SD Mode only)\n\n The value is equal to the actual signal level on DAT pins of the SD interface:\n SRS09.23 - s#_dat_i[3] pin level\n SRS09.22 - s#_dat_i[2] pin level\n SRS09.21 - s#_dat_i[1] pin level\n SRS09.20 - s#_dat_i[0] pin level
            bitOffset: 20
            bitWidth: 4
            access: read-only
          WPSL:
            description: WPSL - Write Protect Switch Pin Level\n\n The value is equal to the actual signal level on Write Protect pin of the SD interface (sdwp_s#_n).\n 1 - means that the write operation is enabled\n 0 - means that the write operations is disabled
            bitOffset: 19
            bitWidth: 1
            access: read-only
          CDSL:
            description: CDSL - Card Detect Pin Level\n\n The value is equal to the inverted signal level on Card Detect pin of the SD interface (sdsl_s#_n).\n 1 - means that the card is inserted\n 0 - means no card is inside the slot\n\n Debouncing is not performed on CDSL, therefore the use of Card Inserted (CI) bit is recommended during normal work.\n CDSL bit is useful only for debugging purposes.
            bitOffset: 18
            bitWidth: 1
            access: read-only
          CSS:
            description: CSS - Card State Stable\n\n Indicates if Card Detect Pin Level (CDSL) is stable.\n 1 - means that the CDSL value is stable\n 0 - means that the CDSL is not stable (during card insertion/removal or during the reset)\n\n Field is useful for debugging purposes.
            bitOffset: 17
            bitWidth: 1
            access: read-only
          CI:
            description: CI - Card Inserted\n\n Indicates if the card is inserted inside the slot.\n 0 - no card in slot\n 1 - card is inserted\n\n Unlike SRS09.CDSL, value of SRS09.CI bit is guaranteed to be stable (i.e. debouncing is performed on this bit). Use of this bit is recommended during the normal operation of host.
            bitOffset: 16
            bitWidth: 1
            access: read-only
          BRE:
            description: BRE - Buffer Read Enable\n\n This field represents data buffer (SRS08.BDP) state for read transfer in non-DMA mode.\n 1 - valid data can be read from the data buffer\n 0 - no valid data inside the data buffer\n\n After reading the entire data block, this bit changes to 0.
            bitOffset: 11
            bitWidth: 1
            access: read-only
          BWE:
            description: BWE - Buffer Write Enable\n\n This bit represents data buffer (SRS08.BDP) state for write transfer in non-DMA mode.\n 1 - data can be written to the data buffer\n 0 - data cannot be written\n\n After reading the entire data block, this changes to 0.\n This bit will be cleared in case of SBGR at non-DMA write transfer (even if the internal buffer is ready). The buffer must not be written after the SBGR. If the BWR was set, the only action from the S/W is to clear the interrupt status.
            bitOffset: 10
            bitWidth: 1
            access: read-only
          RTA:
            description: RTA - Read Transfer Active (SD Mode only)\n\n Indicates the status of the read data transfer.\n 0 - no data read transfer in progress\n 1 - data read transfer in progress\n\n Bit is set 1 after sending the read command, or after restarting the read transfer by the Continue Request (SRS10.CREQ).\n Bit is set 0 by the hardware after the last block of the read transfer, or after stopping the read transfer by the Stop at Block Gap Request (SRS10.SBGR).\n In both cases, the entire data is to be read by the system from the internal data buffer before setting this bit to 0. In other words, SRS09.RTA=0 means that the entire data is already transferred to the system, and internal data buffer is empty.
            bitOffset: 9
            bitWidth: 1
            access: read-only
          WTA:
            description: WTA - Write Transfer Active (SD Mode only)\n\n Indicates the status of the write data transfer.\n 0 - no data write transfer in progress\n 1 - data write transfer in progress\n\n Bit is set 1 after sending the write command, or after restarting the write transfer by the Continue Request (SRS10.CREQ).\n Bit is set 0 by the hardware after the last block of the write transfer, or after stopping the write transfer by the Stop at Block Gap Request (SRS10.SBGR).\n In both cases, the entire data has to be transferred to the card from the internal data buffer before setting this bit to 0. In other words, WTA=0 means that the entire data is already transferred to the card, and CRC response for the last data block is already received.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          DATSL2:
            description: DATSL2 - DAT[7:4] Line Signal Level (SD Mode only)\n\n Field can be used to monitor DAT lines in range 7-4.\n The value is equal to the actual signal level on DAT pins of the SD interface:\n SFR9.7 - dat7_i_pin level\n SFR9.6 - dat6_i_pin level\n SFR9.5 - dat5_i_pin level\n SFR9.4 - dat4_i_pin level
            bitOffset: 4
            bitWidth: 4
            access: read-only
          DLA:
            description: DLA - DAT Line Active (SD Mode only)\n\n Indicates if the DAT lines of SD interface are currently in use.\n 1 - DAT lines are active (in use)\n 0 - DAT lines are released (not in use)\n This bit set to 1, when Read or Write Transfer bits are active (SRS09.RTA=1 or SRS09.WTA=1), or if the card indicates busy state on the DAT lines. The card can become busy immediately after the write operation, or after command which requires response with busy.\n Falling edge of this bit (change from 1 to 0) directly triggers Transfer Complete Interrupt (SRS12.TC).
            bitOffset: 2
            bitWidth: 1
            access: read-only
          CIDAT:
            description: CIDAT - Command Inhibit DAT (SD Mode only)\n\n Indicates if the host can issue a command which uses DAT line. Commands which use DAT line include write and read data commands and commands with busy response.\n 1 - command using DAT line cannot be sent\n 0 - command using DAT line can be sent\n When CIDAT=1 then the SRS03[15:0] is write-protected. The software can write SRS03[15:0] only when CIDAT=0.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          CICMD:
            description: CICMD - Command Inhibit CMD\n\n Indicates if the host can issue a command.\n 0 - command can be sent\n 1 - command cannot be sent\n\n If this bit is 0, indicates the CMD line is not in use and the Host Controller can issue an SD command using the CMD line.\n This bit is set immediately after the CI is written, indicating start of command transmission.\n This bit is cleared when the command response is received.\n Even if the Command Inhibit DAT is set to 1, commands using only the CMD line can be issued if the Command Inhibit CMD is 0.\n Change from 1 to 0 directly triggers Command Complete Interrupt (SRS12.CC).
            bitOffset: 0
            bitWidth: 1
            access: read-only
      SRS10:
        description: SRS10 - Host Control 1 (General / Power / Block-Gap / Wake-Up)
        addressOffset: 0x228
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          WORM:
            description: WORM - Wakeup Event Enable On SD Card Removal\n\n When set to 1, enables wake-up event via Card Removal assertion in the SRS12.CR register.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          WOIS:
            description: WOIS - Wake-Up Event Enable On Card Inserted\n\n When set to 1, enables wake-up event via Card Insertion assertion in the SRS12.CIN register.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          WOIQ:
            description: WOIQ - Wakeup Event Enable On Card Interrupt\n\n When set to 1, enables wake-up event via Card Interrupt assertion in the SRS12.CINT
            bitOffset: 24
            bitWidth: 1
            access: read-write
          IBG:
            description: IBG - Interrupt At Block Gap (SD Mode only)\n\n When set to 1, enables interrupt detection at the block gap for a multiple block transfer.\n This bit is valid only in SD4 mode.\n If the SD card cannot signal an interrupt during a multiple block transfer, this bit should be set to 0.\n\n This field is ignored in UHS-II mode.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          RWC:
            description: RWC - Read-Wait Control (SD Mode only)\n\n When set to 1, enables Read Wait control. The Read Wait function is optional for SDIO cards.\n If the card does not support read wait, this bit would never be set to 1; otherwise, DAT line conflict may occur.\n\n This field is ignored in UHS-II mode.
            bitOffset: 18
            bitWidth: 1
            access: read-write
          CREQ:
            description: CR - Continue Request\n\n When set to 1, restarts the transfer previously stopped using the Stop At Block Gap.\n The software will set SRS10.SBGR (Stop At Block Gap) bit to 0 before setting the (CR) Continue Request.\n When SRS10.SBGR=1, then all write operations to Continue Request are ignored. Clearing SRS10.SBGR can be done before or simultaneously with writing the CR. Continue Request bit is cleared automatically by the host when SRS09.DLA (Dat Line Active) changes from 0 to 1, indicating the actual restart of the transfer.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          SBGR:
            description: SBGR - Stop At Block Gap Request\n\n When set to 1, orders the stop executing read and write transaction at the next possible block gap for non-DMA, SDMA and ADMA transfers. The software will maintain SBGR=1 until the current transfer is complete (typically by waiting for - Transfer Complete bit). After Transfer Complete event, the software will set SBGR back to 0.\n\n In case of the read transfer, the host stops after the next data block received from the card. This uses the Read-Wait mechanism if it is enabled by SRS10.RWC, or stops the card clock (sdclk_s#) if Read-Wait is disabled. \n\n In the case of the write transfer, host stops after the last block written to the data buffer. The host sends all data already written to the internal data buffer before stopping the transfer.\n\n In case of stopping non-DMA write transfer, the software will set this bit only at block gap ( block unit (SD mode)).
            bitOffset: 16
            bitWidth: 1
            access: read-write
          BVS2:
            description: BVS2 - SD Bus Voltage Select for VDD2 \n\n The field is used to configure VDD2 voltage level.\n The state of this field directly drives s#_bus_volt port of the core.\n 000b - VDD2 is not supported\n 001b-011b - Reserved\n 100b - Reserved for 1.2V\n 101b - 1.8V (1.8V VDD Support in Capability registers need to be set)\n 110b-111b - Not used
            bitOffset: 13
            bitWidth: 3
            access: read-write
          BP2:
            description: BP2 - SD Bus Power for VDD2 \n\n This bit is used to enable (1) or disable (0) VDD2 supply.\n The state of this bit directly drives s#_bus_pow2 port of the core.\n The field is ignored in legacy mode.
            bitOffset: 12
            bitWidth: 1
            access: read-write
          BVS:
            description: BVS - SD Bus Voltage Select\n\n This field is used to configure VDD1 voltage level.The state of this field directly drives s#_bus_volt2 port of the core.\n 000b-100b - Reserved\n 101b - 1.8V (typical) for embedded\n 110b - 3.0V (typical)\n 111b - 3.3V (typical)\n others - Reserved.
            bitOffset: 9
            bitWidth: 3
            access: read-write
          BP:
            description: BP - SD Bus Power for VDD1\n\n When set to 1, the VDD1 voltage is supplied to card/device. The state of this bit directly drives s#_bus_pow port of the core.\n Setting bit to 0 cause that host stops driving SDCLK, CMD/DAT lines. If the device is connected to the host, lines go low before disabling VDD1.\n The host will set this bit automatically to 0 when card is removed from the slot (i.e. after high to low transition on s#_sdcd_n pin). This is to provide the hot removal support.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          CDSS:
            description: CDSS - Card Detect Signal Selection\n\n A card detection mechanism will base on either s#_sdcd_n port or register value.\n 0 - s#_sdcd_n pin (normal mode)\n 1 - CDTL(SRS10.6) bit (testing mode)
            bitOffset: 7
            bitWidth: 1
            access: read-write
          CDTL:
            description: CDTL - Card Detect Test Level\n\n Designates card insertion status when SRS10.CDSS=1. Bit provided for test purposes.\n 0 - no card\n 1 - card inserted
            bitOffset: 6
            bitWidth: 1
            access: read-write
          EDTW:
            description: EDTW - Extended Data Transfer Width\n\n This bit is to enable/disable 8-bit DAT bus width mode.\n 0 - bus width selected by SRS10.DTW\n 1 - 8-bit mode enabled
            bitOffset: 5
            bitWidth: 1
            access: read-write
          DMASEL:
            description: DMASEL - DMA Select\n\n In this field the DMA mode can be selected. The field behaviour depends on the Host Controller Compatibility bit (SRS15.HV4E).\n Host Controller version 3.00 compatible mode (SRS15.HV4E=0)\n 00b - SDMA mode\n 01b - Reserved\n 10b - ADMA2 (32-bit Address)\n 11b - ADMA2 (64-bit Address)\n\n Host Controller version 4.00 compatibility mode (SRS15.HV4E=1)\n 00b - SDMA mode\n 01b - Not Used\n 10b - ADMA2 mode\n 11b - Reserved\n\n The ADMA2 address bus width is configured by 64-bit Addressing bit in Host Controller 2 register when SRS15.HV4E=1.
            bitOffset: 3
            bitWidth: 2
            access: read-write
          HSE:
            description: HSE - High Speed Enable (SD mode only)\n\n Selects operating mode to Default Speed (HSE=0) or High Speed (HSE=1).\n The maximum SD clock frequency is defined as 0-25MHz in the default speed mode, and 0-50MHz in the High Speed mode.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          DTW:
            description: DTW - Data Transfer Width (SD mode only)\n\n Bit used to configure DAT bus width to 1 or 4.\n 0 - 1-bit mode\n 1 - 4-bit mode\n\n This bit is ignored when the SRS10.EDTW is set 1 (8-bit mode selected).
            bitOffset: 1
            bitWidth: 1
            access: read-write
          LEDC:
            description: LEDC - LED Control\n\n State of this bit directly drives led port of the host in order to control the external LED diode.\n LEDC=1 will switch LED on, while LEDC=0 will switch it off.\n The software will switch LED on to caution the user not to remove the card while the transfer is in progress.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SRS11:
        description: SRS11 - Host Control 2 (Clock, Timeout, Reset)
        addressOffset: 0x22C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SRDAT:
            description: SRDAT - Software Reset For DAT Line (SD Mode only)\n\n When set to 1, resets the logic related to the data path, including data buffers and the DMA logic.\n The following registers and bits are cleared:\n SRS08 register:\n - Buffer\n\n SRS09 register:\n - Buffer Read Enable\n - Buffer Write Enable\n - Read Transfer Active\n - Write Transfer Active\n - DAT Line Active\n - Command Inhibit\n\n DATSRS10 register:\n - Continue Request\n - Stop At Block Gap Request\n\n SRS12 register:\n - Buffer Read Ready\n - Buffer Write Ready\n - DMA Interrupt\n - Block Gap Event\n - Transfer Complete\n\n After completing the reset operation, SRS11.SRDAT bit is automatically cleared. It takes some time to complete the reset operation, so the software will wait until SRS11.SRDAT=0, and continue the other operations only when SRS11.SRDAT=0.
            bitOffset: 26
            bitWidth: 1
            access: read-write
          SRCMD:
            description: 'SRCMD - Software Reset For CMD Line (SD Mode only)\n\n When set to 1, resets the logic related to the command generation and response checking.\n The following registers and bits are cleared:\n - SRS09 register: Command Inhibit CMD\n - SRS12 register: Command Complete\n\n After completing the reset operation, SRS11.SRCMD bit is automatically cleared. It takes some time to complete the reset operation, so the software will wait until SRCMD=0, and continue the other operations only when SRS11.SRCMD=0.'
            bitOffset: 25
            bitWidth: 1
            access: read-write
          SRFA:
            description: SRFA - Software Reset For All\n\n When set to 1, the entire slot is reset.After completing the reset operation, SRFA bit is automatically cleared. It takes some time to complete the reset operation, so the software will wait until SRFA=0, and continue the other operations only when SRFA=0.\n Additionally, after SRFA, software should reset and reinitialize card inserted to the slot.\n SD Card Power may be enabled 1 ms after this bit is cleared to ensure SD Card has been reset properly.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          DTCV:
            description: DTCV - Data Timeout Counter Value\n\n This value determines the interval by which DAT line timeouts are detected.\n The interval can be computed as below:\n 1111b - Reserved\n 1110b - t_sdmclk*2^(27+2)\n 1101b - t_sdmclk*2^(26+2)\n ...\n 0001b - t_sdmclk*2^(14+2)\n 0000b - t_sdmclk*2^(13+2)\n\n Where t_sdmclk is the sdmclk clock periodRefer to the Data Timeout Error (SRS12.EDT) register for information on factors which generate data timeouts.
            bitOffset: 16
            bitWidth: 4
            access: read-write
          SDCFSL:
            description: SDCFSL - SDCLK Frequency Select (lower part)\n\n This register and SRS11.SDCFSH are used to calculate frequency of SDCLK clock.\n The SDCLK frequency is calculated with following expressions:\n - sdclk = sdmclk; when (N=0)\n - sdclk = sdmclk/2N; when (N>0)\n\n Variable N is concatenation of SRS11.SDCFSH and SRS11.SDCFSL.\n The value of SDCFSL, SDCFSH registers can be changed only when SRS11.SDCE (SD Clock Enable)=0.
            bitOffset: 8
            bitWidth: 8
            access: read-write
          SDCFSH:
            description: SDCFSH - SDCLK Frequency Select (higher part)\n\n This register is an extension to SDCFSL.
            bitOffset: 6
            bitWidth: 2
            access: read-write
          SDCE:
            description: SDCE - SD Clock Enable\n\n When set to 1, SDCLK clock is enabled.\n When cleared to 0, SDCLK clock is stopped.\n\n The host clears SDCE automatically when card is removed from the slot (i.e. after the high to low transition on s#_sdcd_n pin).\n The SDCLK clock should be stopped by the software when changing the clock divider (i.e. SDCE bit will be cleared before writing SRS11.SDCFSL, SRS11.SDCFSH).
            bitOffset: 2
            bitWidth: 1
            access: read-write
          ICS:
            description: ICS - Internal Clock Stable\n\n When read as 1, indicates that the clock on sdmclk pin of the host is stable after setting ICE to 1.\n When read as 0, indicates that the clock is not stable yet (for example the external PLL that generates the clock is not yet locked).\n\n The value of ICS is equal to the actual signal level on ics pin of the host. The user will connect ics to the external PLL if required. Otherwise, ics should be connected directly to the ice output of the host.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          ICE:
            description: ICE - Internal Clock Enable\n\n This field is designated to controls (enable/disable) external clock generator (e.g. PLL). The ICE bits of every slot are logically OR-ed together and then drive the ice pin. It means, the ice pin is 0 only when ICE is 0 for every slot implemented inside the host.\n The ice pin is 1 if at least one of the ICE bits is set to 1.\n When set to 0, the clock on sdmclk pin can be stopped externally.\n\n If the sdmclk is stopped, then host goes to a very low power state. The hosts registers are still operable (read and written operation are valid) even if the clock on sdmclk is stopped.\n Setting of the ICE bit does not affect card detection. It means, the card detection works even if the clock on sdmclk is stopped.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SRS12:
        description: SRS12 - Error/Normal Interrupt Status
        addressOffset: 0x230
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ERSP:
            description: ERSP - Response Error (SD Mode only)\n\n Generated on error detection inside R1 or R5 response.\n Errors will be checked only if RECE is set 1.
            bitOffset: 27
            bitWidth: 1
            access: read-write
          EADMA:
            description: EADMA - ADMA Error\n\n Generated when an error occurs during ADMA read or write transfer.\n To resolve the cause of the error, the state of the ADMA engine at error occurrence is saved in ADMA Error Status register, and the address of the descriptor processed at error occurrence is provided in ADMA System Address register.
            bitOffset: 25
            bitWidth: 1
            access: read-write
          EAC:
            description: EAC - Auto CMD Error (SD mode only)\n\n Generated when an error occurs during Auto CMD12/Auto CMD23 command transmission.\n It indicates one of the following conditions:\n - one of the bits in SRS15 register has changed from 0 to 1,\n - Auto CMD12 is not executed due to the previous command error.
            bitOffset: 24
            bitWidth: 1
            access: read-write
          ECL:
            description: ECL - Current Limit Error\n\n Generated when host is not supplying power to SD card due to some failure.\n The value is equal to the actual signal level on the cle pin of the host.
            bitOffset: 23
            bitWidth: 1
            access: read-write
          EDEB:
            description: EDEB - Data End Bit Error (SD mode only)\n\n When set to 1, indicates detecting 0 at the end bit position of read data transfer which uses the DAT line, or at the end bit position of the Write CRC Status.
            bitOffset: 22
            bitWidth: 1
            access: read-write
          EDCRC:
            description: EDCRC - Data CRC Error (SD mode only)\n\n When set to 1, indicates detecting CRC error when transferring read data which uses the DAT line, or when detecting the Write CRC status having a value of other than 010.\n This bit will be set to 1 immediately when conflict on CMD line detected.\n The conflict is signalized by setting this bit and SRS12.EDT to 1.
            bitOffset: 21
            bitWidth: 1
            access: read-write
          EDT:
            description: EDT - Data Timeout Error (SD mode only)\n\n When set to 1, indicates detecting one of the following timeout conditions:\n 1. Busy timeout for the response with busy.\n 2. Busy timeout after Write CRC status.\n 3. Write CRC Status timeout.\n 4. Read data timeout.\n\n This bit will be set to 1 immediately when conflict on CMD line conflict detected.
            bitOffset: 20
            bitWidth: 1
            access: read-write
          ECI:
            description: ECI - Command Index Error (SD mode only)\n\n When set to 1, indicates that Index error occurs in the command response.
            bitOffset: 19
            bitWidth: 1
            access: read-write
          ECEB:
            description: ECEB - Command End Bit Error (SD mode only)\n\n When set to 1, indicates detecting that the end bit of a command response is 0.
            bitOffset: 18
            bitWidth: 1
            access: read-write
          ECCRC:
            description: ECCRC - Command CRC Error (SD mode only)\n\n When set to 1, indicates that command CRC error has occurred.
            bitOffset: 17
            bitWidth: 1
            access: read-write
          ECT:
            description: ECT - Command Timeout Error (SD mode only)\n\n When set to 1, indicates that no response was returned within 64 SDCLK cycles from the end bit of the command.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          EINT:
            description: 'EINT - Error Interrupt\n\n This bit is set if: - any of bits in range SRS12[31:16] is set; The software can check for an error by reading this single bit first.'
            bitOffset: 15
            bitWidth: 1
            access: read-only
          CQINT:
            description: CQINT - Command Queuing Interrupt\n\n This interrupt is asserted when at least one of the bits in CQIS register is set. This interrupt is cleared only by clearing the source interrupt in CQIS register.
            bitOffset: 14
            bitWidth: 1
            access: read-only
          CINT:
            description: CINT - Card Interrupt\n\n Indicates the card interrupt. CINT is not sampled by the card clock, so the interrupt can be detected even with SD clock stopped (SRS11.SDCE=0). Also, CINT is not cleared by writing 1. Instead, the software will clear the source of an interrupt inside the card.After detecting the Card Interrupt, the software will stop further interrupt detection by clearing SRS13.CINT_SE to 0. Then, the software will clear the interrupt source inside the card by using the appropriate commands. For the details, please refer to the SDIO Card Specification.\n After clearing the interrupt source, the card will stop to drive the interrupt signal to the host. Finally, when the interrupt service routine is finished, the interrupt detection can be enabled by setting SRS13.CINT_SE back to 1.
            bitOffset: 8
            bitWidth: 1
            access: read-only
          CR:
            description: CR - Card Removal\n\n Generated when the SRS09.CI bit changes from 1 to 0, indicating card removal event.\n When read as 1, indicates that the card was removed from the slot.\n When read as 0, indicates that the card state is stable (still inserted or removed) or that the debouncing is in progress.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          CIN:
            description: CIN - Card Insertion\n\n Generated when the SRS09.CI bit changes from 0 to 1, indicating card insertion.\n When read as 1, indicates that the card was inserted to the slot.\n When read as 0, indicates that the card state is stable (still inserted or removed) or that the debouncing is in progress.
            bitOffset: 6
            bitWidth: 1
            access: read-write
          BRR:
            description: BRR - Buffer Read Ready\n\n Generated when the BRE changes from 0 to 1, indicating that the data buffer can be read by the software.
            bitOffset: 5
            bitWidth: 1
            access: read-write
          BWR:
            description: BWR - Buffer Write Ready\n\n Generated when the BWE changes from 0 to 1, indicating that the data buffer can be written by the software.
            bitOffset: 4
            bitWidth: 1
            access: read-write
          DMAINT:
            description: DMAINT - DMA Interrupt\n\n In SDMA mode, DMA interrupt is generated when the host controller detects the Host SDMA Buffer boundary.\n In ADMA mode, DMA interrupt is generated when the INT flag is set in a currently serviced ADMA descriptor.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          BGE:
            description: BGE - Block Gap Event\n\n Generated when the read/write transaction is stopped at a block gap as the result of setting SRS10.SBGR to 1.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          TC:
            description: TC - Transfer Complete\n\n SD Mode:\n Generated when the transfer which uses the DAT line is complete. Transfers which use the DAT line include the read/write transfers and commands with a busy response.\n In case of the read transfer, TC indicates that the entire data was transferred from the card to the host system (i.e. the host FIFO is empty after reading the last data block).\n In case of the write transfer, TC indicates that the entire data was transferred from the host to the card (i.e. the host FIFO is empty after writing the last data block), and the card accepted the data (busy signal released after the last block). In the case of the command with a busy response, TC indicates that the busy signal is released after the response.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CC:
            description: CC - Command Complete\n\n Generated when the end bit of the response is received, except the response for Auto-CMD12 command. Auto-CMD12 command does not generate CC.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SRS13:
