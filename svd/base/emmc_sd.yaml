          SRS24_SDCFSPV_25_16:
            description: SDCFSPV## - SDCLK Clock Frequency Select - Preset Value\n\n This field can be used by the software to update SRS11.SDCFSH and SRS11.SDCFSL.
            bitOffset: 16
