      CQRS00:
        description: CQRS00 - Command Queuing Version
        addressOffset: 0x400
        size: 32
        access: read-only
        resetValue: 0x510
        fields:
          CQVN1:
            description: CQVN1 - eMMC Major Version Number\n\n Major version number of supported eMMC standard - 5.
            bitOffset: 8
            bitWidth: 4
            access: read-only
          CQVN2:
            description: CQVN2 - eMMC Minor Version Number\n\n Minor version number of supported eMMC standard - 1.
            bitOffset: 4
            bitWidth: 4
            access: read-only
          CQVN3:
            description: CQVN3 - eMMC Version Suffix\n\n Suffix version number of supported eMMC standard - 0.
            bitOffset: 0
            bitWidth: 4
            access: read-only
      CQRS01:
        description: CQRS01 - Command Queuing Capabilities
        addressOffset: 0x404
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          ITCFMUL:
            description: ITCFMUL - Internal Timer Clock Frequency Multiplier (ITCFMUL)\n\n Defines multiplier of internal clock frequency for the coalescing timer and for the SQS polling period.\n 0 - 0.001 MHz\n 1 - 0.01 MHz\n 2 - 0.1 MHz\n 3 - 1 MHz\n 4 - 10 MHz\n\n The ITCFMUL and ITCFVAL defines the clock frequency.
            bitOffset: 12
            bitWidth: 4
            access: read-only
          ITCFVAL:
            description: ITCFVAL - Internal Timer Clock Frequency Value (ITCFVAL)\n\n Value defines internal clock frequency for the coalescing timer and for the SQS polling period. The frequency is equal to ITCFMUL * ITCFVAL.
            bitOffset: 0
            bitWidth: 10
            access: read-only
      CQRS02:
        description: CQRS02 - Command Queuing Configuration
        addressOffset: 0x408
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQDCE:
            description: CQDCE - Direct Command (DCMD) Enable\n\n Process Task Descriptor for slot 31 as Data Transfer Task Descriptor (0) or Direct Command Task Descriptor (1).
            bitOffset: 12
            bitWidth: 1
            access: read-write
          CQTDS:
            description: CQTDS - Task Descriptor\n\n Size Expect 128 bit (1) or 64 bit (0) task descriptor. This setting can be changed only when Command Queuing is disabled (CQE = 0).
            bitOffset: 8
            bitWidth: 1
            access: read-write
          CQE:
            description: CQE - Command Queuing Enable\n\n Enables (1) or disables (0) the Command Queuing. This bit can be enabled only when all previous transactions are completed. This bit can be cleared only when all tasks are completed or cleared.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CQRS03:
        description: CQRS03 - Command Queuing Control
        addressOffset: 0x40C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQCAT:
            description: CQCAT - Clear All Tasks\n\n Clears (1) all active tasks in the host controller. Software has to poll this register until operation is completed (bit is automatically cleared). Software can set this bit only when the CQ Engine is halted. Software has to clear all requested tasks in the eMMC device. Writing (0) has no effect.
            bitOffset: 8
            bitWidth: 1
            access: read-write
          CQHLT:
            description: CQHLT - Halt CQ\n\n Engine can be halted by writing this bit 1. Any pending operation will be completed, and awaiting operation will be stopped. Once all tasks are completed or stopped this bit is set 1. The host controller will not automatically start any new operation, but software can use SRS registers to issue any command directly bypassing CQE. CQ Engine starts operation after being halted by writing 0 to this register. Writing 0 is ignored when CQ Engine is not halted.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CQRS04:
        description: CQRS04 - Command Queuing Interrupt Status\n This register has several status bit related to specific interrupt event. When even happened and related Command Queuing Interrupt Status Enable is set, the status bit is set to 1. The bits can be cleared by S/W.\n Write 0 clears bit.\n Write 1 is ignored.
        addressOffset: 0x410
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQTCL:
            description: CQTCL - Task Cleared (TCL)\n\n When task clear operation or clear individual task is completed, the CQE sets this bit to 1.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          CQREDI:
            description: CQREDI - Response Error Detected Interrupt (RED)\n\n When an error is detected in the response received from eMMC device, the CQE sets this bit to 1. S/W can select which bits are analyzed by selecting CQRMEM.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          CQTCC:
            description: CQTCC - Task Complete Interrupt (TCC)\n\n CQE sets this bit when either a task with INT=1 is completed or Interrupt Coalescing reports interrupt.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CQHAC:
            description: CQHAC - Halt Complete Interrupt (HAC)\n\n CQE sets this bit when value of CQHLT changed from 0 to 1.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CQRS05:
        description: CQRS05 - Command Queuing Interrupt Status Enable\n\n Statuses Enable bits enables interrupt sources. The status is enabled when bit is set 1 (S/W wrote 1 to the field).
        addressOffset: 0x414
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQTCLST:
            description: CQTCLST - Task Cleared Status Enable (TCL)\n\n Enables CQTCL register.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          CQREDST:
            description: CQREDST - Response Error Detected Status Enable (RED)\n\n Enables CQREDI register.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          CQTCCST:
            description: CQTCCST - Task Complete Status Enable (TCC)\n\n Enables CQHAC register.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CQHACST:
            description: CQHACST - Halt Complete Status Enable (HAC)\n\n Enables CQTCLST register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CQRS06:
        description: CQRS06 - Command Queuing Interrupt Signal Enable\n This register allows to turn on or turn off interrupt notification separately for each bit of the Command Queuing Interrupt Status. When Interrupt status bit is set 1 and related field in this register is set (S/W wrote 1 to the filed), the Interrupt Status is reported on interrupt port.
        addressOffset: 0x418
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQTCLSI:
            description: CQTCLSI - Task Cleared Signal Enable (TCL)\n\n Enables interrupt signaling from CQTCL register.
            bitOffset: 3
            bitWidth: 1
            access: read-write
          CQREDSI:
            description: CQREDSI - Response Error Detected Signal Enable (TCC)\n\n Enables interrupt signaling from CQREDI register.
            bitOffset: 2
            bitWidth: 1
            access: read-write
          CQTCCSI:
            description: CQTCCSI - Task Complete Signal Enable (TCC)\n\n Enables interrupt signaling from CQTCC register.
            bitOffset: 1
            bitWidth: 1
            access: read-write
          CQHACSI:
            description: CQHACSI - Halt Complete Signal Enable (HAC)\n\n Enables interrupt signaling from CQHLT register.
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CQRS07:
        description: CQRS07 - Interrupt Coalescing\n\n This register allows to group a CQ transfer and report single interrupt for entire group of requested tasks.
        addressOffset: 0x41C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQICED:
            description: CQICED - Interrupt Coalescing Enable/Disable\n\n Enables coalescing mechanism allowing to generate coalescing interrupts.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          CQICSB:
            description: CQICSB - Interrupt Coalescing Status Bit (ICSB)\n\n CQE sets this bit 1 when any task with INT=0 is completed.
            bitOffset: 20
            bitWidth: 1
            access: read-only
          CQICCTR:
            description: CQICCTR - Counter and Timer Reset(ICCTR)\n\n S/W resets interrupt coalescing timer and counter.
            bitOffset: 16
            bitWidth: 1
            access: read-write
          CQICCTHWEN:
            description: CQICCTHWEN - Interrupt Coalescing Counter Threshold Write Enable (ICCTHWEN)\n\n This is write enable for CQICCTH. When this bit is set 1, the field will be updated.
            bitOffset: 15
            bitWidth: 1
            access: read-write
          CQICCTH:
            description: CQICCTH - Interrupt Coalescing Counter Threshold (ICCTH)\n\n CQE increments internal counter when task with INT=0 is completed. When internal counter reaches this value the coalescing generates interrupt. S/W can select treshold value in range 1 to 31. S/W can disable internal counter and interrupt generation by setting this field to 0.
            bitOffset: 8
            bitWidth: 5
            access: read-write
          CQICTOVALEN:
            description: CQICTOVALEN - Interrupt Coalescing Timeout Value Write Enable (ICTOVALWEN)\n\n This is write enable for CQICTOVAL. When this bit is set 1, the field will be updated.
            bitOffset: 7
            bitWidth: 1
            access: read-write
          CQICTOVAL:
            description: CQICTOVAL - Interrupt Coalescing Timeout Value (ICTOVAL)\n\n CQE generates interrupt when internal counter reaches period defined in this field. The counter starts when first transfer with INT=0 is completed. The counter increments each time when Internal Clock * 1024 period elapsed. S/W can disable this timer by setting this filed to 0.
            bitOffset: 0
            bitWidth: 7
            access: read-write
      CQRS08:
        description: CQRS08 - Command Queuing Task Descriptor List Base Address
        addressOffset: 0x420
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQTDLBA:
            description: CQTDLBA - Task Descriptor List Base Address (lower)\n\n Base address (32 lower bits) of the Task Descriptor List. S/W will write values aligned to 1kB boundary (lower 10 bits have to be 0). The hardware ignores 10 lower bits.\n S/W will update this register only when CQE is disabled.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CQRS09:
        description: CQRS09 - Command Queuing Task Descriptor List Base Address Upper 32 Bits
        addressOffset: 0x424
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQTDLBAU:
            description: CQTDLBAU - Task Descriptor List Base Address (upper)\n\n Base address (32 upper bits) of the Task descriptor List. This register is not used in 32 bit addressing mode (S/W does not change this value). S/W will update this register only when CQE is disabled.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CQRS10:
        description: CQRS10 - Command Queuing Task Doorbell\n CQ has 32 tasks have individual bits to start operation on desired task. The S/W writes 1 on any position from 0 to 31 to start task 0 to 31. The S/W can request more than one task in single write. The CQ Engine process tasks in order they were requested:\n - when more than one task is requested in single register write, the task with lower number has higher priority over task with higher number\n - task(s) requested in earlier register write has higher priority over task(s) in later register write\n The order of the tasks are maintained during all phases of transaction. If given task is not ready for execution, the CQ Engine takes next task with highest number.\n CQ Engine needs several clock cycles to push requested in the single register write Task Doorbell to queue. The slave interface ends write transfer as soon all tasks are in the queue.\n When S/W writes 0 to bit in this register, the related task won't start - this value is ignored.\n Task Doorbell bit remain 1 until task execution is completed, task is cleared by Clear All Task or Clear Task with this number or CQ Engine is disabled (CQE=0).
