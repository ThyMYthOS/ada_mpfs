      SRS26:
        description: SRS26 - Preset Value (SDR25 and SDR50)\n\n SRS26[15:0] - SDR25 if:\n SRS15.V18SE=1\n SRS15.UMS=001b\n\n SRS26[31:16] - SDR50 if:\n SRS15.V18SE=1\n SRS15.UMS=010b\n\n HWINIT Register - Note this register is hardware initialized after reset and the value read back will match the IP configuration.
