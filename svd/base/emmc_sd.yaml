      SRS21:
        description: SRS21 - ADMA Error Status
        addressOffset: 0x254
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          EADMAL:
            description: EADMAL - ADMA Length Mismatch Error\n\n This bit is set when:\n - total data length specified in ADMA descriptors is different from that specified by the Block Count and Block Length fields (if Block Count Enable is set).\n - total data length cannot be divided into complete blocks of specified length (if Block Count Enable is not set).
            bitOffset: 2
            bitWidth: 1
            access: read-only
          EADMAS:
            description: EADMAS - ADMA Error State\n\n The value of this field reflects the state of the ADMA state machine. The possible values are:\n 00b - ST_STOP (ADMA Stopped)\n 01b - ST_FDS (Fetching descriptor)\n 10b - not used\n 11b - ST_TRF (Transfer data)
            bitOffset: 0
            bitWidth: 2
            access: read-only
      SRS22:
        description: SRS22 ADMA/SDMA System Address 1
        addressOffset: 0x258
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DMASA1:
            description: DMASA1 - ADMA System Address\n\n This field contains the physical address of the currently processed ADMA descriptor or SDMA system address. The Host Driver will set this register with the descriptors table base address before it starts the ADMA transfers. The Host Driver should not write this register while the data transfer is active.\n While the ADMA engine is processing the descriptors list, the ADMASA value is always incremented to point the next descriptor to be fetched.\n If the ADMA Error occurs, the register holds the descriptor address depending on the ADMA Error State (SRS21.EADMAS) register value, as listed in the table below:\n 00b - Points next of the error descriptor\n 01b - Points the error descriptor\n 10b - not used\n 11b - Points next of the error descriptor\n\n The host ADMA engine ignores 2 or 3 least significant bits in this register when the 32-bit or 64-bit addressing is active, respectively.\n If SRS15.HV4E is set 1 and SDMA engine is selected, this field is used instead of SRS00 to define system memory address. This register incremented and points to the next memory location that will be accessed.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SRS23:
        description: SRS23 ADMA/SDMA System Address 2
        addressOffset: 0x25C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DMASA2:
            description: 'DMASA2 - ADMA System Address #2\n\n In ADMA mode, if 64-bit addressing is enabled (SRS15.A64B=1), this field holds bits 63-32 of the physical address pointing on ADMA descriptor table.\n In SDMA mode, if host compatibility with version 4.x and 64-bit addressing are enabled (SRS15.HV4E=1 and SRS15.A64B=1), this field holds bits 63-32 of system address.'
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SRS24:
        description: SRS24 - Preset Value (Default Speed)\n\n SRS24[31:16] - Default Speed if:\n SRS15.V18SE=0\n SRS10.HSE=0\n\n HWINIT Register - Note this register is hardware initialized after reset and the value read back will match the IP configuration.
        addressOffset: 0x260
        size: 32
        access: read-only
        resetValue: 0x400FA
        fields:
          SRS24_DSSPV_31_30:
            description: DSSPV## - Driver Strength Select - Preset Value\n\n This field can be used by the software to update SRS15.DSS.
