      CQRS16:
        description: CQRS16 - Send Status Configuration 1
        addressOffset: 0x440
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQSSCBC:
            description: CQSSCBC - Send Status Command Block Counter (CBC)\n\n S/W can define if and when CQE sends SEND_QUEUE_STATUS (CMD13) command during data transfer.\n When this register is set 0, the CQE does not send CMD13 during data transfer. The value is 1, 2, or N means, the CQE sends CMD13 is transferred during last, one before last, or (N-1) before last block, respectively.\n Accepted register value range is 0 to 15.
            bitOffset: 16
            bitWidth: 4
            access: read-write
          CQSSCIT:
            description: CQSSCIT - Send Status Command Idle Timer (CIT)\n\n When CQE is in idle, the host controller can poll device by sending SEND_QUEUE_STATUS (CMD13) with interval defined by this register. Accepted register value is in range 1 to 65535. The interval can be calculated as CQSSICT * internal clock period.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CQRS17:
        description: CQRS17 - Send Status Configuration 2
        addressOffset: 0x444
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQSQSR:
            description: CQSQSR - Send Queue Status RCA\n\n S/W writes 16-bit RCA value which is send as an argument in SEND_QUEUE_STATUS (CMD13) command.
            bitOffset: 0
            bitWidth: 16
            access: read-write
      CQRS18:
        description: CQRS18 - Command Response for Direct-Command Task
        addressOffset: 0x448
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CQDCLR:
            description: CQDCLR - Direct Command Last Response\n\n CQE holds the last DCMD command response.
            bitOffset: 0
            bitWidth: 32
            access: read-only
      CQRS20:
        description: CQRS20 - Response Mode Error Mask
        addressOffset: 0x450
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CQRMEM:
            description: CQRMEM - Response Mode Error Mask\n\n CQE is able to automatically detect errors in response. The S/W defines which bits of the response need to be checked. All bits set to 1 (written by S/W) are analyzed. The CQE reports Response Error Detected Interrupt (CQREDI) when N bit of CQRMEM is 1 and N bit of response is 1. Response for SEND_QUEUE_STATUS (CMD13) automatically sent by CQE is ignored.
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CQRS21:
        description: CQRS21 - Task Error Information
        addressOffset: 0x454
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CQDTEFV:
            description: CQDTEFV - Data Transfer Error Fields Valid\n\n Host sets this bit to 1 when error is detected during data transfer. Host clears this bit to 0 when error is detected and there is no active data transfer.
            bitOffset: 31
            bitWidth: 1
            access: read-only
          CQDTETID:
            description: CQDTETID - Data Transfer Error Task ID\n\n Host updates this field with ID of the task with active data transfer when error occurred during the data transfer.
            bitOffset: 24
            bitWidth: 5
            access: read-only
          CQDTECI:
            description: CQDTECI - Data Transfer Error Command Index\n\n Host updates this field with index of the data transfer command executed when error occurred during the data transfer.
            bitOffset: 16
            bitWidth: 6
            access: read-only
          CQRMEFV:
            description: CQRMEFV - Response Mode Error Fields Valid\n\n Host sets this bit to 1 when error is detected and command transaction is active. Host sets this bit to 0 when error is detected and command transaction is no active.
            bitOffset: 15
            bitWidth: 1
            access: read-only
          CQRMETID:
            description: CQRMETID - Response Mode Error Task ID\n\n Host updates this field with ID of the task with active command transfer when error occurred during the command transaction.
            bitOffset: 8
            bitWidth: 5
            access: read-only
          CQRMECI:
            description: CQRMECI - Response Mode Error Command Index\n\n Host updates this field with index of the command executed when error occurred during the command transaction.
            bitOffset: 0
            bitWidth: 6
            access: read-only
      CQRS22:
        description: CQRS22 - Command Response Index
        addressOffset: 0x458
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CQLCRI:
            description: CQLCRI - Last Command Response Index\n\n Host updates this field with command index when response is received.
            bitOffset: 0
            bitWidth: 6
            access: read-only
      CQRS23:
        description: CQRS23 - Command Response Argument
        addressOffset: 0x45C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          CQLCRA:
            description: CQLCRA - Last Command Response Argument\n\n Host updates this field with command argument when response is received.
            bitOffset: 0
            bitWidth: 32
            access: read-only
