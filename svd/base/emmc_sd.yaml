      SRS15:
        description: 'SRS15 - Host Control #2 / Auto CMD Error Status'
        addressOffset: 0x23C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PVE:
            description: PVE - Preset Value Enable\n\n Setting this bit to 1 triggers an automatically update of SRS11.SDCFSL, SRS11.SDCFSH, SRS11.CGS, SRS15.DSS registers by the host. Values for an update are taken from SRS24 - SRS27 and depends on SRS15.UMS.
            bitOffset: 31
            bitWidth: 1
            access: read-write
          A64B:
            description: A64B - 64-bit Addressing\n\n Specifies the addressing mode for DMA ending. This field is ignored when SRS15.HV4E=0.\n 0 - 32-bit addressing\n 1 - 64-bit addressing
            bitOffset: 29
            bitWidth: 1
            access: read-write
          HV4E:
            description: HV4E - Host Version 4.00 Enable\n\n Selects backward (SD Host 3.00 Version) compatibility mode or SD Host 4.00 Version mode.\n 0 - Version 3.00\n 1 - Version 4.00\n\n The software can select system address register SRS00 (when this bit is 0) or SRS23 / SRS22 (when this bit is 1) for the SDMA engine.
            bitOffset: 28
            bitWidth: 1
            access: read-write
          SCS:
            description: SCS - Sampling Clock Select (UHS-I only)\n\n The host updates this bit when the tuning procedure is finished. If this bit is set to 1, this means that the tuning procedure is successfully completed.\n Otherwise it means that procedure failed and clock tuning logic is disabled.\n This bit is valid only after the procedure is finished.Writing 1 will be ignored.\n Writing 0 will reset and disable tuning block.
            bitOffset: 23
            bitWidth: 1
            access: read-write
          EXTNG:
            description: EXTNG - Execute Tuning (UHS-I only)\n\n This register controls tuning procedure.\n The procedure starts when the bit is set 1.\n The procedure can be aborted when the bit is cleared.\n\n The bit is read 1 while the procedure is in progress, and 0 when the procedure is finished.\n SCS = 0, EXTNG = 0 - Reset and disable clock tuning logic\n SCS = 0, EXTNG = 1 - Reset and restart tuning process\n SCS = 1, EXTNG = 0 - Stop tuning procedure\n SCS = 1, EXTNG = 1 - Start retuning (without clock tuning logic reset)
            bitOffset: 22
            bitWidth: 1
            access: read-write
          DSS:
            description: DSS - Driver Strength Select (UHS-I only)\n\n This bit controls the electric parameters of I/O driver. Up to 4 configurations of I/O driver settings can be implemented:\n 00 - Driver Type B (default)\n 01 - Driver Type A\n 10 - Driver Type C\n 11 - Driver Type D\n The bit is ignored when the V18SE is cleared.
            bitOffset: 20
            bitWidth: 2
            access: read-write
          V18SE:
            description: V18SE - 1.8V Signaling Enable (UHS-I only)\n\n This bit controls I/O signaling voltage level.\n If the bit is 0 or 1, the I/O uses the 3.3V or 1.8V signaling, respectively.\n The SW driver will set this bit 1 when UHS-I mode.\n Depend on the selected SD interface mode, the software will set this field as follows:\n - 0 - for Default Speed, High Speed mode\n - 1 - for UHS-I mode
            bitOffset: 19
            bitWidth: 1
            access: read-write
          UMS:
            description: UMS - UHS Mode Select\n\n Used to select one of UHS-I modes .\n 000b - SDR12\n 001b - SDR25\n 010b - SDR50\n 011b - SDR104\n 100b - DDR50\n 101b - Reserved\n 110b - Reserved\n 111b - Reserved\n\n The selected UHS-I mode (when value is in range 000b-100b) will be ignored when V18SE is 0.
            bitOffset: 16
            bitWidth: 3
            access: read-write
          CNIACE:
            description: CNIACE - Command Not Issued By Auto CMD12 Error\n\n When read as 1, the command was not executed by the Host due to the previous Auto CMD12 error.\n When Host detects any error during Auto-CMD12, then all further command generation attempts are blocked. The software reset sequence is needed for recovery.\n Bit is set to 0, when Auto CMD23 Error is detected (any of bits SRS15[4:1] is set).
            bitOffset: 7
            bitWidth: 1
            access: read-only
          ACRE:
            description: ACRE - Auto CMD Response Error\n\n When read as 1, means an error is detected in response to Auto Command.
            bitOffset: 5
            bitWidth: 1
            access: read-only
          ACIE:
            description: ACIE - Auto CMD Index Error\n\n When read as 1, means that Command Index error occurred in the Auto CMD response.
            bitOffset: 4
            bitWidth: 1
            access: read-only
          ACEBE:
            description: ACEBE - Auto CMD End Bit Error\n\n When read as 1, indicates that the end bit of the Auto-CMD response is 0.
            bitOffset: 3
            bitWidth: 1
            access: read-only
          ACCE:
            description: ACCE - Auto CMD CRC Error\n\n When read as 1, indicates a CRC error was detected in the Auto CMD response or conflict on the CMD lines is detected:\n ACCE(SRS15.2) = 0, ACTE(SRS15.1) = 0 - No error\n ACCE(SRS15.2) = 0, ACTE(SRS15.1) = 1 - Auto CMD Timeout error detected\n ACCE(SRS15.2) = 1, ACTE(SRS15.1) = 0 - Auto CMD CRC error detected\n ACCE(SRS15.2) = 1, ACTE(SRS15.1) = 1 - Conflict on the CMD line detected
            bitOffset: 2
            bitWidth: 1
            access: read-only
          ACTE:
            description: ACTE - Auto CMD Timeout Error\n\n When read as 1, indicates that there was no response within 64 SDCLK clock cycles from the end bit of the Auto CMD or conflict on the CMD lines is detected (see table in SRS15.ACCE field description).\n If this bit is set to 1, the other error status bits (SRS15[4:2]) are meaningless.
            bitOffset: 1
            bitWidth: 1
            access: read-only
          ACNE:
            description: ACNE - Auto CMD12 Not Executed\n\n When set to 1, means the host cannot issue Auto CMD12 due to some error. If this bit is set to 1, other error status bits (SRS15[4:1]) are meaningless.\n Bit is updated with 0, when Auto CMD23 Error is detected (any of bits SRS15[4:1] is set).
            bitOffset: 0
            bitWidth: 1
            access: read-only
      SRS16:
        description: 'SRS16 - Capabilities #1\n HWINIT Register - Note this register is hardware initialized after reset and the value read back will match the IP configuration.'
        addressOffset: 0x240
        size: 32
        access: read-only
        resetValue: 0x176AC8B2
        fields:
          SLT:
            description: SLT - Slot Type\n\n These bits inform what type of slot is provided.\n 00 - Removable Card Slot\n 01 - Embedded Slot for One Device\n 10 - Shared Bus Slot\n 11 - Reserved
            bitOffset: 30
            bitWidth: 2
            access: read-only
          AIS:
            description: AIS - Asynchronous Interrupt Support\n\n 0 - not supported\n 1 - supported
            bitOffset: 29
            bitWidth: 1
            access: read-only
          A64S:
            description: A64S - 64-bit System Addressing Support\n\n 0 - not supported\n 1 - supported
            bitOffset: 28
            bitWidth: 1
            access: read-only
          SRS16_HWINIT1:
            description: HWINIT field
            bitOffset: 27
            bitWidth: 1
            access: read-only
          VS18:
            description: VS18 - Voltage Support 1.8V\n\n 0 - not supported\n 1 - supported
            bitOffset: 26
            bitWidth: 1
            access: read-only
          VS30:
            description: VS30 - Voltage Support 3.0V\n\n 0 - not supported\n 1 - supported
            bitOffset: 25
            bitWidth: 1
            access: read-only
          VS33:
            description: VS33 - Voltage Support 3.3V\n\n 0 - not supported\n 1 - supported
            bitOffset: 24
            bitWidth: 1
            access: read-only
          SRS:
            description: SRS - Suspend / Resume Support\n\n 0 - not supported\n 1 - supported\n\n The host controller does not support Suspend / Resume mechanism.
            bitOffset: 23
            bitWidth: 1
            access: read-only
          DMAS:
            description: DMAS - SDMA Support\n\n 0 - not supported\n 1 - supported\n This bit defines whether the SDMA is supported in the slot. There is a separate IMPLEMENT_DMA generic parameter which defines whether the DMA is physically implemented inside host. If DMAS is set to 1 for any card slot, then the IMPLEMENT_DMA would also be set to 1.
            bitOffset: 22
            bitWidth: 1
            access: read-only
          HSS:
            description: HSS - High Speed Support\n\n 0 - not supported\n 1 - supported
            bitOffset: 21
            bitWidth: 1
            access: read-only
          ADMA1S:
            description: ADMA1S - ADMA1 Support\n\n 0 - not supported\n 1 - supported
            bitOffset: 20
            bitWidth: 1
            access: read-only
          ADMA2S:
            description: ADMA2S - ADMA2 Support\n\n 0 - not supported\n 1 - supported
            bitOffset: 19
            bitWidth: 1
            access: read-only
          EDS8:
            description: 8EDS - 8-bit Embedded Device Support\n\n 0 - not supported\n 1 - supported\n If this bit is 0, the SRS10.EDTW register is not implemented.
            bitOffset: 18
            bitWidth: 1
            access: read-only
          MBL:
            description: SRS16.MBL - Max Block Length\n\n This value indicates the maximum block size that can be transferred by the host. Three sizes can be defined as indicated below:\n 00b - 512 Bytes\n 01b - 1024 Bytes\n 10b - 2048 Bytes\n 11b - Reserved\n The physical FIFO buffer size is defined by the separate FIFODEPTH generic parameter, and the physical buffer size is equal to 2^FIFODEPTH * 8 bytes. Therefore, the Maximum Block Size defined by MBL will always be less or equal to the physical buffer size.
            bitOffset: 16
            bitWidth: 2
            access: read-only
          BCSDCLK:
            description: BCSDCLK - Base Clock Frequency for SD Clock\n\n Field defines the base clock frequency for the SD Clock in 1MHz units. The base clock is the clock sourced to sdmclk pin of the host. The maximum clock frequency supported is between 10MHz to 255MHz.\n If BCSDCLK = 0, the Host System has to obtain the clock information via another method (i.e. not defined by the specification).
            bitOffset: 8
            bitWidth: 8
            access: read-only
          TCU:
            description: TCU - Timeout Clock Unit\n\n Field defines the frequency unit for the SRS16.TCF.\n 0 - kHz\n 1 - MHz
            bitOffset: 7
            bitWidth: 1
            access: read-only
          SRS16_HWINIT0:
            description: HWINIT field
            bitOffset: 6
            bitWidth: 1
            access: read-only
          TCF:
            description: TCF - Timeout Clock Frequency\n\n Defines the base clock frequency used to detect Data Timeout Error. The SRS16.TCU bit determines the unit used.\n 111111b - 63kHz(SRS16.TCU=0) or 63MHz(SRS16.TCU=1)\n 111110b - 63kHz(SRS16.TCU=0) or 63MHz(SRS16.TCU=1)\n ...\n 000001b - 1kHz(SRS16.TCU=0) or 1MHz(SRS16.TCU=1)\n 000000b - Host System has to obtain the clock information via another method (i.e. not defined by the spec).
            bitOffset: 0
            bitWidth: 6
            access: read-only
      SRS17:
        description: 'SRS17 - Capabilities #2HWINIT Register - Note this register is hardware initialized after reset and the value read back will match the IP configuration.'
        addressOffset: 0x244
        size: 32
        access: read-only
        resetValue: 0x10000077
        fields:
          SRS17_HWINIT3:
            description: HWINIT field
            bitOffset: 29
            bitWidth: 3
            access: read-only
          VDD2S:
            description: VDD2S - VDD2 Supported\n\n Information about support or lack of support of optional VDD2.
            bitOffset: 28
            bitWidth: 1
            access: read-only
          SRS17_HWINIT2:
            description: HWINIT field
            bitOffset: 24
            bitWidth: 4
            access: read-only
          CLKMPR:
            description: CLKMPR - Clock Multiplier\n\n This field is to be 0 (fixed), as the Clock Multiplier is not supported.
            bitOffset: 16
            bitWidth: 8
            access: read-only
          RTNGM:
            description: 'RTNGM - Re-Tuning Modes\n\n Depending on the retuning method, the some restrictions are assumed for the data length between re-tunings.\n The core can work with supporting one of the three method:\n 0 - Mode1: The software driver will use timer to calculate when the re-tuning is to be rerun. The data length between operations is limited to the 4MB.\n 1 - Mode2: The driver will use either the re-tuning request (external input pin uhsi_retune_req is used for this purpose) or timer to predict when next retuning should be performed. The data length between operations is limited to the 4MB.\n 2 - Mode3: This mode is similar to the mode2 with one exception. The core is able to perform auto retuning during the transmission, so data length limitation is not exists. Mode 3 is currently not supported.The driver can configure the timer by getting the RTNGCNT.This field is to be 0 or 1, because the mode 3 is not supported.'
            bitOffset: 14
            bitWidth: 2
            access: read-only
          UTSM50:
            description: UTSM50 - Use Tuning for SDR50\n\n 1 - tuning operation is necessary in SDR50 mode\n 0 - tuning operation is not necessary in SDR50 mode
            bitOffset: 13
            bitWidth: 1
            access: read-only
          SRS17_HWINIT1:
            description: HWINIT field
            bitOffset: 12
            bitWidth: 1
            access: read-only
          RTNGCNT:
            description: RTNGCNT - Timer Count for Re-Tuning\n\n These bits contain initial value for timer used to start periodically Re-Tuning Operation.\n 0h - Re-Tuning Timer disabled\n 1h - 1 second\n ...\n n - 2^(n-1) seconds\n ...\n Bh - 1024 seconds\n Eh-Ch - Reserved\n Fh - Obtain this info in other way
            bitOffset: 8
            bitWidth: 4
            access: read-only
          SRS17_HWINIT0:
            description: HWINIT field
            bitOffset: 7
            bitWidth: 1
            access: read-only
          DRVD:
            description: DRVD - 1.8V Line Driver Type D Supported\n\n 1 - Driver Type D supported\n 0 - Driver Type D not supported
            bitOffset: 6
            bitWidth: 1
            access: read-only
          DRVC:
            description: DRVC - 1.8V Line Driver Type C Supported\n\n 1 - Driver Type C supported\n 0 - Driver Type C not supported
            bitOffset: 5
            bitWidth: 1
            access: read-only
          DRVA:
            description: DRVA - 1.8V Line Driver Type A Supported\n\n 1 - Driver Type A supported\n 0 - Driver Type A not supported
            bitOffset: 4
            bitWidth: 1
            access: read-only
          UHSII:
            description: UHSII - UHS-II Supported\n\n 1 - UHS-II supported\n 0 - UHS-II not supported
            bitOffset: 3
            bitWidth: 1
            access: read-only
          DDR50:
            description: DDR50 - DDR50 Supported\n\n 1 - DDR50 mode supported\n 0 - DDR50 mode not supported
            bitOffset: 2
            bitWidth: 1
            access: read-only
          SDR104:
            description: SDR104 - SDR104 Supported\n\n 1 - SDR104 mode supported\n 0 - SDR104 mode not supported
            bitOffset: 1
            bitWidth: 1
            access: read-only
          SDR50:
            description: SDR50 - SDR50 Supported\n\n 1 - SDR50 mode supported\n 0 - SDR50 mode not supported
            bitOffset: 0
            bitWidth: 1
            access: read-only
