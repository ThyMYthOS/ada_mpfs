        description: SRS29 - Preset Value for UHS-II\n\n SRS29[15:0] - UHS-II if:\n SRS15.V18SE=0\n SRS15.UMS=111b\n\n HWINIT Register - Note this register is hardware initialized after reset and the value read back will match the IP configuration.
