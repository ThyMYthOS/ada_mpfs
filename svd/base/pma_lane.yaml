_add:
  SERDES_0_PMA_LANE0:
    description: SERDES_0_PMA_LANE0 Controller
    groupName: PMA_LANE
    baseAddress: 0x31041000
    registers:
      SOFT_RESET:
        description: Compulsory register for all SCB slaves, facilitating global soft reset.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: 'This returns the block type and chip location. The value of BLOCKID depends on the block type and instance of Serial block containing this page and upon the page (lane) instance number as follows: {4''h0, SLVTYPE, CHIPID, SUBID}. The SLVTPE value is 4''h1 for PMA. The CHIPID is determined by integration via constant applied to tieoff_chipid[3:0] . The SUBID is the identity of the lane instance copy of this register page (lane 0 has SUBID=0, lane 1 has SUBID=1, lane 2, lane 3 has SUBID=3). Read 0x0000'
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts functional reset of the peripheral block. It is asserted and left asserted at power-up. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: Resets all the volatile register bits. Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: Resets all the non-volatile register bits (e.g. RW-P bits). Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_CDR_CTRL_1:
        description: Desirializer CDR control configuration (ATE TRIM)
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CMRTRIM_CDR:
            description: Trim for common mode restore circuit 0x0 0x1 0x7
            bitOffset: 29
            bitWidth: 3
            access: read-write
          H0CDR3:
            description: DC offset calibration of CDR sampler 3
            bitOffset: 24
            bitWidth: 5
            access: read-write
          H0CDR2:
            description: DC offset calibration of CDR sampler 2
            bitOffset: 16
            bitWidth: 5
            access: read-write
          H0CDR1:
            description: DC offset calibration of CDR sampler 1
            bitOffset: 8
            bitWidth: 5
            access: read-write
          H0CDR0:
            description: DC offset calibration of CDR sampler 0
            bitOffset: 1
            bitWidth: 5
            access: read-write
          DCFBEN_CDR:
            description: Enable DC offset cancellation of the first two CTLE stages (CDR) 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_CDR_CTRL_2:
        description: Desirializer CDR control configuration (Characterization TRIM)
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x15
        fields:
          CALOUT_CDR:
            description: Subsampled CDR output for DC feedback correction Data is sub-sampled with deserializer clock RESETDES must be low during calibration Calibration only valid when RXPLL_LOCK is low RCVEN should be de-asserted during calibration HSLPBKEN should be de-asserted during calibration
            bitOffset: 8
            bitWidth: 4
            access: read-only
          CSENT3_CDR:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 4
            bitWidth: 2
            access: read-write
          CSENT2_CDR:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 2
            bitWidth: 2
            access: read-write
          CSENT1_CDR:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DES_CDR_CTRL_3:
        description: Desirializer CDR control configuration
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SLIP_DES_CDR_STATUS:
            description: De-serializer CDR Slip bit status
            bitOffset: 19
            bitWidth: 1
            access: read-only
          SLIP_DES_CDR_EN:
            description: De-serializer CDR Slip function enable 0 1
            bitOffset: 18
            bitWidth: 1
            access: read-write
          SLIP_DES_CDR_SEL:
            description: Select de-serializer CDR slip controller 0 1
            bitOffset: 17
            bitWidth: 1
            access: read-write
          SLIP_DES_CDR:
            description: 'Slip de-serializer output alignment by 1 bit A bit slip occurs on every state change of SLIP_DES In 8b, 16b, and 32b de-serialization, bits slip forward (ex: 101,01x,1xx) In 10b, 20b, and 40b de-serialization, bits slip backward (ex: 101,x10,xx1) 0 1'
            bitOffset: 16
            bitWidth: 1
            access: read-write
          RXDRV_CDR:
            description: RX CLTLE BW control for CDR path 0x0 0x1 0x3
            bitOffset: 8
            bitWidth: 2
            access: read-write
          RST2_CDR:
            description: CTLE source resistor trim, second CTLE stage 0x0 0x3
            bitOffset: 6
            bitWidth: 2
            access: read-write
          RST1_CDR:
            description: CTLE source resistor trim, second CTLE stage 0x0 0x3
            bitOffset: 4
            bitWidth: 2
            access: read-write
          CST2_CDR:
            description: CTLE shunt capacitor trim for first stage 0x0 0x3
            bitOffset: 2
            bitWidth: 2
            access: read-write
          CST1_CDR:
            description: CTLE shunt capacitor trim for second stage 0x0 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DES_DFEEM_CTRL_1:
        description: Desirializer DFEEM control configuration (Characterization TRIM)
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x15
        fields:
          CMRTRIM_DFEEM:
            description: For DFE/Eye Monitor Trim for common mode restore circuit 0x0 0x1 0x7
            bitOffset: 8
            bitWidth: 3
            access: read-write
          CSENT3_DFEEM:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 4
            bitWidth: 2
            access: read-write
          CSENT2_DFEEM:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 2
            bitWidth: 2
            access: read-write
          CSENT1_DFEEM:
            description: CTLE Current Source Trim 0x0 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DES_DFEEM_CTRL_2:
        description: Desirializer DFEEM control configuration
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          H4:
            description: DFE, eye monitor tap 4
            bitOffset: 24
            bitWidth: 5
            access: read-write
          H3:
            description: DFE, eye monitor tap 3
            bitOffset: 16
            bitWidth: 5
            access: read-write
          H2:
            description: DFE, eye monitor tap 2
            bitOffset: 8
            bitWidth: 5
            access: read-write
          H1:
            description: DFE, eye monitor tap 1
            bitOffset: 0
            bitWidth: 5
            access: read-write
      DES_DFEEM_CTRL_3:
        description: Desirializer DFEEM control configuration
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RST2_DFEEM:
            description: CTLE source resistor trim, first CTLE stage 0x0 0x3
            bitOffset: 14
            bitWidth: 2
            access: read-write
          RST1_DFEEM:
            description: CTLE source resistor trim, first CTLE stage 0x0 0x3
            bitOffset: 12
            bitWidth: 2
            access: read-write
          CST2_DFEEM:
            description: CTLE shunt capacitor trim for first stage 0x0 0x3
            bitOffset: 10
            bitWidth: 2
            access: read-write
          CST1_DFEEM:
            description: CTLE shunt capacitor trim for first stage 0x0 0x3
            bitOffset: 8
            bitWidth: 2
            access: read-write
          H5:
            description: DFE, eye monitor tap 5
            bitOffset: 0
            bitWidth: 5
            access: read-write
      DES_DFE_CTRL_1:
        description: Desirializer DFE control configuration (DFE Algorithm Calibration)
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CALOUT_DFE:
            description: Subsampled DFE output for DC feedback correction Data is sub-sampled with deserializer clock RESETDES must be low during calibration Calibration only valid when RXPLL_LOCK is low RCVEN should be de-asserted during calibration HSLPBKEN should be de-asserted during calibration
            bitOffset: 16
            bitWidth: 2
            access: read-only
          H0DFE1:
            description: DFE tap1 and DC offset calibration for DFE sampler 1
            bitOffset: 8
            bitWidth: 5
            access: read-write
          H0DFE0:
            description: DFE tap1 and DC offset calibration for DFE sampler 0
            bitOffset: 1
            bitWidth: 5
            access: read-write
          DCFBEN_DFE:
            description: Enable DC offset cancellation of the first two CTLE stages (DFE) 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_DFE_CTRL_2:
        description: Desirializer DFE control configuration
        addressOffset: 0x24
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SLIP_DES_DFE_STATUS:
            description: De-serializer DFE Slip bit status
            bitOffset: 27
            bitWidth: 1
            access: read-only
          SLIP_DES_DFE_EN:
            description: De-serializer DFE Slip function enable 0 1
            bitOffset: 26
            bitWidth: 1
            access: read-write
          SLIP_DES_DFE_SEL:
            description: Select de-serializer DFE slip controller 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          SLIP_DES_DFE:
            description: 'Slip de-serializer output alignment by 1 bit A bit slip occurs on every state change of SLIP_DES In 8b, 16b, and 32b de-serialization, bits slip forward (ex: 101,01x,1xx) In 10b, 20b, and 40b de-serialization, bits slip backward (ex: 101,x10,xx1) 0 1'
            bitOffset: 24
            bitWidth: 1
            access: read-write
          PHICTRL_GRAY_DFE:
            description: Gray Coded Phase control for DFE Sets phase of DFE versus the CDR Steps 1/4th UI (2UI total range)
            bitOffset: 16
            bitWidth: 3
            access: read-write
          PHICTRL_TH_DFE:
            description: Thermometer Coded Phase control for DFE Sets phase of DFE versus the CDR Steps 1/32nd UI (1/4th UI total range) to interpolate between gray codes This should be fully stepped before transitioning gray codes to avoid glitching
            bitOffset: 8
            bitWidth: 8
            access: read-write
          CTLEEN_DFE:
            description: CTLE Enable For the DFE Path 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RXDRV_DFE:
            description: RX CLTLE BW control for DFE path 0x0 0x1 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DES_EM_CTRL_1:
        description: Desirializer EM control configuration (EM Algorithm Calibration)
        addressOffset: 0x28
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CALOUT_EM:
            description: Subsampled DFE output for DC feedback correction Data is sub-sampled with deserializer clock RESETDES must be low during calibration Calibration only valid when RXPLL_LOCK is low RCVEN should be de-asserted during calibration HSLPBKEN should be de-asserted during calibration
            bitOffset: 24
            bitWidth: 2
            access: read-only
          CALIBRATION_CLK_EN:
            description: Enable de-serializer DC calibration clock 0 1
            bitOffset: 16
            bitWidth: 1
            access: read-write
          H0EM1:
            description: EM tap1 and DC offset calibration for Eye monitor sampler 1
            bitOffset: 8
            bitWidth: 5
            access: read-write
          H0EM0:
            description: EM tap1 and DC offset calibration for Eye monitor sampler 0
            bitOffset: 1
            bitWidth: 5
            access: read-write
          DCFBEN_EM:
            description: Enable DC offset cancellation of the first two CTLE stages (Eye Monitor) 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_EM_CTRL_2:
        description: Desirializer EM control configuration
        addressOffset: 0x2C
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SLIP_DES_EM_STATUS:
            description: De-serializer Eye Monitor Slip bit status
            bitOffset: 27
            bitWidth: 1
            access: read-only
          SLIP_DES_EM_EN:
            description: De-serializer Eye Monitor Slip function enable 0 1
            bitOffset: 26
            bitWidth: 1
            access: read-write
          SLIP_DES_EM_SEL:
            description: Select de-serializer eye monitor slip controller 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          SLIP_DES_EM:
            description: 'Slip de-serializer output alignment by 1 bit A bit slip occurs on every state change of SLIP_DES In 8b, 16b, and 32b de-serialization, bits slip forward (ex: 101,01x,1xx) In 10b, 20b, and 40b de-serialization, bits slip backward (ex: 101,x10,xx1) 0 1'
            bitOffset: 24
            bitWidth: 1
            access: read-write
          PHICTRL_GRAY_EM:
            description: Gray Coded Phase control for Eye Monitor Sets phase of Eye Monitor versus the CDR Steps 1/4th UI (2UI total range)
            bitOffset: 16
            bitWidth: 3
            access: read-write
          PHICTRL_TH_EM:
            description: Thermometer Coded Phase control for Eye Monitor Sets phase of Eye Monitor versus the CDR Steps 1/32nd UI (1/4th UI total range) to interpolate between gray codes This should be fully stepped before transitioning gray codes to avoid glitching
            bitOffset: 8
            bitWidth: 8
            access: read-write
          CTLEEN_EM:
            description: CTLE Enable For the Eye Monitor Path 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RXDRV_EM:
            description: RX CLTLE BW control for EM path 0x0 0x1 0x3
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DES_IN_TERM:
        description: Desirializer input termination configuration
        addressOffset: 0x30
        size: 32
        access: read-write
        resetValue: 0xA7
        fields:
          ACCOUPLE_RXVCM_EN:
            description: Select AC couple mode (external AC coupling cap) or DC couple mode for receiver 0 1
            bitOffset: 7
            bitWidth: 1
            access: read-write
          RXRTRIM_SEL:
            description: Select RX resistor trim 0x0 0x1 0x2 0x3
            bitOffset: 5
            bitWidth: 2
            access: read-write
          RXTEN:
            description: RX Vtt termination select 0 1
            bitOffset: 4
            bitWidth: 1
            access: read-write
          RXRTRIM:
            description: RX termination trim 4'b1000 is nom RXRTRIM[3:0] Output -------------------- 0000 -> 76 Ohms ... 0111 -> 102 Ohms ... 1111 -> 171 Ohms 0x0 0xF
            bitOffset: 0
            bitWidth: 4
            access: read-write
      DES_PKDET:
        description: Desirializer PKDET
        addressOffset: 0x34
        size: 32
        access: read-write
        resetValue: 0xAC
        fields:
          RXPKDETOUT:
            description: Thermometer Coded Peak Detector Output Gain is set by RXPKDETRANGE 7'b0000000 -> minimum level 7'b0000001 7'b0000011 ... 7'11111111 -> maximum level
            bitOffset: 8
            bitWidth: 7
            access: read-only
          RXPKDET_HIGH_THRESHOLD:
            description: RX Peak Detector HIGH threshold RX_IDLE goes LOW when the bit of the RXPKDETOUT[RXPKDET_HIGH_THRESHOLD] is HIGH. The register value 3'b111 is an invalid setting since the RXPKDETOUT is only 7 bits wide with valid indexes from 6 to 0.
            bitOffset: 5
            bitWidth: 3
            access: read-write
          RXPKDET_LOW_THRESHOLD:
            description: RX Peak Detector LOW threshold RX_IDLE goes HIGH when the bit of the RXPKDETOUT[RXPKDET_LOW_THRESHOLD] is LOW. The register value 3'b111 is an invalid setting since the RXPKDETOUT is only 7 bits wide with valid indexes from 6 to 0.
            bitOffset: 2
            bitWidth: 3
            access: read-write
          RXPKDETRANGE:
            description: Setting RX peak detector range 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RXPKDETEN:
            description: Enable the receiver peak detector 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_RTL_EM:
        description: Desirializer RTL Eyemonitor
        addressOffset: 0x38
        size: 32
        access: read-write
        resetValue: 0xC8
        fields:
          EYEMONITOR_COMPARISON_OUT:
            description: Eye Monitor comparison error count
            bitOffset: 16
            bitWidth: 16
            access: read-only
          EYEMONITOR_COMPARISON_DONE:
            description: Eye Monitor Done Signal
            bitOffset: 13
            bitWidth: 1
            access: read-only
          EYEMONITOR_SAMPLE_COUNT:
            description: Eye Monitor comparison sample count Error rate is EYEMONITOR_COMPARISON_OUT / (10*EYEMONITOR_SAMPLE_COUNT) There are 10 samples taken for every clock period Eye monitor error counter will not restart until ENABLE_EYEMONITOR is de-asserted and re-asserted again.
            bitOffset: 1
            bitWidth: 12
            access: read-write
          RUN_EYEMONITOR_COMPARISON:
            description: Eye Monitor Comparison RTL starts on a 0->1 transition of RUN_EYEMONITOR_COMPARISON Eye monitor will accumulate EYEMONITOR_COMPARISON_SAMPLES and then assert EYEMONITOR_COMPARISON_DONE and present output on EYEMONITOR_SAMPLE_COUNT 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_RTL_LOCK_CTRL:
        description: Desirializer RTL LOCK Control
        addressOffset: 0x3C
        size: 32
        access: read-write
        resetValue: 0x8
        fields:
          LOCK_OVERRIDE_FROMFAB:
            description: Select between LOCK_OVERRIDE and FAB_LOCK_OVERRIDE for RXPLL lock override functionality 0 1
            bitOffset: 24
            bitWidth: 1
            access: read-write
          RXPLL_FLOCK:
            description: RX PLL frequency lock indication for CDR
            bitOffset: 23
            bitWidth: 1
            access: read-only
          RXPLL_LOCK:
            description: RX PLL lock indication input for CDR RX data is valid after lock is asserted
            bitOffset: 22
            bitWidth: 1
            access: read-only
          FDET_VALID:
            description: Frequency output is valid
            bitOffset: 21
            bitWidth: 1
            access: read-only
          FDET_CURRENT_SAMPLE:
            description: Frequency detector current sample
            bitOffset: 16
            bitWidth: 5
            access: read-only
          FDET_COUNT:
            description: Frequency detector count Frequency detector 'error' may be calculated FDET_COUNT / (256*FDET_CURRENT_SAMPLE)
            bitOffset: 8
            bitWidth: 8
            access: read-only
          FDET_SAMPLE_PERIODS:
            description: Frequency detector Number of periods to sample Resolution increases with number of periods
            bitOffset: 3
            bitWidth: 5
            access: read-write
          LOCK_OVERRIDE:
            description: Override control for lock signal Lock detector will need to re-acquire lock from 2'b10 state 0x0 0x1 0x2 0x3
            bitOffset: 1
            bitWidth: 2
            access: read-write
          LOCK_MODE:
            description: Set Number of Loss-Of-Lock events for LOCK to go low 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_RXPLL_DIV:
        description: Desirializer RXPLL Dividers
        addressOffset: 0x40
        size: 32
        access: read-write
        resetValue: 0x2219
        fields:
          CDR_GAIN:
            description: Set CDR Gain 0 1
            bitOffset: 15
            bitWidth: 1
            access: read-write
          RXPLL_RANGE:
            description: RX PLL Range Bit for CDR 0x0 0x1 0x2 0x3
            bitOffset: 13
            bitWidth: 2
            access: read-write
          RXPLL_REFDIV:
            description: RX PLL reference reference divide 5'b00000 -> /1 5'b00001 -> /1 5'b00010 -> /2 5'b00011 -> /3 .... 5'b11111 -> /31 For PLL programming, see RXPLL_FBDIV notes
            bitOffset: 8
            bitWidth: 5
            access: read-write
          RXPLL_FBDIV:
            description: 'RX PLL reference feedback divide (min 16) The VCO frequency is given by (f_ref * RXPLL_FBDIV / RXPLL_REFDIV), where f_ref is the reference frequency The bit rate is given by (2 * f_ref * RXPLL_FBDIV / RXPLL_REFDIV) The VCO frequency should be programmed to half the bit rate Example : for 10Gb/s, the VCO should be programmed to 5GHz'
            bitOffset: 0
            bitWidth: 8
            access: read-write
      DES_TEST_BUS:
        description: Desirializer Test Bus
        addressOffset: 0x44
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RXDTESTOUT:
            description: Digital test bus output
            bitOffset: 24
            bitWidth: 1
            access: read-only
          RXDTESTSEL:
            description: Digital test bus select for RX channel RXDTESTSEL[2:0] Output 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 17
            bitWidth: 3
            access: read-write
          RXDTESTEN:
            description: Digital test bus enable for RX channel 0 1
            bitOffset: 16
            bitWidth: 1
            access: read-write
          RXATESTSEL:
            description: Analog test bus select for RX channel RXATESTSEL[2:0] Output (Hide from Customers) 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 8
            bitWidth: 3
            access: read-write
          RXATESTEN:
            description: Analog test bus enable for RX channel See TXPLL_CLKBUF_EN_APAD for programming of this signal (Hide from Customers) 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_CLK_CTRL:
        description: Desirializer Clock Control
        addressOffset: 0x48
        size: 32
        access: read-write
        resetValue: 0x3C
        fields:
          RXBYPASSEN:
            description: Enable RXP/RXN to RXSEOUT path 0 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          DATALOCKDIVEN:
            description: Enable divide-by-32 path from Rx data to CDR reference clock when in "DATALOCKEN" mode. 0 1
            bitOffset: 7
            bitWidth: 1
            access: read-write
          DATALOCKEN:
            description: Enables the mode where the Reference Clock is embedded within the Rx data stream during training 0 1
            bitOffset: 6
            bitWidth: 1
            access: read-write
          DESMODE:
            description: De-Serializer Mode Control 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 3
            bitWidth: 3
            access: read-write
          RXREFCLK_SEL:
            description: RX PLL Reference Clock Select 0x0 0x1 0x2 0x3 0x4 0x5 0x6 0x7
            bitOffset: 0
            bitWidth: 3
            access: read-write
      DES_RSTPD:
        description: Deserializer RESET & PD
        addressOffset: 0x4C
        size: 32
        access: read-write
        resetValue: 0x2F
        fields:
          RESET_FIFO:
            description: Reset FIFO 0 1
            bitOffset: 5
            bitWidth: 1
            access: read-write
          RCVEN:
            description: Receiver Enable 0 1
            bitOffset: 4
            bitWidth: 1
            access: read-write
          PDEM:
            description: Powerdown control for the Eye Monitor 0 1
            bitOffset: 3
            bitWidth: 1
            access: read-write
          PDDFE:
            description: Powerdown control for the DFE 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          RESETDES:
            description: Reset all deserializers for the channel. Acti ve High. 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RXPD:
            description: Receiver Power down / reset PD should be asserted for programming 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_RTL_ERR_CHK:
        description: Deserializer RTL Error Check
        addressOffset: 0x50
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PRBSERR_COUNT:
            description: PRBS error count
            bitOffset: 8
            bitWidth: 8
            access: read-only
          PRBSMON_RXPLL_LOCK:
            description: RX PLL lock indication input for CDR RX data is valid after lock is asserted
            bitOffset: 4
            bitWidth: 1
            access: read-only
          ERROROUT:
            description: PRBS raw error information
            bitOffset: 1
            bitWidth: 1
            access: read-only
          READ_ERROR:
            description: Read PRBS errors 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DES_PCIE1_2_RXPLL_DIV:
        description: Deserializer RXPLL Dividers for PCIE 1 & 2 mode
        addressOffset: 0x54
        size: 32
        access: read-write
        resetValue: 0x2322219
        fields:
          PCIE2_RXPLL_RANGE:
            description: For PCIE Gen2 (5.0 GT/s) Range Bit for CDR 0x0 0x1 0x2 0x3
            bitOffset: 29
            bitWidth: 2
            access: read-write
          PCIE2_RXPLL_REFDIV:
            description: For PCIE Gen2 (5.0 GT/s) RX PLL reference reference divide 5'b00000 -> /1 5'b00001 -> /1 5'b00010 -> /2 5'b00011 -> /3 .... 5'b11111 -> /31 For PLL programming, see RXPLL_FBDIV notes
            bitOffset: 24
            bitWidth: 5
            access: read-write
          PCIE2_RXPLL_FBDIV:
