_add:
  PCIESS_MAIN:
    description: PCIESS_MAIN Controller
    baseAddress: 0x32050000
    registers:
      SOFT_RESET:
        description: Compulsory register for all SCB slaves, facilitating global soft reset.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. The form of BLOCKID = {4'h0, SLVTYPE, CHIPID, SUBID}. SLVTYPE=4'h2 for PCIESS MAIN. CHIPID=4'h0 for PCIESS. SUBID=4'h4 for the MAIN page. Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts functional reset of the peripheral block. It is asserted and left asserted at power-up. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: Resets all the volatile register bits. Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: Resets all the non-volatile register bits (e.g. RW-P bits). Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      OVRLY:
        description: Controls Identity of Fabric Pin Functions
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x101
        fields:
          AXI1_IFC_MODE:
            description: Sets overlaid AXI1 pins to a gated-off state, assume their AXI functions, or assume their PCS lane 2 and 3 functions. 0x0 0x1 0x2
            bitOffset: 8
            bitWidth: 2
            access: read-write
          AXI0_IFC_MODE:
            description: Sets overlaid AXI0 pins to a gated-off state, assume their AXI functions, or assume their PCS lane 0 and 1 functions. 0x0 0x1 0x2
            bitOffset: 0
            bitWidth: 2
            access: read-write
      MAJOR:
        description: Controls how PCIe Controllers bind to PCS/PMA lanes.
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0xB
        fields:
          PCIE_USAGE_MODE:
            description: Determines the major mode of operation for the PCIESS block. 0x2 0x3 0x4 0x6 0x8 0xA 0xB 0xE 0xF
            bitOffset: 0
            bitWidth: 4
            access: read-write
      INT_PIPE_CLK_CTRL:
        description: Controls quad-level clocking.
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PCLK_INT_LN3_SEL:
            description: Selects source of internal lane 3 PIPE input clock. 0 1
            bitOffset: 25
            bitWidth: 1
            access: read-write
          PCLK_INT_LN2_SEL:
            description: Selects source of internal lane 2 PIPE input clock. 0 1
            bitOffset: 24
            bitWidth: 1
            access: read-write
          PCLK_INT_LN1_SEL:
            description: Selects source of internal lane 1 PIPE input clock. 0x0 0x1 0x2
            bitOffset: 18
            bitWidth: 2
            access: read-write
          PCLK_INT_LN0_SEL:
            description: Selects source of internal lane 0 PIPE input clock. 0x0 0x1 0x2
            bitOffset: 16
            bitWidth: 2
            access: read-write
          PCIE_1_PCLK_SEL:
            description: Selects source of PCIe Controller 1's PIPE clock. 0x0 0x1 0x2 0x3 0x4
            bitOffset: 8
            bitWidth: 3
            access: read-write
          PCIE_0_PCLK_SEL:
            description: Selects source of PCIe Controller 0's PIPE clock. 0x0 0x1 0x2 0x3 0x4 0x5 0x6
            bitOffset: 0
            bitWidth: 3
            access: read-write
      EXT_PIPE_CLK_CTRL:
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PCLK_EXT_LN3_SEL:
            description: Selects source of external lane 3 PIPE input clock. 0 1
            bitOffset: 3
            bitWidth: 1
            access: read-write
          PCLK_EXT_LN2_SEL:
            description: Selects source of external lane 2 PIPE input clock. 0 1
            bitOffset: 2
            bitWidth: 1
            access: read-write
          PCLK_EXT_LN1_SEL:
            description: Selects source of external lane 1 PIPE input clock. 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          PCLK_EXT_LN0_SEL:
            description: Selects source of external lane 0 PIPE input clock. 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      CLK_CTRL:
        description: Controls AXI clocking.
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          AXI1_CLKENA:
            description: AXI1 clock enable. 0 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          AXI0_CLKENA:
            description: AXI0 clock enable. 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      QMUX_R0:
        description: Output Mux Settings
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x70031
        fields:
          PCIE_DBG_SEL:
            description: Selects fab_pcie_debug fabric debug output bus from the two PCIe controller 32-bit debug output port bits. 0x0 0x1 0x2 0x3 0x4 0x5 0x7
            bitOffset: 16
            bitWidth: 3
            access: read-write
          QRST3_SRC:
            description: Selects source of h2f_quad_reset_1_b 0x0 0x1 0x2 0x3 0x4 0x5 0x6
            bitOffset: 12
            bitWidth: 3
            access: read-write
          QRST2_SRC:
            description: Selects source of h2f_quad_reset_0_b 0x0 0x1 0x2 0x3 0x4 0x5 0x6
            bitOffset: 8
            bitWidth: 3
            access: read-write
          QRST1_SRC:
            description: Selects source of h2f_quad_reset_1_b 0x0 0x1 0x2 0x3 0x4 0x5 0x6
            bitOffset: 4
            bitWidth: 3
            access: read-write
          QRST0_SRC:
            description: Selects source of h2f_quad_reset_0_b 0x0 0x1 0x2 0x3 0x4 0x5 0x6
            bitOffset: 0
            bitWidth: 3
            access: read-write
      DLL_CTRL0:
        description: DLL control register 0
        addressOffset: 0x100
        size: 32
        access: read-write
        resetValue: 0x8800000F
        fields:
          LOCK_LOW:
            description: accumulating 3~15 cycles of phase detector lock low, 00xx=3 cycles
            bitOffset: 28
            bitWidth: 4
            access: read-write
          LOCK_HIGH:
            description: accumulating 3~15 cycles of phase detector lock high, 00xx=3 cycles
            bitOffset: 24
            bitWidth: 4
            access: read-write
          LOCK_FLT:
            description: 'Phase lock tolerance: 00 (Default) +/- 50~130ps, 01 +/- 110~270ps, 10 +/- 200~470ps, 11 +/- 280~680ps'
            bitOffset: 20
            bitWidth: 2
            access: read-write
          LOCK_FRC:
            description: force lock high for debugging purpose
            bitOffset: 19
            bitWidth: 1
            access: read-write
          ALU_UPD:
            description: 00=ALU update after 16 accumulated cycles of add or subtract; 01=8 cycles; 10=32 cycles; 11=4 cycles
            bitOffset: 14
            bitWidth: 2
            access: read-write
          DIV_SEL:
            description: 'divided feedback clock select in clock injection removal mode: 0=M4/M5 selects 0/1; 1=M4/M5 selects 2/3'
            bitOffset: 10
            bitWidth: 1
            access: read-write
          FB_SEL:
            description: 'feedback clock selection: 0=direct feedback or through dummy delay to match divider on reference; 1=2*pi shift for clock phase reference mode or feedback through dummy delay inversion'
            bitOffset: 9
            bitWidth: 1
            access: read-write
          REF_SEL:
            description: 'reference clock selection: 0=/1 or /2 0 shift; 1=pi shift for delay match mode or /4 0 shift'
            bitOffset: 8
            bitWidth: 1
            access: read-write
          SEL_S:
            description: 'secondary clock output selection: 00=normal; 01=/2; 10=/4; 11=duty 50 when ref_sel=0 and fb_sel=1 for clock phase reference mode (reg_div_sel=0)'
            bitOffset: 6
            bitWidth: 2
            access: read-write
          SEL_P:
            description: 'primary clock output selection: 00=normal; 01=normal through dummy delay to match divider on clko_s; 10=duty 50 when ref_sel=0 and fb_sel=1 for clock phase reference mode (reg_div_sel=0); 11=duty 50 inversion'
            bitOffset: 4
            bitWidth: 2
            access: read-write
          PHASE_S:
            description: 'secondary clock phase selection: 00=pi/2 shift; 01=pi shift; 10=3*pi/2 shift; 11=2*pi shift'
            bitOffset: 2
            bitWidth: 2
            access: read-write
          PHASE_P:
            description: 'primary clock phase selection: 00=0 shift; 01=pi/2 shift; 10=pi shift; 11=2*pi shift'
            bitOffset: 0
            bitWidth: 2
            access: read-write
      DLL_CTRL1:
        description: DLL control register 1
        addressOffset: 0x104
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RELOCK_FAST:
            description: At unlock, keep locking without counting down to 0 first in clock injection removal mode
            bitOffset: 30
            bitWidth: 1
            access: read-write
          INIT_CODE:
            description: force ALU to count to the minimum initial delay in each delay cell from 0 (00000) to 63 (11111) taps
            bitOffset: 24
            bitWidth: 6
            access: read-write
          TEST_RING:
            description: enable ring oscillator test mode
            bitOffset: 23
            bitWidth: 1
            access: read-write
          TEST_S:
            description: select clko_s to drive ring oscillator in test mode
            bitOffset: 15
            bitWidth: 1
            access: read-write
          ADJ_DEL4:
            description: adjust fine phase shift in DEL4, when MSB=1, subtract reg_adj_del4[5:0]; otherwise add reg_adj_del4[5:0]
            bitOffset: 8
            bitWidth: 7
            access: read-write
          SET_ALU:
            description: when reg_set_alu[7]=1, manual set ALU to reg_set_alu[6:0]
            bitOffset: 0
            bitWidth: 8
            access: read-write
      DLL_STAT0:
        description: DLL status register 0
        addressOffset: 0x108
        size: 32
        access: read-write
        resetValue: 0x1801
        fields:
          PHASE_MOVE_CLK:
            description: fine phase shifting on clko_s when going high, has to go low before the next shifting
            bitOffset: 12
            bitWidth: 1
            access: read-write
          UNLOCK_INT:
            description: unlock interrupt
            bitOffset: 11
            bitWidth: 1
            access: read-write
          LOCK_INT:
            description: lock interrupt
            bitOffset: 10
            bitWidth: 1
            access: read-write
          UNLOCK_INT_EN:
            description: enable unlock interrupt
            bitOffset: 9
            bitWidth: 1
            access: read-write
          LOCK_INT_EN:
            description: enable lock interrupt
            bitOffset: 8
            bitWidth: 1
            access: read-write
          RESET:
            description: active high reset of DLL
            bitOffset: 0
            bitWidth: 1
            access: read-write
      DLL_STAT1:
        description: DLL status register 1
        addressOffset: 0x10C
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          SRO_ALU_CNT:
            description: ALU counter value, upper 7-bits are DEL0 setting
            bitOffset: 16
            bitWidth: 9
            access: read-only
          SRO_DEL4:
            description: same as delay_code output
            bitOffset: 0
            bitWidth: 7
            access: read-only
      DLL_STAT2:
        description: DLL status register 2
        addressOffset: 0x110
        size: 32
        access: read-only
        resetValue: 0x0
        fields:
          SRO_LOCK:
            description: same as lock output
            bitOffset: 2
            bitWidth: 1
            access: read-only
      TEST_DLL:
        description: MSCC Silicon Test for DLL
        addressOffset: 0x118
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          REF_ENABLE:
            description: During silicon testing the reference clock is suppressible such that the delay chain may be fully initialized to full-rail voltages. 0 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          RING_OSC_ENABLE:
            description: For silicon testing of the clock-injection cancellation DLL used for fab_axi4_clk. This is a non-functional test mode. 0 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      SPARE:
        description: Spare reg for scratch-pad and repair purposes.
        addressOffset: 0x190
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SPARE_CTRL:
            description: Spare control for future use.
            bitOffset: 8
            bitWidth: 24
            access: read-write
          SCRATCHPAD:
            description: Scratch-pad within PCIESS address space.
            bitOffset: 0
            bitWidth: 8
            access: read-write
