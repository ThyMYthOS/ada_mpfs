        access: read-only
        resetValue: 0x0
        fields:
          DATA:
            description: ''
            bitOffset: 0
            bitWidth: 24
            access: read-only
      TEST_CTRL:
        description: Test MUX Controls
        addressOffset: 0x20
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DTEST_SEL:
            description: ''
