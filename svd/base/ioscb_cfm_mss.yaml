_add:
  IOSCB_CFM_MSS:
    description: IOSCB_CFM_MSS Controller
    baseAddress: 0x3E002000
    registers:
      SOFT_RESET:
        description: This is a compulsory register for all SCB slaves and must be at the same offset in all slaves to facilitate global soft reset of all SCB registers with a single broadcast write from the SCB master.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. (IO SCB bus only) Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts the functional reset of the block. It is asserted at power up. When written is stays asserted until written to 0. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: This when asserted resets all the register bits apart from the non-volatile registers, the bit self clears. i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: This when asserted resets all the non-volatile register bits e.g. RW-P bits, the bit self clears i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      BCLKMUX:
        description: BCLK mux selections
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BCLK5_SEL:
            description: ''
            bitOffset: 25
            bitWidth: 5
            access: read-write
          BCLK4_SEL:
            description: ''
            bitOffset: 20
            bitWidth: 5
            access: read-write
          BCLK3_SEL:
            description: ''
            bitOffset: 15
            bitWidth: 5
            access: read-write
          BCLK2_SEL:
            description: ''
            bitOffset: 10
            bitWidth: 5
            access: read-write
          BCLK1_SEL:
            description: ''
            bitOffset: 5
            bitWidth: 5
            access: read-write
          BCLK0_SEL:
            description: ''
            bitOffset: 0
            bitWidth: 5
            access: read-write
      PLL_CKMUX:
        description: PLL RF clk mux selections
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PLL1_FDR_SEL:
            description: ''
            bitOffset: 10
            bitWidth: 5
            access: read-write
          PLL1_RFCLK1_SEL:
            description: ''
            bitOffset: 8
            bitWidth: 2
            access: read-write
          PLL1_RFCLK0_SEL:
            description: ''
            bitOffset: 6
            bitWidth: 2
            access: read-write
          PLL0_RFCLK1_SEL:
            description: ''
            bitOffset: 4
            bitWidth: 2
            access: read-write
          PLL0_RFCLK0_SEL:
            description: ''
            bitOffset: 2
            bitWidth: 2
            access: read-write
          CLK_IN_MAC_TSU_SEL:
            description: ''
            bitOffset: 0
            bitWidth: 2
            access: read-write
      MSSCLKMUX:
        description: MSS Clock mux selections
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          CLK_STANDBY_SEL:
            description: ''
            bitOffset: 4
            bitWidth: 1
            access: read-write
          MSSCLK_MUX_MD:
            description: ''
            bitOffset: 2
            bitWidth: 2
            access: read-write
          MSSCLK_MUX_SEL:
            description: ''
            bitOffset: 0
            bitWidth: 2
            access: read-write
      SPARE0:
        description: spare logic
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SPARE0:
            description: ''
            bitOffset: 0
            bitWidth: 32
            access: read-write
      FMETER_ADDR:
        description: Frequency_meter_address_selections
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          ADDR:
            description: ''
            bitOffset: 2
            bitWidth: 4
            access: read-write
      FMETER_DATAW:
        description: Frequency_meter_data_write
        addressOffset: 0x18
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          STROBE:
            description: ''
            bitOffset: 24
