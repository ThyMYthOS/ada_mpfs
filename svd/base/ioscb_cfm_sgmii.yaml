_add:
  IOSCB_CFM_SGMII:
    description: IOSCB_CFM_SGMII Controller
    baseAddress: 0x3E200000
    registers:
      SOFT_RESET:
        description: This is a compulsory register for all SCB slaves and must be at the same offset in all slaves to facilitate global soft reset of all SCB registers with a single broadcast write from the SCB master.
        addressOffset: 0x0
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          BLOCKID:
            description: This returns the block type and chip location. (IO SCB bus only) Read 0x0000
            bitOffset: 16
            bitWidth: 16
            access: read-only
          PERIPH:
            description: This asserts the functional reset of the block. It is asserted at power up. When written is stays asserted until written to 0. Write 0 Write 1
            bitOffset: 8
            bitWidth: 1
            access: read-write
          V_MAP:
            description: This when asserted resets all the register bits apart from the non-volatile registers, the bit self clears. i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 1
            bitWidth: 1
            access: read-write
          NV_MAP:
            description: This when asserted resets all the non-volatile register bits e.g. RW-P bits, the bit self clears i.e. is similar to a W1P bit Write 0 Write 1
            bitOffset: 0
            bitWidth: 1
            access: read-write
      RFCKMUX:
        description: PLL RF clk mux selections
        addressOffset: 0x4
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          PLL0_RFCLK1_SEL:
            description: ''
            bitOffset: 2
            bitWidth: 2
            access: read-write
          PLL0_RFCLK0_SEL:
            description: ''
            bitOffset: 0
            bitWidth: 2
            access: read-write
      SGMII_CLKMUX:
        description: MSS Clock mux selections
        addressOffset: 0x8
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SGMII_CLKMUX:
            description: ''
            bitOffset: 0
            bitWidth: 32
            access: read-write
      SPARE0:
        description: spare logic
        addressOffset: 0xC
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          SPARE0:
            description: ''
            bitOffset: 0
            bitWidth: 32
            access: read-write
      CLK_XCVR:
        description: Clock Receiver
        addressOffset: 0x10
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          RESERVE3:
            description: ''
            bitOffset: 14
            bitWidth: 18
            access: read-only
          EN_RDIFF:
            description: ''
            bitOffset: 13
            bitWidth: 1
            access: read-write
          CLKBUF_EN_PULLUP:
            description: ''
            bitOffset: 12
            bitWidth: 1
            access: read-write
          EN_RXMODE_N:
            description: ''
            bitOffset: 10
            bitWidth: 2
            access: read-write
          EN_TERM_N:
            description: ''
            bitOffset: 8
            bitWidth: 2
            access: read-write
          EN_INS_HYST_N:
            description: ''
            bitOffset: 7
            bitWidth: 1
            access: read-write
          EN_UDRIVE_N:
            description: ''
            bitOffset: 6
            bitWidth: 1
            access: read-write
          EN_RXMODE_P:
            description: ''
            bitOffset: 4
            bitWidth: 2
            access: read-write
          EN_TERM_P:
            description: ''
            bitOffset: 2
            bitWidth: 2
            access: read-write
          EN_INS_HYST_P:
            description: ''
            bitOffset: 1
            bitWidth: 1
            access: read-write
          EN_UDRIVE_P:
            description: ''
            bitOffset: 0
            bitWidth: 1
            access: read-write
      TEST_CTRL:
        description: Test MUX Controls
        addressOffset: 0x14
        size: 32
        access: read-write
        resetValue: 0x0
        fields:
          DTEST1_SEL:
            description: ''
            bitOffset: 13
            bitWidth: 5
            access: read-write
          DTEST1_EN:
            description: ''
            bitOffset: 12
            bitWidth: 1
            access: read-write
          DTEST0_SEL:
            description: ''
            bitOffset: 7
            bitWidth: 5
            access: read-write
          DTEST0_EN:
            description: ''
            bitOffset: 6
            bitWidth: 1
            access: read-write
          RESERVE4:
            description: ''
            bitOffset: 0
            bitWidth: 6
            access: read-only
