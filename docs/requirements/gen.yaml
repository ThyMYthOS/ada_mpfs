# Requirements on the configuration generator (config/gen). See README.md for the format.
requirements:
  - id: GEN-001
    text: >-
      A system description (system.yaml) is accepted only if it is well-formed YAML without a key
      given twice, has schema version 1, conforms to config/gen/schema/system.schema.json, in which
      every object refuses a field it does not name, and keeps the rules across fields of
      config/README.md; every violated rule is reported with its own error code GEN-Exxx and the
      path of the field, and the table of the codes in config/README.md is the one of the reader.
    tsf: false
    source: config/README.md
  - id: GEN-002
    text: >-
      For each of the 30 runtime variants the standalone preset is a system description that the
      reader accepts, and config/gen/standalone.py with the parameters that the preset stands for
      writes the same package MPFS_Partition and list of link symbols as with the parameters that
      ./x build passes for that variant without options.
    tsf: false
    source: config/README.md
  - id: GEN-003
    text: >-
      An MSS Configurator XML is accepted only if it can be read, has no document type or entity
      declaration, is well-formed with the root element mss, has an xml_format_version of 0.6.5 or
      0.6.8, has every core section and every register of them that the generator needs, has no
      register, memory element or field twice, has numbers of the form of their section, fields
      inside their register and apart, and values that fit the width of their field as the XML
      declares it and, where the SVD has the field, as the SVD declares it at the same bit position;
      the sections that are only validated (DDR, the SGMII and DDR PLLs, the high-speed IO) are
      checked by the same rules. Every violated rule is reported with its own error code GEN-Exxx
      and the path of the register or field.
    tsf: false
    source: config/README.md
  - id: GEN-004
    text: >-
      The reader of the MSS Configurator XML returns the registers of the core sections, found by
      section and name, each with the value that Microchip's generator gives it (the RW fields at
      their offsets), the layout of its fields from the XML and from the SVD, and the SHA-256 of the
      file; a register with a known defect of the configurator (0x8 in the 3-bit REG_OUT3_PHSINIT
      of PLL_PHADJ of the MSS PLL) keeps the value of Microchip's generator (0x4003) and names the
      defect. Every reference
      XML in config/boards is read.
    tsf: false
    source: config/README.md
  - id: GEN-005
    text: >-
      For every reference XML in config/boards, every LIBERO_SETTING_* value that Microchip's
      configuration generator (mpfs_configuration_generator.py of polarfire-soc/platform at the
      commit pinned in tools/mchp_diff/oracle.env, whose script has the SHA-256 recorded there)
      writes for a register, a memory element or the design information that the reader of the
      MSS Configurator XML decodes equals the value of the reader; every define of the generator is
      either compared, of a section that the reader only validates, or one of the generator's own
      version constants, and every register and memory element of the reader has a define. A
      difference is admitted only by an entry of tools/mchp_diff/exceptions.yaml that names the
      define, the XML, whose defect it is (ours or Microchip's) and the reason; an entry that admits
      nothing is refused.
    tsf: false
    source: tools/mchp_diff/README.md
  - id: GEN-006
    text: >-
      The clocks of mss_clocks/clocks of an MSS Configurator XML are recomputed from the registers of
      the MSS PLL (reference, RFDIV, INTIN, FRACIN with FRACN_EN, POST0DIV, MSSCLKMUX) and the
      dividers of CLOCK_CONFIG_CR and differ from them by at most 1 ppm; the CPU clock is at most 625
      MHz and not below the AXI clock, the AXI clock at most 312.5 MHz, the AHB/APB clock at most
      156.25 MHz, not divided by 1 and above 66 MHz when USB is configured; the reference clock divided
      by the RTC toggle clock is a whole number from 1 to 4095 that RTC_CLOCK_CR.PERIOD holds, and the
      RTC toggle clock is the Clock_Frequency of the runtime. Every violated rule is reported with its
      own error code GEN-Exxx.
    tsf: false
    source: config/README.md
  - id: GEN-007
    text: >-
      The L2 of a system is the split of the XML (cache ways 0 to WAY_ENABLE - NUM_SCRATCH_PAD_WAYS,
      the scratchpad the upper NUM_SCRATCH_PAD_WAYS of the enabled ways, LIM the ways above
      WAY_ENABLE), or the override l2.ways of system.yaml laid out the same way; the XML has at least
      one cache way and at most 16 ways, no way mask of the XML includes a scratchpad way, and the ways
      of l2.cache_partitioning are cache ways. Every violated rule is reported with its own error code.
    tsf: false
    source: config/README.md
  - id: GEN-008
    text: >-
      The windows of the partitions and channels of a system are placed deterministically into the
      memories of its L2, the eNVM and the ITIMs (one window for code and data per partition and
      memory, channels between the partitions they connect where the channels form chains, otherwise
      in one shared block, first-fit-decreasing, NAPOT-aligned where the size allows it); a window size
      that is not a multiple of 4 and windows that do not fit their memory are refused, and the system
      map is refused if a window reaches outside its memory, windows of two different partitions overlap
      (the message names both) or a window lies in the ITIM or DTIM of a hart that its partition does
      not have. Every violated rule is reported with its own error code.
    tsf: false
    source: config/README.md
  - id: GEN-009
    text: >-
      For each partition the derived system has CPU_To_Hart (the k-th set bit of the mask), its PLIC
      sources with the numbers of the SVD and the M-mode contexts of its harts, its local interrupts,
      and the masks of SUBBLK_CLOCK_CR and SOFT_RESET_CR of its peripherals and console from the bit
      positions of the SVD; the system has RAM_SHUTDOWN_CR for the blocks that CONFIGURED_PERIPHERALS
      and DDRPHY_MODE of the XML leave unused and the GPIO line of each direct GPIO interrupt after
      GPIO_INTERRUPT_FAB_CR. An interrupt that is no PLIC source, a local interrupt that a hart of the
      partition lacks, a PLIC source of two partitions, an unknown peripheral and a peripheral that the
      XML does not configure are refused, each with its own error code.
    tsf: false
    source: config/README.md
