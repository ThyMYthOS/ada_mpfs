#
# Register package: regenerate libs/mpfs_pac/src/generated from the SVD with the
# svd2ada built at the pinned commit, fail on any difference, and compile the
# package for the E51 and the U54 ABI with the pinned riscv64 GNAT.
name: pac

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/pac.yml"
      - "svd/**"
      - "libs/mpfs_pac/**"
      - "tools/**"
      - "tests/host/**"
      - "x"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pac.yml"
      - "svd/**"
      - "libs/mpfs_pac/**"
      - "tools/**"
      - "tests/host/**"
      - "x"

# One run per branch: a newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pac:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      # Alire toolchains (gnat_native, gnat_riscv64_elf, gprbuild) and the per-version
      # tool prefixes (alr, svdtools, svd2ada, ...): every version is pinned in
      # tools/toolchain.env, so the cache key follows that file.
      - name: Cache the toolchains and the svd2ada build
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.local/share/alire
            ~/.local/share/ada_mpfs/tools
            ~/.config/alire
          key: pac-${{ runner.os }}-${{ hashFiles('tools/toolchain.env') }}

      # Only what `./x pac check` needs (no gnatprove, no adalang_analyzer). Idempotent:
      # what the cache restored is detected and not installed again.
      - name: Install the toolchains
        run: ./x toolchain install pac

      - name: Host tests of the register package tooling
        run: tests/host/pac/run.sh

      - name: Check the register package
        run: ./x pac check
