# SPDX-License-Identifier: Apache-2.0
#
# The registers: job `svd` rebuilds the merged SVD, verifies its recorded hash and runs the host
# tests of the SVD tooling and of ./x (no Ada toolchain). Job `pac` takes that merged SVD from
# the `svd` job, regenerates libs/mpfs_pac/src/generated with the svd2ada built at the pinned
# commit, fails if its hash is not the recorded one (the package is not committed) and compiles the package for the E51 and the U54 ABI.
name: registers

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/registers.yml"
      - ".github/actions/**"
      - "svd/**"
      - "hw/svd_probe.py"
      - "hw/mss_init.py"
      - "crates/mpfs_rts/gen_intnam.py"
      - "crates/mpfs_rts/mpfs/gnarl/a-intnam.ads"
      - "crates/bb-runtimes/src/s-bbpara__polarfiresoc.ads"
      - "libs/mpfs_pac/**"
      - "config/gen/**"
      - "config/boards/**"
      - "systems/**"
      - "tools/**"
      - "tests/host/**"
      - "x"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/registers.yml"
      - ".github/actions/**"
      - "svd/**"
      - "hw/svd_probe.py"
      - "hw/mss_init.py"
      - "crates/mpfs_rts/gen_intnam.py"
      - "crates/mpfs_rts/mpfs/gnarl/a-intnam.ads"
      - "crates/bb-runtimes/src/s-bbpara__polarfiresoc.ads"
      - "libs/mpfs_pac/**"
      - "config/gen/**"
      - "config/boards/**"
      - "systems/**"
      - "tools/**"
      - "tests/host/**"
      - "x"

# One run per branch: a newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  svd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python packages and xmllint
        run: |
          python3 -m pip install -r tools/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - uses: ./.github/actions/toolchain
        with:
          target: svdtools
          compilers: "false"

      - name: Check the SVD
        run: ./x svd check

      - name: Host tests of the SVD tooling
        run: tests/host/svd/run.sh

      - name: Host tests of x
        run: tests/host/x/run.sh

      # The interrupt names of the runtime are generated from the SVD and committed: the file must
      # be what the generator makes of the SVD that was just merged.
      - name: Interrupt names are current
        run: python3 crates/mpfs_rts/gen_intnam.py --check

      - name: Host tests of the interrupt names
        run: tests/host/rts_intnam/run.sh

      - name: Host tests of the generator library
        run: tests/host/gen_ada/run.sh

      # The schema of system.yaml and its reader: the reference systems, the broken descriptions and
      # the standalone presets (PyYAML and jsonschema, no toolchain).
      - name: Host tests of the system description
        run: tests/host/system_yaml/run.sh

      # The reader of the MSS Configurator XML: the reference XMLs of config/boards and the broken
      # ones, checked against the SVD that was just merged.
      - name: Host tests of the reader of the MSS Configurator XML
        run: tests/host/xml_reader/run.sh

      # The derivations from the reference systems and the reference XMLs: the clocks recomputed from the
      # MSS PLL, the L2, the placement of the windows, the PLIC and the peripheral bits, and a negative case
      # for every code of the derivations.
      - name: Host tests of the derivations of the configuration generator
        run: tests/host/derive/run.sh

      # The PMP of the MSS Configurator XMLs: decoding, the reserved encodings, and the table of the
      # test program examples/pmp_xml_test, which must be what the generator makes of the XML.
      - name: Host tests of the PMP table of the configuration generator
        run: tests/host/pmp/run.sh

      # The same reader against Microchip's configuration generator: the suite fetches the generator
      # at the commit of tools/mchp_diff/oracle.env (one commit, one directory, from github.com) and
      # compares every LIBERO_SETTING_* value of the reference XMLs. A new format version of the XML
      # needs this step green.
      - name: Differential test against Microchip's configuration generator
        run: tests/host/mchp_diff/run.sh

      # The merged SVD, whose hash `./x svd check` has just verified: the pac job takes it
      # instead of merging again (svd.py ensure accepts a file with the recorded hash).
      - name: Keep the merged SVD
        uses: actions/upload-artifact@v7.0.2
        with:
          name: svd
          path: build/svd/PolarfireSoC.svd
          retention-days: 14

  pac:
    needs: svd
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Take the merged SVD
        uses: actions/download-artifact@v8.0.2
        with:
          name: svd
          path: build/svd

      # Only what `./x pac check` needs (no gnatprove, no adalang_analyzer).
      - uses: ./.github/actions/toolchain
        with:
          target: pac

      # The package is not committed. `./x pac check` regenerates it, compares its hash with the recorded one and
      # compiles it; when it passes, this step saves the package for the other workflows (./.github/actions/pac).
      - name: Cache the register package
        uses: actions/cache@v6.1.0
        with:
          path: libs/mpfs_pac/src/generated
          key: pac-${{ hashFiles('libs/mpfs_pac/MPFS_Registers.sha256') }}

      - name: Check the register package
        run: ./x pac check

      - name: Host tests of the register package tooling
        run: tests/host/pac/run.sh
