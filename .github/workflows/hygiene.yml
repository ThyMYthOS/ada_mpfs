#
# Repository hygiene, no toolchain needed: licences and SPDX headers, and the requirement
# trace (every reference resolves, every TSF requirement has a test, the matrix is current).
# The logic lives in tools/headers.py, tools/trace.py and ./x.
name: hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One run per branch: a newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install reuse
        run: python3 -m pip install reuse==6.2.0

      - name: reuse lint
        run: reuse lint

      - name: SPDX headers and provenance
        run: python3 tools/headers.py check

  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python packages
        run: python3 -m pip install -r tools/requirements.txt

      - name: Trace matrix
        run: python3 tools/trace.py --check

      - name: Tests of trace.py
        run: bash tests/host/trace/run.sh
