#
# Regenerate libs/mpfs_pac/src/generated with the svd2ada built at the pinned commit and
# commit the result to the pull request branch. For changes of the SVD that cannot be
# regenerated where svd2ada is not available. Runs on request and when this file changes.
name: pac-regenerate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pac-regenerate.yml"
      - ".github/actions/**"

permissions:
  contents: write

concurrency:
  group: pac-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # A pull request from a fork gets a read-only token and cannot push.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - uses: ./.github/actions/toolchain
        with:
          target: pac

      - name: Rebuild the merged SVD and check it
        run: |
          ./x svd merge
          ./x svd check

      - name: Regenerate the register package
        run: ./x pac generate

      - name: Check the register package
        run: ./x pac check

      - name: Commit the result
        run: |
          git add svd/PolarfireSoC.sha256 libs/mpfs_pac
          if git diff --cached --quiet; then
            echo "The register package is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "pac: Regenerate MPFS_Registers" -m "Regenerated by the pac-regenerate workflow with the pinned svd2ada."
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
