# SPDX-License-Identifier: Apache-2.0
#
# The bare-metal images (bare_hello, pmp_probe, report_test) for the E51 and the U54, built once:
# job `build` builds them, checks metrics.golden, runs the negative cases and the host tests of
# the harnesses, and hands the images to the emulator jobs as the artifact `images`; the jobs
# `qemu` (smoke test, Test_Report applications) and `renode` (smoke test) run them without a
# toolchain. The job `repro` builds every image twice in two directories; the SHA-256 of the
# ELFs must be equal. The images, the measured metrics and the logs of the QEMU and Renode
# tests are uploaded as artifacts. Job `build` also checks that the runtime packs equal the
# regenerated ones and match the runtimes of the toolchain. The logic lives in ./x and the
# scripts of crates/mpfs_rts.
name: images

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/images.yml"
      - ".github/actions/**"
      - "crates/bb-runtimes/**"
      - "crates/mpfs_rts/**"
      - "examples/**"
      - "hw/**"
      - "tests/**"
      - "tools/**"
      - "metrics.golden"
      - "x"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/images.yml"
      - ".github/actions/**"
      - "crates/bb-runtimes/**"
      - "crates/mpfs_rts/**"
      - "examples/**"
      - "hw/**"
      - "tests/**"
      - "tools/**"
      - "metrics.golden"
      - "x"

# One run per branch: a newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Only the pinned compilers and gprbuild (and alr, if the runner has none).
      - uses: ./.github/actions/toolchain
        with:
          target: gnat

      # The runtime packs are not committed, only their hashes (crates/mpfs_rts/packs.sha256), as
      # for the SVD. The directory with the packs is cached under a key made of the hash file,
      # make_packs.sh and everything in crates/bb-runtimes, so a change to any of them starts
      # from nothing; `--ensure` then restores what the cache lacks or has stale (a hit costs
      # a hash per pack, a miss about 20 s of generation). It comes before the first step that builds
      # a runtime (tasking_test of ./x test examples gets its pack from gen_runtime.sh, which calls
      # --ensure).
      - name: Cache the runtime packs
        uses: actions/cache@v5.0.4
        with:
          path: build/rts/packs
          key: rts-packs-${{ runner.os }}-${{ hashFiles('crates/mpfs_rts/packs.sha256', 'crates/mpfs_rts/make_packs.sh', 'crates/bb-runtimes/**') }}

      # Builds every example for every hart it names; the next steps and the emulator jobs
      # use these images.
      - name: Build all images
        run: ./x test examples

      # Size, entry point, e_flags and Tag_RISCV_arch of every image against metrics.golden.
      # MEASURED receives the rows measured here, in the format of metrics.golden: on a
      # compiler without a baseline they are the rows to add. Metrics builds every hart of
      # BUILD_HARTS, so after this step all the images are there.
      - name: Metrics
        run: |
          mkdir -p build
          MEASURED="$PWD/build/metrics.measured" ./x metrics verify

      - name: Pack the images
        run: tar -cf images.tar examples/*/bin-*

      - name: Keep the images
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: images
          path: images.tar
          retention-days: 14

      - name: Keep the measured metrics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: metrics-measured
          path: build/metrics.measured
          retention-days: 14

      - name: Negative cases
        run: ./x test negative

      # "regenerated == committed": --check regenerates all six packs and compares the SHA-256 of
      # their tar streams with packs.sha256 (never from the cache, so a stale cache cannot hide a
      # difference); then the packs of build/rts/packs (--ensure) are compared with the runtimes of
      # the pinned toolchain (installed above): their common GNAT and GNARL sources must be equal.
      - name: Runtime packs
        run: |
          crates/mpfs_rts/make_packs.sh --ensure
          crates/mpfs_rts/make_packs.sh --check
          crates/mpfs_rts/compare_toolchain.sh

      # The suites that need no svdtools: the svd, pac and x suites run in the registers
      # workflow, and the prove suite runs with gnatprove in the quality workflow (here its
      # stand-in cases only).
      - name: Host tests
        run: |
          for suite in bare report negative qemu_tests stack hw analyze prove repro rts_packs rts_variants rts_boot rts_plic; do
            echo "== host suite $suite"
            bash "tests/host/$suite/run.sh"
          done

  qemu:
    needs: build
    # QEMU 10.1 or newer is needed (QEMU_MIN in tools/toolchain.env); older
    # Ubuntu releases ship an older QEMU.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-riscv

      - name: Take the images
        uses: actions/download-artifact@v8.0.2
        with:
          name: images

      # Boots the images of the build job under QEMU and checks what they print.
      # The output is kept as the log (pipefail: the exit status is that of ./x).
      - name: QEMU smoke test
        shell: bash
        env:
          MPFS_PREBUILT_IMAGES: "1"
        run: |
          tar -xf images.tar
          mkdir -p build/logs
          ./x test qemu 2>&1 | tee build/logs/qemu.log

      - name: Keep the QEMU log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qemu-log
          path: build/logs/qemu.log
          retention-days: 14

  renode:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # The release pinned by RENODE_VERSION, checked against RENODE_SHA256_X86_64_LINUX.
      - uses: ./.github/actions/toolchain
        with:
          target: renode
          compilers: "false"

      - name: Take the images
        uses: actions/download-artifact@v8.0.2
        with:
          name: images

      # The Renode model of the board has 16 PMP entries where QEMU has 8; its
      # expectations are kept apart in tests/renode/smoke.expected.
      - name: Renode smoke test
        shell: bash
        env:
          MPFS_PREBUILT_IMAGES: "1"
        run: |
          tar -xf images.tar
          mkdir -p build/logs
          ./x test renode 2>&1 | tee build/logs/renode.log

      - name: Keep the Renode log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renode-log
          path: build/logs/renode.log
          retention-days: 14

  # Every image is built twice, in two directories, with the same SOURCE_DATE_EPOCH, and the
  # SHA-256 of the ELFs must be equal (tools/repro.sh). Not in `build`: it builds each image twice.
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/toolchain
        with:
          target: gnat

      # The commit time is the default SOURCE_DATE_EPOCH. After a failure the two copies and the
      # build logs are kept, so the differing images can be compared.
      - name: Reproducible images
        run: REPRO_WORK="$RUNNER_TEMP/repro" ./x repro

      - name: Keep the two builds
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repro-builds
          path: |
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/*/*/examples/*/bin-*/*.elf
          retention-days: 14
