# SPDX-License-Identifier: Apache-2.0
#
# The bare-metal images (bare_hello, pmp_probe, report_test) for the E51 and the U54, built once:
# job `build` builds them, checks metrics.golden, runs the negative cases and the host tests of
# the harnesses, and hands the images to the emulator jobs as the artifact `images`; the jobs
# `qemu` (smoke test, Test_Report applications, the register trace of rts_console_bringup) and
# `renode` (smoke test) run them without a toolchain; the three secondary images that
# rts_console_bringup builds go to the job `qemu` as the artifact `console-bringup-images`. The job `repro` builds every image twice in two directories; the SHA-256 of the
# ELFs must be equal. The images, the measured metrics and the logs of the QEMU and Renode
# tests are uploaded as artifacts. Job `build` also checks that the runtime packs equal the
# regenerated ones and match the runtimes of the toolchain. The runtime variants are built with
# three register packages of the PAC (libs/mpfs_pac/src/generated, not committed): the jobs that
# build a runtime restore it with ./.github/actions/pac first. The logic lives in ./x and the
# scripts of crates/mpfs_rts.
name: images

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/images.yml"
      - ".github/actions/**"
      - "crates/bb-runtimes/**"
      - "crates/mpfs_rts/**"
      - "examples/**"
      - "hw/**"
      - "libs/mpfs_pac/**"
      - "tests/**"
      - "tools/**"
      - "metrics.golden"
      - "x"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/images.yml"
      - ".github/actions/**"
      - "crates/bb-runtimes/**"
      - "crates/mpfs_rts/**"
      - "examples/**"
      - "hw/**"
      - "libs/mpfs_pac/**"
      - "tests/**"
      - "tools/**"
      - "metrics.golden"
      - "x"

# One run per branch: a newer push cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # libs/mpfs_pac/src/generated is not committed: restored from the cache keyed by its recorded hash
      # (libs/mpfs_pac/MPFS_Registers.sha256), generated with svd2ada on a miss (the action installs the
      # toolchain target pac then). gen_runtime.sh copies MPFS_Registers, .PLIC and .CLINT into every
      # runtime variant and calls `tools/pac.sh ensure`, which then only compares the hash. It comes
      # before the first step that builds a runtime.
      - uses: ./.github/actions/pac

      # Only the pinned compilers and gprbuild (and alr, if the runner has none).
      - uses: ./.github/actions/toolchain
        with:
          target: gnat

      # The runtime packs are not committed, only their hashes (crates/mpfs_rts/packs.sha256), as
      # for the SVD. The directory with the packs is cached under a key made of the hash file,
      # make_packs.sh and everything in crates/bb-runtimes, so a change to any of them starts
      # from nothing; `--ensure` then restores what the cache lacks or has stale (a hit costs
      # a hash per pack, a miss about 20 s of generation). It comes before the first step that builds
      # a runtime (tasking_test of ./x test examples gets its pack from gen_runtime.sh, which calls
      # --ensure).
      - name: Cache the runtime packs
        uses: actions/cache@v6.1.0
        with:
          path: build/rts/packs
          key: rts-packs-${{ runner.os }}-${{ hashFiles('crates/mpfs_rts/packs.sha256', 'crates/mpfs_rts/make_packs.sh', 'crates/bb-runtimes/**') }}

      # Builds every example for every hart it names; the next steps and the emulator jobs
      # use these images.
      - name: Build all images
        run: ./x test examples

      # Size, entry point, e_flags and Tag_RISCV_arch of every image against metrics.golden.
      # MEASURED receives the rows measured here, in the format of metrics.golden: on a
      # compiler without a baseline they are the rows to add. Metrics builds every hart of
      # BUILD_HARTS, so after this step all the images are there.
      - name: Metrics
        run: |
          mkdir -p build
          MEASURED="$PWD/build/metrics.measured" ./x metrics verify

      - name: Pack the images
        run: tar -cf images.tar examples/*/bin-*

      - name: Keep the images
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: images
          path: images.tar
          retention-days: 14

      - name: Keep the measured metrics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: metrics-measured
          path: build/metrics.measured
          retention-days: 14

      - name: Negative cases
        run: ./x test negative

      # "regenerated == committed": --check regenerates all six packs and compares the SHA-256 of
      # their tar streams with packs.sha256 (never from the cache, so a stale cache cannot hide a
      # difference); then the packs of build/rts/packs (--ensure) are compared with the runtimes of
      # the pinned toolchain (installed above): their common GNAT and GNARL sources must be equal.
      - name: Runtime packs
        run: |
          crates/mpfs_rts/make_packs.sh --ensure
          crates/mpfs_rts/make_packs.sh --check
          crates/mpfs_rts/compare_toolchain.sh

      # The suite hw reads the MSS Configurator XMLs of config/boards (./x hw initialize and
      # svd_probe.py --enable-clocks take their register values from them), and the reader checks
      # them against the merged SVD: svdtools (the pinned release binary, no cache of its own) and
      # xmllint, then ./x svd check merges it into build/svd and compares its hash with the recorded one.
      - name: Merge the SVD for the reader of the XML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          ./x toolchain install svdtools
          ./x svd check

      # The suites that need no further tools: the svd, pac and x suites run in the registers
      # workflow, and the prove suite runs with gnatprove in the quality workflow (here its
      # stand-in cases only).
      #
      # rts_console_bringup: its link and role checks run here; its QEMU cases (the register trace
      # of the images) run in the job qemu, on these images. QEMU is switched off here, so that the
      # job does not run them if the runner has one. The secondary images that the suite builds (./x
      # test examples builds primary images only) are kept in build/console-bringup for that job.
      - name: Host tests
        env:
          MPFS_CONSOLE_BRINGUP_QEMU: "0"
          MPFS_CONSOLE_BRINGUP_IMAGES: ${{ github.workspace }}/build/console-bringup
        run: |
          for suite in bare report negative qemu_tests stack hw analyze prove repro rts_packs rts_variants rts_boot rts_console_bringup rts_plic rts_context rts_tick rts_zcx rts_heap rts_intnam rts_itim standalone rts_negative rts_istack; do
            echo "== host suite $suite"
            bash "tests/host/$suite/run.sh"
          done

      - name: Keep the secondary console images
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: console-bringup-images
          path: build/console-bringup
          if-no-files-found: error
          retention-days: 14

  qemu:
    needs: build
    # QEMU 10.1 or newer is needed (QEMU_MIN in tools/toolchain.env); older
    # Ubuntu releases ship an older QEMU.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-riscv

      - name: Take the images
        uses: actions/download-artifact@v8.0.2
        with:
          name: images

      # The secondary images of rts_console_bringup (built by the suite in the job build).
      - name: Take the secondary console images
        uses: actions/download-artifact@v8.0.2
        with:
          name: console-bringup-images
          path: build/console-bringup

      # Boots the images of the build job under QEMU and checks what they print.
      # The output is kept as the log (pipefail: the exit status is that of ./x).
      - name: QEMU smoke test
        shell: bash
        env:
          MPFS_PREBUILT_IMAGES: "1"
        run: |
          tar -xf images.tar
          mkdir -p build/logs
          ./x test qemu 2>&1 | tee build/logs/qemu.log

      # The register trace of the console bring-up (tests/host/rts_console_bringup): boots primary
      # images of the build job, and the secondary images it built, with QEMU's memory trace. Builds
      # nothing and needs no toolchain (MPFS_PREBUILT_IMAGES=1).
      - name: Console bring-up under QEMU
        shell: bash
        env:
          MPFS_PREBUILT_IMAGES: "1"
        run: |
          bash tests/host/rts_console_bringup/run.sh 2>&1 | tee build/logs/console_bringup.log

      - name: Keep the QEMU log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qemu-log
          path: build/logs/*.log
          retention-days: 14

  renode:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # The release pinned by RENODE_VERSION, checked against RENODE_SHA256_X86_64_LINUX.
      - uses: ./.github/actions/toolchain
        with:
          target: renode
          compilers: "false"

      - name: Take the images
        uses: actions/download-artifact@v8.0.2
        with:
          name: images

      # The Renode model of the board has 16 PMP entries where QEMU has 8; its
      # expectations are kept apart in tests/renode/smoke.expected.
      - name: Renode smoke test
        shell: bash
        env:
          MPFS_PREBUILT_IMAGES: "1"
        run: |
          tar -xf images.tar
          mkdir -p build/logs
          ./x test renode 2>&1 | tee build/logs/renode.log

      - name: Keep the Renode log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renode-log
          path: build/logs/renode.log
          retention-days: 14

  # Every image is built twice, in two directories, with the same SOURCE_DATE_EPOCH, and the
  # SHA-256 of the ELFs must be equal (tools/repro.sh). Not in `build`: it builds each image twice.
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # The runtime variants of the examples need the register package (see the job build); the two
      # copies of the tree that ./x repro builds take it along from the checkout.
      - uses: ./.github/actions/pac

      - uses: ./.github/actions/toolchain
        with:
          target: gnat

      # The commit time is the default SOURCE_DATE_EPOCH. After a failure the two copies and the
      # build logs are kept, so the differing images can be compared.
      - name: Reproducible images
        run: REPRO_WORK="$RUNNER_TEMP/repro" ./x repro

      - name: Keep the two builds
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repro-builds
          path: |
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/*/*/examples/*/bin-*/*.elf
          retention-days: 14
