version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns:
          - "*"
