#
# Reference system amp_a: a monitor on the E51, a real-time core on U54 hart 1 in machine mode, and
# one SMP application on harts 2 to 4.
#
# Example data. The window and channel sizes are chosen to fit together into the LIM
# at reset (15 ways of 128 KiB, 1920 KiB); they are not measured from images. The reference XML
# configures 8 ways of cache, 4 of scratchpad and 4 of LIM (512 KiB), so the description keeps the L2
# at reset with an override. The FRAM values are an example of the section as well.
schema: 1
board: icicle
l2:
  ways: { cache: 1, lim: 15, scratchpad: 0 }
  reason: the windows need more than the 512 KiB of LIM of the XML; the L2 at reset has 1920 KiB
security_profile: dev
partitions:
  - name: monitor              # supervision, the watchdogs, the log
    harts: [0]
    profile: light
    priv: u
    memory:
      code: { region: lim, size: 64K }
      data: { region: lim, size: 64K }
    stacks: { main: 8K, interrupt: 4K }
    console: mmuart0
    peripherals: [mmuart0, wdog0]
    interrupts: [MMUART0, WDOG0_MVRP]
    watchdog: { instance: wdog0, timeout_ms: 1000 }
  - name: rt                   # the real-time core
    harts: [1]
    profile: light-tasking
    priv: m
    memory:
      code: { region: lim, size: 128K }
      data: { region: lim, size: 128K }
      fast_text: { region: itim, size: 16K }
    peripherals: [mmuart1, wdog1]
    interrupts: [local:MMUART, local:WDOG_TOUT]
    watchdog: { instance: wdog1, timeout_ms: 100 }
  - name: app
    harts: [2, 3, 4]
    profile: embedded
    priv: u
    memory:
      code: { region: lim, size: 512K }
      data: { region: lim, size: 512K }
    stacks: { main: 32K }
    peripherals: [mmuart2, mmuart3, wdog2]
    interrupts: [MMUART2, MMUART3]
    watchdog: { instance: wdog2, timeout_ms: 1000 }
ipc:
  - { name: monitor_rt, between: [monitor, rt], size: 16K, doorbell: true }
  - { name: monitor_app, between: [monitor, app], size: 16K, doorbell: true }
boot:
  sources: [fram, ymodem]
fram: { transport: spi1, part: auto, sck_hz: 40_000_000, cs: gpio0_12, wp: none }
