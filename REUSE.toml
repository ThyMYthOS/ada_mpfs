version = 1

# Files that cannot carry an in-file header. In-file headers take precedence
# (precedence = "closest"), so these only apply to files without one.

[[annotations]]
path = "svd/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Manuel Stahl <thymythos@googlemail.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# Derived from the SVD, therefore CC-BY-4.0.
[[annotations]]
path = "libs/mpfs_pac/src/generated/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Manuel Stahl <thymythos@googlemail.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# The imported GNAT bare-board runtime sources (trimmed fork of alire-project/bb-runtimes, see
# PROVENANCE.md) and the packs generated from them. Their files carry the AdaCore and FSF
# notices as running text, not as SPDX tags; the in-file SPDX headers of the files that were
# written or modified here take precedence. Listed before the trivial files so that the
# README.md of the crate stays CC0-1.0. Later annotations win over earlier ones.
#
# The runtime sources are compiled into or linked with the program of a user: GPL-3.0-or-later
# with the GCC Runtime Library Exception, as their notices say. The two licence texts
# (COPYING3, COPYING.RUNTIME) and the linker spec belong to them. The packs (generated into
# build/rts/packs, not committed) hold only such sources.
[[annotations]]
path = [
  "crates/bb-runtimes/gnat_rts_sources/**",
  "crates/bb-runtimes/src/**",
  "crates/bb-runtimes/riscv/**",
  "crates/bb-runtimes/COPYING3",
  "crates/bb-runtimes/COPYING.RUNTIME",
]
precedence = "closest"
SPDX-FileCopyrightText = ["AdaCore", "Free Software Foundation, Inc."]
SPDX-License-Identifier = "GPL-3.0-or-later WITH GCC-exception-3.1"

# The generator of the runtime source trees is Python that runs on the host and is not part of
# any program: plain GPL-3.0-or-later, no exception (it concerns code that is compiled into or
# linked with a program, which none of this is). Upstream gives these files no licence notice at
# all (only `Copyright (C) AdaCore` in a few); the licence is taken from the COPYING3 at the top
# of the upstream repository, see PROVENANCE.md. The Python files of riscv/ carry their own SPDX
# header (also GPL-3.0-or-later).
[[annotations]]
path = ["crates/bb-runtimes/support/**"]
precedence = "closest"
SPDX-FileCopyrightText = "AdaCore"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The specifications that upstream derived from the Ada Reference Manual and marked with the
