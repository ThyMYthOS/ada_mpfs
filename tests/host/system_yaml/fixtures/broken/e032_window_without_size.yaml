# expect: GEN-E032
# A window without a size in a system of two partitions.
schema: 1
board: icicle
partitions:
  - name: monitor
    harts: [0]
    profile: light
    memory:
      code: { region: lim }
      data: { region: lim, size: 64K }
  - name: app
    harts: [1]
    profile: embedded
    memory:
      code: { region: lim, size: 256K }
      data: { region: lim, size: 256K }
