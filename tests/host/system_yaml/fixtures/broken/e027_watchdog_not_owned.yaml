# expect: GEN-E027
# A watchdog that the partition does not own.
schema: 1
board: icicle
partitions:
  - name: monitor
    harts: [0]
    profile: light
    memory:
      code: { region: lim, size: 64K }
      data: { region: lim, size: 64K }
  - name: app
    harts: [1]
    profile: embedded
    memory:
      code: { region: lim, size: 256K }
      data: { region: lim, size: 256K }
    peripherals: [mmuart1]
    watchdog: { instance: wdog1, timeout_ms: 100 }
